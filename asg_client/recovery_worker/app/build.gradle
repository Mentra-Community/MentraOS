plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mentra.recovery'
    compileSdk 35

    defaultConfig {
        applicationId "com.mentra.recovery"
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("../credentials/recovery-keystore.jks")
            storePassword System.getenv("RECOVERY_STORE_PASSWORD")
                ?: System.getenv("OTA_STORE_PASSWORD")
                ?: "android"
            keyAlias System.getenv("RECOVERY_KEY_ALIAS")
                ?: System.getenv("OTA_KEY_ALIAS")
                ?: "recovery"
            keyPassword System.getenv("RECOVERY_KEY_PASSWORD")
                ?: System.getenv("OTA_KEY_PASSWORD")
                ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    implementation libs.work.runtime
    implementation libs.core
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
