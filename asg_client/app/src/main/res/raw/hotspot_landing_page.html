<html><head><title>MentraOS WiFi Setup</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{font-family:sans-serif;margin:0;padding:20px;line-height:1.5;} h1{color:#4285f4;} form{margin-top:20px;} label{display:block;margin-bottom:5px;font-weight:bold;} input[type=text],input[type=password]{width:100%;padding:8px;margin-bottom:15px;border:1px solid #ddd;border-radius:4px;} button{background:#4285f4;color:white;border:none;padding:10px 15px;border-radius:4px;cursor:pointer;} button:hover{background:#2a75f3;}</style></head><body><h1>MentraOS WiFi Setup</h1><p>Please enter your WiFi network details to connect these glasses to the internet:</p><form id="wifiForm" method="POST" action="/"><label for="ssid">WiFi Network Name:</label><input type="text" id="ssid" name="ssid" required><label for="pass">WiFi Password:</label><input type="password" id="pass" name="pass" required><label for="token">Auth Token (optional):</label><input type="text" id="token" name="token"><button type="submit">Connect</button></form><script>document.getElementById('wifiForm').onsubmit = function() {alert('Connecting to network... The glasses will reboot if successful.');};</script></body></html>
