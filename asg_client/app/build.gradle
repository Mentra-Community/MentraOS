    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //navigation
    def nav_version = "2.5.3"
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"
    implementation "androidx.navigation:navigation-runtime:$nav_version"
    implementation "androidx.fragment:fragment:1.5.5"

    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:2.2.0"

    //EventBus, greenrobot
    implementation("org.greenrobot:eventbus:3.3.1")

    //location services
    implementation 'com.google.android.gms:play-services-location:18.0.0'

    // Bundled/offline text localization for Mentra Live text-mode photos.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    //websocket
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'


    // For demo
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // StreamPackLite dependencies
    implementation project(':core')
    implementation project(':extension-rtmp')
    implementation project(':extension-srt')

    // OkHttp for network requests
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    
    // JSON handling
    implementation 'org.json:json:20210307'

    // Decode the exact LZMA-alone chunks used by BES release OTA artifacts before authorization.
    implementation 'org.tukaani:xz:1.9'
    
    // AVIF encoding/decoding support
    implementation 'com.github.awxkee:avif-coder:1.7.3'
    implementation 'androidx.heifwriter:heifwriter:1.1.0'
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    // Sentry SDK for error reporting
    implementation 'io.sentry:sentry-android:7.5.0'

    implementation 'com.google.dagger:hilt-android:2.51.1'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.51.1'

    // Google WebRTC for Android (WHIP streaming)
    // Community-maintained prebuilt of the official Google WebRTC codebase; uses org.webrtc package.
    // Pinned to M114 (2023) — compiled with Java 11, compatible with this project's Java 17 toolchain.
    implementation 'io.github.webrtc-sdk:android:114.5735.08.1'

    // AndroidX Test dependencies
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}

// Check if Sentry auth token is available
def sentryAuthToken = System.getenv("SENTRY_AUTH_TOKEN") ?: 
                     project.hasProperty("sentryAuthToken") ? project.property("sentryAuthToken") : null

sentry {
    org = "mentra-labs"
    projectName = "mentra-asg-client"

    // Only enable Sentry features if auth token is present
    if (sentryAuthToken) {
        // this will upload your source code to Sentry to show it as part of the stack traces
        includeSourceContext = true
        uploadNativeSymbols = true
        autoUploadNativeSymbols = true
        autoUploadSourceContext = true
    } else {
        // Disable all Sentry upload tasks when no auth token
        includeSourceContext = false
        uploadNativeSymbols = false
        autoUploadNativeSymbols = false
        autoUploadSourceContext = false
        
        // Don't fail the build if Sentry operations fail
        ignoredBuildTypes = ["release", "debug"]
    }
}

tasks.register('checkNoFullyQualifiedMentraTypes') {
    doLast {
        def violations = []
        def fqcnTypePattern = ~/com\.mentra\.asg_client\.(\w+\.)+[A-Z]\w*/
        fileTree(dir: 'src/main/java', include: '**/*.java').each { File f ->
            boolean inBlockComment = false
            f.readLines().eachWithIndex { line, int idx ->
                def trimmed = line.trim()
                if (inBlockComment) {
                    if (trimmed.contains('*/')) {
                        inBlockComment = false
                    }
                    int commentEnd = line.indexOf('*/')
                    if (commentEnd >= 0) {
                        inBlockComment = false
                        line = line.substring(commentEnd + 2)
                        trimmed = line.trim()
                    } else {
                        return
                    }
                }
                if (trimmed.startsWith('import ')
                        || trimmed.startsWith('package ')
                        || trimmed.startsWith('*')
                        || trimmed.startsWith('/**')
                        || trimmed.startsWith('/*')
                        || trimmed.startsWith('//')) {
                    if (trimmed.startsWith('/*') && !trimmed.contains('*/')) {
                        inBlockComment = true
                    }
                    return
                }
                // Intent action strings and broadcast actions are not Java type references.
                if (line.contains('"com.mentra.asg_client')) {
                    return
                }
                if (fqcnTypePattern.matcher(line).find()) {
                    violations << "${f.path}:${idx + 1}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    'Use imports instead of fully-qualified com.mentra.asg_client types: '
                            + violations.join(', '))
        }
    }
}

// Disable Sentry tasks when auth token is not present
afterEvaluate {
    tasks.matching { it.name == 'preBuild' }.configureEach {
        dependsOn('checkNoFullyQualifiedMentraTypes')
    }
    if (!sentryAuthToken) {
        tasks.matching { it.name.contains("sentry") || it.name.contains("Sentry") }.configureEach {
            enabled = false
        }
    }
}
