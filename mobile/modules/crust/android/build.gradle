apply plugin: 'com.android.library'

group = 'com.mentra.crust'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Zipline + kotlinx.serialization plugins. The Zipline plugin processes
// any interface annotated `@ZiplineService` and generates a Kotlin Serializer
// adapter so JS can call into it through QuickJS. The serialization plugin
// is its prerequisite — it provides the @Serializable code generator that
// Zipline's adapter relies on.
buildscript {
  dependencies {
    classpath 'app.cash.zipline:zipline-gradle-plugin:1.27.0'
  }
}

apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'app.cash.zipline'

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "com.mentra.crust"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    multiDexEnabled true
  }
  compileOptions {
    coreLibraryDesugaringEnabled true
  }
  buildTypes {
    internal {
      initWith release
      matchingFallbacks = ['release']
    }
  }
  buildTypes {
    internal {
      initWith release
      matchingFallbacks = ['release']
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Google Navigation SDK for Android.
  // Used by NavigationManager.kt to drive headless turn-by-turn nav.
  implementation 'com.google.android.libraries.navigation:navigation:6.0.0'

  // Required by Google Nav SDK (Java 8+ APIs on minSdk < 26).
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

dependencies {
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  implementation 'com.google.android.gms:play-services-base:18.2.0'
}

dependencies {
  // MentraJS — QuickJS (via Cash App's Zipline) for per-miniapp JS contexts.
  // The Zipline runtime exposes Kotlin objects to QuickJS through generated
  // @ZiplineService adapters; the matching Gradle plugin above produces those
  // adapters at compile time.
  implementation 'app.cash.zipline:zipline-android:1.27.0'
  // kotlinx.serialization runtime (Zipline's adapter generator marshals
  // bridge method args + return values as JSON across the QuickJS boundary).
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

  // OkHttp for fetch / WebSocket — already used elsewhere in MentraOS;
  // pinned here so the gradle plugin doesn't downgrade us.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'

  // Tink for X25519 (Android stdlib X25519 is API 33+ only; minSdk is 24).
  // ~1.2 MB AAR. Crypto.subtle's SHA / AES-GCM / HMAC stay on javax.crypto
  // which ships on the platform.
  implementation 'com.google.crypto.tink:tink-android:1.14.1'

  // Kotlin coroutines for the Zipline bridge + suspending polyfill shims.
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
