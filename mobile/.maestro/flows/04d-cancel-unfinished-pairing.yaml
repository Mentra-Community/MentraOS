appId: ${MAESTRO_APP_ID}
---
# Start signed in at an unpaired Home. No physical glasses are required.
# A scan left unfinished (here: the app is killed on it) is cancelled when
# Home comes back: Home shows the unpaired card, never a finish-pairing state.
- launchApp:
    permissions:
      all: allow
- tapOn: "Pair glasses"
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    id: "pairing-model-mentra_live"
- extendedWaitUntil:
    visible: "Put your glasses in pairing mode"
    timeout: 20000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Pair glasses"
    timeout: 10000
- assertNotVisible: "Finish pairing"
- assertNotVisible: "Cancel pairing"
- stopApp
- launchApp
- assertVisible: "Pair glasses"
- assertNotVisible: "Finish pairing"
- takeScreenshot: "cancel-unfinished-pairing"
