appId: ${MAESTRO_APP_ID}
env:
  E2E_TEST_EMAIL: ${E2E_TEST_EMAIL}
  E2E_TEST_PASSWORD: ${E2E_TEST_PASSWORD}
---
# Test: Authentication Flow
# Description: Tests login flow for existing users
#
# Required environment variables (set on CI runner or locally):
#   E2E_TEST_EMAIL - Test account email
#   E2E_TEST_PASSWORD - Test account password

- launchApp:
    clearState: true

# Should see welcome screen after clearState
- assertVisible: "The future of smart glasses starts here"
- takeScreenshot: "welcome-screen"

# Run the login and onboarding helper
- runFlow:
    file: ../helpers/login-and-onboard.yaml

# Verify we reach home screen
- extendedWaitUntil:
    visible: "Home"
    timeout: 10000

- takeScreenshot: "logged-in-home"
