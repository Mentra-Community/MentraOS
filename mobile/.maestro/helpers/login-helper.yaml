appId: ${MAESTRO_APP_ID}
---
# Helper flow for logging in
# This is a reusable flow that can be called from other tests
#
# Required environment variables (set on CI runner or locally):
#   E2E_TEST_EMAIL - Test account email
#   E2E_TEST_PASSWORD - Test account password

- assertVisible: "The future of smart glasses starts here"

# Tap on Log In button
- tapOn: "Log In"

# Wait for login form
- assertVisible: "Log in to MentraOS"

# Enter email - tap the email field and type
- tapOn:
    text: "Email"
- inputText: ${E2E_TEST_EMAIL}

# Hide keyboard and tap password field
- hideKeyboard
- tapOn:
    text: "Password"
    index: 1
- inputText: ${E2E_TEST_PASSWORD}

# Hide keyboard and tap Log In button
- hideKeyboard
- tapOn: "Log In"

# Dismiss Google password manager prompt if it appears
- pressKey: back

# Wait for onboarding or home screen
- extendedWaitUntil:
    visible: "(Do you have smart glasses?|Home)"
    timeout: 15000
