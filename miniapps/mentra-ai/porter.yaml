version: v2
# Omit a hard-coded name here. Use environment variables to supply dynamic values.
namespace: ${PORTER_NAMESPACE}
build:
  method: docker
  context: .
  dockerfile: ./docker/Dockerfile
services:
  - name: mentra-ai-2
    type: web
    run: bun run start
    port: 80
    cpuCores: 1.5
    ramMegabytes: 4000
    env:
      NODE_ENV: ${NODE_ENV}
      PORTER_APP_NAME: ${PORTER_APP_NAME}
      HOST: "0.0.0.0"
      PORT: "80"
