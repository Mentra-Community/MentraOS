# Cloudflare Worker: secret-proxy
#
# Holds the Google Places API key server-side so it never ships in the
# Navigation miniapp bundle. The miniapp calls this Worker; the Worker
# attaches the key and forwards to Google Places.
#
# Deploy:
#   cd sdk/Navigation/worker
#   bun install            # or npm install
#   bunx wrangler secret put GOOGLE_NAV_PLACES_KEY   # paste the Places-only GCP key
#   bunx wrangler deploy
#
# After deploy, note the printed workers.dev URL (or your custom route).
# That URL becomes PROXY_BASE_URL in sdk/Navigation/build.ts.

name = "mentra-secret-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# GOOGLE_NAV_PLACES_KEY is set as a SECRET (not here) via:
#   bunx wrangler secret put GOOGLE_NAV_PLACES_KEY
# Secrets are encrypted and never committed.
