<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Kawaii</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #101915;
        --muted: #66746d;
        --line: #dfe8e2;
        --mint: #dcf8ec;
        --mint-strong: #39d98a;
        --pink: #ff6da8;
        --peach: #ffb16d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 10%, rgba(255, 109, 168, 0.22), transparent 28%),
          radial-gradient(circle at 80% 8%, rgba(57, 217, 138, 0.2), transparent 24%),
          linear-gradient(180deg, #fff 0%, #f5fbf7 100%);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .card {
        width: min(100%, 520px);
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 16px 40px rgba(18, 31, 25, 0.1);
        padding: 28px;
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(57, 217, 138, 0.42);
        border-radius: 999px;
        background: var(--mint);
        color: #087a4b;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 22px 0 8px;
        font-size: clamp(40px, 11vw, 64px);
        line-height: 1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.45;
      }

      .face {
        margin: 28px auto;
        min-height: 132px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(255, 109, 168, 0.15), rgba(57, 217, 138, 0.16));
        color: #111612;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: clamp(36px, 11vw, 58px);
        font-weight: 900;
        letter-spacing: 0;
        line-height: 1;
        white-space: nowrap;
      }

      .face.bump {
        animation: bump 180ms ease-out;
      }

      @keyframes bump {
        0% {
          transform: scale(0.96) rotate(-1deg);
        }
        60% {
          transform: scale(1.04) rotate(1deg);
        }
        100% {
          transform: scale(1) rotate(0);
        }
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: #101114;
        color: white;
        min-height: 60px;
        padding: 0 22px;
        font: inherit;
        font-size: 18px;
        font-weight: 800;
      }

      button:active {
        transform: translateY(1px);
      }

      .version {
        margin-top: 18px;
        color: #8a948f;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-label="Kawaii miniapp">
        <span class="badge">Preinstall canary</span>
        <h1>Kawaii</h1>
        <p>Tap the button and the hands change. Tiny, cute, and perfect for update testing.</p>
        <div class="face" id="face">づ(^_^)づ</div>
        <button id="next" type="button">New face</button>
        <div class="version">com.mentra.kawaii · v__KAWAII_VERSION__</div>
      </section>
    </main>
    <script>
      const faces = [
        "づ(^_^)づ",
        "ᕕ(^_^)ᕗ",
        "ᕙ(^_^)ᕗ",
        "٩(^‿^)۶",
        "\\(^o^)/",
        "b(^_^)d",
      ]
      let index = 0
      const showFace = (face) => {
        const nextIndex = faces.indexOf(face)
        if (nextIndex >= 0) index = nextIndex
        const faceEl = document.getElementById("face")
        faceEl.textContent = face
        faceEl.classList.remove("bump")
        void faceEl.offsetWidth
        faceEl.classList.add("bump")
      }
      document.getElementById("next").addEventListener("click", () => {
        index = (index + 1) % faces.length
        const face = faces[index]
        showFace(face)
        window.mentra?.send?.("kawaii:set-face", { face })
      })
      window.mentra?.on?.("kawaii:face", ({ face }) => showFace(face))
      window.mentra?.ready?.()
    </script>
  </body>
</html>
