# Local MediaMTX stack for Mentra Live testing.
#
# Primary:  RTMP on 1935/tcp (low friction — one TCP port, no ICE).
# Fallback: WHIP/WHEP on 8889/tcp + 8189/udp (needs MTX_WEBRTCADDITIONALHOSTS
#           from start-local-stream.sh so ICE candidates reach Docker Desktop/macOS).
services:
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: mentra-local-stream
    restart: unless-stopped
    ports:
      - "1935:1935" # Primary: RTMP publish
      - "8888:8888" # HLS watch (recommended for RTMP)
      - "8889:8889" # WHIP / WHEP fallback (HTTP signaling + WebRTC page)
      - "8189:8189/udp" # WHIP ICE / media (most common failure if blocked)
      - "9997:9997" # MediaMTX API
    environment:
      # Only required for WHIP ICE; harmless for RTMP-only runs.
      MTX_WEBRTCADDITIONALHOSTS: ${MTX_WEBRTCADDITIONALHOSTS:?set by start-local-stream.sh}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
