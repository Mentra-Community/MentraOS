# Local MediaMTX WHIP/WHEP stack for Mentra Live testing.
#
# MTX_WEBRTCADDITIONALHOSTS must be set by start-local-whip.sh (the laptop LAN
# IP) so ICE candidates advertise a reachable address on Docker Desktop/macOS.
services:
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: mentra-local-whip
    restart: unless-stopped
    ports:
      - "8889:8889" # WHIP / WHEP HTTP signaling + WebRTC page
      - "8189:8189/udp" # ICE / media (most common failure if blocked)
      - "8888:8888" # optional HLS
      - "1935:1935" # optional RTMP
      - "9997:9997" # MediaMTX API
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MTX_WEBRTCADDITIONALHOSTS:?set by start-local-whip.sh}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
