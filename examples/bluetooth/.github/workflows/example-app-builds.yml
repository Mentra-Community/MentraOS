name: Example App Builds

"on":
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:
    inputs:
      artifact_suffix:
        description: Optional coordinated release identity appended to filenames
        required: false
        type: string

permissions:
  contents: read

# Newest validation per ref wins. Coordinated publication has separate
# non-canceling channel concurrency in coordinated-example-release.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  GSTREAMER_VERSION: 1.28.2
  # Temporary source pin for MentraOS #3929. Remove with the source checkouts
  # once both Mac examples pin a published SDK containing native macOS support.
  MACOS_SDK_SOURCE_REF: 639ad9323a35164250d6efc621de04f394131d1c

jobs:
  release-contract:
    name: Coordinated release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test coordinated release scripts
        run: node --test .github/scripts/coordinated-example-release.test.mjs

  android:
    name: Native Android example
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.sdk-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Bluetooth SDK version
        id: sdk-version
        run: |
          version=$(grep '^mentraSdkVersion=' examples/android/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "Could not read mentraSdkVersion from gradle.properties" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check exact Maven release availability
        id: availability
        env:
          RELEASE_IDENTITY: ${{ steps.sdk-version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://repo.maven.apache.org/maven2/com/mentraglass"
          sdk_status=$(curl --silent --show-error --head --location --output /dev/null --write-out '%{http_code}' \
            "$base/bluetooth-sdk/$RELEASE_IDENTITY/bluetooth-sdk-$RELEASE_IDENTITY.pom" || true)
          lc3_status=$(curl --silent --show-error --head --location --output /dev/null --write-out '%{http_code}' \
            "$base/lc3Lib/$RELEASE_IDENTITY/lc3Lib-$RELEASE_IDENTITY.pom" || true)
          if [[ "$sdk_status" == "200" && "$lc3_status" == "200" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$sdk_status" == "404" || "$lc3_status" == "404" ]]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "Native Android example skipped because $RELEASE_IDENTITY is not yet available from Maven Central."
          else
            echo "Unexpected Maven Central status (SDK $sdk_status, LC3 $lc3_status)." >&2
            exit 1
          fi

      - name: Set up Java
        if: steps.availability.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: steps.availability.outputs.available == 'true'
        uses: android-actions/setup-android@v3

      - name: Free disk space
        if: steps.availability.outputs.available == 'true'
        run: |
          df -h
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            "$ANDROID_HOME/ndk" \
            "$ANDROID_HOME/cmake" \
            "$ANDROID_HOME/emulator" \
            "$ANDROID_HOME/system-images" \
            "$ANDROID_HOME/platforms" \
            "$ANDROID_HOME/build-tools"
          df -h

      - name: Install Android SDK packages
        if: steps.availability.outputs.available == 'true'
        run: |
          # build-tools;34.0.0 is the AGP 8.7 default; install it up front so
          # Gradle does not have to auto-install it mid-build.
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.1.12297006"

      - name: Cache GStreamer Android SDK
        if: steps.availability.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: examples/android/.gstreamer/Android.sdk
          key: gstreamer-android-${{ env.GSTREAMER_VERSION }}

      - name: Type check Kotlin
        if: steps.availability.outputs.available == 'true'
        working-directory: examples/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build
        if: steps.availability.outputs.available == 'true'
        working-directory: examples/android
        run: |
          ./gradlew :app:assembleDebug --no-daemon

      - name: Collect APK
        if: steps.availability.outputs.available == 'true'
        id: collect
        env:
          ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        run: |
          artifact_suffix="$ARTIFACT_SUFFIX"
          if [[ -z "$artifact_suffix" && -f .github/coordinated-example-release.json ]]; then
            artifact_suffix=$(jq -er .releaseIdentity .github/coordinated-example-release.json)
          fi
          suffix="${artifact_suffix:+-$artifact_suffix}"
          output="mentra-example-android${suffix}.apk"
          cp examples/android/app/build/outputs/apk/debug/app-debug.apk "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.availability.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-android
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error

  ios:
    name: Native iOS example
    runs-on: macos-latest
    outputs:
      sdk-version: ${{ steps.sdk-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Bluetooth SDK version
        id: sdk-version
        run: |
          version=$(awk '/repositoryURL = .*mentra-bluetooth-sdk-ios/,/};/' examples/ios/MentraExample.xcodeproj/project.pbxproj \
            | sed -n 's/.*version = \([^;[:space:]][^;[:space:]]*\);.*/\1/p' | head -1)
          if [ -z "$version" ]; then
            echo "Could not read the Bluetooth SDK package version from project.pbxproj" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: examples/ios/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('examples/ios/MentraExample.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache GStreamer iOS SDK
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/GStreamer/iPhone.sdk
          key: gstreamer-ios-${{ env.GSTREAMER_VERSION }}

      - name: Install GStreamer iOS SDK
        working-directory: examples/ios
        run: bash scripts/setup-gstreamer-ios.sh

      - name: Type check Swift
        working-directory: examples/ios
        run: |
          xcodebuild \
            -project MentraExample.xcodeproj \
            -scheme MentraExample \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Build
        working-directory: examples/ios
        run: |
          xcodebuild \
            -project MentraExample.xcodeproj \
            -scheme MentraExample \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        id: collect
        working-directory: examples/ios
        env:
          ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        run: |
          app_path=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo "No .app bundle found in build/Build/Products/Debug-iphoneos" >&2
            exit 1
          fi
          mkdir Payload
          cp -R "$app_path" Payload/
          artifact_suffix="$ARTIFACT_SUFFIX"
          if [[ -z "$artifact_suffix" && -f ../../.github/coordinated-example-release.json ]]; then
            artifact_suffix=$(jq -er .releaseIdentity ../../.github/coordinated-example-release.json)
          fi
          suffix="${artifact_suffix:+-$artifact_suffix}"
          output="mentra-example-ios${suffix}-unsigned.ipa"
          zip -qry "$output" Payload
          echo "path=examples/ios/$output" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-ios
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error

  macos:
    name: Native macOS example
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MENTRA_BLUETOOTH_SDK_PACKAGE_PATH: ${{ github.workspace }}/.ci-sdk/mobile/modules/bluetooth-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned macOS SDK source
        uses: actions/checkout@v4
        with:
          repository: Mentra-Community/MentraOS
          ref: ${{ env.MACOS_SDK_SOURCE_REF }}
          path: .ci-sdk
          sparse-checkout: mobile/modules/bluetooth-sdk
          persist-credentials: false

      - name: Build AppKit app
        working-directory: examples/macos
        run: bash run.sh --build-only

  react-native-macos:
    name: React Native macOS example
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MENTRA_BLUETOOTH_SDK_PACKAGE_PATH: ${{ github.workspace }}/.ci-sdk/mobile/modules/bluetooth-sdk
      RCT_NO_LAUNCH_PACKAGER: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned macOS SDK source
        uses: actions/checkout@v4
        with:
          repository: Mentra-Community/MentraOS
          ref: ${{ env.MACOS_SDK_SOURCE_REF }}
          path: .ci-sdk
          sparse-checkout: mobile/modules/bluetooth-sdk
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        working-directory: examples/react-native-macos
        run: bun install --frozen-lockfile

      - name: Type check TypeScript
        working-directory: examples/react-native-macos
        run: bun run typecheck

      - name: Install CocoaPods dependencies
        working-directory: examples/react-native-macos/macos
        run: pod install

      - name: Build native app and bundle JavaScript
        working-directory: examples/react-native-macos/macos
        run: |
          xcodebuild \
            -workspace mentra-bluetooth-sdk-macos-example.xcworkspace \
            -scheme mentra-bluetooth-sdk-macos-example-macOS \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify embedded JavaScript bundle
        working-directory: examples/react-native-macos/macos
        run: test -s build/Build/Products/Release/mentra-bluetooth-sdk-macos-example.app/Contents/Resources/main.jsbundle

  react-native:
    name: React Native example
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.sdk-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Bluetooth SDK version
        id: sdk-version
        run: |
          version=$(jq -r '.dependencies["@mentra/bluetooth-sdk"]' examples/react-native/package.json | sed 's/^[^0-9]*//')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not read @mentra/bluetooth-sdk version from package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Free disk space
        run: |
          df -h
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            "$ANDROID_HOME/ndk" \
            "$ANDROID_HOME/cmake" \
            "$ANDROID_HOME/emulator" \
            "$ANDROID_HOME/system-images" \
            "$ANDROID_HOME/platforms" \
            "$ANDROID_HOME/build-tools"
          df -h

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache GStreamer Android SDK
        uses: actions/cache@v4
        with:
          path: examples/react-native/.gstreamer/Android.sdk
          key: gstreamer-android-${{ env.GSTREAMER_VERSION }}

      - name: Install dependencies
        working-directory: examples/react-native
        run: bun install --frozen-lockfile

      - name: Type check TypeScript
        working-directory: examples/react-native
        run: bunx tsc --noEmit

      - name: Generate Android project
        working-directory: examples/react-native
        run: bunx expo prebuild --platform android --no-install

      - name: Verify Android cleartext support
        working-directory: examples/react-native
        run: grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      - name: Type check generated Android project
        working-directory: examples/react-native/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build release Android app
        working-directory: examples/react-native/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Verify Android 16 KB page-size support
        run: examples/react-native/scripts/check-android-16kb.sh examples/react-native/android/app/build/outputs/apk/release/app-release.apk

      - name: Collect APK
        id: collect
        env:
          ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        run: |
          artifact_suffix="$ARTIFACT_SUFFIX"
          if [[ -z "$artifact_suffix" && -f .github/coordinated-example-release.json ]]; then
            artifact_suffix=$(jq -er .releaseIdentity .github/coordinated-example-release.json)
          fi
          suffix="${artifact_suffix:+-$artifact_suffix}"
          output="mentra-example-react-native${suffix}.apk"
          cp examples/react-native/android/app/build/outputs/apk/release/app-release.apk "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-react-native
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error

  react-native-elevenlabs-audio:
    name: React Native ElevenLabs audio example
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.sdk-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Bluetooth SDK version
        id: sdk-version
        run: |
          version=$(jq -r '.dependencies["@mentra/bluetooth-sdk"]' examples/react-native-elevenlabs-audio/package.json | sed 's/^[^0-9]*//')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not read @mentra/bluetooth-sdk version from package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Free disk space
        run: |
          df -h
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            "$ANDROID_HOME/ndk" \
            "$ANDROID_HOME/cmake" \
            "$ANDROID_HOME/emulator" \
            "$ANDROID_HOME/system-images" \
            "$ANDROID_HOME/platforms" \
            "$ANDROID_HOME/build-tools"
          df -h

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: examples/react-native-elevenlabs-audio
        run: bun install --frozen-lockfile

      - name: Type check TypeScript
        working-directory: examples/react-native-elevenlabs-audio
        run: bun run typecheck

      - name: Generate Android project
        working-directory: examples/react-native-elevenlabs-audio
        run: bunx expo prebuild --platform android --no-install

      - name: Verify Android cleartext support
        working-directory: examples/react-native-elevenlabs-audio
        run: grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      - name: Type check generated Android project
        working-directory: examples/react-native-elevenlabs-audio/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build release Android app
        working-directory: examples/react-native-elevenlabs-audio/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        id: collect
        env:
          ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        run: |
          artifact_suffix="$ARTIFACT_SUFFIX"
          if [[ -z "$artifact_suffix" && -f .github/coordinated-example-release.json ]]; then
            artifact_suffix=$(jq -er .releaseIdentity .github/coordinated-example-release.json)
          fi
          suffix="${artifact_suffix:+-$artifact_suffix}"
          output="mentra-example-rn-elevenlabs-audio${suffix}.apk"
          cp examples/react-native-elevenlabs-audio/android/app/build/outputs/apk/release/app-release.apk "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-rn-elevenlabs-audio
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error
