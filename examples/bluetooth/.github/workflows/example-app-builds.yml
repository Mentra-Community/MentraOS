name: Example App Builds

# CI of the standalone Bluetooth SDK Starter Kit. The kit is exported from
# examples/bluetooth in MentraOS
# (https://github.com/Mentra-Community/MentraOS/tree/dev/examples/bluetooth)
# with every SDK dependency pinned to one published release, recorded in
# starter-kit-release.json. This workflow builds each example the way an
# integrator would: from the published npm, Maven Central and Swift Package
# Manager packages. Inside MentraOS this file is inert (GitHub only runs
# workflows from the repository root); there, Example App Builds builds the same
# examples against the SDK source.

"on":
  pull_request:
    branches:
      - main
      - dev
      - staging
  push:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:

permissions:
  contents: read

# Newest validation per ref wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  GSTREAMER_VERSION: 1.28.2

jobs:
  android:
    name: Native Android example
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.sdk-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Bluetooth SDK version
        id: sdk-version
        run: |
          version=$(grep '^mentraSdkVersion=' android/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "Could not read mentraSdkVersion from gradle.properties" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check exact Maven release availability
        id: availability
        env:
          RELEASE_IDENTITY: ${{ steps.sdk-version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://repo.maven.apache.org/maven2/com/mentraglass"
          sdk_status=$(curl --silent --show-error --head --location --output /dev/null --write-out '%{http_code}' \
            "$base/bluetooth-sdk/$RELEASE_IDENTITY/bluetooth-sdk-$RELEASE_IDENTITY.pom" || true)
          lc3_status=$(curl --silent --show-error --head --location --output /dev/null --write-out '%{http_code}' \
            "$base/lc3Lib/$RELEASE_IDENTITY/lc3Lib-$RELEASE_IDENTITY.pom" || true)
          if [[ "$sdk_status" == "200" && "$lc3_status" == "200" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$sdk_status" == "404" || "$lc3_status" == "404" ]]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "Native Android example skipped because $RELEASE_IDENTITY is not yet available from Maven Central."
          else
            echo "Unexpected Maven Central status (SDK $sdk_status, LC3 $lc3_status)." >&2
            exit 1
          fi

      - name: Set up Java
        if: steps.availability.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: steps.availability.outputs.available == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Free disk space
        if: steps.availability.outputs.available == 'true'
        run: |
          df -h
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            "$ANDROID_HOME/ndk" \
            "$ANDROID_HOME/cmake" \
            "$ANDROID_HOME/emulator" \
            "$ANDROID_HOME/system-images" \
            "$ANDROID_HOME/platforms" \
            "$ANDROID_HOME/build-tools"
          df -h

      - name: Install Android SDK packages
        if: steps.availability.outputs.available == 'true'
        run: |
          # build-tools;34.0.0 is the AGP 8.7 default; install it up front so
          # Gradle does not have to auto-install it mid-build.
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.1.12297006"

      - name: Cache GStreamer Android SDK
        if: steps.availability.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: android/.gstreamer/Android.sdk
          key: gstreamer-android-${{ env.GSTREAMER_VERSION }}

      - name: Type check Kotlin
        if: steps.availability.outputs.available == 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build
        if: steps.availability.outputs.available == 'true'
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify foreground service types
        if: steps.availability.outputs.available == 'true'
        working-directory: android
        run: python3 scripts/check-foreground-service.py app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml

      - name: Collect APK
        if: steps.availability.outputs.available == 'true'
        id: collect
        env:
          ARTIFACT_SUFFIX: ${{ steps.sdk-version.outputs.version }}
        run: |
          artifact_suffix="$ARTIFACT_SUFFIX"
          suffix="${artifact_suffix:+-$artifact_suffix}"
          output="mentra-example-android${suffix}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.availability.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-android
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error

  ios:
    name: Native iOS example
    runs-on: macos-latest
    outputs:
      sdk-version: ${{ steps.sdk-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Bluetooth SDK version
        id: sdk-version
        run: |
          version=$(awk '/repositoryURL = .*mentra-bluetooth-sdk-ios/,/};/' ios/MentraExample.xcodeproj/project.pbxproj \
            | sed -n 's/.*version = \([^;[:space:]][^;[:space:]]*\);.*/\1/p' | head -1)
          if [ -z "$version" ]; then
            echo "Could not read the Bluetooth SDK package version from project.pbxproj" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/MentraExample.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache GStreamer iOS SDK
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/GStreamer/iPhone.sdk
          key: gstreamer-ios-${{ env.GSTREAMER_VERSION }}

      - name: Install GStreamer iOS SDK
        working-directory: ios
        run: bash scripts/setup-gstreamer-ios.sh

      - name: Type check Swift
        working-directory: ios
        run: |
          xcodebuild \
            -project MentraExample.xcodeproj \
            -scheme MentraExample \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Build
        working-directory: ios
        run: |
          xcodebuild \
            -project MentraExample.xcodeproj \
            -scheme MentraExample \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        # Ordinary runs only need the mandatory analysis and build above.
        if: github.event_name == 'workflow_dispatch'
        id: collect
        working-directory: ios
        env:
          ARTIFACT_SUFFIX: ${{ steps.sdk-version.outputs.version }}
        run: |
          app_path=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo "No .app bundle found in build/Build/Products/Debug-iphoneos" >&2
            exit 1
          fi
          mkdir Payload
          cp -R "$app_path" Payload/
          artifact_suffix="$ARTIFACT_SUFFIX"
          suffix="${artifact_suffix:+-$artifact_suffix}"
          output="mentra-example-ios${suffix}-unsigned.ipa"
          zip -qry "$output" Payload
          echo "path=ios/$output" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-ios
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error

  macos:
    name: Native macOS example
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppKit app
        working-directory: macos
        run: bash run.sh --build-only

  react-native-macos:
    name: React Native macOS example
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RCT_NO_LAUNCH_PACKAGER: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        working-directory: react-native-macos
        run: bun install --frozen-lockfile

      - name: Type check TypeScript
        working-directory: react-native-macos
        run: bun run typecheck

      - name: Install CocoaPods dependencies
        working-directory: react-native-macos/macos
        run: pod install

      - name: Build native app and bundle JavaScript
        working-directory: react-native-macos/macos
        run: |
          xcodebuild \
            -workspace mentra-bluetooth-sdk-macos-example.xcworkspace \
            -scheme mentra-bluetooth-sdk-macos-example-macOS \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify embedded JavaScript bundle
        working-directory: react-native-macos/macos
        run: test -s build/Build/Products/Release/mentra-bluetooth-sdk-macos-example.app/Contents/Resources/main.jsbundle

  react-native:
    name: React Native example
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.sdk-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Bluetooth SDK version
        id: sdk-version
        run: |
          version=$(jq -er '.dependencies["@mentra/bluetooth-sdk"]' react-native/package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The example requires an exact @mentra/bluetooth-sdk version, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Free disk space
        run: |
          df -h
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            "$ANDROID_HOME/ndk" \
            "$ANDROID_HOME/cmake" \
            "$ANDROID_HOME/emulator" \
            "$ANDROID_HOME/system-images" \
            "$ANDROID_HOME/platforms" \
            "$ANDROID_HOME/build-tools"
          df -h

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache GStreamer Android SDK
        uses: actions/cache@v4
        with:
          path: react-native/.gstreamer/Android.sdk
          key: gstreamer-android-${{ env.GSTREAMER_VERSION }}

      - name: Install dependencies
        working-directory: react-native
        run: bun install --frozen-lockfile

      - name: Type check TypeScript
        working-directory: react-native
        run: bunx tsc --noEmit

      - name: Generate Android project
        working-directory: react-native
        run: bunx expo prebuild --platform android --no-install

      - name: Verify Android cleartext support
        working-directory: react-native
        run: grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      - name: Type check generated Android project
        working-directory: react-native/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build release Android app
        working-directory: react-native/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Verify Android 16 KB page-size support
        run: react-native/scripts/check-android-16kb.sh react-native/android/app/build/outputs/apk/release/app-release.apk

      - name: Collect APK
        id: collect
        env:
          ARTIFACT_SUFFIX: ${{ steps.sdk-version.outputs.version }}
        run: |
          artifact_suffix="$ARTIFACT_SUFFIX"
          suffix="${artifact_suffix:+-$artifact_suffix}"
          output="mentra-example-react-native${suffix}.apk"
          cp react-native/android/app/build/outputs/apk/release/app-release.apk "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-react-native
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error

  react-native-elevenlabs-audio:
    name: React Native ElevenLabs audio example
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.sdk-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Bluetooth SDK version
        id: sdk-version
        run: |
          version=$(jq -er '.dependencies["@mentra/bluetooth-sdk"]' react-native-elevenlabs-audio/package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The example requires an exact @mentra/bluetooth-sdk version, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Free disk space
        run: |
          df -h
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            "$ANDROID_HOME/ndk" \
            "$ANDROID_HOME/cmake" \
            "$ANDROID_HOME/emulator" \
            "$ANDROID_HOME/system-images" \
            "$ANDROID_HOME/platforms" \
            "$ANDROID_HOME/build-tools"
          df -h

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: react-native-elevenlabs-audio
        run: bun install --frozen-lockfile

      - name: Type check TypeScript
        working-directory: react-native-elevenlabs-audio
        run: bun run typecheck

      - name: Generate Android project
        working-directory: react-native-elevenlabs-audio
        run: bunx expo prebuild --platform android --no-install

      - name: Verify Android cleartext support
        working-directory: react-native-elevenlabs-audio
        run: grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      - name: Type check generated Android project
        working-directory: react-native-elevenlabs-audio/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build release Android app
        working-directory: react-native-elevenlabs-audio/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        id: collect
        env:
          ARTIFACT_SUFFIX: ${{ steps.sdk-version.outputs.version }}
        run: |
          artifact_suffix="$ARTIFACT_SUFFIX"
          suffix="${artifact_suffix:+-$artifact_suffix}"
          output="mentra-example-rn-elevenlabs-audio${suffix}.apk"
          cp react-native-elevenlabs-audio/android/app/build/outputs/apk/release/app-release.apk "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-rn-elevenlabs-audio
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error
