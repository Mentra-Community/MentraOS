name: Doppler Porter health

# The hourly audit runs from Mentra's monorepo (doppler-porter-health.yml
# there); this keeps its pull request checks and manual runs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/porter-doppler-health*"
      - ".github/scripts/porter-doppler-source*"
      - "cloud-v2/porter*.yaml"
      - "cloud-v2/deploy/porter.shared.yaml"
      - "cloud-v2/deploy/runtime-policy.yaml"
      - ".github/scripts/render-cloud-v2-config*"
      - ".github/scripts/coordinated-cloud-v2-records.mjs"
      - ".github/production-release/doppler-porter-contract.json"
      - ".github/workflows/doppler-porter-health.yml"

permissions:
  contents: read

concurrency:
  group: doppler-porter-health
  cancel-in-progress: false

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Render every deployment environment
        run: |
          for environment in dev staging prod; do
            bun .github/scripts/render-cloud-v2-config.mjs --source-root . --environment "$environment"
          done
      - name: Test audit failure detection
        run: node --test .github/scripts/porter-doppler-{health,source}.test.mjs
      - name: Reject deployment source overrides
        run: node .github/scripts/porter-doppler-source.mjs
  check:
    # Only reviewed default-branch code may receive the Porter credential.
    # Pull requests run the uncredentialed tests/source guard above.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      PORTER_TOKEN: ${{ secrets.PORTER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: porter-dev/setup-porter@v0.1.0
      - name: Check sync freshness and configuration ownership
        run: node .github/scripts/porter-doppler-health.mjs
