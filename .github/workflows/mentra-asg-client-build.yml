name: MentraOS ASG Client Build

on:
  pull_request:
    paths:
      - "asg_client/**"
      - ".github/workflows/mentra-asg-client-build.yml"
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Cancel a branch's in-flight build when a newer commit is pushed to it.
# Scoped per-ref so branches never cancel each other; frees the shared Mac
# runners from superseded builds.
concurrency:
  group: asg-client-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    # Blacksmith 4 vCPU Ubuntu. Signing creds come from secrets via inject-signing
    # (no longer needs the mac runners' ~/.mentra/credentials), keeping mac
    # capacity free for iOS + staging/release builds. Faster than the free
    # ubuntu-latest tier (more vCPU + NVMe); same provider as our cloud builds.
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Update PR comment - Build started
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- pr-review-helper -->';
            const comment = comments.data.find(c => c.body.includes(marker));
            if (!comment) return;

            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            // Check for existing working build link to preserve
            const existingDownloadMatch = comment.body.match(/\[📥 \*\*Download ASG APK\*\*\]\((https:\/\/github\.com[^)]+\.apk)\)/);
            const existingShaMatch = comment.body.match(/🕶️ ASG Client[\s\S]*?✅ \*\*Ready to test!\*\* \(commit `([a-f0-9]+)`\)/);

            let buildStatus = `### 🕶️ ASG Client Build\n⏳ **Building...** (commit \`${sha}\`)`;

            // If there's a previous working build, show it
            if (existingDownloadMatch && existingShaMatch && existingShaMatch[1] !== sha) {
              buildStatus += `\n\n📦 **Previous build:** (commit \`${existingShaMatch[1]}\`) - [📥 **Download ASG APK**](${existingDownloadMatch[1]})`;
            }

            const newBody = comment.body.replace(
              /<!-- asg-build-status -->[\s\S]*?<!-- \/asg-build-status -->/,
              `<!-- asg-build-status -->\n${buildStatus}\n<!-- /asg-build-status -->`
            );

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body: newBody
            });

      - name: Get cache week number
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> $GITHUB_OUTPUT

      - name: Clean build artifacts (preserve caches)
        run: |
          # Only clean build outputs, NOT dependency caches
          rm -rf asg_client/app/build asg_client/.gradle asg_client/StreamPackLite

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Init StreamPackLite submodule
        # Path-scoped on purpose: .gitmodules also carries a dangling
        # mcu_client/peripheral_uart_next/nrf5340 entry with an unfetchable relative
        # self-URL; a blanket recursive init would break if its gitlink ever lands.
        run: git submodule update --init asg_client/StreamPackLite

      - name: Free up disk space
        # GitHub-hosted ubuntu ships ~14GB free; a full ASG release build (NDK +
        # Gradle + StreamPackLite) can exhaust it. Drop unused preinstalled
        # toolchains to reclaim ~15GB+. Keep the Android SDK.
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo "After:"; df -h / | tail -1

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup environment
        working-directory: ./asg_client
        run: |
          # Create .env from example
          cp .env.example .env

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Scope by runner.environment so a cache saved on self-hosted (absolute
          # symlinks) can't break tar-restore on a github-hosted runner.
          key: asg-gradle-${{ runner.environment }}-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-${{ hashFiles('asg_client/**/*.gradle*', 'asg_client/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            asg-gradle-${{ runner.environment }}-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-
            asg-gradle-${{ runner.environment }}-${{ runner.os }}-

      # Inject BEFORE the recovery worker build: build_and_deploy.sh links its
      # recovery keystore from asg_client/credentials/asg-keystore.jks (the repo-
      # local fallback this action writes) and signs with the ASG_* gradle props,
      # so it must run after injection or it falls back to ~/.mentra (the disk
      # dependency this PR removes) and fails on a clean runner.
      - name: Inject release signing key
        uses: ./.github/actions/inject-signing
        with:
          asg: "true"
          asg-keystore-b64: ${{ secrets.ASG_KEYSTORE_B64 }}
          asg-store-password: ${{ secrets.ASG_STORE_PASSWORD }}
          asg-key-password: ${{ secrets.ASG_KEY_PASSWORD }}
          asg-key-alias: ${{ secrets.ASG_KEY_ALIAS }}

      - name: Build recovery worker asset
        working-directory: ./asg_client/recovery_worker
        run: |
          chmod +x ./build_and_deploy.sh
          ./build_and_deploy.sh
          test -f ../app/src/main/assets/recovery_worker.apk

      - name: Build Release APK
        id: gradle-build
        working-directory: ./asg_client
        run: ./gradlew assembleRelease --build-cache --parallel
        continue-on-error: true

      - name: Retry build with clean cache (if first attempt failed)
        if: steps.gradle-build.outcome == 'failure'
        working-directory: ./asg_client
        run: |
          echo "First build failed, cleaning Gradle cache and retrying..."
          # Stop Gradle daemons first to release file locks
          ./gradlew --stop || true
          rm -rf ~/.gradle/caches ~/.gradle/wrapper || true
          ./gradlew assembleRelease --build-cache --parallel

      - name: Fail if both builds failed
        if: steps.gradle-build.outcome == 'failure'
        run: |
          # Check if retry succeeded by looking for the APK
          if [ ! -f "asg_client/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Both build attempts failed"
            exit 1
          fi

      - name: Verify release signature (not debug)
        # Guard against silent debug-key fallback: the APK MUST be signed with the
        # production key, never CN=Android Debug. Fail the build if it is.
        run: |
          APK=asg_client/app/build/outputs/apk/release/app-release.apk
          # Any build-tools apksigner can verify; pick the last one. Avoid
          # `sort -V` (not portable to older BSD/macOS sort) — plain sort of the
          # build-tools paths is fine for selecting one that exists.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::Release APK is DEBUG-signed — release keystore was not injected."
            exit 1
          fi
          echo "Release APK is signed with the production key."

      - name: Run unit tests
        working-directory: ./asg_client
        run: ./gradlew testDebugUnitTest

     # Temporarily disabled while ASG Java files are reformatted in a follow-up.
      # - name: Spotless check
      #   working-directory: ./asg_client
      #   run: ./gradlew spotlessCheck

      - name: Mark build succeeded
        id: build-ok
        run: echo "ok=true" >> $GITHUB_OUTPUT

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: asg-client-release
          path: asg_client/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK to pr-builds release
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const apkName = `asg-pr-${prNumber}-${sha}.apk`;
            const apkPath = 'asg_client/app/build/outputs/apk/release/app-release.apk';

            // Get the pr-builds release
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'pr-builds'
            });

            // Delete existing asset with same name if it exists
            for (const asset of release.data.assets) {
              if (asset.name === apkName) {
                console.log(`Deleting existing asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
                break;
              }
            }

            // Read the APK file
            const apkData = fs.readFileSync(apkPath);

            // Upload the APK
            console.log(`Uploading ${apkName} (${apkData.length} bytes)...`);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: apkName,
              data: apkData
            });

            console.log(`Successfully uploaded ${apkName}`);

      - name: Cleanup old release assets
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'pr-builds'
              });

              for (const asset of release.data.assets) {
                const createdAt = new Date(asset.created_at);
                if (createdAt < sevenDaysAgo) {
                  console.log(`Deleting old asset: ${asset.name} (created ${asset.created_at})`);
                  await github.rest.repos.deleteReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id
                  });
                }
              }
            } catch (error) {
              console.log('Cleanup skipped:', error.message);
            }

      - name: Update PR comment - Build succeeded
        if: steps.build-ok.outputs.ok == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- pr-review-helper -->';
            const comment = comments.data.find(c => c.body.includes(marker));
            if (!comment) return;

            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const apkName = `asg-pr-${prNumber}-${sha}.apk`;
            const downloadUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/pr-builds/${apkName}`;

            const buildStatus = `### 🕶️ ASG Client Build\n✅ **Ready to test!** (commit \`${sha}\`)\n\n[📥 **Download ASG APK**](${downloadUrl})`;

            const newBody = comment.body.replace(
              /<!-- asg-build-status -->[\s\S]*?<!-- \/asg-build-status -->/,
              `<!-- asg-build-status -->\n${buildStatus}\n<!-- /asg-build-status -->`
            );

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body: newBody
            });

      - name: Update PR comment - Build failed
        if: failure() && steps.build-ok.outcome != 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- pr-review-helper -->';
            const comment = comments.data.find(c => c.body.includes(marker));
            if (!comment) return;

            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Check if there was a previous working build
            const previousDownloadMatch = comment.body.match(/\[📥 \*\*Download ASG APK\*\*\]\((https:\/\/github\.com[^)]+\.apk)\)/);
            const previousShaMatch = comment.body.match(/🕶️ ASG Client[\s\S]*?✅ \*\*Ready to test!\*\* \(commit `([a-f0-9]+)`\)/)
                                  || comment.body.match(/📦 \*\*Previous build:\*\* \(commit `([a-f0-9]+)`\)/);

            let buildStatus = `### 🕶️ ASG Client Build\n❌ **Build failed** (commit \`${sha}\`) - [View logs](${runUrl})`;

            if (previousDownloadMatch && previousShaMatch && previousShaMatch[1] !== sha) {
              buildStatus += `\n\n📦 **Previous build:** (commit \`${previousShaMatch[1]}\`) - [📥 **Download ASG APK**](${previousDownloadMatch[1]})`;
            }

            const newBody = comment.body.replace(
              /<!-- asg-build-status -->[\s\S]*?<!-- \/asg-build-status -->/,
              `<!-- asg-build-status -->\n${buildStatus}\n<!-- /asg-build-status -->`
            );

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body: newBody
            });
