name: Mobile App Maestro E2E Tests (Android)

on:
  workflow_run:
    workflows: ["Mobile App Android Build"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      flow_filter:
        description: 'Filter flows by name (e.g., "auth", "captions"). Leave empty to run all.'
        required: false
        default: ''

env:
  E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
  E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

jobs:
  maestro-test:
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Download APK from build workflow
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: mentraos-manager-android-build.yml
          workflow_conclusion: success
          name: app-debug
          path: ./

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Determine emulator architecture
        id: emu-arch
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            echo "arch=arm64-v8a" >> $GITHUB_OUTPUT
          else
            echo "arch=x86_64" >> $GITHUB_OUTPUT
          fi

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-${{ steps.emu-arch.outputs.arch }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: ${{ steps.emu-arch.outputs.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Maestro E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: ${{ steps.emu-arch.outputs.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Wait for emulator to boot
            adb wait-for-device
            adb shell input keyevent 82

            # Install the APK
            adb install app-debug.apk

            # Install dependencies
            cd mobile
            bun install

            # Prep device (push test audio files, etc.)
            ./scripts/prep-test-device.sh

            # Determine which flows to run
            FLOW_FILTER="${{ github.event.inputs.flow_filter }}"

            if [ -n "$FLOW_FILTER" ]; then
              echo "Running flows matching: $FLOW_FILTER"
              maestro test .maestro/flows \
                --include-tags "$FLOW_FILTER" \
                --env MAESTRO_APP_ID=com.mentra.mentra \
                --env E2E_TEST_EMAIL="${E2E_TEST_EMAIL}" \
                --env E2E_TEST_PASSWORD="${E2E_TEST_PASSWORD}" \
                --format junit \
                --output maestro-results.xml || true
            else
              echo "Running all Maestro flows"
              maestro test .maestro/flows \
                --env MAESTRO_APP_ID=com.mentra.mentra \
                --env E2E_TEST_EMAIL="${E2E_TEST_EMAIL}" \
                --env E2E_TEST_PASSWORD="${E2E_TEST_PASSWORD}" \
                --format junit \
                --output maestro-results.xml || true
            fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: mobile/maestro-results.xml

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: ~/.maestro/tests/
          if-no-files-found: ignore

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: mobile/maestro-results.xml
          check_name: Maestro E2E Test Results
