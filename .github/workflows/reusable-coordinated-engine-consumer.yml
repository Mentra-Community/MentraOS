name: Reusable Coordinated Engine Consumer Gate

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      release_plan_artifact:
        required: true
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
    secrets:
      MAPBOX_DOWNLOADS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  source-only:
    name: Defer registry gate during a dry run
    if: inputs.dry_run == true
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - run: echo "Registry-backed consumer validation runs only after public package publication."

  android:
    name: Install public Engine and build Android host
    if: inputs.dry_run != true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-intent

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Check Mapbox SDK download authentication
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: node .github/scripts/check-mapbox-downloads.mjs

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the retired `tools` package,
          # which no longer downloads; Gradle fetches the rest it needs.
          packages: platform-tools

      - name: Prepare a clean external Engine host
        run: |
          identity=$(jq -er .releaseIdentity release-intent/release-plan.json)
          node .github/scripts/prepare-external-engine-fixture.mjs \
            --source examples/oem-app \
            --output "$RUNNER_TEMP/engine-consumer" \
            --release-identity "$identity"

      - name: Install only the public Engine entry and its registry closure
        working-directory: ${{ runner.temp }}/engine-consumer
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify exact public dependency resolution
        run: >-
          node .github/scripts/verify-external-engine-install.mjs
          --fixture "$RUNNER_TEMP/engine-consumer"
          --plan release-intent/release-plan.json

      - name: Verify public declarations and Metro resolution
        working-directory: ${{ runner.temp }}/engine-consumer
        run: |
          npx tsc --noEmit
          npx expo export --platform android --output-dir dist/android

      - name: Prebuild and compile the autolinked Android host
        working-directory: ${{ runner.temp }}/engine-consumer
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          npx expo prebuild --clean --no-install --platform android
          ./android/gradlew -p android :app:assembleDebug --no-daemon --stacktrace

  ios:
    name: Install public Engine and build iOS host
    if: inputs.dry_run != true
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      # This installed office toolchain compiled the unchanged public Engine
      # closure for both simulator architectures after Swift 6.2.3 crashed.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Verify the Expo iOS toolchain
        run: |
          set -euo pipefail
          # Keep credentials and caches separate from concurrent office jobs.
          consumer_home="$RUNNER_TEMP/engine-consumer-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$consumer_home"
          chmod 700 "$consumer_home"
          xcode_version=$(xcodebuild -version)
          swift_version=$(xcrun swift --version)
          printf '%s\n' "$xcode_version" "$swift_version"
          if [[ "$xcode_version" != $'Xcode 26.6\nBuild version 17F113' ]]; then
            echo '::error::The public Engine consumer requires the verified Xcode 26.6 (17F113) office toolchain.'
            exit 1
          fi
          if ! grep -Fq 'Apple Swift version 6.3.3 (swiftlang-6.3.3.1.3 clang-2100.1.1.101)' <<< "$swift_version"; then
            echo '::error::The public Engine consumer requires the verified Apple Swift 6.3.3 compiler.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-intent

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Check Mapbox SDK download authentication
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: node .github/scripts/check-mapbox-downloads.mjs

      - name: Configure Mapbox package access
        env:
          HOME: ${{ runner.temp }}/engine-consumer-home-${{ github.run_id }}-${{ github.run_attempt }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MAPBOX_DOWNLOADS_TOKEN"
          touch "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOADS_TOKEN" >> "$HOME/.netrc"

      - name: Prepare a clean external Engine host
        run: |
          identity=$(jq -er .releaseIdentity release-intent/release-plan.json)
          node .github/scripts/prepare-external-engine-fixture.mjs \
            --source examples/oem-app \
            --output "$RUNNER_TEMP/engine-consumer" \
            --release-identity "$identity"

      - name: Install only the public Engine entry and its registry closure
        working-directory: ${{ runner.temp }}/engine-consumer
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify exact public dependency resolution
        run: >-
          node .github/scripts/verify-external-engine-install.mjs
          --fixture "$RUNNER_TEMP/engine-consumer"
          --plan release-intent/release-plan.json

      - name: Prebuild and resolve the autolinked iOS host
        working-directory: ${{ runner.temp }}/engine-consumer
        env:
          HOME: ${{ runner.temp }}/engine-consumer-home-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test ! -d ios
          npx expo prebuild --no-install --platform ios
          cd ios
          pod install --repo-update

      - name: Compile the external iOS host without signing
        working-directory: ${{ runner.temp }}/engine-consumer/ios
        env:
          HOME: ${{ runner.temp }}/engine-consumer-home-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ExampleOEMApp.xcworkspace \
            -scheme ExampleOEMApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/engine-consumer-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Remove this job's Mapbox credentials
        if: always()
        env:
          HOME: ${{ runner.temp }}/engine-consumer-home-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -f "$HOME/.netrc"
