name: Example App Builds

# Builds the integrator examples in examples/bluetooth against the SDK source
# in this repository: no published packages, no version pins. The jobs live in
# reusable-bluetooth-examples.yml, which the coordinated release also calls to
# build the release's example apps. The engine example (examples/oem-app) has
# its own gates: oem-host-gate.yml and oem-app-apk.yml.

"on":
  pull_request:
    paths:
      - "examples/bluetooth/**"
      - "examples/package.json"
      - "examples/bun.lock"
      - "mobile/modules/bluetooth-sdk/**"
      - "mobile/modules/engine/**"
      - "mobile/modules/crust/**"
      - "mobile/modules/acs-meeting/**"
      - "mobile/modules/glasses-media/**"
      - "mobile/modules/miniapp/**"
      - "cloud-v2/packages/protocol/**"
      - "cloud-v2/packages/cloud-client/**"
      - ".github/workflows/example-app-builds.yml"
      - ".github/workflows/reusable-bluetooth-examples.yml"
  push:
    branches:
      - dev
    paths:
      - "examples/bluetooth/**"
      - "examples/package.json"
      - "examples/bun.lock"
      - "mobile/modules/bluetooth-sdk/**"
      - "mobile/modules/engine/**"
      - "mobile/modules/crust/**"
      - "mobile/modules/acs-meeting/**"
      - "mobile/modules/glasses-media/**"
      - "mobile/modules/miniapp/**"
      - "cloud-v2/packages/protocol/**"
      - "cloud-v2/packages/cloud-client/**"
      - ".github/workflows/example-app-builds.yml"
      - ".github/workflows/reusable-bluetooth-examples.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: example-app-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Bluetooth examples
    uses: ./.github/workflows/reusable-bluetooth-examples.yml
