name: Store build

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/websites/store/**"

concurrency:
  group: store-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      store: ${{ steps.filter.outputs.store }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so paths-filter can diff against the base of the PR
          fetch-depth: 0
      - name: Compute changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            store:
              - 'cloud/websites/store/**'

  build-store:
    name: Build cloud/websites/store
    needs: [changes]
    if: needs.changes.outputs.store == 'true'
    uses: ./.github/workflows/reusable-bun-build.yml
    with:
      working_directory: cloud/websites/store
      lockfile: cloud/websites/store/bun.lock
      bun_version: latest
      install_args: --frozen-lockfile
      build_script: build
      checkout_fetch_depth: 1

  gate-store:
    name: "Gate: Store build"
    needs: [changes, build-store]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        run: |
          if [ "${{ needs.changes.outputs.store }}" = "true" ]; then
            if [ "${{ needs.build-store.result }}" = "success" ]; then
              echo "Store changed; build passed."
              exit 0
            else
              echo "Store changed; build failed."
              exit 1
            fi
          else
            echo "No store changes; passing gate."
            exit 0
          fi

  comment-on-failure:
    name: Comment on failure
    if: failure() && github.event_name == 'pull_request'
    needs: [build-store]
    uses: ./.github/workflows/reusable-pr-comment.yml
    with:
      message: |
        Store build failed.
        Workflow: ${{ github.workflow }}
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        Tail of build log:
        ```
        ${{ needs.build-store.outputs.build_snippet }}
        ```
