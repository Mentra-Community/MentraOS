name: Deploy cloud-v2 debug

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-v2-auth
      - cloud-v2/debug
      - cloud-v2/debug/**
    paths:
      - "cloud-v2/**"
      - ".github/workflows/cloud-v2-debug.yml"

concurrency:
  group: cloud-v2-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy cloud-debug to AWS us-west-2
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      PORTER_CLUSTER: "5692"
      PORTER_PROJECT: "15081"
      PORTER_DEPLOYMENT_TARGET_ID: 87f939d6-b019-4955-9f4b-1050e8ff57bd
      PORTER_HOST: https://dashboard.porter.run
      PORTER_APP_NAME: cloud-debug
      PORTER_REPO_NAME: ${{ github.event.repository.name }}
      PORTER_TOKEN: ${{ secrets.PORTER_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_NAME: mentraglass.com
      CORE_HOSTNAME: core.debug.us-west-2.dev.mentraglass.com
      RUNTIME_HOSTNAME: runtime.debug.us-west-2.dev.mentraglass.com
      UDP_HOSTNAME: audio-udp.debug.us-west-2.dev.mentraglass.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Git SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Porter CLI
        uses: porter-dev/setup-porter@v0.1.0

      - name: Deploy cloud-debug app
        timeout-minutes: 45
        working-directory: cloud-v2
        env:
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          porter apply -f porter.debug.yaml \
            --variables AUDIO_UDP_PORT=8000 \
            --variables AUDIO_UDP_ADVERTISED_HOST="${UDP_HOSTNAME}" \
            --variables AUDIO_UDP_ADVERTISED_PORT=8000 \
            --variables AUDIO_WORKERS=1 \
            --variables CLOUD_RUNTIME_AUTH_AUDIENCE=cloud-runtime \
            --variables 'CLOUD_RUNTIME_AUTH_ISSUERS=[{"issuer":"cloud-core","publicKeyEnv":"MENTRA_JWT_PUBLIC_KEY","userIdClaim":"sub","oemIdClaim":"oem_id"}]'

      - name: Apply debug UDP NLB service
        working-directory: cloud-v2
        continue-on-error: true
        run: porter kubectl -- apply -f deploy/audio-udp-nlb-debug.yaml

      - name: Discover deployed load balancers
        id: endpoints
        run: |
          set -euo pipefail

          wait_for_jsonpath() {
            local resource="$1"
            local jsonpath="$2"
            local value=""
            for _ in $(seq 1 60); do
              value=$(porter kubectl -- get "$resource" -o "jsonpath=${jsonpath}" 2>/dev/null || true)
              if [ -n "$value" ]; then
                printf '%s' "$value"
                return 0
              fi
              sleep 10
            done
            echo "Timed out waiting for $resource $jsonpath" >&2
            return 1
          }

          CORE_INGRESS=$(wait_for_jsonpath "ingress/cloud-debug-core" "{.status.loadBalancer.ingress[0].hostname}")
          RUNTIME_INGRESS=$(wait_for_jsonpath "ingress/cloud-debug-runtime" "{.status.loadBalancer.ingress[0].hostname}")
          UDP_NLB=$(wait_for_jsonpath "svc/cloud-debug-audio-udp" "{.status.loadBalancer.ingress[0].hostname}" || true)
          if [ -z "$UDP_NLB" ]; then
            echo "Debug UDP NLB is not available yet; skipping UDP DNS record." >&2
          fi

          echo "core_ingress=$CORE_INGRESS" >> "$GITHUB_OUTPUT"
          echo "runtime_ingress=$RUNTIME_INGRESS" >> "$GITHUB_OUTPUT"
          echo "udp_nlb=$UDP_NLB" >> "$GITHUB_OUTPUT"

      - name: Upsert Cloudflare DNS
        working-directory: cloud-v2
        env:
          CORE_INGRESS: ${{ steps.endpoints.outputs.core_ingress }}
          RUNTIME_INGRESS: ${{ steps.endpoints.outputs.runtime_ingress }}
          UDP_NLB: ${{ steps.endpoints.outputs.udp_nlb }}
        run: |
          set -euo pipefail
          CF_DNS_RECORDS=$(bun -e '
            const records = [
              {
                type: "CNAME",
                name: process.env.CORE_HOSTNAME,
                content: process.env.CORE_INGRESS,
                proxied: false,
                comment: "cloud-v2 debug core HTTP/REST"
              },
              {
                type: "CNAME",
                name: process.env.RUNTIME_HOSTNAME,
                content: process.env.RUNTIME_INGRESS,
                proxied: false,
                comment: "cloud-v2 debug runtime WS/HTTP"
              }
            ];
            if (process.env.UDP_NLB) {
              records.push({
                type: "CNAME",
                name: process.env.UDP_HOSTNAME,
                content: process.env.UDP_NLB,
                proxied: false,
                comment: "cloud-v2 debug UDP audio - DNS only; do not proxy"
              });
            }
            process.stdout.write(JSON.stringify(records));
          ')
          export CF_DNS_RECORDS
          bun scripts/cloudflare-upsert-dns.ts

      - name: Verify debug health
        run: |
          set -euo pipefail
          curl --retry 12 --retry-delay 10 --retry-all-errors -fsS "https://${CORE_HOSTNAME}/healthz"
          echo
          curl --retry 12 --retry-delay 10 --retry-all-errors -fsS "https://${RUNTIME_HOSTNAME}/healthz"
          echo
