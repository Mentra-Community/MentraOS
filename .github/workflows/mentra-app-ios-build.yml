name: Mobile App iOS Build

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mentra-app-ios-build.yml"
      - ".github/workflows/reusable-pr-build-notification.yml"
      - ".github/scripts/pr-ios-artifacts*"
      # Scripts and config this job executes; a change to them must run it.
      - ".github/scripts/ios-*"
      - ".github/ccache/**"
      - ".github/actions/disk-guard/**"
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      pr_compile_mode:
        description: >-
          Build with the same settings a pull_request run gets (PR-only
          compile-check shortcuts). Use together with force_clean_retry to
          exercise the retry path under PR conditions.
        required: false
        type: boolean
        default: false
      force_clean_retry:
        description: >-
          Skip the first xcodebuild attempt so the clean-cache retry path runs.
          Test-only; never set on real builds.
        required: false
        type: boolean
        default: false
      ccache_mode:
        description: >-
          ccache behaviour for this dispatch: default (use the host cache),
          recache (recompile everything and overwrite cache entries; use to
          diagnose a suspected stale hit), off (do not use ccache).
        required: false
        type: choice
        options: [default, recache, off]
        default: default

# Cancel a branch's in-flight build when a newer commit is pushed to it.
# Scoped per-ref so branches never cancel each other; keeps the Mac runner
# queue from filling with superseded builds.
concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build job never writes to the repository. `actions: read` lets the
# timing summary read its own job's step timestamps.
permissions:
  contents: read
  actions: read

env:
  PR_IOS_SIGNED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    outputs:
      upload_attempt: ${{ github.run_attempt }}
    env:
      EXPO_PUBLIC_AR99_RELEASE_DEVELOPER_ID: ${{ secrets.EXPO_PUBLIC_AR99_RELEASE_DEVELOPER_ID }}
      EXPO_PUBLIC_AR99_RELEASE_CLIENT_KEY: ${{ secrets.EXPO_PUBLIC_AR99_RELEASE_CLIENT_KEY }}
      # Compile-check mode: the build is disposable (unsigned `build`, nothing
      # published), so PR-only shortcuts apply (no JS bundle, no dSYM/debug
      # info, no index store). True for pull_request runs whose build is NOT
      # signed and published (fork PRs, or same-repo PRs without signing), and
      # for dispatches that ask for PR behaviour. Signed PR archives are
      # installed by testers, so they build like a full build.
      MENTRA_IOS_PR_COMPILE_MODE: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || inputs.pr_compile_mode == true) && 'true' || 'false' }}
      # ccache eligibility is broader: every pull_request build (signed or
      # not) may use the host compiler cache; push builds to dev/main and
      # full-mode dispatches never do.
      MENTRA_IOS_CCACHE_ELIGIBLE: ${{ (github.event_name == 'pull_request' || inputs.pr_compile_mode == true) && 'true' || 'false' }}
      # Repository variable: set MENTRA_IOS_CCACHE=false to disable ccache on
      # every PR run at once (kill switch); unset or any other value enables.
      MENTRA_IOS_CCACHE_VAR: ${{ vars.MENTRA_IOS_CCACHE }}
      MENTRA_IOS_CCACHE_MODE: ${{ inputs.ccache_mode || 'default' }}
      MENTRA_IOS_FORCE_CLEAN_RETRY: ${{ inputs.force_clean_retry == true && 'true' || 'false' }}

    steps:
      - name: Record job start and Actions cache state
        id: job-start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Runner: ${RUNNER_NAME:-unknown}  event: ${{ github.event_name }}  pr_compile_mode: $MENTRA_IOS_PR_COMPILE_MODE"
          # Actions cache usage for the repo at job start. The configured
          # storage limit is not exposed by the REST API for this repo
          # (usage-policy returns 404); it is 10 GB unless changed in repo
          # settings, so record usage and the largest entries instead.
          usage="$(gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage" 2>/dev/null || echo '{}')"
          size_bytes="$(printf '%s' "$usage" | jq -r '.active_caches_size_in_bytes // 0')"
          count="$(printf '%s' "$usage" | jq -r '.active_caches_count // 0')"
          printf 'Actions cache usage: %s entries, %s GB\n' "$count" "$(awk -v b="$size_bytes" 'BEGIN { printf "%.2f", b / 1073741824 }')"
          echo "cache_size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"
          echo "cache_count=$count" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100&sort=size_in_bytes&direction=desc" \
            --jq '.actions_caches[] | "\(.size_in_bytes / 1048576 | floor) MB  \(.key)"' 2>/dev/null | head -12 > "$RUNNER_TEMP/cache-entries.txt" || true
          cat "$RUNNER_TEMP/cache-entries.txt" || true

      - name: Kill stale build processes (this runner's prior job only)
        run: |
          # This is a SHARED self-hosted macOS runner. A blanket `killall xcodebuild`
          # would kill iOS builds for OTHER branches running concurrently here — that was
          # the cause of the recurring fast, diagnostic-free build failures (xcodebuild
          # SIGTERM'd mid-compile → exit 65 with no error). The self-hosted runner only
          # ever executes ONE job at a time per runner process, but multiple runner
          # processes share this Mac, so we must not touch other runners' xcodebuild.
          #
          # Scope the cleanup to xcodebuild processes whose RUNNER_WORKSPACE matches ours.
          # xcodebuild invocations carry the workspace path in their args, so grep for it
          # and SIGTERM only those. Anything from another branch lives under a different
          # runner work dir and is left alone.
          WS="${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}"
          echo "Cleaning stale xcodebuild under: $WS"
          # pgrep -f matches the full arg list; -- guards against paths starting with '-'.
          pids="$(pgrep -f "xcodebuild.*${WS}" 2>/dev/null || true)"
          if [ -n "$pids" ]; then
            echo "Terminating stale xcodebuild pids: $pids"
            # shellcheck disable=SC2086
            kill -TERM $pids 2>/dev/null || true
            sleep 2
            # shellcheck disable=SC2086
            kill -KILL $pids 2>/dev/null || true
          else
            echo "No stale xcodebuild for this workspace."
          fi
          # Simulators are per-job and safe to shut down for THIS runner only; but a
          # machine-wide `killall Simulator` / `simctl shutdown all` would also disrupt
          # other runners. Device builds (generic/platform=iOS) don't use a simulator at
          # all, so we skip simulator teardown entirely here.

      - name: Clean previous build outputs only
        run: |
          # Wipe this workspace's build outputs from previous runs. Host-level
          # dependency caches (~/Library/Caches/CocoaPods, ~/.cocoapods, the
          # bun cache) live outside the workspace and are left alone.
          rm -rf mobile/ios/build mobile/ios/build-device

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space if low
        uses: ./.github/actions/disk-guard

      - name: Configure ccache for the compile check
        id: ccache
        run: |
          # Host-persistent compiler cache for C/C++/ObjC (the largest share of
          # this build: ~980 CPU-s of CompileC vs ~480 of SwiftCompile). Enabled
          # for pull_request builds (signed or compile-check) and only when
          # ccache is installed on the host (setup-runner.sh installs it;
          # `brew install ccache` on older hosts). Push builds to dev/main never
          # use it. Without ccache the job runs exactly as before.
          #
          # - USE_CCACHE=1 is read by the generated Podfile
          #   (ccache_enabled? -> react_native_post_install :ccache_enabled),
          #   which points CC/CXX/LD/LDPLUSPLUS at React Native's ccache-clang
          #   wrappers. No generated file is edited.
          # - CCACHE_DIR lives outside ~/Library/Caches so the weekly Tier-2
          #   cleanup keeps it; disk-guard's deep tier removes it when the host
          #   is critically low. All runner processes on the host share it.
          #   It is namespaced by a hash of the toolchain (Xcode, macOS, arch,
          #   ccache) and of our ccache config + compile-check settings, so a
          #   toolchain or configuration change can never reuse old objects.
          # - CCACHE_CONFIGPATH points at .github/ccache/ios-compile-check.conf
          #   (RN's wrapper honours a pre-set value): sloppiness, depend_mode,
          #   compiler_check=content and the 20 GB cap live there, under our
          #   control rather than in node_modules.
          # - CCACHE_BASEDIR makes paths under this runner's workspace
          #   relative, so actions-runner-1/2/3 produce identical hashes.
          # - CCACHE_STATSLOG gives this job its own hit/miss log; the shared
          #   global counters are never zeroed (other jobs are using them).
          # Switches: repository variable MENTRA_IOS_CCACHE=false disables
          # ccache on every PR run (kill switch); workflow_dispatch input
          # ccache_mode=off|recache is per-run diagnosis.
          if [ "$MENTRA_IOS_CCACHE_ELIGIBLE" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull_request build: ccache not used."
            exit 0
          fi
          if [ "${MENTRA_IOS_CCACHE_VAR:-}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ccache disabled for all PR runs by repository variable MENTRA_IOS_CCACHE=false."
            exit 0
          fi
          if [ "${MENTRA_IOS_CCACHE_MODE:-default}" = "off" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ccache_mode=off: compiling without ccache for this dispatch."
            exit 0
          fi
          if ! command -v ccache >/dev/null 2>&1; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ccache is not installed on ${RUNNER_NAME:-this runner}; compiling without it (see mobile/scripts/README.md)."
            exit 0
          fi
          conf="$GITHUB_WORKSPACE/.github/ccache/ios-compile-check.conf"
          settings="$GITHUB_WORKSPACE/.github/scripts/ios-compile-check-settings.sh"
          toolchain="$( { xcodebuild -version; sw_vers -productVersion; uname -m; ccache --version | head -1; cat "$conf" "$settings"; } | shasum -a 256 | cut -c1-16 )"
          ccache_dir="$HOME/.ccache-mentra-ci/$toolchain"
          mkdir -p "$ccache_dir"
          {
            echo "USE_CCACHE=1"
            echo "CCACHE_DIR=$ccache_dir"
            echo "CCACHE_CONFIGPATH=$conf"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
          } >> "$GITHUB_ENV"
          if [ "${MENTRA_IOS_CCACHE_MODE:-default}" = "recache" ]; then
            echo "CCACHE_RECACHE=1" >> "$GITHUB_ENV"
            echo "ccache_mode=recache: every compilation runs and overwrites its cache entry."
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "namespace=$toolchain" >> "$GITHUB_OUTPUT"
          echo "ccache $(ccache --version | head -1 | awk '{print $NF}') enabled; cache dir $ccache_dir (namespace $toolchain)"
          CCACHE_DIR="$ccache_dir" CCACHE_CONFIGPATH="$conf" ccache --show-stats 2>/dev/null | head -12 || true
          echo "Existing namespaces under $HOME/.ccache-mentra-ci:"; du -sh "$HOME/.ccache-mentra-ci"/* 2>/dev/null || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match coordinated mobile builds. v2 reuses this installed version
          # or downloads from GitHub Releases, avoiding the flaky bun.sh alias.
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test PR artifact and notification contracts
        run: |
          node --test .github/scripts/pr-ios-artifacts.test.mjs .github/scripts/notify-pr-builds.test.mjs
          python3 mobile/ci/pr-ios/test_artifacts.py

      - name: Use the self-hosted Mac's Ruby for signing
        if: env.PR_IOS_SIGNED == 'true'
        working-directory: mobile
        run: |
          set -euo pipefail
          ruby_bin="$(brew --prefix ruby)/bin"
          export PATH="$ruby_bin:$PATH"
          echo "$ruby_bin" >> "$GITHUB_PATH"
          ruby --version
          # Do not install hosted-runner Ruby under /Users/runner on this Mac.
          # Keep gems and Bundler configuration scoped to this job.
          export BUNDLE_PATH="$RUNNER_TEMP/mentra-pr-signing-gems"
          export BUNDLE_FROZEN=true
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          echo "BUNDLE_FROZEN=true" >> "$GITHUB_ENV"
          bundle install --jobs 4 --retry 3

      - name: Install PR ad hoc signing assets
        if: env.PR_IOS_SIGNED == 'true'
        working-directory: mobile
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          RAW_MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          IOS_PR_PROFILE_BASE64: ${{ secrets.IOS_PR_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/mentra-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "PR_IOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "PR_IOS_KEYCHAIN_PASSWORD=$password" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          # Match release signing: keep only this disposable job keychain
          # unlocked through archive/export; always delete it at job cleanup.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          python3 ci/pr-ios/keychain-search.py add "$keychain"
          # A fresh job keychain needs the Apple certificate chain as well as
          # the distribution identity, matching the coordinated signing setup.
          for wwdr in G2 G3 G4 G5 G6; do
            certificate="$RUNNER_TEMP/AppleWWDRCA${wwdr}.cer"
            curl --fail --silent --show-error --location --retry 2 \
              "https://www.apple.com/certificateauthority/AppleWWDRCA${wwdr}.cer" -o "$certificate"
            security import "$certificate" -k "$keychain" -T /usr/bin/codesign
          done
          MATCH_GIT_BASIC_AUTHORIZATION="$(printf '%s' "$RAW_MATCH_GIT_BASIC_AUTHORIZATION" | tr -d '\r\n')"
          export MATCH_GIT_BASIC_AUTHORIZATION
          bundle exec fastlane match adhoc --readonly --skip_provisioning_profiles true --keychain_name "$keychain" --keychain_password "$password"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          python3 ci/pr-ios/artifacts.py configure --keychain "$keychain" --output build/pr-ios

      # No actions/cache here on purpose. Measured over the last twelve runs
      # before the signed PR flow, and worse since (DerivedData saves of 27 and
      # 59 minutes were observed in the week of 2026-09-18):
      #   - DerivedData (3.5 GB) hit 2/12 times; a hit saved 30–60 s of
      #     xcodebuild but cost 100–210 s to restore and 105–660 s to save.
      #   - Installed Pods: pod install took 18 s with or without the cache,
      #     while restore+save cost 45–80 s.
      #   - CocoaPods downloads (1.1 GB): 43 s per run to overwrite files that
      #     already persist in ~/Library/Caches/CocoaPods on this self-hosted
      #     host between the weekly Tier-2 cleanup runs.
      # Every entry also competed for the repo's 10 GB cache quota with the
      # Android/ASG Gradle caches. Host-local persistence (CocoaPods cache,
      # ccache) replaces all of them.

      - name: Install dependencies
        id: bun-install
        working-directory: ./mobile
        run: bun install --no-frozen-lockfile
        continue-on-error: true

      - name: Retry bun install with clean node_modules (if first attempt failed)
        if: steps.bun-install.outcome == 'failure'
        working-directory: ./mobile
        run: |
          echo "First bun install failed, wiping node_modules and retrying..."
          rm -rf node_modules
          bun install --no-frozen-lockfile

      - name: Test native gallery download progress
        run: mobile/scripts/test-gallery-download-progress.sh

      - name: Validate CocoaPods post-install project integrity
        working-directory: ./mobile
        run: bun ./scripts/check-mapbox-pods-project.ts

      - name: Setup environment
        working-directory: ./mobile
        # Copy the dummy .env, then overwrite the Mapbox runtime token line with
        # the real public token (pk.…). app.config.ts bakes it into Info.plist
        # (MBXAccessToken) for the Nav SDK.
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_MOBILE_PRD }}
        run: |
          cp .env.example .env
          # Pin which cloud this binary talks to (OS-1875).
          #
          # main is production-configured; dev, PRs and feature branches use dev
          # cloud. Trusted PRs publish ad hoc iPhone/Mac downloads; other events
          # remain compile checks. No TestFlight export or upload occurs here.
          #
          # .env.example ships dev URLs so a local checkout builds with no setup.
          # A lane that produces a distributable must not inherit that silently.
          # Fatal on release-producing events, warning on pull_request, matching the
          # Sentry DSN rule (OS-1827).
          case "${{ github.ref_name }}" in
            main) CLOUD_ENV="prod" ;;
            *) CLOUD_ENV="dev" ;;
          esac
          case "$CLOUD_ENV" in
            dev)
              CLOUD_CORE="https://core.dev.us-west-2.mentraglass.com"
              CLOUD_RT="https://runtime.dev.us-west-2.mentraglass.com"
              ;;
            staging)
              CLOUD_CORE="https://core.staging.us-west-2.mentraglass.com"
              CLOUD_RT="https://runtime.staging.us-west-2.mentraglass.com"
              ;;
            prod)
              CLOUD_CORE="https://core.us-west-2.mentraglass.com"
              CLOUD_RT="https://runtime.us-west-2.mentraglass.com"
              ;;
            *)
              CLOUD_CORE=""
              CLOUD_RT=""
              ;;
          esac
          if [ -n "$CLOUD_CORE" ]; then
            sed -e "s|^EXPO_PUBLIC_BUILD_ENV=.*|EXPO_PUBLIC_BUILD_ENV=$CLOUD_ENV|" \
                -e "s|^EXPO_PUBLIC_CLOUD_CORE_URL=.*|EXPO_PUBLIC_CLOUD_CORE_URL=$CLOUD_CORE|" \
                -e "s|^EXPO_PUBLIC_CLOUD_RUNTIME_URL=.*|EXPO_PUBLIC_CLOUD_RUNTIME_URL=$CLOUD_RT|" \
                .env > .env.tmp && mv .env.tmp .env
            # Make the pin authoritative for every later step. release:android /
            # release:ios call setBuildEnv(), which keeps any value already
            # present in the environment over the .env file (standard dotenv
            # precedence, deliberately relied on for the signing credentials).
            # These jobs run on persistent self-hosted runners, so a stale
            # runner-level EXPO_PUBLIC_CLOUD_* or EXPO_PUBLIC_BUILD_ENV would
            # otherwise outrank the values written above, Expo would bundle the
            # inherited endpoint, and validateReleaseArchive() would compare the
            # bundle against that same inherited process env and pass. GITHUB_ENV
            # takes precedence over the runner's inherited environment, so the
            # three keys agree from here on.
            {
              echo "EXPO_PUBLIC_BUILD_ENV=$CLOUD_ENV"
              echo "EXPO_PUBLIC_CLOUD_CORE_URL=$CLOUD_CORE"
              echo "EXPO_PUBLIC_CLOUD_RUNTIME_URL=$CLOUD_RT"
            } >> "$GITHUB_ENV"
            echo "Cloud backend pinned to $CLOUD_ENV ($CLOUD_CORE)"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::Unrecognised cloud env '$CLOUD_ENV'; this PR build keeps the dev backend (OS-1875)."
          else
            echo "::error::Unrecognised cloud env '$CLOUD_ENV'. A distributable build must pin its backend (OS-1875)."
            exit 1
          fi
          if [ -n "$MAPBOX_PUBLIC_TOKEN" ]; then
            sed -i '' "s|^EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=.*|EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=$MAPBOX_PUBLIC_TOKEN|" .env
          else
            echo "::warning::MAPBOX_PUBLIC_TOKEN secret not set — iOS build will use the dummy token and on-device navigation will not work."
          fi
          # .env.example ships an empty EXPO_PUBLIC_SENTRY_DSN and SentrySetup.tsx
          # returns early on an empty DSN *without logging*, so every CI build has
          # shipped with crash reporting silently off (OS-1827). Warn rather than
          # fail, but never be silent about it again.
          # A release-producing lane must never ship a green build with crash
          # reporting silently off -- that is the exact failure OS-1827 exists to
          # remove. pull_request runs legitimately have no secrets (forks, and
          # secrets are not exposed to PRs from outside collaborators), so those
          # still warn and continue. Everything else -- push to a release branch,
          # workflow_dispatch, staging -- is fatal.
          #
          # Note the curl below keeps `|| true` on purpose: a network failure or a
          # changed response shape lands here as an empty DSN and is reported with
          # an actionable message, rather than killing the step with a bare
          # non-zero exit that says nothing about crash reporting.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SENTRY_DSN_REQUIRED=false
          else
            SENTRY_DSN_REQUIRED=true
          fi
          sentry_dsn_unavailable() {
            if [ "$SENTRY_DSN_REQUIRED" = "true" ]; then
              echo "::error::$1 A release build must have crash reporting (OS-1827)."
              exit 1
            fi
            echo "::warning::$1 This PR build will have no crash reporting (OS-1827)."
          }
          if [ -n "$DOPPLER_TOKEN" ]; then
            # curl, not the Doppler CLI action: that action verifies its own
            # download with gpg and hard-fails where gpg is absent, which is the
            # case on our self-hosted macOS runners. curl needs nothing that is
            # not already on every runner. The single-secret endpoint keeps the
            # rest of the config (MAPBOX_DOWNLOADS_TOKEN) out of the shell; a
            # service token implies its own project and config.
            SENTRY_DSN_RESPONSE="$(curl -sS --fail-with-body --retry 3 --retry-connrefused \
              -u "$DOPPLER_TOKEN:" \
              "https://api.doppler.com/v3/configs/config/secret?name=EXPO_PUBLIC_SENTRY_DSN" || true)"
            # A DSN contains no double quote, so this extraction is exact.
            SENTRY_DSN_VALUE="$(printf '%s' "$SENTRY_DSN_RESPONSE" | sed -n 's/.*"computed":"\([^"]*\)".*/\1/p')"
            echo "::add-mask::$SENTRY_DSN_VALUE"
            if [ -n "$SENTRY_DSN_VALUE" ]; then
              sed "s|^EXPO_PUBLIC_SENTRY_DSN=.*|EXPO_PUBLIC_SENTRY_DSN=$SENTRY_DSN_VALUE|" .env > .env.tmp && mv .env.tmp .env
            else
              sentry_dsn_unavailable "Doppler returned an empty EXPO_PUBLIC_SENTRY_DSN."
            fi
          else
            sentry_dsn_unavailable "DOPPLER_TOKEN_MOBILE_PRD secret not set."
          fi

      - name: Configure Mapbox SPM credentials (~/.netrc)
        # The Mapbox Navigation SDK (v3) is a Swift Package fetched from
        # api.mapbox.com at prebuild / pod install / SPM resolve time. SPM
        # authenticates via ~/.netrc with the Downloads:Read secret token (sk.…).
        # Without this the package download returns 401. Build-time only — never
        # written into the IPA.
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret not set — SPM cannot fetch the Mapbox Nav SDK; iOS build will fail with 401."
            exit 1
          fi
          # Remove any prior api.mapbox.com entry so re-runs on the persistent
          # self-hosted runner don't stack duplicate machine lines.
          if [ -f "$HOME/.netrc" ]; then
            sed -i '' '/machine api.mapbox.com/,+2d' "$HOME/.netrc" || true
          fi
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOADS_TOKEN" >> "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Ensure a clean iOS prebuild (drop any stale generated project)
        run: |
          # mobile/ios is gitignored (generated by prebuild). If anything left a
          # partial mobile/ios/ behind, `expo prebuild` sees the directory,
          # says "reusing /ios" and SKIPS regenerating the native project, so
          # there is no AppDelegate and the withIosIcons config plugin fails
          # with "Could not locate a valid AppDelegate at root: .../mobile"
          # (#3239). Remove the directory outright so prebuild always
          # regenerates AppDelegate + the Xcode project. We do NOT use
          # `expo prebuild --clean` (disallowed).
          rm -rf mobile/ios

      - name: Run Expo prebuild
        working-directory: ./mobile
        # --no-install: prebuild would otherwise run its own `pod install`
        # (~23 s) that the explicit step below repeats with the self-heal
        # retry. One controlled pod install instead of two.
        run: bun expo prebuild --platform ios --no-install

      - name: Show generated Podfile ccache hook
        # Diagnostic only. Prints how the generated Podfile wires
        # react_native_post_install so we know which switch (USE_CCACHE env or
        # Podfile.properties.json apple.ccacheEnabled) actually enables ccache
        # for this Expo/RN version.
        continue-on-error: true
        working-directory: ./mobile/ios
        run: |
          echo "--- react_native_post_install(...) in generated Podfile ---"
          awk '/react_native_post_install\(/,/^[[:space:]]*\)/' Podfile || true
          echo "--- ccache references in Podfile ---"
          grep -n -i "ccache" Podfile || echo "(none)"
          echo "--- Podfile.properties.json ---"
          cat Podfile.properties.json 2>/dev/null || echo "(missing)"

      # The former "Setup Sherpa Onnx" step downloaded sherpa-onnx.xcframework
      # into mobile/ios/Packages/SherpaOnnx, a path nothing consumes: the
      # MentraBluetoothSDK podspec vendors the git-tracked copy under
      # mobile/modules/bluetooth-sdk/ios/Packages/SherpaOnnx. The step below
      # asserts that the vendored copy is what pod install integrates.

      - name: Install CocoaPods dependencies
        working-directory: ./mobile/ios
        run: |
          # Self-heal a corrupted prebuilt-framework install: Pods can end up
          # missing the React-Core-prebuilt React.xcframework Info.plist (a known
          # RN-0.83 prebuilt + CocoaPods cache flake on the self-hosted runners).
          # On failure, clear the project Pods + the global pod cache and
          # reinstall fresh. Happy path is unchanged.
          # pipefail: the default `bash -e` shell would otherwise report tee's
          # exit status and never trigger the retry.
          set -o pipefail
          pod install 2>&1 | tee "$RUNNER_TEMP/pod-install.log" || {
            echo "::warning::pod install failed (likely a stale/corrupt prebuilt cache) — clearing caches and retrying"
            # Keep Podfile.lock: the retry must resolve the same pod versions as the
            # first attempt, not drift to whatever currently satisfies the Podfile.
            rm -rf Pods
            pod cache clean --all || true
            pod install --repo-update 2>&1 | tee -a "$RUNNER_TEMP/pod-install.log"
          }

      - name: Verify ccache wiring in the generated Pods project
        if: steps.ccache.outputs.enabled == 'true'
        working-directory: ./mobile/ios
        run: |
          # react_native_post_install logs exactly one of these. With
          # USE_CCACHE=1 and ccache on PATH it must be the "Setting" line.
          if grep -qF '[Ccache]: Setting CC, LD, CXX & LDPLUSPLUS' "$RUNNER_TEMP/pod-install.log"; then
            echo "ccache wrappers applied to CC/CXX/LD/LDPLUSPLUS (pod install log)."
          else
            echo "::error::USE_CCACHE=1 was set but pod install did not apply the ccache wrappers:"
            grep -F '[Ccache]' "$RUNNER_TEMP/pod-install.log" || echo "(no [Ccache] line at all)"
            exit 1
          fi
          # The integration writes CCACHE_BINARY and the wrapper paths into the
          # projects' build settings (not xcconfig files), so check the
          # project files themselves.
          for proj in Pods/Pods.xcodeproj/project.pbxproj Mentra.xcodeproj/project.pbxproj; do
            if ! grep -q 'CCACHE_BINARY' "$proj" || ! grep -q 'ccache-clang.sh' "$proj"; then
              echo "::error::$proj lacks CCACHE_BINARY / ccache-clang.sh build settings"
              grep -n -i 'ccache' "$proj" | head -5 || true
              exit 1
            fi
          done
          echo "CCACHE_BINARY and ccache-clang wrappers present in Pods and app project build settings."

      - name: Verify vendored Sherpa ONNX framework is integrated from the module
        working-directory: ./mobile/ios
        run: |
          # The xcframework must come from the bluetooth-sdk module tree (git
          # tracked), not from a CI-time download into mobile/ios/Packages.
          if [ -e Packages/SherpaOnnx ]; then
            echo "::error::mobile/ios/Packages/SherpaOnnx exists; the legacy CI download path is back."
            exit 1
          fi
          support='Pods/Target Support Files/MentraBluetoothSDK'
          if ! grep -rq 'bluetooth-sdk/ios/Packages/SherpaOnnx' "$support" Pods/Pods.xcodeproj/project.pbxproj 2>/dev/null; then
            echo "::error::pod install did not reference the module's Packages/SherpaOnnx directory"
            grep -rn -i "sherpa" "$support" 2>/dev/null | head -5 || true
            exit 1
          fi
          if ! grep -q 'sherpa-onnx.xcframework' Pods/Pods.xcodeproj/project.pbxproj; then
            echo "::error::sherpa-onnx.xcframework is not integrated in the Pods project"
            exit 1
          fi
          echo "Vendored sherpa-onnx.xcframework integrated from the bluetooth-sdk module."

      - name: Configure only the app target for PR signing
        if: env.PR_IOS_SIGNED == 'true'
        working-directory: mobile
        run: bundle exec ruby ci/pr-ios/configure-signing.rb ios/Mentra.xcodeproj build/pr-ios/signing.json

      - name: Ensure iOS platform is installed
        working-directory: ./mobile/ios
        run: |
          # Idempotent: no-op if already present, downloads if missing.
          # Required because Xcode bundles SDK headers but device-build
          # support files are downloaded separately (e.g. iOS 26.4).
          xcodebuild -downloadPlatform iOS || true

      # ----------------------------------------------------------------------
      # Debug simulator build — disabled on PRs to keep Mac mini queue moving.
      # Re-enable when Maestro E2E is added (Maestro needs simulator builds).
      # ----------------------------------------------------------------------
      # - name: Build iOS app for Simulator
      #   working-directory: ./mobile/ios
      #   run: |
      #     xcodebuild \
      #                -workspace Mentra.xcworkspace \
      #                -scheme Mentra \
      #                -configuration Debug \
      #                -sdk iphonesimulator \
      #                -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.0' \
      #                -derivedDataPath build

      - name: Build iOS app for Device (cached attempt)
        id: xcode-build
        working-directory: ./mobile/ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        continue-on-error: true
        run: |
          if [ "$MENTRA_IOS_FORCE_CLEAN_RETRY" = "true" ]; then
            echo "force_clean_retry set: skipping the first attempt so the retry path runs."
            echo "duration_seconds=0" >> "$GITHUB_OUTPUT"
            echo "status=99" >> "$GITHUB_OUTPUT"
            exit 99
          fi
          # mobile/ci/pr-ios/build.mjs runs xcodebuild: a signed `archive` for
          # trusted PRs (published as iPhone/Mac downloads) or an unsigned
          # `build` compile check otherwise. The wrapper keeps the full log and
          # Build Timing Summary in $RUNNER_TEMP (uploaded as an artifact
          # below), shows errors/warnings/result on the console, and exits
          # with xcodebuild's own status (PIPESTATUS), never tee's.
          # shellcheck source=.github/scripts/ios-compile-check-settings.sh
          . "$GITHUB_WORKSPACE/.github/scripts/ios-compile-check-settings.sh"
          cd "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/.github/scripts/ios-xcodebuild-attempt.sh" attempt-1 -- \
            node mobile/ci/pr-ios/build.mjs

      - name: Retry build with clean caches (if first attempt failed)
        id: xcode-build-clean
        if: steps.xcode-build.outcome == 'failure'
        working-directory: ./mobile/ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          echo "First build failed, nuking caches and retrying from scratch..."

          # Kill any hung xcodebuild from THIS job's failed attempt only — scoped to our
          # workspace so we don't SIGTERM other branches' builds on this shared runner
          # (a machine-wide killall here was part of the recurring cross-build failures).
          WS="${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}"
          pids="$(pgrep -f "xcodebuild.*${WS}" 2>/dev/null || true)"
          if [ -n "$pids" ]; then
            echo "Terminating stale xcodebuild pids: $pids"
            # shellcheck disable=SC2086
            kill -TERM $pids 2>/dev/null || true
            sleep 2
            # shellcheck disable=SC2086
            kill -KILL $pids 2>/dev/null || true
          fi

          # DerivedData wipe scoped to THIS workspace's build dir only (the global
          # ~/Library/.../DerivedData/Mentra-* glob would clobber other branches' builds
          # mid-flight on the shared runner). build-device is our -derivedDataPath.

          # Wipe iOS caches for THIS workspace only. The build uses
          # -derivedDataPath build-device, so that dir IS our DerivedData — removing it is
          # sufficient. We intentionally do NOT `rm -rf ~/Library/.../DerivedData/Mentra-*`:
          # that global glob would delete other branches' in-flight DerivedData on this
          # shared runner, which was contributing to the cross-build failures.
          # Keep Podfile.lock so the retry resolves the same dependency graph as
          # the first attempt rather than drifting to newer pod versions.
          rm -rf Pods build-device

          # Reinstall pods from scratch with fresh repo
          pod install --repo-update

          # Retry serially. The fallback only runs after a failed cached build,
          # and limiting concurrency avoids the observed CocoaPods VFS overlay
          # disappearing while parallel compile and XCFramework copy jobs run.
          # shellcheck source=.github/scripts/ios-compile-check-settings.sh
          . "$GITHUB_WORKSPACE/.github/scripts/ios-compile-check-settings.sh"
          cd "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/.github/scripts/ios-xcodebuild-attempt.sh" attempt-2 -- \
            node mobile/ci/pr-ios/build.mjs --serial

      - name: Verify build outputs
        if: steps.xcode-build.outcome == 'success' || steps.xcode-build-clean.outcome == 'success'
        env:
          TIMING1: ${{ steps.xcode-build.outputs.timing_summary }}
          TIMING2: ${{ steps.xcode-build-clean.outputs.timing_summary }}
          LOG1: ${{ steps.xcode-build.outputs.log }}
          LOG2: ${{ steps.xcode-build-clean.outputs.log }}
        run: |
          # Signed PR builds archive; compile checks build. Both must leave an app.
          if [ "$PR_IOS_SIGNED" = "true" ]; then
            app="mobile/build/pr-ios/Mentra.xcarchive/Products/Applications/Mentra.app"
          else
            app="mobile/ios/build-device/Build/Products/Release-iphoneos/Mentra.app"
          fi
          test -d "$app" || { echo "::error::$app missing after a successful build"; exit 1; }
          # The log of the attempt that produced the app: the retry's if it ran.
          log="$LOG1"
          if [ -n "$LOG2" ] && [ -s "$LOG2" ]; then log="$LOG2"; fi
          skip_marker='SKIP_BUNDLING enabled; skipping.'
          if [ "$MENTRA_IOS_PR_COMPILE_MODE" = "true" ]; then
            # dSYM generation is disabled in PR compile mode; the timing summary
            # lists every task type xcodebuild ran, so GenerateDSYMFile must be absent.
            for t in "$TIMING1" "$TIMING2"; do
              if [ -n "$t" ] && [ -s "$t" ] && grep -q '^GenerateDSYMFile' "$t"; then
                echo "::error::GenerateDSYMFile ran in PR compile mode (DEBUG_INFORMATION_FORMAT=dwarf not applied)"
                exit 1
              fi
            done
            # JS bundling is skipped in PR compile mode: the bundle phase must
            # have logged the skip marker and no main.jsbundle may exist.
            if ! grep -qF "$skip_marker" "$log"; then
              echo "::error::PR compile mode but the bundle phase did not log '$skip_marker' (SKIP_BUNDLING not honoured)"
              exit 1
            fi
            if [ -e "$app/main.jsbundle" ]; then
              echo "::error::PR compile mode but $app/main.jsbundle exists (JS bundling ran)"
              exit 1
            fi
            echo "PR compile mode: no dSYM generation and JS bundling skipped, as expected."
          else
            # Full build: the bundle phase must have run and embedded the bundle.
            if grep -qF "$skip_marker" "$log"; then
              echo "::error::Full build mode but the bundle phase was skipped"
              exit 1
            fi
            if [ ! -s "$app/main.jsbundle" ]; then
              echo "::error::Full build mode but $app/main.jsbundle is missing or empty"
              exit 1
            fi
            echo "Full build mode: JS bundle embedded ($(du -h "$app/main.jsbundle" | cut -f1)), default debug-info settings."
          fi

      - name: Summarize iOS build attempts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STARTED_AT: ${{ steps.job-start.outputs.started_at }}
          CACHE_SIZE_BYTES: ${{ steps.job-start.outputs.cache_size_bytes }}
          CACHE_COUNT: ${{ steps.job-start.outputs.cache_count }}
          ATTEMPT1_OUTCOME: ${{ steps.xcode-build.outcome }}
          ATTEMPT1_SECONDS: ${{ steps.xcode-build.outputs.duration_seconds }}
          ATTEMPT1_TIMING: ${{ steps.xcode-build.outputs.timing_summary }}
          ATTEMPT2_OUTCOME: ${{ steps.xcode-build-clean.outcome }}
          ATTEMPT2_SECONDS: ${{ steps.xcode-build-clean.outputs.duration_seconds }}
          ATTEMPT2_TIMING: ${{ steps.xcode-build-clean.outputs.timing_summary }}
          EVENT_NAME: ${{ github.event_name }}
          PR_COMPILE_MODE: ${{ env.MENTRA_IOS_PR_COMPILE_MODE }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CCACHE_ENABLED: ${{ steps.ccache.outputs.enabled }}
        run: "$GITHUB_WORKSPACE/.github/scripts/ios-build-summary.sh"

      - name: Upload xcodebuild logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/xcodebuild-attempt-*.log
            ${{ runner.temp }}/xcodebuild-attempt-*.timing.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Require a successful build attempt
        if: always()
        env:
          CACHED_RESULT: ${{ steps.xcode-build.outcome }}
          RETRY_RESULT: ${{ steps.xcode-build-clean.outcome }}
        run: test "$CACHED_RESULT" = success || test "$RETRY_RESULT" = success

      - name: Export and package iPhone and Mac downloads
        if: success() && env.PR_IOS_SIGNED == 'true'
        run: |
          set -euo pipefail
          security unlock-keychain -p "$PR_IOS_KEYCHAIN_PASSWORD" "$PR_IOS_KEYCHAIN"
          xcodebuild -exportArchive -archivePath mobile/build/pr-ios/Mentra.xcarchive \
            -exportOptionsPlist mobile/build/pr-ios/ExportOptions.plist \
            -exportPath mobile/build/pr-ios/export
          python3 mobile/ci/pr-ios/artifacts.py package \
            --ipa mobile/build/pr-ios/export/Mentra.ipa --output pr-ios-output

      - name: Hand off signed PR downloads
        id: handoff
        if: success() && env.PR_IOS_SIGNED == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pr-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-ios-output
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Retry signed download handoff
        if: steps.handoff.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pr-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-ios-output
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Remove this job's signing keychain
        if: always() && env.PR_IOS_KEYCHAIN != ''
        run: |
          python3 mobile/ci/pr-ios/keychain-search.py remove "$PR_IOS_KEYCHAIN"
          security delete-keychain "$PR_IOS_KEYCHAIN"

  publish:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACTS_R2_ACCOUNT_ID: ${{ vars.ARTIFACTS_R2_ACCOUNT_ID }}
      ARTIFACTS_R2_BUCKET: artifactscdn
      SOURCE_RUN_ID: ${{ github.run_id }}
      SOURCE_RUN_ATTEMPT: ${{ needs.build.outputs.upload_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --prefix .github/artifact-storage
      - uses: actions/download-artifact@v4
        with:
          name: pr-ios-${{ github.run_id }}-${{ needs.build.outputs.upload_attempt }}
          path: pr-ios-output
      - name: Publish verified iPhone installer, IPA, Mac ZIP and receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        run: node .github/scripts/pr-ios-artifacts.mjs pr-ios-output

  notify-pr-builds:
    needs: [build, publish]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/reusable-pr-build-notification.yml
    permissions:
      contents: read
      actions: read
      pull-requests: write
    secrets:
      SLACK_WEBHOOK_PR_BUILDS: ${{ secrets.SLACK_WEBHOOK_PR_BUILDS }}
