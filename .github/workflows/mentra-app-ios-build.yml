name: Mobile App iOS Build

on:
  pull_request:
    paths:
      - "mobile/**"
      - "android_core/**"
      - "cloud-v2/packages/cloud-client/src/**"
      - "cloud-v2/packages/cloud-client/react-native/**"
      - "cloud-v2/packages/cloud-client/package.json"
      - "cloud-v2/packages/protocol/src/**"
      - "cloud-v2/packages/protocol/package.json"
      - "cloud-v2/packages/runtime/src/protocol/**"
      - "cloud-v2/bun.lock"
      - "package.json"
      - "bun.lock"
      - "asg_client/**"
      - ".github/workflows/mentra-app-android-build.yml"
      - ".github/workflows/mentra-asg-client-build.yml"
      - ".github/actions/inject-signing/**"
      - ".github/scripts/pr-mobile-build*"
      - ".github/scripts/mobile-build-inputs*"
      - ".github/scripts/ensure-android-ndk*"
      - ".github/scripts/install-android-sdk*"
      - ".github/scripts/pr_mobile_config.py"
      - ".github/scripts/prepare-pr-mobile.mjs"
      - ".github/scripts/repackage-pr-apk*"
      - ".github/scripts/test_repackage_pr_apk.py"
      - ".github/scripts/notify-pr-builds*"
      - ".github/workflows/mentra-app-ios-build.yml"
      - ".github/workflows/reusable-pr-build-notification.yml"
      - ".github/scripts/pr-ios-artifacts*"
      - ".github/scripts/ios-*"
      - ".github/actions/disk-guard/**"
      - ".github/scripts/pr-android-artifacts*"
      - ".github/scripts/select-pr-asg.mjs"
      - ".github/scripts/compute-asg-build-identity.mjs"
      - ".github/scripts/allocate-asg-version.mjs"
      - ".github/scripts/build-bluetooth-sdk-ota-manifest.mjs"
  push:
    branches:
      - main
      - dev
    paths:
      - "mobile/**"
      - "android_core/**"
      - "cloud-v2/packages/cloud-client/src/**"
      - "cloud-v2/packages/cloud-client/react-native/**"
      - "cloud-v2/packages/cloud-client/package.json"
      - "cloud-v2/packages/protocol/src/**"
      - "cloud-v2/packages/protocol/package.json"
      - "cloud-v2/packages/runtime/src/protocol/**"
      - "cloud-v2/bun.lock"
      - "package.json"
      - "bun.lock"
      - "asg_client/**"
      - ".github/workflows/mentra-app-android-build.yml"
      - ".github/workflows/mentra-asg-client-build.yml"
      - ".github/actions/inject-signing/**"
      - ".github/scripts/pr-mobile-build*"
      - ".github/scripts/mobile-build-inputs*"
      - ".github/scripts/ensure-android-ndk*"
      - ".github/scripts/install-android-sdk*"
      - ".github/scripts/pr_mobile_config.py"
      - ".github/scripts/prepare-pr-mobile.mjs"
      - ".github/scripts/repackage-pr-apk*"
      - ".github/scripts/test_repackage_pr_apk.py"
      - ".github/scripts/notify-pr-builds*"
      - ".github/workflows/mentra-app-ios-build.yml"
      - ".github/workflows/reusable-pr-build-notification.yml"
      - ".github/scripts/pr-ios-artifacts*"
      - ".github/scripts/ios-*"
      - ".github/actions/disk-guard/**"
      - ".github/scripts/pr-android-artifacts*"
      - ".github/scripts/select-pr-asg.mjs"
      - ".github/scripts/compute-asg-build-identity.mjs"
      - ".github/scripts/allocate-asg-version.mjs"
      - ".github/scripts/build-bluetooth-sdk-ota-manifest.mjs"
  workflow_dispatch:

# Cancel a branch's in-flight build when a newer commit is pushed to it.
# Scoped per-ref so branches never cancel each other; keeps the Mac runner
# queue from filling with superseded builds.
concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PR_IOS_SIGNED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  # Keep per-PR configuration out of reusable JavaScript, matching Android.
  EXPO_PUBLIC_ASG_OTA_VERSION_URL: ""
  PR_OTA_MANIFEST_URL: ${{ github.event_name == 'pull_request' && format('https://artifactscdn.mentraglass.com/{0}/releases/pr-builds/ota-pr-{1}-{2}.json', github.repository, github.event.pull_request.number, github.event.pull_request.head.sha) || '' }}

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    outputs:
      upload_attempt: ${{ github.run_attempt }}
    env:
      EXPO_PUBLIC_AR99_RELEASE_DEVELOPER_ID: ${{ secrets.EXPO_PUBLIC_AR99_RELEASE_DEVELOPER_ID }}
      EXPO_PUBLIC_AR99_RELEASE_CLIENT_KEY: ${{ secrets.EXPO_PUBLIC_AR99_RELEASE_CLIENT_KEY }}

    steps:
      - name: Record job start and Actions cache state
        id: job-start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "IOS_BUILD_LOG_DIR=$RUNNER_TEMP/ios-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Runner: ${RUNNER_NAME:-unknown}  event: ${{ github.event_name }}"
          # Actions cache usage for the repo at job start. The configured
          # storage limit is not exposed by the REST API for this repo
          # (usage-policy returns 404); it is 10 GB unless changed in repo
          # settings, so record usage and the largest entries instead.
          usage="$(gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage" 2>/dev/null || echo '{}')"
          size_bytes="$(printf '%s' "$usage" | jq -r '.active_caches_size_in_bytes // 0')"
          count="$(printf '%s' "$usage" | jq -r '.active_caches_count // 0')"
          printf 'Actions cache usage: %s entries, %s GB\n' "$count" "$(awk -v b="$size_bytes" 'BEGIN { printf "%.2f", b / 1073741824 }')"
          echo "cache_size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"
          echo "cache_count=$count" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100&sort=size_in_bytes&direction=desc" \
            --jq '.actions_caches[] | "\(.size_in_bytes / 1048576 | floor) MB  \(.key)"' 2>/dev/null | head -12 > "$RUNNER_TEMP/cache-entries.txt" || true
          cat "$RUNNER_TEMP/cache-entries.txt" || true

      - name: Kill stale build processes (this runner's prior job only)
        run: |
          # This is a SHARED self-hosted macOS runner. A blanket `killall xcodebuild`
          # would kill iOS builds for OTHER branches running concurrently here — that was
          # the cause of the recurring fast, diagnostic-free build failures (xcodebuild
          # SIGTERM'd mid-compile → exit 65 with no error). The self-hosted runner only
          # ever executes ONE job at a time per runner process, but multiple runner
          # processes share this Mac, so we must not touch other runners' xcodebuild.
          #
          # Scope the cleanup to xcodebuild processes whose RUNNER_WORKSPACE matches ours.
          # xcodebuild invocations carry the workspace path in their args, so grep for it
          # and SIGTERM only those. Anything from another branch lives under a different
          # runner work dir and is left alone.
          WS="${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}"
          echo "Cleaning stale xcodebuild under: $WS"
          # pgrep -f matches the full arg list; -- guards against paths starting with '-'.
          pids="$(pgrep -f "xcodebuild.*${WS}" 2>/dev/null || true)"
          if [ -n "$pids" ]; then
            echo "Terminating stale xcodebuild pids: $pids"
            # shellcheck disable=SC2086
            kill -TERM $pids 2>/dev/null || true
            sleep 2
            # shellcheck disable=SC2086
            kill -KILL $pids 2>/dev/null || true
          else
            echo "No stale xcodebuild for this workspace."
          fi
          # Simulators are per-job and safe to shut down for THIS runner only; but a
          # machine-wide `killall Simulator` / `simctl shutdown all` would also disrupt
          # other runners. Device builds (generic/platform=iOS) don't use a simulator at
          # all, so we skip simulator teardown entirely here.

      - name: Clean previous build outputs only
        run: |
          # This must run before checkout's git clean. Keep the helper outside
          # the checkout so the clean-cache retry can use the same policy.
          cat > "$RUNNER_TEMP/mentra-ios-cleanup.py" <<'PY'
          import errno
          import os
          from pathlib import Path
          import shutil
          import sys
          import time

          def remove_output(target):
              # Xcode workers can finish writing after their parent is stopped.
              # Retry only teardown races, for at most 15 seconds of backoff.
              for attempt in range(6):
                  try:
                      if target.is_symlink():
                          target.unlink()
                      else:
                          shutil.rmtree(target)
                      if os.path.lexists(target):
                          raise OSError(errno.EBUSY, "Build output was recreated", str(target))
                      return
                  except OSError as error:
                      if error.errno == errno.ENOENT and not os.path.lexists(target):
                          return
                      if error.errno not in {errno.ENOENT, errno.ENOTEMPTY, errno.EBUSY} or attempt == 5:
                          raise
                      delay = min(2 ** attempt, 4)
                      print(f"::warning::Cleanup still busy: {target} ({error.strerror}); retrying in {delay}s", flush=True)
                      time.sleep(delay)

          if __name__ == "__main__":
              root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
              allowed = {"mobile/ios/build", "mobile/ios/build-device", "mobile/ios/Pods"}
              if not sys.argv[1:] or any(target not in allowed for target in sys.argv[1:]):
                  raise ValueError("Expected only this checkout's iOS build/cache paths")
              if (root / "mobile/ios").resolve() != root / "mobile/ios":
                  raise ValueError("Refusing cleanup through a symlinked mobile/ios parent")
              for target in sys.argv[1:]:
                  remove_output(root / target)
          PY
          # Preserve Pods, node_modules and all other runners' build outputs.
          python3 "$RUNNER_TEMP/mentra-ios-cleanup.py" mobile/ios/build mobile/ios/build-device

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space if low
        uses: ./.github/actions/disk-guard

      - name: Isolate this runner's CocoaPods download cache
        run: |
          # Three runner processes share this Mac. With one shared
          # ~/Library/Caches/CocoaPods, a job whose pod install self-heal runs
          # `pod cache clean --all` deletes archives another job is reading at
          # that moment (seen as "No such file or directory @ rb_file_s_lstat
          # ... CocoaPods/Pods/Release/ZXingObjC/..." in a concurrent retry).
          # CocoaPods honours CP_CACHE_DIR, so keep one download cache per
          # runner process. Still under ~/Library/Caches, so the weekly Tier-2
          # cleanup and disk-guard treat it like before; first run per
          # process is cold once.
          cache_dir="$HOME/Library/Caches/CocoaPods-${RUNNER_NAME:-runner}"
          mkdir -p "$cache_dir"
          echo "CP_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CocoaPods download cache for this runner: $cache_dir ($(du -sh "$cache_dir" 2>/dev/null | cut -f1))"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match coordinated mobile builds. v2 reuses this installed version
          # or downloads from GitHub Releases, avoiding the flaky bun.sh alias.
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test PR artifact and notification contracts
        run: |
          node --test .github/scripts/pr-ios-artifacts.test.mjs .github/scripts/notify-pr-builds.test.mjs mobile/scripts/release-bundle-config.test.mjs
          python3 mobile/ci/pr-ios/test_artifacts.py
          python3 mobile/ci/pr-ios/test_mac_installer.py
          bash mobile/ci/pr-ios/mac-installer/test.sh
          python3 mobile/ci/pr-ios/test_repackage.py
          python3 mobile/ci/pr-ios/test_keychain_search.py
          python3 mobile/ci/pr-ios/test_cleanup_workflow.py
          node --test mobile/ci/pr-ios/xcode-attempt.test.mjs
          node --test .github/scripts/pr-mobile-build.test.mjs .github/scripts/ios-build-timings.test.mjs .github/scripts/ios-xcodebuild-attempt.test.mjs .github/scripts/ios-cache-cleanup.test.mjs

      - name: Setup environment
        working-directory: ./mobile
        # Copy the dummy .env, then overwrite the Mapbox runtime token line with
        # the real public token (pk.…). app.config.ts bakes it into Info.plist
        # (MBXAccessToken) for the Nav SDK.
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_MOBILE_PRD }}
        run: |
          cp .env.example .env
          # Pin which cloud this binary talks to (OS-1875).
          #
          # main is production-configured; staging-targeted PRs use staging; dev,
          # other PRs and feature branches use dev
          # cloud. Trusted PRs publish ad hoc iPhone/Mac downloads; other events
          # remain compile checks. No TestFlight export or upload occurs here.
          #
          # .env.example ships dev URLs so a local checkout builds with no setup.
          # A lane that produces a distributable must not inherit that silently.
          # Fatal on release-producing events, warning on pull_request, matching the
          # Sentry DSN rule (OS-1827).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # A PR app targets its base's services: staging-targeted PRs use
            # staging, every other PR keeps dev. GITHUB_BASE_REF is GitHub's PR
            # base, not PR-controlled input. The backend is part of the reuse
            # fingerprint, so a dev binary is never repackaged as staging.
            case "$GITHUB_BASE_REF" in
              staging) CLOUD_ENV="staging" ;;
              *) CLOUD_ENV="dev" ;;
            esac
          else
            case "${{ github.ref_name }}" in
              main) CLOUD_ENV="prod" ;;
              *) CLOUD_ENV="dev" ;;
            esac
          fi
          case "$CLOUD_ENV" in
            dev)
              CLOUD_CORE="https://core.dev.us-west-2.mentraglass.com"
              CLOUD_RT="https://runtime.dev.us-west-2.mentraglass.com"
              ;;
            staging)
              CLOUD_CORE="https://core.staging.us-west-2.mentraglass.com"
              CLOUD_RT="https://runtime.staging.us-west-2.mentraglass.com"
              ;;
            prod)
              CLOUD_CORE="https://core.us-west-2.mentraglass.com"
              CLOUD_RT="https://runtime.us-west-2.mentraglass.com"
              ;;
            *)
              CLOUD_CORE=""
              CLOUD_RT=""
              ;;
          esac
          if [ -n "$CLOUD_CORE" ]; then
            sed -e "s|^EXPO_PUBLIC_BUILD_ENV=.*|EXPO_PUBLIC_BUILD_ENV=$CLOUD_ENV|" \
                -e "s|^EXPO_PUBLIC_CLOUD_CORE_URL=.*|EXPO_PUBLIC_CLOUD_CORE_URL=$CLOUD_CORE|" \
                -e "s|^EXPO_PUBLIC_CLOUD_RUNTIME_URL=.*|EXPO_PUBLIC_CLOUD_RUNTIME_URL=$CLOUD_RT|" \
                .env > .env.tmp && mv .env.tmp .env
            # Make the pin authoritative for every later step. release:android /
            # release:ios call setBuildEnv(), which keeps any value already
            # present in the environment over the .env file (standard dotenv
            # precedence, deliberately relied on for the signing credentials).
            # These jobs run on persistent self-hosted runners, so a stale
            # runner-level EXPO_PUBLIC_CLOUD_* or EXPO_PUBLIC_BUILD_ENV would
            # otherwise outrank the values written above, Expo would bundle the
            # inherited endpoint, and validateReleaseArchive() would compare the
            # bundle against that same inherited process env and pass. GITHUB_ENV
            # takes precedence over the runner's inherited environment, so the
            # three keys agree from here on.
            {
              echo "EXPO_PUBLIC_BUILD_ENV=$CLOUD_ENV"
              echo "EXPO_PUBLIC_CLOUD_CORE_URL=$CLOUD_CORE"
              echo "EXPO_PUBLIC_CLOUD_RUNTIME_URL=$CLOUD_RT"
            } >> "$GITHUB_ENV"
            echo "Cloud backend pinned to $CLOUD_ENV ($CLOUD_CORE)"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::Unrecognised cloud env '$CLOUD_ENV'; this PR build keeps the dev backend (OS-1875)."
          else
            echo "::error::Unrecognised cloud env '$CLOUD_ENV'. A distributable build must pin its backend (OS-1875)."
            exit 1
          fi
          if [ -n "$MAPBOX_PUBLIC_TOKEN" ]; then
            sed -i '' "s|^EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=.*|EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=$MAPBOX_PUBLIC_TOKEN|" .env
          else
            echo "::warning::MAPBOX_PUBLIC_TOKEN secret not set — iOS build will use the dummy token and on-device navigation will not work."
          fi
          # .env.example ships an empty EXPO_PUBLIC_SENTRY_DSN and SentrySetup.tsx
          # returns early on an empty DSN *without logging*, so every CI build has
          # shipped with crash reporting silently off (OS-1827). Warn rather than
          # fail, but never be silent about it again.
          # A release-producing lane must never ship a green build with crash
          # reporting silently off -- that is the exact failure OS-1827 exists to
          # remove. pull_request runs legitimately have no secrets (forks, and
          # secrets are not exposed to PRs from outside collaborators), so those
          # still warn and continue. Everything else -- push to a release branch,
          # workflow_dispatch, staging -- is fatal.
          #
          # Note the curl below keeps `|| true` on purpose: a network failure or a
          # changed response shape lands here as an empty DSN and is reported with
          # an actionable message, rather than killing the step with a bare
          # non-zero exit that says nothing about crash reporting.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SENTRY_DSN_REQUIRED=false
          else
            SENTRY_DSN_REQUIRED=true
          fi
          sentry_dsn_unavailable() {
            if [ "$SENTRY_DSN_REQUIRED" = "true" ]; then
              echo "::error::$1 A release build must have crash reporting (OS-1827)."
              exit 1
            fi
            echo "::warning::$1 This PR build will have no crash reporting (OS-1827)."
          }
          if [ -n "$DOPPLER_TOKEN" ]; then
            # curl, not the Doppler CLI action: that action verifies its own
            # download with gpg and hard-fails where gpg is absent, which is the
            # case on our self-hosted macOS runners. curl needs nothing that is
            # not already on every runner. The single-secret endpoint keeps the
            # rest of the config (MAPBOX_DOWNLOADS_TOKEN) out of the shell; a
            # service token implies its own project and config.
            SENTRY_DSN_RESPONSE="$(curl -sS --fail-with-body --retry 3 --retry-connrefused \
              -u "$DOPPLER_TOKEN:" \
              "https://api.doppler.com/v3/configs/config/secret?name=EXPO_PUBLIC_SENTRY_DSN" || true)"
            # A DSN contains no double quote, so this extraction is exact.
            SENTRY_DSN_VALUE="$(printf '%s' "$SENTRY_DSN_RESPONSE" | sed -n 's/.*"computed":"\([^"]*\)".*/\1/p')"
            echo "::add-mask::$SENTRY_DSN_VALUE"
            if [ -n "$SENTRY_DSN_VALUE" ]; then
              sed "s|^EXPO_PUBLIC_SENTRY_DSN=.*|EXPO_PUBLIC_SENTRY_DSN=$SENTRY_DSN_VALUE|" .env > .env.tmp && mv .env.tmp .env
            else
              sentry_dsn_unavailable "Doppler returned an empty EXPO_PUBLIC_SENTRY_DSN."
            fi
          else
            sentry_dsn_unavailable "DOPPLER_TOKEN_MOBILE_PRD secret not set."
          fi

      - name: Prepare PR mobile configuration
        if: env.PR_IOS_SIGNED == 'true'
        run: node .github/scripts/prepare-pr-mobile.mjs

      - name: Use the self-hosted Mac's Ruby for signing
        if: env.PR_IOS_SIGNED == 'true'
        working-directory: mobile
        run: |
          set -euo pipefail
          ruby_bin="$(brew --prefix ruby)/bin"
          export PATH="$ruby_bin:$PATH"
          echo "$ruby_bin" >> "$GITHUB_PATH"
          ruby --version
          # Do not install hosted-runner Ruby under /Users/runner on this Mac.
          # Keep gems and Bundler configuration scoped to this job.
          export BUNDLE_PATH="$RUNNER_TEMP/mentra-pr-signing-gems"
          export BUNDLE_FROZEN=true
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          echo "BUNDLE_FROZEN=true" >> "$GITHUB_ENV"
          bundle install --jobs 4 --retry 3

      - name: Install PR ad hoc signing assets
        if: env.PR_IOS_SIGNED == 'true'
        working-directory: mobile
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          RAW_MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          IOS_PR_PROFILE_BASE64: ${{ secrets.IOS_PR_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/mentra-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "PR_IOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "PR_IOS_KEYCHAIN_PASSWORD=$password" >> "$GITHUB_ENV"
          python3 ci/pr-ios/keychain-search.py locked security create-keychain -p "$password" "$keychain"
          # Match release signing: keep only this disposable job keychain
          # unlocked through archive/export; always delete it at job cleanup.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          python3 ci/pr-ios/keychain-search.py add "$keychain"
          # A fresh job keychain needs the Apple certificate chain as well as
          # the distribution identity, matching the coordinated signing setup.
          for wwdr in G2 G3 G4 G5 G6; do
            certificate="$RUNNER_TEMP/AppleWWDRCA${wwdr}.cer"
            curl --fail --silent --show-error --location --retry 2 \
              "https://www.apple.com/certificateauthority/AppleWWDRCA${wwdr}.cer" -o "$certificate"
            security import "$certificate" -k "$keychain" -T /usr/bin/codesign
          done
          MATCH_GIT_BASIC_AUTHORIZATION="$(printf '%s' "$RAW_MATCH_GIT_BASIC_AUTHORIZATION" | tr -d '\r\n')"
          export MATCH_GIT_BASIC_AUTHORIZATION
          bundle exec fastlane match adhoc --readonly --skip_provisioning_profiles true --keychain_name "$keychain" --keychain_password "$password"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          python3 ci/pr-ios/artifacts.py configure --keychain "$keychain" --output build/pr-ios

      - name: Configure Developer ID signing and notarization for the Mac download
        if: env.PR_IOS_SIGNED == 'true'
        env:
          DOPPLER_TOKEN_MOBILE_PRD: ${{ secrets.DOPPLER_TOKEN_MOBILE_PRD }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl --fail --silent --show-error --location --retry 2 \
            "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$certificate"
          python3 mobile/ci/pr-ios/mac_installer.py configure \
            --keychain "$PR_IOS_KEYCHAIN" --output mobile/build/pr-ios \
            --intermediate "$certificate"
          # The Mac import touches the same job keychain; verify that the iOS
          # identity remains usable before spending time compiling the app.
          python3 mobile/ci/pr-ios/artifacts.py probe \
            --keychain "$PR_IOS_KEYCHAIN" --output mobile/build/pr-ios

      - name: Fingerprint compiled mobile inputs
        if: env.PR_IOS_SIGNED == 'true'
        run: node .github/scripts/pr-mobile-build.mjs ios

      - name: Select a matching signed PR IPA
        id: select-ipa
        if: env.PR_IOS_SIGNED == 'true'
        env:
          ARTIFACTS_R2_ACCOUNT_ID: ${{ vars.ARTIFACTS_R2_ACCOUNT_ID }}
          ARTIFACTS_R2_BUCKET: artifactscdn
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        uses: actions/github-script@v7
        with:
          script: |
            const {selectMobile} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-mobile-build.mjs`);
            await selectMobile({github, context, core, platform: 'ios'});

      - name: Install dependencies
        if: steps.select-ipa.outputs.reused != 'true'
        id: bun-install
        working-directory: ./mobile
        run: bun install --no-frozen-lockfile
        continue-on-error: true

      - name: Retry bun install with clean node_modules (if first attempt failed)
        if: steps.bun-install.outcome == 'failure'
        working-directory: ./mobile
        run: |
          echo "First bun install failed, wiping node_modules and retrying..."
          rm -rf node_modules
          bun install --no-frozen-lockfile

      - name: Test native gallery download progress
        if: steps.select-ipa.outputs.reused != 'true'
        run: mobile/scripts/test-gallery-download-progress.sh

      - name: Test native hotspot error facts
        if: steps.select-ipa.outputs.reused != 'true'
        run: mobile/scripts/test-hotspot-error-facts.sh

      - name: Validate CocoaPods post-install project integrity
        if: steps.select-ipa.outputs.reused != 'true'
        working-directory: ./mobile
        run: bun ./scripts/check-mapbox-pods-project.ts

      - name: Configure Mapbox SPM credentials (~/.netrc)
        if: steps.select-ipa.outputs.reused != 'true'
        # The Mapbox Navigation SDK (v3) is a Swift Package fetched from
        # api.mapbox.com at prebuild / pod install / SPM resolve time. SPM
        # authenticates via ~/.netrc with the Downloads:Read secret token (sk.…).
        # Without this the package download returns 401. Build-time only — never
        # written into the IPA.
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret not set — SPM cannot fetch the Mapbox Nav SDK; iOS build will fail with 401."
            exit 1
          fi
          # Remove any prior api.mapbox.com entry so re-runs on the persistent
          # self-hosted runner don't stack duplicate machine lines.
          if [ -f "$HOME/.netrc" ]; then
            sed -i '' '/machine api.mapbox.com/,+2d' "$HOME/.netrc" || true
          fi
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOADS_TOKEN" >> "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Ensure a clean iOS prebuild (drop any stale generated project)
        if: steps.select-ipa.outputs.reused != 'true'
        run: |
          # mobile/ios is gitignored (generated by prebuild). If anything left a
          # partial mobile/ios/ behind, `expo prebuild` sees the directory,
          # says "reusing /ios" and SKIPS regenerating the native project, so
          # there is no AppDelegate and the withIosIcons config plugin fails
          # with "Could not locate a valid AppDelegate at root: .../mobile"
          # (#3239). Remove the directory outright so prebuild always
          # regenerates AppDelegate + the Xcode project. We do NOT use
          # `expo prebuild --clean` (disallowed).
          rm -rf mobile/ios

      - name: Run Expo prebuild
        if: steps.select-ipa.outputs.reused != 'true'
        working-directory: ./mobile
        run: bun expo prebuild --platform ios

      - name: Setup Sherpa Onnx
        if: steps.select-ipa.outputs.reused != 'true'
        working-directory: ./mobile
        run: |
          chmod +x scripts/setup-sherpa-onnx-optional.sh
          ./scripts/setup-sherpa-onnx-optional.sh

      - name: Install CocoaPods dependencies
        if: steps.select-ipa.outputs.reused != 'true'
        working-directory: ./mobile/ios
        run: |
          # Self-heal a corrupted prebuilt-framework cache: the cached Pods can be
          # valid-by-lockfile-key yet missing the React-Core-prebuilt React.xcframework
          # Info.plist (a known RN-0.83 prebuilt + CocoaPods cache flake on the
          # self-hosted runners). On failure, clear the project Pods + this runner's pod
          # cache and reinstall fresh. Happy path is unchanged.
          pod install || {
            echo "::warning::pod install failed (likely a stale/corrupt prebuilt cache) — clearing caches and retrying"
            # Keep Podfile.lock: the retry must resolve the same pod versions as the
            # repository lockfile, not drift to whatever currently satisfies the Podfile.
            rm -rf Pods
            pod cache clean --all || true
            pod install --repo-update
          }

      - name: Configure only the app target for PR signing
        if: env.PR_IOS_SIGNED == 'true' && steps.select-ipa.outputs.reused != 'true'
        working-directory: mobile
        run: bundle exec ruby ci/pr-ios/configure-signing.rb ios/Mentra.xcodeproj build/pr-ios/signing.json

      - name: Ensure iOS platform is installed
        if: steps.select-ipa.outputs.reused != 'true'
        working-directory: ./mobile/ios
        run: |
          # Idempotent: no-op if already present, downloads if missing.
          # Required because Xcode bundles SDK headers but device-build
          # support files are downloaded separately (e.g. iOS 26.4).
          xcodebuild -downloadPlatform iOS || true
          echo "Available destinations:"
          xcodebuild -workspace Mentra.xcworkspace -scheme Mentra -showdestinations 2>&1 | head -40 || true

      # ----------------------------------------------------------------------
      # Debug simulator build — disabled on PRs to keep Mac mini queue moving.
      # Re-enable when Maestro E2E is added (Maestro needs simulator builds).
      # ----------------------------------------------------------------------
      # - name: Build iOS app for Simulator
      #   working-directory: ./mobile/ios
      #   run: |
      #     xcodebuild \
      #                -workspace Mentra.xcworkspace \
      #                -scheme Mentra \
      #                -configuration Debug \
      #                -sdk iphonesimulator \
      #                -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.0' \
      #                -derivedDataPath build

      - name: Build iOS app for Device (first attempt)
        if: steps.select-ipa.outputs.reused != 'true'
        id: xcode-build
        working-directory: ./mobile/ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/.github/scripts/ios-xcodebuild-attempt.sh" attempt-1 -- \
            node mobile/ci/pr-ios/build.mjs

      - name: Retry build with clean caches (if first attempt failed)
        id: xcode-build-clean
        if: steps.xcode-build.outcome == 'failure' && steps.xcode-build.outputs.failure_kind != 'signing'
        working-directory: ./mobile/ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          echo "First build failed, nuking caches and retrying from scratch..."

          # Kill any hung xcodebuild from THIS job's failed attempt only — scoped to our
          # workspace so we don't SIGTERM other branches' builds on this shared runner
          # (a machine-wide killall here was part of the recurring cross-build failures).
          WS="${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}"
          pids="$(pgrep -f "xcodebuild.*${WS}" 2>/dev/null || true)"
          if [ -n "$pids" ]; then
            echo "Terminating stale xcodebuild pids: $pids"
            # shellcheck disable=SC2086
            kill -TERM $pids 2>/dev/null || true
            sleep 2
            # shellcheck disable=SC2086
            kill -KILL $pids 2>/dev/null || true
          fi

          # DerivedData wipe scoped to THIS workspace's build dir only (the global
          # ~/Library/.../DerivedData/Mentra-* glob would clobber other branches' builds
          # mid-flight on the shared runner). build-device is our -derivedDataPath.

          # Wipe iOS caches for THIS workspace only. The build uses
          # -derivedDataPath build-device, so that dir IS our DerivedData — removing it is
          # sufficient. We intentionally do NOT `rm -rf ~/Library/.../DerivedData/Mentra-*`:
          # that global glob would delete other branches' in-flight DerivedData on this
          # shared runner, which was contributing to the cross-build failures.
          # Keep Podfile.lock so the retry resolves the same dependency graph as
          # the first attempt rather than drifting to newer pod versions.
          python3 "$RUNNER_TEMP/mentra-ios-cleanup.py" mobile/ios/Pods mobile/ios/build-device

          # Reinstall pods from scratch with fresh repo
          pod install --repo-update

          # Retry serially. The fallback only runs after a failed first build,
          # and limiting concurrency avoids the observed CocoaPods VFS overlay
          # disappearing while parallel compile and XCFramework copy jobs run.
          cd "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/.github/scripts/ios-xcodebuild-attempt.sh" attempt-2 -- \
            node mobile/ci/pr-ios/build.mjs --serial

      - name: Summarize iOS build attempts
        if: always()
        continue-on-error: true
        env:
          REUSED: ${{ steps.select-ipa.outputs.reused }}
          GH_TOKEN: ${{ github.token }}
          JOB_STARTED_AT: ${{ steps.job-start.outputs.started_at }}
          CACHE_SIZE_BYTES: ${{ steps.job-start.outputs.cache_size_bytes }}
          CACHE_COUNT: ${{ steps.job-start.outputs.cache_count }}
          ATTEMPT1_OUTCOME: ${{ steps.xcode-build.outcome }}
          ATTEMPT1_SECONDS: ${{ steps.xcode-build.outputs.duration_seconds }}
          ATTEMPT1_TIMING: ${{ steps.xcode-build.outputs.timing_summary }}
          ATTEMPT2_OUTCOME: ${{ steps.xcode-build-clean.outcome }}
          ATTEMPT2_SECONDS: ${{ steps.xcode-build-clean.outputs.duration_seconds }}
          ATTEMPT2_TIMING: ${{ steps.xcode-build-clean.outputs.timing_summary }}
          ATTEMPT1_TIMELINE: ${{ steps.xcode-build.outputs.timeline }}
          ATTEMPT1_MEMORY: ${{ steps.xcode-build.outputs.memory }}
          ATTEMPT2_TIMELINE: ${{ steps.xcode-build-clean.outputs.timeline }}
          ATTEMPT2_MEMORY: ${{ steps.xcode-build-clean.outputs.memory }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/ios-build-summary.sh"

      - name: Require a successful build attempt
        if: always()
        env:
          CACHED_RESULT: ${{ steps.xcode-build.outcome }}
          RETRY_RESULT: ${{ steps.xcode-build-clean.outcome }}
          REUSED: ${{ steps.select-ipa.outputs.reused }}
        run: test "$REUSED" = true || test "$CACHED_RESULT" = success || test "$RETRY_RESULT" = success

      - name: Export fresh iOS compilation
        if: success() && env.PR_IOS_SIGNED == 'true' && steps.select-ipa.outputs.reused != 'true'
        run: |
          set -euo pipefail
          security unlock-keychain -p "$PR_IOS_KEYCHAIN_PASSWORD" "$PR_IOS_KEYCHAIN"
          python3 mobile/ci/pr-ios/keychain-search.py run "$PR_IOS_KEYCHAIN" \
            xcodebuild -exportArchive -archivePath mobile/build/pr-ios/Mentra.xcarchive \
            -exportOptionsPlist mobile/build/pr-ios/ExportOptions.plist \
            -exportPath mobile/build/pr-ios/export

      - name: Package this PR's configuration and sign
        if: success() && env.PR_IOS_SIGNED == 'true'
        env:
          PR_IOS_REUSED: ${{ steps.select-ipa.outputs.reused }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$PR_IOS_KEYCHAIN_PASSWORD" "$PR_IOS_KEYCHAIN"
          source=mobile/build/pr-ios/export/Mentra.ipa
          if [[ "$PR_IOS_REUSED" == true ]]; then source=pr-mobile-candidate.ipa; fi
          python3 mobile/ci/pr-ios/repackage.py package "$source" "$MENTRA_PR_MOBILE_FINGERPRINT" mobile/build/pr-ios/Mentra-pr.ipa
          python3 mobile/ci/pr-ios/artifacts.py package --ipa mobile/build/pr-ios/Mentra-pr.ipa \
            --mac-signing mobile/build/pr-ios/mac-signing.json --output pr-ios-output

      - name: Preserve notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: mac-installer-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Hand off signed PR downloads
        id: handoff
        if: success() && env.PR_IOS_SIGNED == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pr-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-ios-output
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Retry signed download handoff
        if: steps.handoff.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pr-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-ios-output
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Remove this job's signing keychain
        if: always() && env.PR_IOS_KEYCHAIN != ''
        run: |
          rm -rf mobile/build/pr-ios/mac-installer-private
          rm -f mobile/build/pr-ios/mac-signing.json
          python3 mobile/ci/pr-ios/keychain-search.py remove "$PR_IOS_KEYCHAIN"
          python3 mobile/ci/pr-ios/keychain-search.py locked security delete-keychain "$PR_IOS_KEYCHAIN"

      - name: Upload xcodebuild logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.IOS_BUILD_LOG_DIR }}/xcodebuild-attempt-*.log
            ${{ env.IOS_BUILD_LOG_DIR }}/xcodebuild-attempt-*.timing.txt
            ${{ env.IOS_BUILD_LOG_DIR }}/xcodebuild-attempt-*.timeline
            ${{ env.IOS_BUILD_LOG_DIR }}/xcodebuild-attempt-*.memory
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Blacksmith: a GitHub-hosted publish step stalls PR builds whenever
    # GitHub-hosted runners are unavailable.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      ARTIFACTS_R2_ACCOUNT_ID: ${{ vars.ARTIFACTS_R2_ACCOUNT_ID }}
      ARTIFACTS_R2_BUCKET: artifactscdn
      SOURCE_RUN_ID: ${{ github.run_id }}
      SOURCE_RUN_ATTEMPT: ${{ needs.build.outputs.upload_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --prefix .github/artifact-storage
      - uses: actions/download-artifact@v4
        with:
          name: pr-ios-${{ github.run_id }}-${{ needs.build.outputs.upload_attempt }}
          path: pr-ios-output
      - name: Publish verified iPhone installer, IPA, Mac ZIP and receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        run: node .github/scripts/pr-ios-artifacts.mjs pr-ios-output

  notify-pr-builds:
    needs: [build, publish]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/reusable-pr-build-notification.yml
    permissions:
      contents: read
      actions: read
      pull-requests: write
    secrets:
      SLACK_WEBHOOK_PR_BUILDS: ${{ secrets.SLACK_WEBHOOK_PR_BUILDS }}
      TEST_RUN_INGEST_TOKEN_DEV: ${{ secrets.TEST_RUN_INGEST_TOKEN_DEV }}
