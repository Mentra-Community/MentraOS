name: Cloud package build

on:
  pull_request:
    branches:
      - main
      - dev
      - staging

  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/packages/cloud/**"
      - "cloud/bun.lock"
      - "cloud/package.json"

concurrency:
  group: cloud-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.filter.outputs.cloud }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so paths-filter can diff against the base of the PR
          fetch-depth: 0
      - name: Compute changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cloud:
              - 'cloud/packages/cloud/**'
              - 'cloud/bun.lock'
              - 'cloud/package.json'
  build-cloud:
    name: Build cloud/packages/cloud
    needs: [changes]
    if: needs.changes.outputs.cloud == 'true'
    uses: ./.github/workflows/reusable-bun-build.yml
    with:
      working_directory: cloud/packages/cloud
      lockfile: cloud/bun.lock
      bun_version: latest
      install_args: ""
      build_script: build
      checkout_fetch_depth: 1

  gate-cloud:
    name: "Gate: Cloud package build"
    needs: [changes, build-cloud]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        run: |
          if [ "${{ needs.changes.outputs.cloud }}" = "true" ]; then
            if [ "${{ needs.build-cloud.result }}" = "success" ]; then
              echo "Cloud package changed; build passed."
              exit 0
            else
              echo "Cloud package changed; build failed."
              exit 1
            fi
          else
            echo "No cloud package changes; passing gate."
            exit 0
          fi

  comment-on-failure:
    name: Comment on failure
    if: failure() && github.event_name == 'pull_request'
    needs: [build-cloud]
    uses: ./.github/workflows/reusable-pr-comment.yml
    with:
      message: |
        Cloud package build failed.
        Workflow: ${{ github.workflow }}
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        Tail of build log:
        ```
        ${{ needs.build-cloud.outputs.build_snippet }}
        ```
