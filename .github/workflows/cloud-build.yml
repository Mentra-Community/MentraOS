name: Cloud package build

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/packages/cloud/**"
      - "cloud/bun.lock"
      - "cloud/package.json"
  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/packages/cloud/**"
      - "cloud/bun.lock"
      - "cloud/package.json"

concurrency:
  group: cloud-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build-cloud:
    name: Build cloud/packages/cloud
    uses: ./.github/workflows/reusable-bun-build.yml
    with:
      working_directory: cloud/packages/cloud
      lockfile: cloud/bun.lock
      bun_version: latest
      install_args: ""
      build_script: build
      checkout_fetch_depth: 1

  comment-on-failure:
    name: Comment on failure
    if: failure() && github.event_name == 'pull_request'
    needs: [build-cloud]
    uses: ./.github/workflows/reusable-pr-comment.yml
    with:
      message: |
        Cloud package build failed.
        Workflow: ${{ github.workflow }}
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        Tail of build log:
        ```
        ${{ needs.build-cloud.outputs.build_snippet }}
        ```
