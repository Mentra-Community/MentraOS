name: Cloud package build

on:
  pull_request:
    branches:
      - main
      - dev
      - staging

  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/packages/cloud/**"
      - "cloud/bun.lock"
      - "cloud/package.json"

concurrency:
  group: cloud-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  cloud:
    name: Build cloud/packages/cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cloud:
              - 'cloud/packages/cloud/**'
              - 'cloud/bun.lock'
              - 'cloud/package.json'

      - name: Skip if no cloud package changes
        if: steps.filter.outputs.cloud != 'true'
        run: echo "No changes under cloud/packages/cloud; skipping build."

      - name: Setup Bun
        if: steps.filter.outputs.cloud == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun cache
        if: steps.filter.outputs.cloud == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-cloud-${{ hashFiles('cloud/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-cloud-

      - name: Install dependencies
        if: steps.filter.outputs.cloud == 'true'
        working-directory: cloud
        run: bun install

      - name: Run build (capture log)
        if: steps.filter.outputs.cloud == 'true'
        id: build
        continue-on-error: true
        working-directory: cloud/packages/cloud
        env:
          LOG_FILE: ${{ runner.temp }}/bun-build.log
        run: |
          set +e
          set -o pipefail
          bun run build 2>&1 | tee "$LOG_FILE"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "snippet<<'EOF'" >> "$GITHUB_OUTPUT"
          tail -n 200 "$LOG_FILE" >> "$GITHUB_OUTPUT" || true
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comment on failure
        if: github.event_name == 'pull_request' && steps.build.outputs.failed == 'true'
        uses: ./.github/workflows/reusable-pr-comment.yml
        with:
          message: |
            Cloud package build failed.
            Workflow: ${{ github.workflow }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Tail of build log:
            ```
            ${{ steps.build.outputs.build_snippet }}
            ```

      - name: Fail if build failed
        if: steps.build.outputs.failed == 'true'
        run: |
          echo "Build failed with status ${{ steps.build.outputs.status }}"
          exit 1
