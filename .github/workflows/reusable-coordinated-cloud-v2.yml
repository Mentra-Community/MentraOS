name: Reusable Coordinated Cloud V2 Deployment

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      release_plan_artifact:
        required: true
        type: string
      deployment_environment:
        required: true
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
      approval_environment:
        description: Optional protected GitHub environment for this deployment job
        required: false
        default: ""
        type: string
    secrets:
      PORTER_TOKEN:
        required: true
    outputs:
      result_artifact:
        value: ${{ jobs.deploy.outputs.result_artifact }}
      deployment_environment:
        value: ${{ jobs.deploy.outputs.deployment_environment }}
      porter_app:
        value: ${{ jobs.deploy.outputs.porter_app }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy and verify Cloud V2 ${{ inputs.deployment_environment }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Budget: 45 min Core/Runtime apply + 30 min companion apply, plus probes
    # and pod read-back. A job cap below that sum could cancel an already
    # successful companion apply before its evidence is recorded.
    timeout-minutes: 90
    environment:
      name: ${{ inputs.approval_environment || inputs.deployment_environment }}
    concurrency:
      group: coordinated-cloud-v2-${{ inputs.deployment_environment }}
      cancel-in-progress: false
    outputs:
      result_artifact: ${{ steps.artifact.outputs.name }}
      deployment_environment: ${{ steps.target.outputs.environment }}
      porter_app: ${{ steps.target.outputs.porter_app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-input/plan

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Resolve and validate the guarded deployment target
        id: target
        run: >-
          node .github/scripts/coordinated-cloud-v2-records.mjs resolve
          --plan release-input/plan/release-plan.json
          --environment "${{ inputs.deployment_environment }}"
          --source-commit "${{ inputs.source_commit }}"
          --output cloud-v2-target.json
          --github-output "$GITHUB_OUTPUT"

      - name: Set exact source tag
        id: source
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          [[ "$actual" == "${{ inputs.source_commit }}" ]]
          echo "tag=$actual" >> "$GITHUB_OUTPUT"

      - name: Setup Porter CLI
        if: inputs.dry_run != true
        uses: porter-dev/setup-porter@v0.1.0

      - name: Validate Cloud V2 source and Porter configuration
        if: inputs.dry_run
        working-directory: cloud-v2
        env:
          PORTER_APP_NAME: ${{ steps.target.outputs.porter_app }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          config="${{ steps.target.outputs.porter_config }}"
          config="${config#cloud-v2/}"
          [[ -s "$config" ]]
          grep --fixed-strings --line-regexp "version: v2" "$config"
          grep --fixed-strings --line-regexp "name: $PORTER_APP_NAME" "$config"
          while IFS=$'\t' read -r name app companion_config; do
            echo "Validating companion app $name ($app) configuration $companion_config"
            [[ -s "$GITHUB_WORKSPACE/$companion_config" ]]
            grep --fixed-strings --line-regexp "version: v2" "$GITHUB_WORKSPACE/$companion_config"
            grep --fixed-strings --line-regexp "name: $app" "$GITHUB_WORKSPACE/$companion_config"
          done < <(
            jq -r \
              '.companions | to_entries[] | [.key, .value.porterApp, .value.porterConfig] | @tsv' \
              "$GITHUB_WORKSPACE/cloud-v2-target.json"
          )

      - name: Deploy exact Cloud V2 source through Porter
        if: inputs.dry_run != true
        timeout-minutes: 45
        working-directory: cloud-v2
        env:
          PORTER_APP_NAME: ${{ steps.target.outputs.porter_app }}
          PORTER_CLUSTER: ${{ steps.target.outputs.porter_cluster }}
          PORTER_DEPLOYMENT_TARGET_ID: ${{ steps.target.outputs.porter_deployment_target_id }}
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PROJECT: ${{ steps.target.outputs.porter_project }}
          PORTER_REPO_NAME: ${{ github.event.repository.name }}
          PORTER_TAG: ${{ steps.source.outputs.tag }}
          PORTER_TOKEN: ${{ secrets.PORTER_TOKEN }}
        run: |
          set -euo pipefail
          config="${{ steps.target.outputs.porter_config }}"
          porter apply \
            -w \
            -f "${config#cloud-v2/}" \
            -x "${{ steps.target.outputs.porter_target }}" \
            --cluster "$PORTER_CLUSTER" \
            --project "$PORTER_PROJECT"

      # Companion apps (see CLOUD_V2_TARGETS in coordinated-cloud-v2-records.mjs)
      # deploy from the same checkout and image tag, in this same job, so
      # production gets them under the same protected approval as Core/Runtime.
      # Their Porter configs build from the repository root.
      - name: Deploy companion apps from the exact same source through Porter
        if: inputs.dry_run != true
        timeout-minutes: 30
        env:
          COMPANION_PORTER_TOKEN: ${{ secrets.PORTER_APP_15081_5783 }}
          PORTER_HOST: https://dashboard.porter.run
          PORTER_REPO_NAME: ${{ github.event.repository.name }}
          PORTER_TAG: ${{ steps.source.outputs.tag }}
          PORTER_TOKEN: ${{ secrets.PORTER_TOKEN }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name app config cluster project target_id target; do
            echo "Deploying companion app $name ($app) from $config"
            PORTER_APP_NAME="$app" \
              PORTER_CLUSTER="$cluster" \
              PORTER_PROJECT="$project" \
              PORTER_DEPLOYMENT_TARGET_ID="$target_id" \
              PORTER_TOKEN="${COMPANION_PORTER_TOKEN:-$PORTER_TOKEN}" \
              porter apply -w -f "$config" -x "$target" --cluster "$cluster" --project "$project"
          done < <(
            jq -r \
              '.companions | to_entries[] | [.key, .value.porterApp, .value.porterConfig, .value.porterCluster, .value.porterProject, .value.porterDeploymentTargetId, .value.porterTarget] | @tsv' \
              cloud-v2-target.json
          )

      - name: Require public liveness and readiness
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          shopt -s nullglob
          probe_status() {
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 12 \
              --retry-delay 10 \
              --retry-all-errors \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$1"
          }
          record_check() {
            jq -nc \
              --arg service "$1" \
              --arg url "$2" \
              --argjson statusCode "$3" \
              '{service: $service, url: $url, ready: true, statusCode: $statusCode}' \
              >> "$4"
          }
          : > cloud-v2-checks.ndjson
          while IFS=$'\t' read -r service host; do
            getent hosts "$host" >/dev/null
            for probe in healthz ready; do
              url="https://$host/$probe"
              status=$(probe_status "$url")
              record_check "$service" "$url" "$status" cloud-v2-checks.ndjson
            done
          done < <(
            jq -r \
              '.services | to_entries[] | .key as $service | .value.hosts[] | [$service, .] | @tsv' \
              cloud-v2-target.json
          )
          jq -s . cloud-v2-checks.ndjson > cloud-v2-checks.json

          mkdir -p companions
          while IFS=$'\t' read -r name service host probe; do
            getent hosts "$host" >/dev/null
            url="https://$host/$probe"
            status=$(probe_status "$url")
            record_check "$service" "$url" "$status" "companions/$name.checks.ndjson"
          done < <(
            jq -r \
              '.companions | to_entries[] | .key as $name | .value.probes as $probes
                | .value.services | to_entries[] | .key as $service | .value.hosts[] | . as $host
                | $probes[] | [$name, $service, $host, .] | @tsv' \
              cloud-v2-target.json
          )
          for checks in companions/*.checks.ndjson; do
            jq -s . "$checks" > "${checks%.ndjson}.json"
          done

      - name: Read back the running deployment
        if: inputs.dry_run != true
        env:
          COMPANION_PORTER_TOKEN: ${{ secrets.PORTER_APP_15081_5783 }}
          PORTER_APP_NAME: ${{ steps.target.outputs.porter_app }}
          PORTER_CLUSTER: ${{ steps.target.outputs.porter_cluster }}
          PORTER_DEPLOYMENT_TARGET_ID: ${{ steps.target.outputs.porter_deployment_target_id }}
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PROJECT: ${{ steps.target.outputs.porter_project }}
          PORTER_TOKEN: ${{ secrets.PORTER_TOKEN }}
        run: |
          set -euo pipefail
          porter kubectl -- get pods \
            -l "porter.run/app-name=$PORTER_APP_NAME" \
            -o json \
            > cloud-v2-pods.json
          mkdir -p companions
          while IFS=$'\t' read -r name app cluster project target_id; do
            PORTER_APP_NAME="$app" \
              PORTER_CLUSTER="$cluster" \
              PORTER_PROJECT="$project" \
              PORTER_DEPLOYMENT_TARGET_ID="$target_id" \
              PORTER_TOKEN="${COMPANION_PORTER_TOKEN:-$PORTER_TOKEN}" \
              porter kubectl -- get pods -l "porter.run/app-name=$app" -o json \
              > "companions/$name.pods.json"
          done < <(
            jq -r \
              '.companions | to_entries[] | [.key, .value.porterApp, .value.porterCluster, .value.porterProject, .value.porterDeploymentTargetId] | @tsv' \
              cloud-v2-target.json
          )

      - name: Record validation-only evidence
        if: inputs.dry_run
        run: >-
          node .github/scripts/coordinated-cloud-v2-records.mjs create
          --plan release-input/plan/release-plan.json
          --environment "${{ inputs.deployment_environment }}"
          --source-commit "${{ inputs.source_commit }}"
          --requested-tag "${{ steps.source.outputs.tag }}"
          --status validated
          --completed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          --provenance-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --output cloud-v2-deployment.json

      - name: Record observed deployment evidence
        if: inputs.dry_run != true
        run: >-
          node .github/scripts/coordinated-cloud-v2-records.mjs create
          --plan release-input/plan/release-plan.json
          --environment "${{ inputs.deployment_environment }}"
          --source-commit "${{ inputs.source_commit }}"
          --requested-tag "${{ steps.source.outputs.tag }}"
          --status deployed
          --pods cloud-v2-pods.json
          --checks cloud-v2-checks.json
          --companions-dir companions
          --completed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          --provenance-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --output cloud-v2-deployment.json

      - name: Name result artifact
        id: artifact
        run: |
          set -euo pipefail
          release_set_id=$(jq -er .releaseSetId release-input/plan/release-plan.json)
          echo "name=coordinated-cloud-v2-$release_set_id" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: cloud-v2-deployment.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize Cloud V2 result
        run: |
          {
            echo "## Cloud V2 coordinated result"
            echo ""
            echo "- Environment: \`${{ steps.target.outputs.environment }}\`"
            echo "- Porter app: \`${{ steps.target.outputs.porter_app }}\`"
            echo "- Source: \`${{ inputs.source_commit }}\`"
            echo "- Status: \`$(jq -er .status cloud-v2-deployment.json)\`"
            if [[ "$(jq -er .status cloud-v2-deployment.json)" == "deployed" ]]; then
              echo "- Deployment: \`$(jq -er .deploymentId cloud-v2-deployment.json)\`"
              jq -r '.observedServices[] | "- \(.service) image: `\(.digest)`"' cloud-v2-deployment.json
              jq -r \
                '.companions | to_entries[] | .key as $name | .value.porter.app as $app
                  | .value.observedServices[] | "- companion \($name) (`\($app)`) \(.service) image: `\(.digest)`"' \
                cloud-v2-deployment.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
