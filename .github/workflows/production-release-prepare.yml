name: Production Release - Prepare
# The dispatch id, when the CLI passes one, lets it recognise the run its own
# dispatch started among this workflow's runs.
run-name: ${{ inputs.beta_identity }} ${{ inputs.dispatch_id && format('[{0}]', inputs.dispatch_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Correlation id chosen by the dispatching CLI; shown in the run name
        required: false
        type: string
      beta_identity:
        description: Completed coordinated beta to select, for example 3.1.0-beta.57
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  # Preparation allocates the authoritative attempt number. Serialize all
  # production allocations so two beta selections cannot race before either
  # attempt has published its initial state record.
  group: production-release-prepare
  cancel-in-progress: false

env:
  ARTIFACTS_R2_ACCOUNT_ID: ${{ vars.ARTIFACTS_R2_ACCOUNT_ID }}
  ARTIFACTS_R2_BUCKET: artifactscdn

jobs:
  prepare:
    name: Select and freeze production inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-store-status
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate dispatch and selected beta identity
        id: identity
        env:
          BETA_IDENTITY: ${{ inputs.beta_identity }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "main" ]]
          [[ "$BETA_IDENTITY" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]
          release_identity="${BETA_IDENTITY%%-*}"
          {
            echo "release_identity=$release_identity"
            echo "beta_tag=mentra-builds-v$release_identity"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify the completed selected beta
        id: beta
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
          BETA_IDENTITY: ${{ inputs.beta_identity }}
          BETA_TAG: ${{ steps.identity.outputs.beta_tag }}
        run: |
          set -euo pipefail
          mkdir -p promotion-input/beta
          state=$(gh release view "$BETA_TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')
          [[ "$state" == $'false\ttrue' ]]
          node .github/scripts/release-assets.mjs download --tag "$BETA_TAG" \
            --pattern "mentra-release-plan-$BETA_IDENTITY.json" \
            --pattern "mentra-release-$BETA_IDENTITY.json" \
            --dir promotion-input/beta
          mv "promotion-input/beta/mentra-release-plan-$BETA_IDENTITY.json" promotion-input/beta/release-plan.json
          mv "promotion-input/beta/mentra-release-$BETA_IDENTITY.json" promotion-input/beta/release-manifest.json
          [[ "$(jq -er .completedAt promotion-input/beta/release-manifest.json)" != "" ]]
          node .github/scripts/verify-release-artifacts.mjs --manifest promotion-input/beta/release-manifest.json
          source_commit=$(jq -er .sourceCommit promotion-input/beta/release-plan.json)
          git cat-file -e "$source_commit^{commit}"
          git merge-base --is-ancestor "$source_commit" origin/main
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Download current production provenance
        id: previous
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Walks every release page: a truncated listing could hide an older
          # mentra-vX.Y.Z and wrongly skip Phase 2.
          node .github/scripts/production-promotion-assets.mjs latest-production-release \
            --repository "$GITHUB_REPOSITORY" \
            --github-output promotion-input/latest-production.env
          if ! grep -qx 'found=true' promotion-input/latest-production.env; then
            # First coordinated promotion. The public app predates this system,
            # so it is frozen from the store inventories instead and has no
            # compatibility lab; see "Phase 1" in the runbook.
            echo "Warning: no published mentra-vX.Y.Z release exists; freezing the current Mentra App from the stores." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(sed -n 's/^tag=//p' promotion-input/latest-production.env)
          identity=$(sed -n 's/^identity=//p' promotion-input/latest-production.env)
          [[ "$tag" == "mentra-v$identity" ]]
          name="mentra-release-$identity.json"
          plan_name="mentra-release-plan-$identity.json"
          mkdir -p promotion-input/current
          node .github/scripts/release-assets.mjs download --tag "$tag" --pattern "$name" --pattern "$plan_name" --dir promotion-input/current
          mv "promotion-input/current/$name" promotion-input/current/release-manifest.json
          mv "promotion-input/current/$plan_name" promotion-input/current/release-plan.json
          [[ "$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {releaseRecordSha256} from "./.github/scripts/release-family.mjs"; process.stdout.write(releaseRecordSha256(JSON.parse(readFileSync("promotion-input/current/release-plan.json", "utf8"))))')" == "$(jq -er .releasePlanSha256 promotion-input/current/release-manifest.json)" ]]
          url="$(node .github/scripts/release-assets.mjs url --tag "$tag" --name "$name" --existing true)"
          node .github/scripts/verify-public-release-asset.mjs \
            --file promotion-input/current/release-manifest.json \
            --url "$url"
          {
            echo "found=true"
            echo "tag=$tag"
            echo "identity=$identity"
            echo "manifest_url=$url"
          } >> "$GITHUB_OUTPUT"

      - name: Inject read-only store credentials
        uses: ./.github/actions/inject-signing
        with:
          play: "true"
          ios: "true"
          google-play-key-json: ${{ secrets.GOOGLE_PLAY_KEY_JSON }}
          asc-api-key-p8-b64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          asc-api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          asc-api-issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}

      - name: Resolve App Store Connect credential path
        id: asc
        run: |
          set -euo pipefail
          key_path=$(sed -n 's/^ASC_API_KEY_PATH=//p' "$MENTRA_ASC_CONFIG_PATH")
          test -f "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Read App Store inventories
        run: |
          set -euo pipefail
          mkdir -p promotion-input/stores
          node mobile/scripts/app-store-connect-build.mjs inventory \
            --issuer-id "${{ secrets.ASC_API_ISSUER_ID }}" \
            --key-id "${{ secrets.ASC_API_KEY_ID }}" \
            --key-path "${{ steps.asc.outputs.key_path }}" \
            --bundle-id com.mentra.mentra \
            --output promotion-input/stores/mentra-apple.json

      - name: Install pinned Google Play inventory tooling
        run: |
          set -euo pipefail
          mkdir -p promotion-input/play/fastlane
          cp mobile/ci/fastlane-android/Fastfile mobile/ci/fastlane-android/Appfile promotion-input/play/fastlane/
          cp mobile/Gemfile mobile/Gemfile.lock promotion-input/play/
          cd promotion-input/play
          bundle install

      - name: Read Google Play inventories
        working-directory: promotion-input/play
        run: |
          set -euo pipefail
          APP_PACKAGE_NAME=com.mentra.mentra \
            GOOGLE_PLAY_INVENTORY_OUTPUT="$GITHUB_WORKSPACE/promotion-input/stores/mentra-google.json" \
            bundle exec fastlane google_play_inventory
          jq -s '{apple: .[0], google: .[1]}' \
            ../stores/mentra-apple.json ../stores/mentra-google.json \
            > ../stores/mentra-inventory.json

      - name: Fingerprint every frozen preparation input
        id: selection
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          BETA_IDENTITY: ${{ inputs.beta_identity }}
          BETA_TAG: ${{ steps.identity.outputs.beta_tag }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}
          PREVIOUS_MANIFEST_URL: ${{ steps.previous.outputs.manifest_url }}
        run: |
          set -euo pipefail
          previous=()
          if [[ "$PREVIOUS_FOUND" == "true" ]]; then
            previous=(
              --previous-plan promotion-input/current/release-plan.json
              --previous-manifest promotion-input/current/release-manifest.json
              --previous-manifest-url "$PREVIOUS_MANIFEST_URL"
            )
          fi
          node .github/scripts/production-promotion-assets.mjs selection-digest \
            --beta-plan promotion-input/beta/release-plan.json \
            --beta-manifest promotion-input/beta/release-manifest.json \
            --beta-manifest-url "$(node .github/scripts/release-assets.mjs url --tag "$BETA_TAG" --name "mentra-release-$BETA_IDENTITY.json" --existing true)" \
            "${previous[@]}" \
            --mentra-inventory promotion-input/stores/mentra-inventory.json \
            --github-output "$GITHUB_OUTPUT"

      # Production candidates take the next sequence of their family from the
      # family's build container, like every coordinated run; the compatibility
      # lab takes the next sequence of the current app's family.
      - name: Read the family build containers
        id: family
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ steps.identity.outputs.beta_tag }}
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}
        run: |
          set -euo pipefail
          mkdir -p promotion-input/family
          # Markers above a floor are downloaded so a retry of this attempt finds
          # the numbers it already reserved (markers name their owner).
          download_markers() {
            local assets="$1" floor="$2" directory="$3"
            mkdir -p "$directory"
            while IFS=$'\t' read -r asset_id name; do
              [[ -z "$asset_id" ]] && continue
              node .github/scripts/release-assets.mjs fetch --repository "${GITHUB_REPOSITORY}" --asset-id "$asset_id" \
                > "$directory/$name"
            done < <(jq -r --argjson floor "$floor" \
              '.[] | select(.name | test("^mentra-build-number-[0-9]+\\.json$")) | select((.name | capture("mentra-build-number-(?<code>[0-9]+)") | .code | tonumber) > $floor) | [.id, .name] | @tsv' \
              "$assets")
          }
          # ASG pairs numbered before markers existed live in the shared ASG
          # release; their numbers are taken too, in every family.
          asg_assets='[]'
          if asg_release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/mentra-coordinated-asg" --jq .id 2>/dev/null); then
            asg_assets=$(node .github/scripts/release-assets.mjs list --repository "${GITHUB_REPOSITORY}" --release-id "$asg_release_id")
          fi
          printf '%s\n' "$asg_assets" > promotion-input/family/asg-assets.json
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$BETA_TAG" --jq .id)
          node .github/scripts/release-assets.mjs list --repository "${GITHUB_REPOSITORY}" --release-id "$release_id" | jq -s 'add' - promotion-input/family/asg-assets.json > promotion-input/family/assets.json
          download_markers promotion-input/family/assets.json \
            "$(jq -er .native.buildNumber promotion-input/beta/release-plan.json)" promotion-input/family/markers
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          # The current app's family container is only needed for a compatibility
          # lab; a current app that predates the formula has none, and its
          # family may have no container at all.
          if [[ "$PREVIOUS_FOUND" == "true" ]]; then
            current_version=$(jq -er .familyBaseVersion promotion-input/current/release-plan.json)
            current_tag="mentra-builds-v$current_version"
            mkdir -p promotion-input/family/current-markers
            if current_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$current_tag" --jq .id 2>/dev/null); then
              node .github/scripts/release-assets.mjs list --repository "${GITHUB_REPOSITORY}" --release-id "$current_id" | jq -s 'add' - promotion-input/family/asg-assets.json > promotion-input/family/current-assets.json
              download_markers promotion-input/family/current-assets.json \
                "$(jq -er .native.buildNumber promotion-input/current/release-plan.json)" promotion-input/family/current-markers
              echo "current_release_id=$current_id" >> "$GITHUB_OUTPUT"
            else
              echo '[]' > promotion-input/family/current-assets.json
            fi
            echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          fi

      - name: Allocate append-only promotion container
        id: container
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/production-promotion-assets.mjs create-container
          --repository "$GITHUB_REPOSITORY"
          --release "${{ steps.identity.outputs.release_identity }}"
          --beta "${{ inputs.beta_identity }}"
          --selection-digest "${{ steps.selection.outputs.selection_digest }}"
          --target-commit "${{ steps.beta.outputs.source_commit }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Create frozen production plan and initial state
        id: record
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          BETA_IDENTITY: ${{ inputs.beta_identity }}
          BETA_TAG: ${{ steps.identity.outputs.beta_tag }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}
          PREVIOUS_MANIFEST_URL: ${{ steps.previous.outputs.manifest_url }}
        run: |
          set -euo pipefail
          beta_manifest_name="mentra-release-$BETA_IDENTITY.json"
          beta_manifest_url="$(node .github/scripts/release-assets.mjs url --tag "$BETA_TAG" --name "$beta_manifest_name" --existing true)"
          previous=()
          if [[ "$PREVIOUS_FOUND" == "true" ]]; then
            previous=(
              --previous-manifest promotion-input/current/release-manifest.json
              --previous-manifest-url "$PREVIOUS_MANIFEST_URL"
              --current-family-assets promotion-input/family/current-assets.json
              --current-family-markers-dir promotion-input/family/current-markers
            )
          fi
          mkdir -p promotion-output
          node .github/scripts/prepare-production-promotion.mjs \
            --beta-plan promotion-input/beta/release-plan.json \
            --beta-manifest promotion-input/beta/release-manifest.json \
            --beta-manifest-url "$beta_manifest_url" \
            "${previous[@]}" \
            --mentra-inventory promotion-input/stores/mentra-inventory.json \
            --family-assets promotion-input/family/assets.json \
            --family-markers-dir promotion-input/family/markers \
            --marker-directory promotion-output/family-build-numbers \
            --attempt "${{ steps.container.outputs.attempt }}" \
            --actor "$GITHUB_ACTOR" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --provenance-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --plan-output promotion-output/production-release-plan.json \
            --record-directory promotion-output
          record=$(find promotion-output -maxdepth 1 -name 'production-promotion-*.json' -print -quit)
          test -n "$record"
          echo "record=$record" >> "$GITHUB_OUTPUT"

      # Recorded in the family containers before anything is built, so no later
      # coordinated run or attempt can take the same numbers.
      - name: Record the allocated build numbers in the family containers
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_IDENTITY: ${{ steps.identity.outputs.release_identity }}
          FAMILY_RELEASE_ID: ${{ steps.family.outputs.release_id }}
          CURRENT_VERSION: ${{ steps.family.outputs.current_version }}
          CURRENT_RELEASE_ID: ${{ steps.family.outputs.current_release_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          published=0
          for marker in promotion-output/family-build-numbers/"$RELEASE_IDENTITY"/mentra-build-number-*.json; do
            name=$(basename "$marker")
            node .github/scripts/publish-immutable-release-asset.mjs \
              --file "promotion-output/family-build-numbers/$RELEASE_IDENTITY/$name" --name "$name" \
              --release-id "$FAMILY_RELEASE_ID" --repository "$GITHUB_REPOSITORY"
            published=$((published + 1))
          done
          (( published == 1 ))
          # A compatibility-lab marker exists only when the current app could be
          # rebuilt; it then goes to that app's family container.
          if [[ -n "$CURRENT_VERSION" && -d "promotion-output/family-build-numbers/$CURRENT_VERSION" ]]; then
            test -n "$CURRENT_RELEASE_ID"
            for marker in promotion-output/family-build-numbers/"$CURRENT_VERSION"/mentra-build-number-*.json; do
              name=$(basename "$marker")
              node .github/scripts/publish-immutable-release-asset.mjs \
                --file "promotion-output/family-build-numbers/$CURRENT_VERSION/$name" --name "$name" \
                --release-id "$CURRENT_RELEASE_ID" --repository "$GITHUB_REPOSITORY"
            done
          fi

      - name: Publish immutable preparation evidence
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan_name="production-release-plan-${{ steps.identity.outputs.release_identity }}.json"
          mv promotion-output/production-release-plan.json "promotion-output/$plan_name"
          node .github/scripts/publish-immutable-release-asset.mjs \
            --file "promotion-output/$plan_name" \
            --name "$plan_name" \
            --release-id "${{ steps.container.outputs.release_id }}" \
            --repository "$GITHUB_REPOSITORY"
          if [[ "${{ steps.previous.outputs.found }}" == "true" ]]; then
            cp promotion-input/current/release-plan.json promotion-input/current/current-production-release-plan.json
            cp promotion-input/current/release-manifest.json promotion-input/current/current-production-release-manifest.json
            node .github/scripts/publish-immutable-release-asset.mjs \
              --file promotion-input/current/current-production-release-plan.json \
              --name current-production-release-plan.json \
              --release-id "${{ steps.container.outputs.release_id }}" \
              --repository "$GITHUB_REPOSITORY"
            node .github/scripts/publish-immutable-release-asset.mjs \
              --file promotion-input/current/current-production-release-manifest.json \
              --name current-production-release-manifest.json \
              --release-id "${{ steps.container.outputs.release_id }}" \
              --repository "$GITHUB_REPOSITORY"
          fi
          # The immutable publisher requires the file basename to be the asset name.
          cp promotion-input/stores/mentra-inventory.json promotion-input/stores/current-production-store-inventory.json
          node .github/scripts/publish-immutable-release-asset.mjs \
            --file promotion-input/stores/current-production-store-inventory.json \
            --name current-production-store-inventory.json \
            --release-id "${{ steps.container.outputs.release_id }}" \
            --repository "$GITHUB_REPOSITORY"
          node .github/scripts/production-promotion-assets.mjs publish-record \
            --record "${{ steps.record.outputs.record }}" \
            --release-id "${{ steps.container.outputs.release_id }}" \
            --repository "$GITHUB_REPOSITORY"

      - name: Summarize preparation
        run: |
          record="${{ steps.record.outputs.record }}"
          {
            echo "## Production promotion prepared"
            echo
            echo "- Release: \`${{ steps.identity.outputs.release_identity }}\`"
            echo "- Attempt: \`${{ steps.container.outputs.attempt }}\`"
            echo "- Selected beta: \`${{ inputs.beta_identity }}\`"
            echo "- MentraOS source: \`$(jq -er .source.mentraosCommit "$record")\`"
            echo "- State: \`$(jq -er .state "$record")\`"
            echo "- Current Mentra App: \`$(jq -er '.coordinates.currentMentraApp | "\(.provenance) \(.ios.marketingVersion) (iOS \(.ios.buildNumber), Android \(.android.buildNumber))"' "$record")\`"
            echo
            if [[ "$(jq -er .coordinates.currentMentraApp.provenance "$record")" == "coordinated" ]]; then
              echo "No Cloud or app-store state was changed. The next action builds non-promotable Mobile N compatibility-lab apps."
            else
              echo "No Cloud or app-store state was changed. The current Mentra App predates coordinated releases, so there is no compatibility lab; the next action is the Cloud configuration preflight."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
