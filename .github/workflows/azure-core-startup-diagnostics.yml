name: Diagnose Azure private Core startup

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/dev'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.ENTERPRISE_DEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.ENTERPRISE_DEV_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.ENTERPRISE_DEV_AZURE_SUBSCRIPTION_ID }}
      - name: Read current Core metadata and classify startup failure
        run: bash .github/scripts/azure-readiness-diagnostics.sh
