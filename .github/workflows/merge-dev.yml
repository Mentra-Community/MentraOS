name: Deploy Local Merge dev

on:
  workflow_dispatch:
  push:
    branches:
      - miniapps/merge/dev
      - miniapps/merge/dev/**
    paths:
      - "miniapps/merge/**"
      - "cloud-v2/packages/auth/**"
      - "mobile/modules/miniapp/**"
      - "package.json"
      - "bun.lock"
      - ".dockerignore"
      - ".github/workflows/merge-dev.yml"

concurrency:
  group: merge-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy merge-dev to miniapps us-west-2
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      PORTER_CLUSTER: "5783"
      PORTER_PROJECT: "15081"
      PORTER_DEPLOYMENT_TARGET_ID: 95380467-4a76-458d-b12a-df66cf0c362b
      PORTER_HOST: https://dashboard.porter.run
      PORTER_APP_NAME: merge-dev
      PORTER_REPO_NAME: ${{ github.event.repository.name }}
      PORTER_TOKEN: ${{ secrets.PORTER_TOKEN }}
      MERGE_HOSTNAME: merge.dev.us-west-2.mentraglass.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Git SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Porter CLI
        uses: porter-dev/setup-porter@v0.1.0

      - name: Deploy merge-dev app
        timeout-minutes: 30
        env:
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
        run: porter apply -w -x "${PORTER_DEPLOYMENT_TARGET_ID}" -f miniapps/merge/porter.dev.yaml

      - name: Verify dev health
        run: |
          set -euo pipefail
          if ! getent hosts "${MERGE_HOSTNAME}" >/dev/null; then
            echo "::warning::Merge dev DNS is not configured yet; skipping public health check."
            exit 0
          fi
          curl --retry 12 --retry-delay 10 --retry-all-errors -fsS "https://${MERGE_HOSTNAME}/healthz"
          echo
