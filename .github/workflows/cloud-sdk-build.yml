name: SDK build

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
    # paths filter removed; gating handled via jobs.changes with dorny/paths-filter
  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/packages/sdk/**"
      - "cloud/bun.lock"
      - "cloud/package.json"

concurrency:
  group: sdk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so paths-filter can diff against the base of the PR
          fetch-depth: 0
      - name: Compute changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sdk:
              - 'cloud/packages/sdk/**'
              - 'cloud/bun.lock'
              - 'cloud/package.json'

  build-sdk:
    name: Build cloud/packages/sdk
    needs: [changes]
    if: needs.changes.outputs.sdk == 'true'
    uses: ./.github/workflows/reusable-bun-build.yml
    with:
      working_directory: cloud/packages/sdk
      lockfile: cloud/bun.lock
      bun_version: latest
      install_args: ""
      build_script: build
      checkout_fetch_depth: 1

  gate-sdk:
    name: "Gate: SDK build"
    needs: [changes, build-sdk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        run: |
          if [ "${{ needs.changes.outputs.sdk }}" = "true" ]; then
            if [ "${{ needs.build-sdk.result }}" = "success" ]; then
              echo "SDK changed; build passed."
              exit 0
            else
              echo "SDK changed; build failed."
              exit 1
            fi
          else
            echo "No SDK changes; passing gate."
            exit 0
          fi

  comment-on-failure:
    name: Comment on failure
    if: github.event_name == 'pull_request' && needs.build-sdk.outputs.build_failed == 'true'
    needs: [build-sdk]
    uses: ./.github/workflows/reusable-pr-comment.yml
    with:
      message: |
        SDK build failed.
        Workflow: ${{ github.workflow }}
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        Tail of build log:
        ```
        ${{ needs.build-sdk.outputs.build_snippet }}
        ```
