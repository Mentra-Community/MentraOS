name: SDK build

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/packages/sdk/**"
      - "cloud/bun.lock"
      - "cloud/package.json"
  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/packages/sdk/**"
      - "cloud/bun.lock"
      - "cloud/package.json"

concurrency:
  group: sdk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-sdk:
    name: Build cloud/packages/sdk
    uses: ./.github/workflows/reusable-bun-build.yml
    with:
      working_directory: cloud/packages/sdk
      lockfile: cloud/bun.lock
      bun_version: latest
      install_args: ""
      build_script: build
      checkout_fetch_depth: 1
