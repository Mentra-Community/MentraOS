name: SDK build

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
    # paths filter removed; gating handled via jobs.changes with dorny/paths-filter
  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/packages/sdk/**"
      - "cloud/bun.lock"
      - "cloud/package.json"

concurrency:
  group: sdk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk:
    name: Build cloud/packages/sdk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sdk:
              - 'cloud/packages/sdk/**'
              - 'cloud/bun.lock'
              - 'cloud/package.json'

      - name: Skip if no SDK changes
        if: steps.filter.outputs.sdk != 'true'
        run: echo "No changes under cloud/packages/sdk; skipping build."

      - name: Setup Bun
        if: steps.filter.outputs.sdk == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun cache
        if: steps.filter.outputs.sdk == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-sdk-${{ hashFiles('cloud/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-sdk-

      - name: Install dependencies
        if: steps.filter.outputs.sdk == 'true'
        working-directory: cloud
        run: bun install

      - name: Run build (capture log)
        if: steps.filter.outputs.sdk == 'true'
        id: build
        continue-on-error: true
        working-directory: cloud/packages/sdk
        env:
          LOG_FILE: ${{ runner.temp }}/bun-build.log
        run: |
          set +e
          set -o pipefail
          bun run build 2>&1 | tee "$LOG_FILE"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "snippet<<'EOF'" >> "$GITHUB_OUTPUT"
          tail -n 200 "$LOG_FILE" >> "$GITHUB_OUTPUT" || true
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Add failure summary
        if: steps.build.outputs.failed == 'true'
        run: |
          {
            echo "### SDK build failed";
            echo "";
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            echo "";
            echo "Tail of build log:";
            echo "";
            echo '```';
            echo "${{ steps.build.outputs.build_snippet }}";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if build failed
        if: steps.build.outputs.failed == 'true'
        run: |
          echo "Build failed with status ${{ steps.build.outputs.status }}"
          exit 1
