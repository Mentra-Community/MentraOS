name: Release Miniapp SDK

# Publishes the @mentra/miniapp SDK family + the Cloud V2 developer packages to
# npm: @mentra/miniapp, @mentra/miniapp-cli, create-mentra-miniapp, @mentra/auth,
# and @mentra/cli.
#
# Channel = branch -> dist-tag (derived from the package version's prerelease label):
#   main     -> latest   (X.Y.Z)
#   staging  -> beta     (X.Y.Z-beta.N)
#   dev      -> dev      (X.Y.Z-dev.N)
#   (any other -<label>.N -> <label>, e.g. -alpha.N -> alpha)
#
# A package publishes only when the `version` field in its package.json changes
# on the push (same gate as bluetooth-sdk-release.yml). Bump the version, merge
# to the channel branch, and CI ships it. Existing versions are skipped, so
# re-runs are safe.
#
# Before packing, workspace `file:` deps are rewritten to exact published versions
# (rewrite-file-deps.mjs) so wrappers like @mentra/cli install cleanly for users.
#
# Requires repo secret NPM_TOKEN: an npm *automation* token (bypasses 2FA) for
# an account with publish rights on the @mentra org. See sdk/PUBLISHING.md.

on:
  push:
    branches: [main, staging, dev]
    paths:
      - "mobile/modules/miniapp/**"
      - "sdk/miniapp-cli/**"
      - "sdk/create-mentra-miniapp/**"
      - "cloud-v2/packages/auth/**"
      - "cloud-v2/packages/cli/**"
      - ".github/scripts/miniapp-sdk-release-info.mjs"
      - ".github/scripts/rewrite-file-deps.mjs"
      - ".github/scripts/stamp-template-versions.mjs"
      - ".github/workflows/miniapp-sdk-release.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + pack but do not publish to npm"
        required: true
        default: true
        type: boolean
      force_release:
        description: "Publish even if the package version did not change"
        required: true
        default: false
        type: boolean

concurrency:
  group: miniapp-sdk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect version changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.info.outputs.matrix }}
      has_publishes: ${{ steps.info.outputs.has_publishes }}
      dry_run: ${{ steps.info.outputs.dry_run }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect package version changes
        id: info
        run: node .github/scripts/miniapp-sdk-release-info.mjs
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}

  publish:
    name: Publish ${{ matrix.pkg.name }}@${{ matrix.pkg.version }}
    needs: detect
    if: needs.detect.outputs.has_publishes == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Sequential + dependency-ordered: the scaffolder's template pins
      # @mentra/miniapp and @mentra/miniapp-cli, so those publish first.
      max-parallel: 1
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-miniapp-sdk-${{ matrix.pkg.installDir }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-miniapp-sdk-

      - name: Install workspace dependencies
        working-directory: ${{ matrix.pkg.installDir }}
        run: bun install

      - name: Build package
        if: matrix.pkg.buildCmd != ''
        working-directory: ${{ matrix.pkg.dir }}
        run: ${{ matrix.pkg.buildCmd }}

      # Rewrite workspace `file:` deps to exact published versions so the tarball
      # installs for end users (no-op for packages without them). This only
      # mutates the checkout that gets packed/published — it is never committed.
      - name: "Rewrite workspace file: deps"
        run: node .github/scripts/rewrite-file-deps.mjs "${{ matrix.pkg.dir }}"

      # Stamp the scaffolder's template pins to the exact versions being published
      # this run, so a scaffolded project installs on any channel (the caret pins
      # in the repo can't reach -dev prereleases). No-op for packages without a
      # template/package.json. Packed checkout only — never committed.
      - name: Stamp scaffolder template versions
        run: node .github/scripts/stamp-template-versions.mjs "${{ matrix.pkg.dir }}"

      - name: Check npm registry
        id: registry
        run: |
          set -euo pipefail
          if npm view "${{ matrix.pkg.name }}@${{ matrix.pkg.version }}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "npm already has ${{ matrix.pkg.name }}@${{ matrix.pkg.version }}; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack (dry run)
        if: steps.registry.outputs.exists != 'true'
        working-directory: ${{ matrix.pkg.dir }}
        run: npm pack --dry-run

      - name: Publish to npm
        if: needs.detect.outputs.dry_run != 'true' && steps.registry.outputs.exists != 'true'
        working-directory: ${{ matrix.pkg.dir }}
        run: npm publish --tag "${{ matrix.pkg.tag }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarize
        if: always()
        run: |
          {
            echo "## ${{ matrix.pkg.name }}"
            echo ""
            echo "- Version: \`${{ matrix.pkg.version }}\`"
            echo "- Dist-tag: \`${{ matrix.pkg.tag }}\`"
            echo "- Already on npm: \`${{ steps.registry.outputs.exists }}\`"
            echo "- Dry run: \`${{ needs.detect.outputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
