name: Production Release - Rollout Observation

on:
  workflow_dispatch:
    inputs:
      release_identity:
        required: true
        type: string
      attempt:
        required: true
        type: number
      action:
        required: true
        type: choice
        options: [advance, complete]
      android_percent:
        required: true
        type: number

permissions:
  contents: write

concurrency:
  group: production-release-${{ inputs.release_identity }}-attempt-${{ inputs.attempt }}
  cancel-in-progress: false

jobs:
  record:
    name: Record protected rollout decision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-store-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Load current immutable promotion record
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/production-promotion-assets.mjs download-latest
          --repository "$GITHUB_REPOSITORY"
          --release "${{ inputs.release_identity }}"
          --attempt "${{ inputs.attempt }}"
          --output promotion-input/current.json
          --github-output "$GITHUB_OUTPUT"

      - name: Validate monotonic rollout decision and append state
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(jq -er .state promotion-input/current.json)" == rolling-out ]]
          percent="${{ inputs.android_percent }}"
          [[ "$percent" =~ ^([1-9][0-9]?|100)$ ]]
          assets=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${{ steps.promotion.outputs.release_id }}/assets?per_page=100" | jq 'add')
          previous=$(jq -r '[.[].name | (try capture("^production-rollout-(?<percent>[0-9]{3})\\.json$") catch empty) | .percent | tonumber] | max // 0' <<< "$assets")
          [[ "$percent" -gt "$previous" ]]
          if [[ "${{ inputs.action }}" == complete ]]; then
            [[ "$percent" == 100 ]]
            to=completed
          else
            to=rolling-out
          fi
          mkdir -p promotion-output
          padded=$(printf '%03d' "$percent")
          asset="production-rollout-$padded.json"
          jq -n \
            --argjson androidPercent "$percent" \
            --arg action "${{ inputs.action }}" \
            --arg actor "$GITHUB_ACTOR" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{schemaVersion: 1, kind: "production-rollout-observation", androidPercent: $androidPercent, applePhasedReleaseObserved: true, action: $action, actor: $actor, provenanceUrl: $url, note: "The protected approver confirms the matching store-console rollout setting was observed before this record was appended."}' \
            > "promotion-output/$asset"
          digest=$(sha256sum "promotion-output/$asset" | cut -d' ' -f1)
          jq -n --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg sha256 "$digest" --arg assetName "$asset" '{kind: "production-rollout-observation", url: $url, sha256: $sha256, assetName: $assetName}' > promotion-output/evidence.json
          node .github/scripts/production-promotion-state.mjs transition --record promotion-input/current.json --to "$to" --actor "$GITHUB_ACTOR" --created-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --provenance-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --evidence promotion-output/evidence.json --output promotion-output/next.json
          name=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {promotionAssetName} from "./.github/scripts/production-promotion-state.mjs"; process.stdout.write(promotionAssetName(JSON.parse(readFileSync("promotion-output/next.json", "utf8"))))')
          mv promotion-output/next.json "promotion-output/$name"
          {
            echo "record=promotion-output/$name"
            echo "asset=promotion-output/$asset"
            echo "asset_name=$asset"
          } >> "$GITHUB_OUTPUT"

      - name: Publish immutable rollout evidence and state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/publish-immutable-release-asset.mjs --file "${{ steps.next.outputs.asset }}" --name "${{ steps.next.outputs.asset_name }}" --release-id "${{ steps.promotion.outputs.release_id }}" --repository "$GITHUB_REPOSITORY"
          node .github/scripts/production-promotion-assets.mjs publish-record --record "${{ steps.next.outputs.record }}" --release-id "${{ steps.promotion.outputs.release_id }}" --repository "$GITHUB_REPOSITORY"

      - name: Summarize completion
        if: inputs.action == 'complete'
        run: |
          {
            echo "## Production promotion completed"
            echo
            echo "The immutable promotion chain is complete."
            echo "Publish the stable GitHub release only after the README final public-availability checks have also passed."
          } >> "$GITHUB_STEP_SUMMARY"
