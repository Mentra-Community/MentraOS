name: Publish routine results
run-name: Routine result ${{ inputs.request_id || github.event.workflow_run.id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Core accepted request ID
        type: string
        required: true
  workflow_run:
    workflows: [Request device routine, Dispatch requested device routine]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  fanout:
    if: github.repository == 'Mentra-Community/MentraOS' && github.ref == 'refs/heads/dev' && github.event_name == 'workflow_run'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10
    concurrency:
      group: routine-result-fanout-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Start independent publication for every authenticated request
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const {resolveRoutineSelectors, launchRoutineResultNotifications} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-routine-slack.mjs`);
            const requestIds = await resolveRoutineSelectors({github, context});
            const launches = await launchRoutineResultNotifications({github, context, requestIds});
            for (const launch of launches) core.notice(`${launch.requestId}: ${launch.status}`);
  resolve:
    if: github.repository == 'Mentra-Community/MentraOS' && github.ref == 'refs/heads/dev' && github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: build-notifications
    timeout-minutes: 190
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-work: ${{ steps.plan.outputs.has-work }}
      pr-matrix: ${{ steps.plan.outputs.pr-matrix }}
      has-pr-work: ${{ steps.plan.outputs.has-pr-work }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Authenticate result and exact release message
        id: plan
        uses: actions/github-script@v7
        env:
          TEST_RUN_INGEST_TOKEN: ${{ secrets.TEST_RUN_INGEST_TOKEN_DEV }}
          SLACK_BUILDS_BOT_TOKEN: ${{ secrets.SLACK_BUILDS_BOT_TOKEN }}
          SLACK_DEV_BUILDS_CHANNEL_ID: ${{ vars.SLACK_DEV_BUILDS_CHANNEL_ID }}
          SLACK_STAGING_BUILDS_CHANNEL_ID: ${{ vars.SLACK_STAGING_BUILDS_CHANNEL_ID }}
          REQUEST_ID: ${{ inputs.request_id }}
        with:
          script: |
            const {resolveRoutineSelectors, resolveRoutineResults, resolveRoutineNotifications} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-routine-slack.mjs`);
            const {resolvePrRoutineResults} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-routine-result.mjs`);
            const {slackDestination} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-slack-message.mjs`);
            const requestIds = await resolveRoutineSelectors({github, context, requestId: process.env.REQUEST_ID});
            const details = await resolveRoutineResults({token: process.env.TEST_RUN_INGEST_TOKEN, requestIds});
            const prPlans = resolvePrRoutineResults({details});
            core.setOutput('pr-matrix', JSON.stringify({include: prPlans}));
            core.setOutput('has-pr-work', String(prPlans.length > 0));
            const plans = process.env.SLACK_BUILDS_BOT_TOKEN ? await resolveRoutineNotifications({github, context, details}) : [];
            const ready = plans.filter(plan => slackDestination({...process.env, BRANCH: plan.notification.build.channel}));
            core.setOutput('matrix', JSON.stringify({include: ready}));
            core.setOutput('has-work', String(ready.length > 0));
            if (!ready.length) core.notice('No configured bot-owned release post; terminal updates unavailable. Admin results are unchanged.');
  comment:
    needs: resolve
    if: needs.resolve.outputs.has-pr-work == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.pr-matrix) }}
    name: PR ${{ matrix.pr }} / request ${{ matrix.requestId }}
    concurrency:
      group: pr-routine-result-${{ matrix.requestId }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Retain each execution on its originating PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RESULT_PLAN: ${{ toJSON(matrix) }}
        with:
          retries: 0
          script: |
            const {publishPrRoutineResult} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-routine-result.mjs`);
            const result = await publishPrRoutineResult({github, context, plan: JSON.parse(process.env.RESULT_PLAN)});
            core.notice(`PR routine result: ${result.status} (${result.commentId})`);
  update:
    needs: resolve
    if: needs.resolve.outputs.has-work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    name: Update release ${{ matrix.notification.build.runId }} / post ${{ matrix.notification.producer.runAttempt }} / ${{ matrix.row.requestId }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: build-notifications
    timeout-minutes: 10
    concurrency:
      group: release-slack-${{ matrix.notification.build.runId }}-${{ matrix.notification.producer.runAttempt }}
      cancel-in-progress: false
      # Keep different routine completions; the default single pending slot drops them.
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare complete desired message from retained state
        uses: actions/github-script@v7
        env:
          NOTIFICATION_PLAN: ${{ toJSON(matrix) }}
        with:
          script: |
            const {prepareRoutineUpdate} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-routine-slack.mjs`);
            await prepareRoutineUpdate({github, context, plan: JSON.parse(process.env.NOTIFICATION_PLAN)});
      - name: Retain desired message before updating Slack
        uses: actions/upload-artifact@v4
        with:
          name: release-slack-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.row.requestId }}
          path: slack-update-state.json
          if-no-files-found: error
      - name: Update original Slack message
        env:
          SLACK_BUILDS_BOT_TOKEN: ${{ secrets.SLACK_BUILDS_BOT_TOKEN }}
          SLACK_DEV_BUILDS_CHANNEL_ID: ${{ vars.SLACK_DEV_BUILDS_CHANNEL_ID }}
          SLACK_STAGING_BUILDS_CHANNEL_ID: ${{ vars.SLACK_STAGING_BUILDS_CHANNEL_ID }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {updateReleaseMessage} from './.github/scripts/release-slack-message.mjs';
          await updateReleaseMessage(JSON.parse(await readFile('slack-update-state.json', 'utf8')), process.env);
          JS
