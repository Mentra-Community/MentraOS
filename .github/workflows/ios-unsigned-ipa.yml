name: iOS Unsigned IPA (Sideload Build)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./mobile
        run: bun install --no-frozen-lockfile

      - name: Setup environment
        working-directory: ./mobile
        run: cp .env.example .env

      - name: Run Expo prebuild
        working-directory: ./mobile
        run: bun expo prebuild --platform ios

      - name: Setup Sherpa Onnx (optional, non-blocking)
        working-directory: ./mobile
        run: |
          chmod +x scripts/setup-sherpa-onnx-optional.sh
          ./scripts/setup-sherpa-onnx-optional.sh || true

      - name: Install CocoaPods dependencies
        working-directory: ./mobile/ios
        run: pod install

      - name: Build unsigned .app for device
        id: xcode-build
        working-directory: ./mobile/ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          xcodebuild \
            -workspace Mentra.xcworkspace \
            -scheme Mentra \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into unsigned IPA
        run: |
          APP_PATH="mobile/ios/build-device/Build/Products/Release-iphoneos/Mentra.app"
          IPA_PATH="mobile/ios/Mentra-unsigned.ipa"
          mkdir -p /tmp/Payload
          cp -r "$APP_PATH" /tmp/Payload/Mentra.app
          cd /tmp
          zip -r "$GITHUB_WORKSPACE/$IPA_PATH" Payload
          echo "IPA created at $IPA_PATH"
          ls -lh "$GITHUB_WORKSPACE/$IPA_PATH"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mentra-unsigned-ipa
          path: mobile/ios/Mentra-unsigned.ipa
          retention-days: 14
