name: iOS Build sidestore

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  WORKING_DIR: mobile
  IOS_DIR: mobile/ios

jobs:
  build-ios:
    name: iOS Archive
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install Node dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install CocoaPods gem
        run: gem install cocoapods --no-document

      - name: Cache CocoaPods
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: ${{ env.IOS_DIR }}/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles(format('{0}/Podfile.lock', env.IOS_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Pod install
        if: steps.pods-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.IOS_DIR }}
        run: pod install --repo-update

      - name: Fix Pod deployment targets
        working-directory: ${{ env.IOS_DIR }}
        run: |
          find Pods/Target\ Support\ Files -name "*.xcconfig" | while read f; do
            sed -i '' \
              -e 's/IPHONEOS_DEPLOYMENT_TARGET = 9\.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' \
              -e 's/IPHONEOS_DEPLOYMENT_TARGET = 10\.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' \
              -e 's/IPHONEOS_DEPLOYMENT_TARGET = 11\.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' \
              "$f"
          done

      - name: Build archive
        working-directory: ${{ env.IOS_DIR }}
        run: |
          set -o pipefail

          xcodebuild archive \
            -workspace MentraOSGO2.xcworkspace \
            -scheme MentraOSGO2 \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MentraOSGO2.xcarchive" \
            -destination "generic/platform=iOS" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            SWIFT_COMPILATION_MODE=singlefile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee /tmp/xcodebuild.log | xcpretty --color --report html --output /tmp/build-report.html

          BUILD_RESULT=${PIPESTATUS[0]}

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo ""
            echo "========== BUILD FAILED — LAST 200 LINES =========="
            tail -200 /tmp/xcodebuild.log
            exit "$BUILD_RESULT"
          fi

      - name: Upload full build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            /tmp/xcodebuild.log
            /tmp/build-report.html
          retention-days: 14

      - name: Upload archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MentraOSGO2-archive
          path: ${{ runner.temp }}/MentraOSGO2.xcarchive
          retention-days: 30
