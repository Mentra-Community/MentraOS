name: iOS IPA (SideStore Build)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: ./mobile
        run: bun install --no-frozen-lockfile

      - name: Setup env
        working-directory: ./mobile
        run: cp .env.example .env

      - name: Expo prebuild
        working-directory: ./mobile
        run: bun expo prebuild --platform ios

      - name: Setup Sherpa Onnx (optional)
        working-directory: ./mobile
        run: |
          chmod +x scripts/setup-sherpa-onnx-optional.sh
          ./scripts/setup-sherpa-onnx-optional.sh || true

      - name: Install pods
        working-directory: ./mobile/ios
        run: pod install

      - name: Patch Pods project
        working-directory: ./mobile/ios
        run: |
          ruby << 'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('Pods/Pods.xcodeproj')

          project.targets.each do |target|
            target.build_configurations.each do |config|
              # Fix low deployment targets on all pods
              current = config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'].to_f
              if current > 0 && current < 13.0
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
              end

              case target.name
              when 'SwiftProtobuf'
                # WMO OOM-kills compiler on 80+ files — force singlefile
                config.build_settings['SWIFT_COMPILATION_MODE'] = 'singlefile'
                puts "SwiftProtobuf #{config.name}: singlefile set"

              when 'RNScreens'
                # gamma/ files have Swift 6 incompatibilities — compile in Swift 5 mode
                config.build_settings['SWIFT_VERSION'] = '5'
                config.build_settings['SWIFT_STRICT_CONCURRENCY'] = 'minimal'
                puts "RNScreens #{config.name}: SWIFT_VERSION=5, strict-concurrency=minimal"
              end
            end
          end

          project.save
          puts "Done"
          RUBY


      - name: List schemes
        working-directory: ./mobile/ios
        run: xcodebuild -workspace Mentra.xcworkspace -list

      - name: Archive app
        working-directory: ./mobile/ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -o pipefail

          xcodebuild archive \
            -workspace Mentra.xcworkspace \
            -scheme Mentra \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/Mentra.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            2>&1 | tee /tmp/xcodebuild.log

          BUILD_RESULT=${PIPESTATUS[0]}

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo "========== ACTUAL ERRORS =========="
            grep ": error:" /tmp/xcodebuild.log | grep -v "^note:" | head -80
            echo "========== FAILED TARGETS =========="
            grep -E "FAILED|EmitSwift|CompileSwift" /tmp/xcodebuild.log | tail -20
            exit "$BUILD_RESULT"
          fi

          echo "✅ Archive succeeded"

      - name: Verify archive and find .app
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE" -name "Mentra.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Mentra.app not found"
            find "$GITHUB_WORKSPACE/Mentra.xcarchive" -maxdepth 5 2>/dev/null || echo "No xcarchive found"
            exit 1
          fi
          echo "✅ Found: $APP_PATH"
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "❌ Info.plist missing"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "${{ env.APP_PATH }}" Payload/App.app
          touch Payload/App.app/embedded.mobileprovision
          zip -r Mentra.ipa Payload
          ls -lh Mentra.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mentra-SideStore-IPA
          path: Mentra.ipa
          retention-days: 14

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 5
