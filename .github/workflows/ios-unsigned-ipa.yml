name: iOS IPA (SideStore Build)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: macos-13   # important: stable runner with Xcode 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Force Xcode 15 (avoids Swift 6 entirely)
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Confirm Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: ./mobile
        run: bun install --no-frozen-lockfile

      - name: Setup env
        working-directory: ./mobile
        run: cp .env.example .env

      - name: Expo prebuild
        working-directory: ./mobile
        run: npx expo prebuild --platform ios

      # ✅ Install CocoaPods cleanly
      - name: Install CocoaPods
        run: sudo gem install cocoapods

      # ✅ Apply SAFE Podfile patch (no duplication)
      - name: Patch Podfile (Swift 5 fix)
        working-directory: ./mobile/ios
        run: |
          ruby <<'RUBY'
          file = 'Podfile'
          content = File.read(file)

          unless content.include?("SWIFT_VERSION")
            injection = <<~EOS

              post_install do |installer|
                installer.pods_project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings['SWIFT_VERSION'] = '5.0'
                    config.build_settings['SWIFT_STRICT_CONCURRENCY'] = 'minimal'
                    config.build_settings['SWIFT_TREAT_WARNINGS_AS_ERRORS'] = 'NO'
                  end
                end
              end
            EOS

            content += injection
            File.write(file, content)
            puts "✅ Podfile patched"
          else
            puts "ℹ️ Podfile already patched"
          end
          RUBY

      - name: Install pods
        working-directory: ./mobile/ios
        run: pod install --repo-update

      # ✅ Dynamically detect workspace + scheme
      - name: Detect workspace and scheme
        working-directory: ./mobile/ios
        run: |
          WORKSPACE=$(ls *.xcworkspace | head -1)
          echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV

          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/ {getline; print $1}')
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV

          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"

      - name: Archive app
        working-directory: ./mobile/ios
        run: |
          set -o pipefail

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed"
            grep ": error:" /tmp/xcodebuild.log | head -50
            exit $EXIT_CODE
          fi

          echo "✅ Archive succeeded"

      - name: Extract .app
        run: |
          APP_PATH=$(find $GITHUB_WORKSPACE -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app: $APP_PATH"

      # ✅ SideStore-compatible IPA packaging
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r "$APP_PATH" Payload/App.app
          zip -r App.ipa Payload
          ls -lh App.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-IPA
          path: App.ipa

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: /tmp/xcodebuild.log
