name: iOS IPA (SideStore Build)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: ./mobile
        run: bun install --no-frozen-lockfile

      - name: Setup env
        working-directory: ./mobile
        run: cp .env.example .env

      - name: Expo prebuild
        working-directory: ./mobile
        run: bun expo prebuild --platform ios

      - name: Setup Sherpa Onnx (optional)
        working-directory: ./mobile
        run: |
          chmod +x scripts/setup-sherpa-onnx-optional.sh
          ./scripts/setup-sherpa-onnx-optional.sh || true

      - name: Install pods
        working-directory: ./mobile/ios
        run: pod install

      - name: Download iOS platform support
        working-directory: ./mobile/ios
        run: xcodebuild -downloadPlatform iOS

      - name: Archive app (forces full bundle assembly)
        working-directory: ./mobile/ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          xcodebuild archive \
            -workspace Mentra.xcworkspace \
            -scheme Mentra \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build-device/Mentra.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee /tmp/xcodebuild.log | xcpretty --color || \
          (echo "=== ERRORS ===" && grep "error:" /tmp/xcodebuild.log | tail -80 && exit 1)

      - name: Verify archive and locate .app
        run: |
          echo "=== Archive contents ==="
          find mobile/ios/build-device/Mentra.xcarchive -name "*.app" -type d
          APP_PATH=$(find mobile/ios/build-device/Mentra.xcarchive -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found in archive"
            find mobile/ios/build-device/Mentra.xcarchive -maxdepth 5
            exit 1
          fi
          echo "✅ Found: $APP_PATH"
          echo "=== App contents ==="
          ls -la "$APP_PATH"
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "❌ Info.plist still missing"
            exit 1
          fi
          echo "✅ Info.plist present"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package IPA (SideStore friendly)
        run: |
          mkdir -p Payload
          cp -r "${{ env.APP_PATH }}" Payload/App.app
          touch Payload/App.app/embedded.mobileprovision
          zip -r Mentra.ipa Payload
          mv Mentra.ipa mobile/ios/
          echo "✅ IPA packaged"
          ls -lh mobile/ios/Mentra.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mentra-SideStore-IPA
          path: mobile/ios/Mentra.ipa
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 5
