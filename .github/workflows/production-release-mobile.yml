name: Production Release - Mobile Candidates

on:
  workflow_dispatch:
    inputs:
      release_identity:
        required: true
        type: string
      attempt:
        required: true
        type: number
      phase:
        required: true
        type: choice
        options: [build]

permissions:
  actions: read
  contents: write

concurrency:
  group: production-release-${{ inputs.release_identity }}-attempt-${{ inputs.attempt }}
  cancel-in-progress: false

jobs:
  load:
    name: Load frozen production candidate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_artifact: ${{ steps.inputs.outputs.plan_artifact }}
      source_commit: ${{ steps.inputs.outputs.source_commit }}
      mentra_build: ${{ steps.inputs.outputs.mentra_build }}
      ota_url: ${{ steps.inputs.outputs.ota_url }}
      ota_sha256: ${{ steps.inputs.outputs.ota_sha256 }}
      candidate_container_tag: ${{ steps.inputs.outputs.candidate_container_tag }}
      candidate_container_name: ${{ steps.inputs.outputs.candidate_container_name }}
      promotion_release_id: ${{ steps.promotion.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Load current immutable promotion record
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/production-promotion-assets.mjs download-latest
          --repository "$GITHUB_REPOSITORY"
          --release "${{ inputs.release_identity }}"
          --attempt "${{ inputs.attempt }}"
          --output promotion-input/current.json
          --github-output "$GITHUB_OUTPUT"

      - name: Download plan and resolve the attempt-scoped candidate container
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(jq -er .state promotion-input/current.json)" == "current-clients-accepted" ]]
          release_id="${{ steps.promotion.outputs.release_id }}"
          name="production-release-plan-${{ inputs.release_identity }}.json"
          assets=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?per_page=100" | jq 'add')
          asset_id=$(jq -er --arg name "$name" '[.[] | select(.name == $name)] | if length == 1 then .[0].id else error("production plan must be unique") end' <<< "$assets")
          mkdir -p release-input/plan
          gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id" > release-input/plan/release-plan.json
          plan=release-input/plan/release-plan.json
          [[ "$(jq -er .channel "$plan")" == "production" ]]
          source_commit=$(jq -er .sourceCommit "$plan")
          [[ "$source_commit" == "$(jq -er .source.mentraosCommit promotion-input/current.json)" ]]
          candidate_container=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id")
          [[ "$(jq -r .draft <<< "$candidate_container")" == "true" ]]
          [[ "$(jq -r .prerelease <<< "$candidate_container")" == "false" ]]
          [[ "$(jq -r .target_commitish <<< "$candidate_container")" == "$source_commit" ]]
          plan_artifact="production-plan-${GITHUB_RUN_ID}"
          {
            echo "plan_artifact=$plan_artifact"
            echo "source_commit=$source_commit"
            echo "mentra_build=$(jq -er .coordinates.candidates.mentraApp.ios.buildNumber promotion-input/current.json)"
            echo "ota_url=$(jq -er .promotion.otaManifest.url "$plan")"
            echo "ota_sha256=$(jq -er .promotion.otaManifest.sha256 "$plan")"
            echo "candidate_container_tag=$(jq -er .tag_name <<< "$candidate_container")"
            echo "candidate_container_name=$(jq -er .name <<< "$candidate_container")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inputs.outputs.plan_artifact }}
          path: release-input/plan/release-plan.json
          if-no-files-found: error
          retention-days: 30

  approve:
    name: Approve production-signed candidate uploads
    needs: load
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-mobile-candidates
    steps:
      - run: |
          echo "Approved candidate build from ${{ needs.load.outputs.source_commit }}."
          echo "No public store release occurs in this phase."

  mentra-app:
    name: Rebuild Mentra App with production configuration
    needs: [load, approve]
    uses: ./.github/workflows/reusable-coordinated-mobile.yml
    with:
      source_commit: ${{ needs.load.outputs.source_commit }}
      release_plan_artifact: ${{ needs.load.outputs.plan_artifact }}
      release_id: ${{ needs.load.outputs.promotion_release_id }}
      artifact_container_tag: ${{ needs.load.outputs.candidate_container_tag }}
      artifact_container_name: ${{ needs.load.outputs.candidate_container_name }}
      ota_manifest_url: ${{ needs.load.outputs.ota_url }}
      ota_manifest_sha256: ${{ needs.load.outputs.ota_sha256 }}
      backend_environment: prod
      play_track: internal
      testflight_group: Mentra Production Candidates
    secrets: inherit

  record:
    name: Record exact uploaded production candidates
    needs: [load, mentra-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reload unchanged pre-candidate state
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/production-promotion-assets.mjs download-latest
          --repository "$GITHUB_REPOSITORY"
          --release "${{ inputs.release_identity }}"
          --attempt "${{ inputs.attempt }}"
          --output promotion-input/current.json
          --github-output "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.mentra-app.outputs.result_artifact }}
          path: candidate-input/mentra

      - name: Validate candidate coordinates and append state
        id: next
        run: |
          set -euo pipefail
          [[ "$(jq -er .state promotion-input/current.json)" == "current-clients-accepted" ]]
          mentra=candidate-input/mentra/mobile-publications.json
          [[ "$(jq -er '.publications.mentraos["google-play"].coordinate' "$mentra")" == "com.mentra.mentra:${{ needs.load.outputs.mentra_build }}:internal" ]]
          [[ "$(jq -er '.publications.mentraos["app-store-connect"].coordinate' "$mentra")" == "com.mentra.mentra:${{ inputs.release_identity }}:${{ needs.load.outputs.mentra_build }}:Mentra Production Candidates" ]]
          mkdir -p promotion-output
          jq '{schemaVersion: 1, kind: "production-mobile-candidates", mentraApp: .}' "$mentra" > promotion-output/mobile-candidates.json
          node .github/scripts/production-promotion-assets.mjs prepare-evidence \
            --file promotion-output/mobile-candidates.json \
            --kind production-mobile-candidates \
            --url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output promotion-output/evidence.json \
            --output-directory promotion-output/evidence-assets \
            --github-output "$GITHUB_OUTPUT"
          node .github/scripts/production-promotion-state.mjs transition \
            --record promotion-input/current.json \
            --to mobile-candidates-uploaded \
            --actor "$GITHUB_ACTOR" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --provenance-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --evidence promotion-output/evidence.json \
            --output promotion-output/next.json
          name=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {promotionAssetName} from "./.github/scripts/production-promotion-state.mjs"; process.stdout.write(promotionAssetName(JSON.parse(readFileSync("promotion-output/next.json", "utf8"))))')
          mv promotion-output/next.json "promotion-output/$name"
          echo "record=promotion-output/$name" >> "$GITHUB_OUTPUT"

      - name: Publish immutable candidate evidence and state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/publish-immutable-release-asset.mjs \
            --file "${{ steps.next.outputs.asset_path }}" \
            --name "${{ steps.next.outputs.asset_name }}" \
            --release-id "${{ steps.promotion.outputs.release_id }}" \
            --repository "$GITHUB_REPOSITORY"
          node .github/scripts/production-promotion-assets.mjs publish-record \
            --record "${{ steps.next.outputs.record }}" \
            --release-id "${{ steps.promotion.outputs.release_id }}" \
            --repository "$GITHUB_REPOSITORY"
