name: Dispatch requested device routine
on:
  workflow_run:
    workflows: [Mobile App iOS Build, Mobile App Android Build, Coordinated Mentra Release]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  resolve:
    environment: routine-nightly-dev
    if: github.repository == 'Mentra-Community/MentraOS' && vars.DEVICE_ROUTINE_PR_DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-work: ${{ steps.plan.outputs.has-work }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve exact publications and enrolled routine selections
        id: plan
        uses: actions/github-script@v7
        env:
          TEST_RUN_INGEST_TOKEN: ${{ secrets.TEST_RUN_INGEST_TOKEN_DEV }}
        with:
          retries: 0
          script: |
            const {planDeviceDispatches} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dispatch-device-routine.mjs`);
            const plans = await planDeviceDispatches({github, context, token: process.env.TEST_RUN_INGEST_TOKEN});
            core.setOutput('matrix', JSON.stringify({include: plans}));
            core.setOutput('has-work', String(plans.length > 0));
  dispatch:
    environment: routine-nightly-dev
    needs: resolve
    if: needs.resolve.outputs.has-work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: routine-dispatch-${{ matrix.requestId }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Queue frozen Core request
        id: queue
        uses: actions/github-script@v7
        env:
          TEST_RUN_INGEST_TOKEN: ${{ secrets.TEST_RUN_INGEST_TOKEN_DEV }}
          DISPATCH_PLAN: ${{ toJSON(matrix) }}
        with:
          retries: 0
          script: |
            const {dispatchRoutinePlan} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dispatch-device-routine.mjs`);
            const {writeFile} = await import('node:fs/promises');
            const plan = JSON.parse(process.env.DISPATCH_PLAN);
            await writeFile('routine-dispatch.json', JSON.stringify({requestIds: [plan.requestId], outcomes: [{
              routineId: plan.routineId, platform: plan.platform, requestId: plan.requestId, status: 'uncertain', reason: 'Dispatch outcome is not yet known',
            }]}));
            core.setOutput('persisted', 'true');
            const {request, ...outcome} = await dispatchRoutinePlan({token: process.env.TEST_RUN_INGEST_TOKEN, plan});
            await writeFile('routine-dispatch.json', JSON.stringify({requestIds: outcome.status === 'failed' ? [] : [plan.requestId], outcomes: [outcome]}));
            await core.summary.addRaw(`Core request ${plan.requestId}: ${outcome.status}`).write();
      - uses: actions/upload-artifact@v4
        if: always() && steps.queue.outputs.persisted == 'true'
        with:
          name: routine-dispatch-${{ matrix.requestId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: routine-dispatch.json
          if-no-files-found: error
      - name: Report admission outcome after retaining selectors
        if: always() && steps.queue.outputs.persisted == 'true'
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const {assertRoutineRequestOutcomes} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/request-e2e-routine.mjs`);
            const {readFile} = await import('node:fs/promises');
            const {outcomes} = JSON.parse(await readFile('routine-dispatch.json', 'utf8'));
            assertRoutineRequestOutcomes(outcomes);
