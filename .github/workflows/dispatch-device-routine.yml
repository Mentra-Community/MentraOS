name: Dispatch requested device routine
run-name: Device request callback ${{ github.event.workflow_run.id }} / attempt ${{ github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows: [Mobile App iOS Build, Request device routine]
    types: [completed]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  dispatch:
    if: github.repository == 'Mentra-Community/MentraOS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize only callbacks for the same source run and attempt. Other publications and
    # the private hardware queue have no shared concurrency group.
    concurrency:
      group: device-request-callback-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      cancel-in-progress: false
    # Retained callback run history fences automatic generation before POST.
    # Deleting it is not permission to replay; unknown sends need reconciliation.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve completed producer from GitHub metadata
        id: plan
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const {planDeviceDispatch, requestAfterPublication} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dispatch-device-routine.mjs`);
            const plan = await planDeviceDispatch({github, context, callbackAttempt: Number(process.env.GITHUB_RUN_ATTEMPT)});
            core.setOutput('plan', JSON.stringify(plan));
            core.setOutput('mode', plan.mode);
            if (plan.mode === 'request') {
              const result = await requestAfterPublication({github, context, plan});
              await core.summary.addRaw(JSON.stringify(result)).write();
              if (result.status === 'request-dispatch-unknown') core.setFailed(result.reason);
            } else if (plan.mode === 'skip' || plan.mode === 'reconcile') {
              await core.summary.addRaw(JSON.stringify(plan)).write();
              if (plan.mode === 'reconcile') core.setFailed(plan.reason);
            } else {
              core.setOutput('artifact-id', String(plan.artifactId));
              core.setOutput('run-id', String(plan.runId));
            }
      - name: Download the exact immutable request artifact
        if: steps.plan.outputs.mode == 'dispatch'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.plan.outputs.artifact-id }}
          run-id: ${{ steps.plan.outputs.run-id }}
          github-token: ${{ github.token }}
          path: routine-request
          merge-multiple: true
      - name: Queue the ready request in the private repository
        if: steps.plan.outputs.mode == 'dispatch'
        uses: actions/github-script@v7
        env:
          DISPATCH_PLAN: ${{ steps.plan.outputs.plan }}
          E2E_PRIVATE_DISPATCH_TOKEN: ${{ secrets.E2E_PRIVATE_DISPATCH_TOKEN }}
        with:
          retries: 0
          script: |
            const {dispatchReadyRequest, readRequest} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dispatch-device-routine.mjs`);
            const privateGithub = process.env.E2E_PRIVATE_DISPATCH_TOKEN ? new github.constructor({auth: process.env.E2E_PRIVATE_DISPATCH_TOKEN, retry: {enabled: false}}) : null;
            const result = await dispatchReadyRequest({github, privateGithub, context,
              plan: JSON.parse(process.env.DISPATCH_PLAN), bytes: await readRequest('routine-request/request.json')});
            await core.summary.addRaw(JSON.stringify(result)).write();
