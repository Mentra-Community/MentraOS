name: Dispatch requested device routine
run-name: Device request callback ${{ github.event.workflow_run.id }} / attempt ${{ github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows: [Mobile App iOS Build, Request device routine]
    types: [completed]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  resolve:
    if: github.repository == 'Mentra-Community/MentraOS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      mode: ${{ steps.plan.outputs.mode }}
      source-run-id: ${{ steps.plan.outputs.source-run-id }}
      publication-attempt: ${{ steps.plan.outputs.publication-attempt }}
      artifact-id: ${{ steps.plan.outputs.artifact-id }}
      run-id: ${{ steps.plan.outputs.run-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve completed producer from GitHub metadata
        id: plan
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const {planDeviceDispatch} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dispatch-device-routine.mjs`);
            const plan = await planDeviceDispatch({github, context, callbackAttempt: Number(process.env.GITHUB_RUN_ATTEMPT)});
            core.setOutput('plan', JSON.stringify(plan));
            core.setOutput('mode', plan.mode);
            if (plan.mode === 'request') {
              core.setOutput('source-run-id', String(plan.sourceRunId));
              core.setOutput('publication-attempt', String(plan.publicationAttempt));
            } else if (plan.mode === 'skip' || plan.mode === 'reconcile') {
              await core.summary.addRaw(JSON.stringify(plan)).write();
              if (plan.mode === 'reconcile') core.setFailed(plan.reason);
            } else {
              core.setOutput('artifact-id', String(plan.artifactId));
              core.setOutput('run-id', String(plan.runId));
            }

  dispatch:
    needs: resolve
    if: needs.resolve.outputs.mode == 'request' || needs.resolve.outputs.mode == 'dispatch'
    # This name binds the retained send step to one build/publication attempt.
    name: ${{ needs.resolve.outputs.mode == 'request' && format('Request publication {0} / attempt {1}', needs.resolve.outputs.source-run-id, needs.resolve.outputs.publication-attempt) || 'Dispatch trusted request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ needs.resolve.outputs.mode == 'request' && format('device-publication-{0}-{1}', needs.resolve.outputs.source-run-id, needs.resolve.outputs.publication-attempt) || format('device-request-callback-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
      cancel-in-progress: false
    # Never delete callback history to authorize replay; unknown sends need reconciliation.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Send trusted publication request
        if: needs.resolve.outputs.mode == 'request'
        uses: actions/github-script@v7
        env:
          DISPATCH_PLAN: ${{ needs.resolve.outputs.plan }}
        with:
          retries: 0
          script: |
            const {requestAfterPublication} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dispatch-device-routine.mjs`);
            const result = await requestAfterPublication({github, context, plan: JSON.parse(process.env.DISPATCH_PLAN)});
            await core.summary.addRaw(JSON.stringify(result)).write();
            if (result.status !== 'request-dispatched') core.setFailed(result.reason);
      - name: Download the exact immutable request artifact
        if: needs.resolve.outputs.mode == 'dispatch'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact-id }}
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          path: routine-request
          merge-multiple: true
      - name: Queue the ready request in the private repository
        if: needs.resolve.outputs.mode == 'dispatch'
        uses: actions/github-script@v7
        env:
          DISPATCH_PLAN: ${{ needs.resolve.outputs.plan }}
          E2E_PRIVATE_DISPATCH_TOKEN: ${{ secrets.E2E_PRIVATE_DISPATCH_TOKEN }}
        with:
          retries: 0
          script: |
            const {dispatchReadyRequest, readRequest} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dispatch-device-routine.mjs`);
            const privateGithub = process.env.E2E_PRIVATE_DISPATCH_TOKEN ? new github.constructor({auth: process.env.E2E_PRIVATE_DISPATCH_TOKEN, retry: {enabled: false}}) : null;
            const result = await dispatchReadyRequest({github, privateGithub, context,
              plan: JSON.parse(process.env.DISPATCH_PLAN), bytes: await readRequest('routine-request/request.json')});
            await core.summary.addRaw(JSON.stringify(result)).write();
