name: Deploy Dev Docs

on:
  push:
    branches:
      - dev
    paths:
      - docs/**
      - package.json
      - bun.lock
      - .github/workflows/deploy-dev-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-docs
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: mentraos-docs-dev
  CLOUDFLARE_PAGES_BRANCH: dev
  DOCS_DEV_URL: https://docs-dev.mentraglass.com
  EXPORT_ZIP: ${{ runner.temp }}/mentraos-docs-dev.zip
  EXPORT_DIR: ${{ runner.temp }}/mentraos-docs-dev

jobs:
  deploy:
    name: Export and deploy dev docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Export Mintlify docs
        working-directory: docs
        run: bunx --bun mint export --output "$EXPORT_ZIP"

      - name: Prepare Cloudflare Pages artifact
        run: |
          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"
          unzip -q "$EXPORT_ZIP" -d "$EXPORT_DIR"
          cat > "$EXPORT_DIR/_headers" <<'HEADERS'
          /*
            X-Robots-Tag: noindex
          HEADERS

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4.86.0 pages deploy "$EXPORT_DIR" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Deploy dev docs from ${GITHUB_SHA::7}" \
            --commit-dirty=true

      - name: Print dev docs URL
        run: |
          echo "Dev docs deploy target: $DOCS_DEV_URL"
