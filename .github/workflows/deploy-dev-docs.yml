name: Deploy Dev Docs

on:
  push:
    branches:
      - dev
    paths:
      - docs/**
      - docs-bluetooth-sdk/**
      - package.json
      - bun.lock
      - .github/workflows/deploy-dev-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-docs
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_BRANCH: dev

jobs:
  deploy:
    name: Export and deploy ${{ matrix.site_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - site_name: MentraOS dev docs
            docs_dir: docs
            export_name: mentraos-docs-dev
            pages_project: mentraos-docs-dev
            docs_url: https://docs-dev.mentraglass.com
          - site_name: Bluetooth SDK docs
            docs_dir: docs-bluetooth-sdk
            export_name: mentra-bluetooth-sdk-docs
            pages_project: mentraos-docs-temp
            docs_url: https://bluetooth-sdk-docs.mentra.glass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Export Mintlify docs
        working-directory: ${{ matrix.docs_dir }}
        run: bunx --bun mint export --output "$RUNNER_TEMP/${{ matrix.export_name }}.zip"

      - name: Prepare Cloudflare Pages artifact
        run: |
          EXPORT_ZIP="$RUNNER_TEMP/${{ matrix.export_name }}.zip"
          EXPORT_DIR="$RUNNER_TEMP/${{ matrix.export_name }}"
          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"
          unzip -q "$EXPORT_ZIP" -d "$EXPORT_DIR"
          cat > "$EXPORT_DIR/_headers" <<'HEADERS'
          /*
            X-Robots-Tag: noindex
          HEADERS

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          EXPORT_DIR="$RUNNER_TEMP/${{ matrix.export_name }}"
          npx wrangler@4.86.0 pages deploy "$EXPORT_DIR" \
            --project-name "${{ matrix.pages_project }}" \
            --branch "$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Deploy ${{ matrix.site_name }} from ${GITHUB_SHA::7}" \
            --commit-dirty=true

      - name: Print docs URL
        run: |
          echo "${{ matrix.site_name }} deploy target: ${{ matrix.docs_url }}"
