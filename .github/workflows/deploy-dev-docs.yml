name: Deploy Dev Docs

on:
  push:
    branches:
      - dev
    paths:
      - mintlify-docs/**
      - package.json
      - bun.lock
      - .github/workflows/deploy-dev-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-docs
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_BRANCH: dev

jobs:
  deploy:
    name: Export and deploy MentraOS dev docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Export Mintlify docs
        working-directory: mintlify-docs
        run: bunx --bun mint export --output "$RUNNER_TEMP/mentraos-docs-dev.zip"

      - name: Prepare Cloudflare Pages artifact
        run: |
          EXPORT_ZIP="$RUNNER_TEMP/mentraos-docs-dev.zip"
          EXPORT_DIR="$RUNNER_TEMP/mentraos-docs-dev"
          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"
          unzip -q "$EXPORT_ZIP" -d "$EXPORT_DIR"
          cat > "$EXPORT_DIR/_headers" <<'HEADERS'
          /*
            X-Robots-Tag: noindex
          HEADERS

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          EXPORT_DIR="$RUNNER_TEMP/mentraos-docs-dev"
          npx wrangler@4.86.0 pages deploy "$EXPORT_DIR" \
            --project-name mentraos-docs-dev \
            --branch "$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Deploy MentraOS dev docs from ${GITHUB_SHA::7}" \
            --commit-dirty=true

      - name: Print docs URL
        run: |
          echo "MentraOS dev docs deploy target: https://docs-dev.mentraglass.com"
