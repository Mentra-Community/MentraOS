name: Mobile App Quality Checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/augmentos-manager-jest.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "mobile/**"
      - ".github/workflows/augmentos-manager-jest.yml"
  workflow_dispatch:

# Cancel a branch's in-flight check when a newer commit is pushed to it.
# Scoped per-ref so branches never cancel each other; keeps the runner
# queue from filling with superseded runs.
concurrency:
  group: mobile-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('mobile/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./mobile
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        working-directory: ./mobile
        run: bun run compile

      - name: Run release tooling tests
        working-directory: ./mobile
        run: node --test scripts/*.test.mjs

      - name: Run Jest tests
        working-directory: ./mobile
        run: bun run test
        env:
          CI: true

      # jest.config.js ignores modules/engine and modules/miniapp because those
      # suites are bun:test, which Jest cannot resolve. They ran nowhere in CI
      # until now, so they get their own steps.
      - name: Run engine module tests (bun)
        working-directory: ./mobile/modules/engine
        run: bun run test
        env:
          CI: true

      - name: Run miniapp SDK tests (bun)
        working-directory: ./mobile/modules/miniapp
        run: bun test
        env:
          CI: true
