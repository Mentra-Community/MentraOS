name: Reusable Bluetooth Examples

# Builds the Bluetooth SDK examples in examples/bluetooth against the SDK
# source in the same checkout. The React Native examples are members of the
# examples/ Bun workspace, which links @mentra/* to mobile/modules and
# cloud-v2/packages; installing it runs those packages' prepare scripts, which
# build them. The native Android example includes
# mobile/modules/bluetooth-sdk/android as a Gradle composite build, and the
# Apple examples use mobile/modules/bluetooth-sdk as a local Swift package.
#
# Example App Builds calls this for pull requests. A coordinated release calls
# it with its release plan and OTA manifest: the SDK and Engine are then
# stamped with the release metadata exactly as the Mentra App build stamps
# them, every example is named after the release, and the last job uploads the
# APKs and the unsigned iOS IPA to the release container under those names, as
# the Mentra App build does. The release never waits for the examples.

on:
  workflow_call:
    inputs:
      source_commit:
        description: Commit to build; empty builds the triggering revision
        required: false
        default: ""
        type: string
      release_plan_artifact:
        description: Release plan artifact of a coordinated release; empty for pull requests
        required: false
        default: ""
        type: string
      ota_manifest_url:
        required: false
        default: ""
        type: string
      ota_manifest_sha256:
        required: false
        default: ""
        type: string
      release_id:
        description: Release container to upload the release's examples to
        required: false
        default: ""
        type: string
      desktop:
        description: Also build the macOS examples, which have no release artifact
        required: false
        default: true
        type: boolean
    outputs:
      react_native_name:
        value: ${{ jobs.publish.outputs.react_native_name }}
      react_native_url:
        value: ${{ jobs.publish.outputs.react_native_url }}

permissions:
  actions: read
  contents: read

env:
  ARTIFACTS_R2_ACCOUNT_ID: ${{ vars.ARTIFACTS_R2_ACCOUNT_ID }}
  ARTIFACTS_R2_BUCKET: artifactscdn
  CI: true
  GSTREAMER_VERSION: 1.28.2

jobs:
  prepare:
    name: Resolve example build identity
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      release: ${{ steps.identity.outputs.release }}
      identity: ${{ steps.identity.outputs.identity }}
      artifact_suffix: ${{ steps.identity.outputs.artifact_suffix }}
    steps:
      - uses: actions/download-artifact@v4
        if: inputs.release_plan_artifact != ''
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-input/plan

      - name: Resolve the release the examples are built for
        id: identity
        env:
          OTA_MANIFEST_URL: ${{ inputs.ota_manifest_url }}
          OTA_MANIFEST_SHA256: ${{ inputs.ota_manifest_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.release_plan_artifact }}" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          plan=release-input/plan/release-plan.json
          [[ "$OTA_MANIFEST_URL" == https://* ]]
          [[ "$OTA_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(jq -er .sourceCommit "$plan")" == "${{ inputs.source_commit }}" ]]
          {
            echo "release=true"
            echo "identity=$(jq -er .releaseIdentity "$plan")"
            echo "artifact_suffix=-$(jq -er .releaseSetId "$plan")"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Native Android example
    needs: prepare
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - uses: actions/setup-node@v4
        if: needs.prepare.outputs.release == 'true'
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.release == 'true'
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-input/plan

      # The tooling comes from the workflow revision: the frozen source of a
      # production example may predate the stamping action.
      - name: Check out the release tooling
        if: needs.prepare.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Stamp the release into the SDK and Engine
        if: needs.prepare.outputs.release == 'true'
        uses: ./release-tooling/.github/actions/stamp-release
        with:
          plan: release-input/plan/release-plan.json
          ota-manifest-url: ${{ inputs.ota_manifest_url }}
          ota-manifest-sha256: ${{ inputs.ota_manifest_sha256 }}

      - name: Get cache week number
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Scoped by job and runner.environment, as in the Mentra App build.
          key: gradle-${{ runner.environment }}-${{ runner.os }}-example-android-${{ steps.cache-week.outputs.week }}-${{ hashFiles('examples/bluetooth/android/**/*.gradle*', 'examples/bluetooth/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/modules/bluetooth-sdk/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.environment }}-${{ runner.os }}-example-android-${{ steps.cache-week.outputs.week }}-
            gradle-${{ runner.environment }}-${{ runner.os }}-example-android-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.1.12297006"

      - name: Cache GStreamer Android SDK
        uses: actions/cache@v4
        with:
          path: examples/bluetooth/android/.gstreamer/Android.sdk
          key: gstreamer-android-${{ env.GSTREAMER_VERSION }}

      - name: Build the example with the SDK from source
        # settings.gradle.kts includes mobile/modules/bluetooth-sdk/android
        # and substitutes com.mentraglass:bluetooth-sdk with it.
        working-directory: examples/bluetooth/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify foreground service types
        working-directory: examples/bluetooth/android
        run: python3 scripts/check-foreground-service.py app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml

      - name: Name the APK
        id: collect
        env:
          IDENTITY: ${{ needs.prepare.outputs.identity }}
        run: |
          set -euo pipefail
          mkdir -p example-output
          cp examples/bluetooth/android/app/build/outputs/apk/debug/app-debug.apk \
            "example-output/mentra-example-android${IDENTITY:+-$IDENTITY}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-android${{ needs.prepare.outputs.artifact_suffix }}
          path: example-output/*.apk
          retention-days: 14
          if-no-files-found: error

  react-native:
    name: React Native example
    needs: prepare
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Get cache week number
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Scoped by job and runner.environment, as in the Mentra App build.
          key: gradle-${{ runner.environment }}-${{ runner.os }}-example-react-native-${{ steps.cache-week.outputs.week }}-${{ hashFiles('examples/bun.lock', 'examples/bluetooth/react-native/**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.environment }}-${{ runner.os }}-example-react-native-${{ steps.cache-week.outputs.week }}-
            gradle-${{ runner.environment }}-${{ runner.os }}-example-react-native-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache GStreamer Android SDK
        uses: actions/cache@v4
        with:
          path: examples/bluetooth/react-native/.gstreamer/Android.sdk
          key: gstreamer-android-${{ env.GSTREAMER_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.environment }}-${{ runner.os }}-examples-${{ hashFiles('examples/bun.lock') }}
          restore-keys: |
            bun-${{ runner.environment }}-${{ runner.os }}-examples-

      - name: Install the examples workspace
        # Also builds the linked SDK packages through their prepare scripts.
        working-directory: examples
        run: bun install --frozen-lockfile

      # After the install, as for the Mentra App: the stamped versions and
      # metadata are part of the build, not of the lockfile.
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.release == 'true'
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-input/plan

      # The tooling comes from the workflow revision: the frozen source of a
      # production example may predate the stamping action.
      - name: Check out the release tooling
        if: needs.prepare.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Stamp the release into the SDK and Engine
        if: needs.prepare.outputs.release == 'true'
        uses: ./release-tooling/.github/actions/stamp-release
        with:
          plan: release-input/plan/release-plan.json
          ota-manifest-url: ${{ inputs.ota_manifest_url }}
          ota-manifest-sha256: ${{ inputs.ota_manifest_sha256 }}

      - name: Build Engine types
        # Engine has no prepare script; tsc reads its build/*.d.ts.
        working-directory: mobile/modules/engine
        run: bun run build

      - name: Type check TypeScript
        working-directory: examples/bluetooth/react-native
        run: bunx tsc --noEmit

      - name: Unit tests
        working-directory: examples/bluetooth/react-native
        run: |
          bun test
          bun run test:app-config

      - name: Generate Android project
        working-directory: examples/bluetooth/react-native
        run: bunx expo prebuild --platform android --no-install

      - name: Verify Android cleartext support
        working-directory: examples/bluetooth/react-native
        run: grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      # Pull request builds are compile checks: one ABI, as in the Mentra App
      # PR build. Release builds keep every ABI the example ships.
      - name: Build only arm64-v8a outside releases
        if: needs.prepare.outputs.release != 'true'
        run: echo "ORG_GRADLE_PROJECT_reactNativeArchitectures=arm64-v8a" >> "$GITHUB_ENV"

      - name: Build release Android app
        working-directory: examples/bluetooth/react-native/android
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Verify Android 16 KB page-size support
        run: examples/bluetooth/react-native/scripts/check-android-16kb.sh examples/bluetooth/react-native/android/app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        env:
          IDENTITY: ${{ needs.prepare.outputs.identity }}
        run: |
          set -euo pipefail
          mkdir -p example-output
          cp examples/bluetooth/react-native/android/app/build/outputs/apk/release/app-release.apk \
            "example-output/mentra-example-react-native${IDENTITY:+-$IDENTITY}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-react-native${{ needs.prepare.outputs.artifact_suffix }}
          path: example-output/*.apk
          retention-days: 14
          if-no-files-found: error

  react-native-elevenlabs-audio:
    name: React Native ElevenLabs audio example
    needs: prepare
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Get cache week number
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Scoped by job and runner.environment, as in the Mentra App build.
          key: gradle-${{ runner.environment }}-${{ runner.os }}-example-rn-elevenlabs-audio-${{ steps.cache-week.outputs.week }}-${{ hashFiles('examples/bun.lock', 'examples/bluetooth/react-native-elevenlabs-audio/**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.environment }}-${{ runner.os }}-example-rn-elevenlabs-audio-${{ steps.cache-week.outputs.week }}-
            gradle-${{ runner.environment }}-${{ runner.os }}-example-rn-elevenlabs-audio-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.environment }}-${{ runner.os }}-examples-${{ hashFiles('examples/bun.lock') }}
          restore-keys: |
            bun-${{ runner.environment }}-${{ runner.os }}-examples-

      - name: Install the examples workspace
        # Also builds the linked SDK packages through their prepare scripts.
        working-directory: examples
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.release == 'true'
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-input/plan

      # The tooling comes from the workflow revision: the frozen source of a
      # production example may predate the stamping action.
      - name: Check out the release tooling
        if: needs.prepare.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Stamp the release into the SDK and Engine
        if: needs.prepare.outputs.release == 'true'
        uses: ./release-tooling/.github/actions/stamp-release
        with:
          plan: release-input/plan/release-plan.json
          ota-manifest-url: ${{ inputs.ota_manifest_url }}
          ota-manifest-sha256: ${{ inputs.ota_manifest_sha256 }}

      - name: Type check TypeScript
        working-directory: examples/bluetooth/react-native-elevenlabs-audio
        run: bun run typecheck

      - name: Generate Android project
        working-directory: examples/bluetooth/react-native-elevenlabs-audio
        run: bunx expo prebuild --platform android --no-install

      - name: Verify Android cleartext support
        working-directory: examples/bluetooth/react-native-elevenlabs-audio
        run: grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      # Pull request builds are compile checks: one ABI, as in the Mentra App
      # PR build. Release builds keep every ABI the example ships.
      - name: Build only arm64-v8a outside releases
        if: needs.prepare.outputs.release != 'true'
        run: echo "ORG_GRADLE_PROJECT_reactNativeArchitectures=arm64-v8a" >> "$GITHUB_ENV"

      - name: Build release Android app
        working-directory: examples/bluetooth/react-native-elevenlabs-audio/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the APK
        env:
          IDENTITY: ${{ needs.prepare.outputs.identity }}
        run: |
          set -euo pipefail
          mkdir -p example-output
          cp examples/bluetooth/react-native-elevenlabs-audio/android/app/build/outputs/apk/release/app-release.apk \
            "example-output/mentra-example-rn-elevenlabs-audio${IDENTITY:+-$IDENTITY}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-rn-elevenlabs-audio${{ needs.prepare.outputs.artifact_suffix }}
          path: example-output/*.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    name: Native iOS example
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Free disk space if low
        uses: ./.github/actions/disk-guard

      - uses: actions/setup-node@v4
        if: needs.prepare.outputs.release == 'true'
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.release == 'true'
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-input/plan

      # The tooling comes from the workflow revision: the frozen source of a
      # production example may predate the stamping action.
      - name: Check out the release tooling
        if: needs.prepare.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Stamp the release into the SDK and Engine
        if: needs.prepare.outputs.release == 'true'
        uses: ./release-tooling/.github/actions/stamp-release
        with:
          plan: release-input/plan/release-plan.json
          ota-manifest-url: ${{ inputs.ota_manifest_url }}
          ota-manifest-sha256: ${{ inputs.ota_manifest_sha256 }}

      - name: Install GStreamer iOS SDK
        # Installs to ~/Library/Developer/GStreamer/iPhone.sdk once per runner
        # host; later runs reuse it.
        working-directory: examples/bluetooth/ios
        run: bash scripts/setup-gstreamer-ios.sh

      - name: Analyze
        working-directory: examples/bluetooth/ios
        run: |
          xcodebuild \
            -project MentraExample.xcodeproj \
            -scheme MentraExample \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/example-ios" \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Build
        working-directory: examples/bluetooth/ios
        run: |
          xcodebuild \
            -project MentraExample.xcodeproj \
            -scheme MentraExample \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/example-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package the unsigned IPA
        if: needs.prepare.outputs.release == 'true'
        env:
          IDENTITY: ${{ needs.prepare.outputs.identity }}
        run: |
          set -euo pipefail
          app_path=$(find "$RUNNER_TEMP/example-ios/Build/Products/Debug-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          package="$RUNNER_TEMP/example-ios-package"
          rm -rf "$package"
          mkdir -p "$package/Payload" example-output
          cp -R "$app_path" "$package/Payload/"
          (cd "$package" && zip -qry "$GITHUB_WORKSPACE/example-output/mentra-example-ios-$IDENTITY-unsigned.ipa" Payload)

      - name: Upload IPA artifact
        if: needs.prepare.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mentra-example-ios${{ needs.prepare.outputs.artifact_suffix }}
          path: example-output/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Remove build outputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/example-ios" "$RUNNER_TEMP/example-ios-package" example-output

  macos:
    name: Native macOS example
    needs: prepare
    if: inputs.desktop
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Free disk space if low
        uses: ./.github/actions/disk-guard

      - name: Build AppKit app
        working-directory: examples/bluetooth/macos
        run: bash run.sh --build-only

      - name: Remove build outputs
        if: always()
        working-directory: examples/bluetooth/macos
        run: rm -rf .build build

  react-native-macos:
    name: React Native macOS example
    needs: prepare
    if: inputs.desktop
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      RCT_NO_LAUNCH_PACKAGER: 1
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Free disk space if low
        uses: ./.github/actions/disk-guard

      - name: Isolate this runner's CocoaPods download cache
        run: |
          cache_dir="$HOME/Library/Caches/CocoaPods-${RUNNER_NAME:-runner}"
          mkdir -p "$cache_dir"
          echo "CP_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install the examples workspace
        # Also builds the linked SDK packages through their prepare scripts.
        working-directory: examples
        run: bun install --frozen-lockfile

      - name: Type check TypeScript
        working-directory: examples/bluetooth/react-native-macos
        run: bun run typecheck

      - name: Install CocoaPods dependencies
        working-directory: examples/bluetooth/react-native-macos/macos
        run: pod install

      - name: Build native app and bundle JavaScript
        working-directory: examples/bluetooth/react-native-macos/macos
        env:
          # Outside releases, build the runner's architecture only instead of
          # a universal binary.
          ONLY_ACTIVE_ARCH: ${{ needs.prepare.outputs.release == 'true' && 'NO' || 'YES' }}
        run: |
          xcodebuild \
            -workspace mentra-bluetooth-sdk-macos-example.xcworkspace \
            -scheme mentra-bluetooth-sdk-macos-example-macOS \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH="$ONLY_ACTIVE_ARCH" \
            build

      - name: Verify embedded JavaScript bundle
        working-directory: examples/bluetooth/react-native-macos/macos
        run: test -s build/Build/Products/Release/mentra-bluetooth-sdk-macos-example.app/Contents/Resources/main.jsbundle

      - name: Remove build outputs
        if: always()
        working-directory: examples/bluetooth/react-native-macos/macos
        run: rm -rf build Pods

  publish:
    name: Upload the release's example apps
    needs: [prepare, android, react-native, react-native-elevenlabs-audio, ios]
    if: needs.prepare.outputs.release == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      react_native_name: ${{ steps.names.outputs.react_native_name }}
      react_native_url: ${{ steps.names.outputs.react_native_url }}
    steps:
      # The scripts run from the workflow revision: a production example
      # builds a promoted beta's source, which may predate them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts
            .github/artifact-storage
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-input/plan

      - uses: actions/download-artifact@v4
        with:
          pattern: mentra-example-*${{ needs.prepare.outputs.artifact_suffix }}
          path: release-output
          merge-multiple: true

      # Deterministic names, so the release page, the docs and Slack link the
      # files without a record. A file an earlier attempt already uploaded
      # keeps its bytes; the immutable publisher refuses different ones.
      - name: Upload the examples to the release container
        id: names
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          plan=release-input/plan/release-plan.json
          [[ -n "$RELEASE_ID" ]]
          existing=$(node .github/scripts/release-assets.mjs list --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID")
          while IFS= read -r name; do
            test -s "release-output/$name"
            if jq -e --arg name "$name" 'any(.[]; .name == $name and .state == "uploaded")' <<< "$existing" > /dev/null; then
              echo "Keeping the uploaded $name"
              continue
            fi
            node .github/scripts/publish-immutable-release-asset.mjs \
              --file "release-output/$name" --name "$name" \
              --release-id "$RELEASE_ID" --repository "$GITHUB_REPOSITORY"
          done < <(node .github/scripts/bluetooth-example-artifacts.mjs names --plan "$plan")
          node .github/scripts/bluetooth-example-artifacts.mjs urls --plan "$plan" \
            --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
