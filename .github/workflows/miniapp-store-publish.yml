name: Publish first-party miniapps to the Store

# Builds and validates the first-party miniapps kept in miniapps/ on every
# change. Each branch publishes them to its own Mentra Miniapp Store: dev to the
# dev Store, staging to the staging Store (once its keys exist), and main to
# production. A version a Store already has is skipped, so publishing happens
# when a miniapp.json version is bumped.

on:
  pull_request:
    paths:
      - "miniapps/captions/**"
      - "miniapps/translation/**"
      - "miniapps/teleprompter/**"
      - "miniapps/navigation/**"
      - "miniapps/recorder/**"
      - "sdk/miniapp-cli/**"
      - "mobile/modules/miniapp/**"
      - ".github/actions/publish-miniapp/**"
      - ".github/scripts/setup-store-publishing*"
      - ".github/workflows/miniapp-store-publish.yml"
  push:
    branches: [dev, staging, main]
    paths:
      - "miniapps/captions/**"
      - "miniapps/translation/**"
      - "miniapps/teleprompter/**"
      - "miniapps/navigation/**"
      - "miniapps/recorder/**"
      - "sdk/miniapp-cli/**"
      - "mobile/modules/miniapp/**"
      - ".github/actions/publish-miniapp/**"
      - ".github/scripts/setup-store-publishing*"
      - ".github/workflows/miniapp-store-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniapp-store-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate ${{ matrix.miniapp }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        miniapp: [captions, translation, teleprompter, navigation, recorder]
    env:
      # Public Mapbox tiles token baked into the Maps UI bundle.
      PUBLIC_MAPBOX_TOKEN: ${{ vars.PUBLIC_MAPBOX_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the Mentra Miniapp SDK
        working-directory: mobile/modules/miniapp
        run: bun run build
      - name: Typecheck
        working-directory: miniapps/${{ matrix.miniapp }}
        run: bun run typecheck
      - name: Test
        if: matrix.miniapp == 'navigation'
        working-directory: miniapps/${{ matrix.miniapp }}
        run: bun run test
      - name: Production pack
        working-directory: miniapps/${{ matrix.miniapp }}
        run: NODE_ENV=production bun run pack
      - uses: ./.github/actions/publish-miniapp
        with:
          operation: prepare
          directory: miniapps/${{ matrix.miniapp }}
      - uses: actions/upload-artifact@v4
        with:
          name: miniapp-${{ matrix.miniapp }}-${{ github.sha }}
          path: miniapps/${{ matrix.miniapp }}/build/*.zip
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  setup-script:
    name: Check the Store setup script
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test .github/scripts/setup-store-publishing.test.mjs

  stores:
    name: Choose this branch's Store
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      stores: ${{ steps.choose.outputs.stores }}
    steps:
      - id: choose
        env:
          BRANCH: ${{ github.ref_name }}
          # Each Store, the branch that publishes to it, and the GitHub environment holding its keys,
          # which only that branch may deploy to. The keys are named <secretPrefix><miniapp key>.
          # .github/scripts/setup-store-publishing.mjs sets a Store up, issues its keys and, for staging,
          # turns it on with the MENTRA_STAGING_STORE_PUBLISHING repository variable.
          STORES: >-
            [
            {"name": "prod", "branch": "main", "url": "https://api.apps.mentraglass.com", "environment": "miniapp-store-production", "secretPrefix": "MENTRA_STORE_PUBLISH_TOKEN_", "on": true},
            {"name": "staging", "branch": "staging", "url": "https://api.apps.staging.mentraglass.com", "environment": "miniapp-store-staging", "secretPrefix": "MENTRA_STAGING_STORE_PUBLISH_TOKEN_", "on": ${{ vars.MENTRA_STAGING_STORE_PUBLISHING == 'true' }}},
            {"name": "dev", "branch": "dev", "url": "https://api.apps.dev.mentraglass.com", "environment": "miniapp-store-dev", "secretPrefix": "MENTRA_DEV_STORE_PUBLISH_TOKEN_", "on": true}
            ]
        run: |
          stores=$(jq -c --arg branch "$BRANCH" 'map(select(.on and .branch == $branch))' <<<"$STORES")
          echo "stores=$stores" >> "$GITHUB_OUTPUT"
          if [[ "$stores" == "[]" ]]; then echo "$BRANCH publishes to no Store."; fi

  publish:
    name: Publish ${{ matrix.miniapp.name }} to the ${{ matrix.store.name }} Store
    needs: [validate, setup-script, stores]
    if: needs.stores.outputs.stores != '[]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The Store's keys are in its GitHub environment, which only the branch that publishes to it may
    # use, so another branch can neither publish there nor read them.
    environment: ${{ matrix.store.environment }}
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(needs.stores.outputs.stores) }}
        miniapp:
          - {name: captions, key: CAPTIONS}
          - {name: translation, key: TRANSLATION}
          - {name: teleprompter, key: TELEPROMPTER}
          - {name: navigation, key: MAPS}
          - {name: recorder, key: RECORDER}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: miniapp-${{ matrix.miniapp.name }}-${{ github.sha }}
          path: miniapps/${{ matrix.miniapp.name }}/build
      - name: Check whether the Store already has this version
        id: store
        env:
          STORE_URL: ${{ matrix.store.url }}
          MANIFEST: miniapps/${{ matrix.miniapp.name }}/miniapp.json
        run: |
          package=$(jq -r .packageName "$MANIFEST")
          version=$(jq -r .version "$MANIFEST")
          # The public catalog needs no key. A private or unlisted package isn't
          # there, so it goes on to the authenticated check in the action.
          current=$(curl -fsS --max-time 30 "$STORE_URL/api/store/apps/$package" \
            | jq -r '.app.release | select(.track == "stable") | .version' 2>/dev/null || true)
          if [[ "$current" == "$version" ]]; then
            echo "The Store already has $package@$version; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the publishing key
        if: steps.store.outputs.publish == 'true'
        env:
          HAS_KEY: ${{ secrets[format('{0}{1}', matrix.store.secretPrefix, matrix.miniapp.key)] != '' }}
          KEY_NAME: ${{ format('{0}{1}', matrix.store.secretPrefix, matrix.miniapp.key) }}
          ENVIRONMENT: ${{ matrix.store.environment }}
        run: |
          if [[ "$HAS_KEY" != "true" ]]; then
            echo "::error::The secret $KEY_NAME is not set in the $ENVIRONMENT environment. A Store administrator issues an app-restricted publishing key for this miniapp (.github/scripts/setup-store-publishing.mjs)."
            exit 1
          fi
      - uses: ./.github/actions/publish-miniapp
        if: steps.store.outputs.publish == 'true'
        with:
          operation: publish
          directory: miniapps/${{ matrix.miniapp.name }}
          branch: ${{ github.ref_name }}
          store-url: ${{ matrix.store.url }}
          token: ${{ secrets[format('{0}{1}', matrix.store.secretPrefix, matrix.miniapp.key)] }}
