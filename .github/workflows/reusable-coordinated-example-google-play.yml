name: Reusable Coordinated Example Google Play

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      release_plan_artifact:
        required: true
        type: string
      starter_kit_result_artifact:
        required: true
        type: string
      release_id:
        required: true
        type: string
      play_track:
        required: true
        type: string
    outputs:
      result_artifact:
        value: ${{ jobs.android.outputs.result_artifact }}
      install_url:
        value: ${{ jobs.android.outputs.install_url }}

permissions:
  contents: write

env:
  CI: true
  EXAMPLE_PACKAGE_ID: com.mentra.bluetoothsdkexample
  STARTER_KIT_REPOSITORY: Mentra-Community/Mentra-Bluetooth-SDK-Starter-Kit

jobs:
  android:
    name: Build and distribute the coordinated Android example
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    # Play edits are app-wide, even when dev and staging use different tracks.
    concurrency:
      group: coordinated-example-google-play
      cancel-in-progress: false
    outputs:
      result_artifact: ${{ steps.coordinates.outputs.result_artifact }}
      install_url: ${{ steps.coordinates.outputs.install_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-input/plan

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.starter_kit_result_artifact }}
          path: release-input/starter-kit

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve exact validated example coordinates
        id: coordinates
        env:
          GOOGLE_PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          set -euo pipefail
          starter=$(find release-input/starter-kit -type f -name 'starter-kit-release-*.json' -print -quit)
          test -n "$starter"
          node .github/scripts/coordinated-example-google-play.mjs coordinates \
            --plan release-input/plan/release-plan.json --starter-kit "$starter" \
            --track "$GOOGLE_PLAY_TRACK" --output "$GITHUB_OUTPUT"
          echo "starter_result=$starter" >> "$GITHUB_OUTPUT"

      - name: Resolve previously persisted immutable App Bundle
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          [[ "$(jq -er .tag_name <<< "$release")" == "${{ steps.coordinates.outputs.container_tag }}" ]]
          [[ "$(jq -r .draft <<< "$release")" == false ]]
          assets=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" | jq 'add')
          matches=$(jq --arg name "${{ steps.coordinates.outputs.aab_name }}" '[.[] | select(.name == $name)]' <<< "$assets")
          [[ "$(jq length <<< "$matches")" -le 1 ]]
          mkdir -p release-output
          if [[ "$(jq length <<< "$matches")" == 1 ]]; then
            asset_id=$(jq -er '.[0].id' <<< "$matches")
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "release-output/${{ steps.coordinates.outputs.aab_name }}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.existing.outputs.exists != 'true'

      - name: Install the example Android toolchain
        if: steps.existing.outputs.exists != 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Inject upload and Google Play credentials
        uses: ./.github/actions/inject-signing
        with:
          mobile: "true"
          play: "true"
          upload-keystore-b64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          upload-store-password: ${{ secrets.MENTRAOS_UPLOAD_STORE_PASSWORD }}
          upload-key-password: ${{ secrets.MENTRAOS_UPLOAD_KEY_PASSWORD }}
          upload-key-alias: ${{ secrets.MENTRAOS_UPLOAD_KEY_ALIAS }}
          google-play-key-json: ${{ secrets.GOOGLE_PLAY_KEY_JSON }}

      - name: Install pinned Google Play tooling
        run: |
          set -euo pipefail
          mkdir -p example-play/fastlane
          cp mobile/ci/fastlane-android/Fastfile mobile/ci/fastlane-android/Appfile example-play/fastlane/
          cp mobile/Gemfile mobile/Gemfile.lock example-play/
          cd example-play
          bundle install

      - name: Check Play setup and exact version
        id: play
        working-directory: example-play
        env:
          APP_PACKAGE_NAME: com.mentra.bluetoothsdkexample
          GOOGLE_PLAY_TRACK: ${{ inputs.play_track }}
          GOOGLE_PLAY_VERSION_CODES_OUTPUT: ${{ runner.temp }}/example-play-codes.json
        run: |
          set -euo pipefail
          if ! bundle exec fastlane track_version_codes; then
            # Still produce the signed AAB required for first-time Console setup.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if jq -e --argjson expected "${{ steps.coordinates.outputs.build_number }}" 'map(tonumber) | index($expected) != null' "$GOOGLE_PLAY_VERSION_CODES_OUTPUT" >/dev/null; then
            [[ "${{ steps.existing.outputs.exists }}" == true ]] || {
              echo "Play contains this version without its previously persisted release AAB; refusing to claim byte identity." >&2
              exit 1
            }
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Starter Kit checkout token
        id: starter-token
        if: steps.existing.outputs.exists != 'true' && vars.STARTER_KIT_COORDINATOR_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.STARTER_KIT_COORDINATOR_APP_ID }}
          private-key: ${{ secrets.STARTER_KIT_COORDINATOR_APP_PRIVATE_KEY }}
          owner: Mentra-Community
          repositories: Mentra-Bluetooth-SDK-Starter-Kit
          permission-contents: read

      - name: Checkout exact validated Starter Kit source
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STARTER_KIT_REPOSITORY }}
          ref: ${{ steps.coordinates.outputs.starter_release_commit }}
          token: ${{ steps.starter-token.outputs.token || secrets.STARTER_KIT_COORDINATOR_TOKEN || secrets.MENTRA_BLUETOOTH_SDK_IOS_PUSH_TOKEN }}
          path: starter-kit

      - uses: oven-sh/setup-bun@v2
        if: steps.existing.outputs.exists != 'true'
        with:
          bun-version: "1.3.11"

      - name: Generate release-matched Android project
        if: steps.existing.outputs.exists != 'true'
        working-directory: starter-kit/examples/react-native
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ steps.coordinates.outputs.starter_release_commit }}" ]]
          node "$GITHUB_WORKSPACE/.github/scripts/coordinated-example-google-play.mjs" configure \
            --plan "$GITHUB_WORKSPACE/release-input/plan/release-plan.json" --app app.json --package package.json
          bun install --frozen-lockfile
          bunx expo prebuild --platform android

      - name: Build and sign the example App Bundle
        if: steps.existing.outputs.exists != 'true'
        working-directory: starter-kit/examples/react-native/android
        run: |
          set -euo pipefail
          ./gradlew :app:bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$aab"
          zip -d "$aab" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
          jarsigner -keystore "$GITHUB_WORKSPACE/mobile/credentials/upload-keystore.jks" \
            -storepass "$ORG_GRADLE_PROJECT_MENTRAOS_UPLOAD_STORE_PASSWORD" \
            -keypass "$ORG_GRADLE_PROJECT_MENTRAOS_UPLOAD_KEY_PASSWORD" \
            "$aab" "$ORG_GRADLE_PROJECT_MENTRAOS_UPLOAD_KEY_ALIAS"
          cp "$aab" "$GITHUB_WORKSPACE/release-output/${{ steps.coordinates.outputs.aab_name }}"

      - name: Verify and persist exact signed bytes before Play upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aab="release-output/${{ steps.coordinates.outputs.aab_name }}"
          jarsigner -verify "$aab"
          keytool -printcert -jarfile "$aab" > "$RUNNER_TEMP/example-certificate.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/example-certificate.txt"; then
            echo "Refusing a debug-signed Play bundle." >&2
            exit 1
          fi
          abis=$(unzip -Z1 "$aab" | sed -n 's#^[^/]*/lib/\([^/]*\)/.*\.so$#\1#p' | LC_ALL=C sort -u | paste -sd, -)
          # Preserve the example's withAndroid16KbPageSize plugin ABI contract.
          [[ "$abis" == "arm64-v8a,x86_64" ]]
          node .github/scripts/publish-immutable-release-asset.mjs \
            --file "$aab" --name "${{ steps.coordinates.outputs.aab_name }}" \
            --release-id "${{ inputs.release_id }}" --repository "$GITHUB_REPOSITORY"

      - name: Require Play access before publishing
        if: steps.play.outputs.ready != 'true'
        run: |
          echo "Play access failed. Check the lookup error above. For first-time setup, register com.mentra.bluetoothsdkexample, upload the persisted signed AAB in Play Console, and grant the existing release service account access. Open testing also requires completed app setup." >&2
          echo "AAB: ${{ steps.coordinates.outputs.aab_url }}" >&2
          exit 1

      - name: Upload exact App Bundle to the channel audience
        if: steps.play.outputs.exists != 'true'
        working-directory: example-play
        env:
          APP_PACKAGE_NAME: com.mentra.bluetoothsdkexample
          GOOGLE_PLAY_AAB: ${{ github.workspace }}/release-output/${{ steps.coordinates.outputs.aab_name }}
          GOOGLE_PLAY_RELEASE_NAME: ${{ steps.coordinates.outputs.release_identity }}
          GOOGLE_PLAY_TRACK: ${{ inputs.play_track }}
        run: bundle exec fastlane google_play

      - name: Confirm accepted version and record publication evidence
        working-directory: example-play
        env:
          APP_PACKAGE_NAME: com.mentra.bluetoothsdkexample
          GOOGLE_PLAY_TRACK: ${{ inputs.play_track }}
          GOOGLE_PLAY_VERSION_CODES_OUTPUT: ${{ runner.temp }}/example-play-codes.json
        run: |
          set -euo pipefail
          bundle exec fastlane track_version_codes
          node ../.github/scripts/coordinated-example-google-play.mjs record \
            --plan ../release-input/plan/release-plan.json \
            --starter-kit "../${{ steps.coordinates.outputs.starter_result }}" \
            --track "$GOOGLE_PLAY_TRACK" --codes "$GOOGLE_PLAY_VERSION_CODES_OUTPUT" \
            --aab "../release-output/${{ steps.coordinates.outputs.aab_name }}" \
            --artifact-url "${{ steps.coordinates.outputs.aab_url }}" \
            --upload-status "${{ steps.play.outputs.exists == 'true' && 'reused' || 'published' }}" \
            --provenance-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output ../release-output/example-google-play-publication.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.coordinates.outputs.result_artifact }}
          path: release-output/example-google-play-publication.json
          if-no-files-found: error
          retention-days: 90
