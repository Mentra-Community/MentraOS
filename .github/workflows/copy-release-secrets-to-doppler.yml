name: Copy release secrets to Doppler

# One-off, for the coordinated release's move to the Mentra monorepo: writes
# the secrets the release workflows use into Doppler mentra-monorepo-ci
# (config shared), where the monorepo reads them. GitHub never shows a secret
# again, so this is the only way to move them without re-entering each one.
# Started by hand; removed right after it has run. DOPPLER_COPY_TOKEN is a
# short-lived service token that can only write that config.

on: workflow_dispatch

permissions: {}

jobs:
  copy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Install the Doppler CLI
        run: |
          archive="$RUNNER_TEMP/doppler_3.76.6_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" \
            "https://github.com/DopplerHQ/cli/releases/download/3.76.6/doppler_3.76.6_linux_amd64.tar.gz"
          echo "67e4e020761adf3ffe5a030712d61721b4e2752182670bf90de5a2a88e4961e3  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" doppler
      - name: Copy the secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_COPY_TOKEN }}
          COPY_ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          COPY_ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          COPY_ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          COPY_ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          COPY_ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          COPY_ASG_KEYSTORE_B64: ${{ secrets.ASG_KEYSTORE_B64 }}
          COPY_ASG_KEY_ALIAS: ${{ secrets.ASG_KEY_ALIAS }}
          COPY_ASG_KEY_PASSWORD: ${{ secrets.ASG_KEY_PASSWORD }}
          COPY_ASG_STORE_PASSWORD: ${{ secrets.ASG_STORE_PASSWORD }}
          COPY_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COPY_CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          COPY_EXPO_PUBLIC_AR99_RELEASE_CLIENT_KEY: ${{ secrets.EXPO_PUBLIC_AR99_RELEASE_CLIENT_KEY }}
          COPY_EXPO_PUBLIC_AR99_RELEASE_DEVELOPER_ID: ${{ secrets.EXPO_PUBLIC_AR99_RELEASE_DEVELOPER_ID }}
          COPY_GOOGLE_PLAY_KEY_JSON: ${{ secrets.GOOGLE_PLAY_KEY_JSON }}
          COPY_IOS_PR_PROFILE_BASE64: ${{ secrets.IOS_PR_PROFILE_BASE64 }}
          COPY_MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          COPY_MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          COPY_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          COPY_MAVEN_CENTRAL_TOKEN_BASE64: ${{ secrets.MAVEN_CENTRAL_TOKEN_BASE64 }}
          COPY_MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          COPY_MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          COPY_MENTRAOS_UPLOAD_KEY_ALIAS: ${{ secrets.MENTRAOS_UPLOAD_KEY_ALIAS }}
          COPY_MENTRAOS_UPLOAD_KEY_PASSWORD: ${{ secrets.MENTRAOS_UPLOAD_KEY_PASSWORD }}
          COPY_MENTRAOS_UPLOAD_STORE_PASSWORD: ${{ secrets.MENTRAOS_UPLOAD_STORE_PASSWORD }}
          COPY_MENTRA_BLUETOOTH_SDK_IOS_PUSH_TOKEN: ${{ secrets.MENTRA_BLUETOOTH_SDK_IOS_PUSH_TOKEN }}
          COPY_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          COPY_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          COPY_SLACK_BUILDS_BOT_TOKEN: ${{ secrets.SLACK_BUILDS_BOT_TOKEN }}
          COPY_SLACK_WEBHOOK_DEV_BUILDS: ${{ secrets.SLACK_WEBHOOK_DEV_BUILDS }}
          COPY_SLACK_WEBHOOK_NIGHTLY_BUILDS: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_BUILDS }}
          COPY_SONATYPE_PUBLISHING_TYPE: ${{ secrets.SONATYPE_PUBLISHING_TYPE }}
          COPY_STARTER_KIT_COORDINATOR_APP_PRIVATE_KEY: ${{ secrets.STARTER_KIT_COORDINATOR_APP_PRIVATE_KEY }}
          COPY_TEST_RUN_INGEST_TOKEN_DEV: ${{ secrets.TEST_RUN_INGEST_TOKEN_DEV }}
          COPY_UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          file=$(mktemp)
          trap 'rm -f "$file"' EXIT
          # Names only in the log; secrets that are not set are skipped.
          jq -n 'env | with_entries(select(.key | startswith("COPY_")) | .key |= ltrimstr("COPY_") | select(.value != ""))' > "$file"
          echo "Copying $(jq length "$file") secrets: $(jq -r 'keys | join(" ")' "$file")"
          "$RUNNER_TEMP/doppler" secrets upload "$file" > /dev/null
          echo "Doppler now has: $("$RUNNER_TEMP/doppler" secrets --only-names --json | jq -r 'keys | join(" ")')"
