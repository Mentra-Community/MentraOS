name: E2E Setup Checks

on:
  pull_request:
    paths:
      - "tools/mentra-e2e/**"
      - "cloud-v2/packages/core/src/types/test-run.types.ts"
      - "cloud-v2/bun.lock"
      - ".github/scripts/request-e2e-routine*"
      - ".github/workflows/request-e2e-routine.yml"
      - "mobile/scripts/install-ios-mac.mjs"
      - "mobile/scripts/install-ios-mac.test.mjs"
      - "mobile/ci/pr-ios/mac_installer.py"
      - "mobile/ci/pr-ios/test_mac_installer.py"
      - ".github/workflows/e2e-setup-checks.yml"
  push:
    branches: [dev]
    paths:
      - "tools/mentra-e2e/**"
      - "cloud-v2/packages/core/src/types/test-run.types.ts"
      - "cloud-v2/bun.lock"
      - ".github/scripts/request-e2e-routine*"
      - ".github/workflows/request-e2e-routine.yml"
      - "mobile/scripts/install-ios-mac.mjs"
      - "mobile/scripts/install-ios-mac.test.mjs"
      - "mobile/ci/pr-ios/mac_installer.py"
      - "mobile/ci/pr-ios/test_mac_installer.py"
      - ".github/workflows/e2e-setup-checks.yml"

permissions:
  contents: read

jobs:
  test:
    name: Verify routine evidence and Mac installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install canonical result schema dependencies
        working-directory: cloud-v2
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: python3 -m unittest discover -s tools/mentra-e2e -p test_mac_ci.py -v
      - name: Verify January setup with fake hardware
        run: python3 -m unittest discover -s tools/mentra-e2e/adapters/day1-setup -p 'test_*.py' -v
      - run: node --test mobile/scripts/install-ios-mac.test.mjs
      - run: python3 mobile/ci/pr-ios/test_mac_installer.py
      - name: Verify routine lifecycle, firmware assertions and request guards
        run: |
          bun test tools/mentra-e2e/runner/lifecycle.test.ts tools/mentra-e2e/runner/firmware-profile.test.ts tools/mentra-e2e/runner/firmware-state-cli.test.ts tools/mentra-e2e/runner/ci-request.test.ts tools/mentra-e2e/runner/test-run-publisher.test.ts
          bun test tools/mentra-e2e/runner/ota-state.test.ts tools/mentra-e2e/runner/ota-legacy-route.test.ts tools/mentra-e2e/runner/return-observer.test.ts tools/mentra-e2e/runner/day1-run-exporter.test.ts
          bun test tools/mentra-e2e/runner/ota-customer-sequence.test.ts tools/mentra-e2e/runner/ota-recording.test.ts tools/mentra-e2e/runner/return-collector.test.ts tools/mentra-e2e/runner/return-app-observer.test.ts tools/mentra-e2e/runner/ci-run-exporter.test.ts
          node --test .github/scripts/request-e2e-routine.test.mjs

  native-recorder:
    name: Verify native recorder timing
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Verify generated frames without screen capture or devices
        run: bun test tools/mentra-e2e/runner/recorder-writer.test.ts
