name: Console build

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/websites/console/**"
  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/websites/console/**"

concurrency:
  group: console-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build-console:
    name: Build cloud/websites/console
    uses: ./.github/workflows/reusable-bun-build.yml
    with:
      working_directory: cloud/websites/console
      lockfile: cloud/websites/console/bun.lock
      bun_version: latest
      install_args: --frozen-lockfile
      build_script: build
      checkout_fetch_depth: 1

  comment-on-failure:
    name: Comment on failure
    if: failure() && github.event_name == 'pull_request'
    needs: [build-console]
    uses: ./.github/workflows/reusable-pr-comment.yml
    with:
      message: |
        Console build failed.
        Workflow: ${{ github.workflow }}
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        Tail of build log:
        ```
        ${{ needs.build-console.outputs.build_snippet }}
        ```
