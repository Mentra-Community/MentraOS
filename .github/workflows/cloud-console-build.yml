name: Console build

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/websites/console/**"
  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "cloud/websites/console/**"

concurrency:
  group: console-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-console:
    name: Build cloud/websites/console
    uses: ./.github/workflows/reusable-bun-build.yml
    with:
      working_directory: cloud/websites/console
      lockfile: cloud/websites/console/bun.lock
      bun_version: latest
      install_args: --frozen-lockfile
      build_script: build
      checkout_fetch_depth: 1
