name: Mobile App Android Build

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mentra-app-android-build.yml"
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Cancel a branch's in-flight build when a newer commit is pushed to it.
# Scoped per-ref so branches never cancel each other; keeps the runner
# queue from filling with superseded builds.
concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    # Blacksmith 8 vCPU / 32 GB: this is the long-pole check on every mobile PR
    # (~17 min of assembleRelease on 4 vCPU). The Expo plugin already sets
    # -Xmx8192m, which is tight on the 16 GB box and leaves Gradle
    # under-paralleled. Stays off the Mac minis so iOS keeps that capacity.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_AR99_RELEASE_DEVELOPER_ID: ${{ secrets.EXPO_PUBLIC_AR99_RELEASE_DEVELOPER_ID }}
      EXPO_PUBLIC_AR99_RELEASE_CLIENT_KEY: ${{ secrets.EXPO_PUBLIC_AR99_RELEASE_CLIENT_KEY }}
      # Compile-check APKs are phone sideloads. Full ABI belongs on the
      # coordinated release workflow, not on this compile-check workflow.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

    steps:
      - name: Update PR comment - Build started
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- pr-review-helper -->';
            const comment = comments.data.find(c => c.body.includes(marker));
            if (!comment) return;

            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            // Check for existing working build link to preserve
            const existingDownloadMatch = comment.body.match(/\[📥 \*\*Download APK\*\*\]\((https:\/\/github\.com[^)]+\.apk)\)/);
            const existingShaMatch = comment.body.match(/✅ \*\*Ready to test!\*\* \(commit `([a-f0-9]+)`\)/);

            let buildStatus = `### 📱 Mobile App Build\n⏳ **Building...** (commit \`${sha}\`)`;

            // If there's a previous working build, show it
            if (existingDownloadMatch && existingShaMatch && existingShaMatch[1] !== sha) {
              buildStatus += `\n\n📦 **Previous build:** (commit \`${existingShaMatch[1]}\`) - [📥 **Download APK**](${existingDownloadMatch[1]})`;
            }

            const newBody = comment.body.replace(
              /<!-- android-build-status -->[\s\S]*?<!-- \/android-build-status -->/,
              `<!-- android-build-status -->\n${buildStatus}\n<!-- /android-build-status -->`
            );

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body: newBody
            });

      - name: Get cache week number
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The retired `tools` package download is no longer a valid ZIP.
          # Gradle installs the project's platform/build-tools/NDK versions.
          packages: platform-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Scope by runner.environment: a cache saved on a self-hosted Linux
          # runner stores absolute symlink paths (/home/mentra/...) that break
          # tar-restore on a github-hosted runner (/home/runner/...).
          key: gradle-${{ runner.environment }}-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.environment }}-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-
            gradle-${{ runner.environment }}-${{ runner.os }}-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.environment }}-${{ runner.os }}-${{ hashFiles('mobile/bun.lock') }}
          restore-keys: |
            bun-${{ runner.environment }}-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./mobile
        run: bun install

      - name: Setup environment
        working-directory: ./mobile
        # Copy the dummy .env, then overwrite the Mapbox runtime token line with
        # the real public token (pk.…). app.config.ts bakes it into the Android
        # manifest (com.mapbox.token) for the Nav SDK.
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_MOBILE_PRD }}
        run: |
          # Create .env from example (Expo reads from mobile/.env, not android/.env)
          cp .env.example .env
          # Pin which cloud this binary talks to (OS-1875).
          #
          # main is production-configured; dev, PRs and feature branches use dev
          # cloud. Nothing uploads from this workflow, so these are compile checks,
          # but they should still match the environment they claim to check.
          #
          # .env.example ships dev URLs so a local checkout builds with no setup.
          # A lane that produces a distributable must not inherit that silently.
          # Fatal on release-producing events, warning on pull_request, matching the
          # Sentry DSN rule (OS-1827).
          case "${{ github.ref_name }}" in
            main) CLOUD_ENV="prod" ;;
            *) CLOUD_ENV="dev" ;;
          esac
          case "$CLOUD_ENV" in
            dev)
              CLOUD_CORE="https://core.dev.us-west-2.mentraglass.com"
              CLOUD_RT="https://runtime.dev.us-west-2.mentraglass.com"
              ;;
            staging)
              CLOUD_CORE="https://core.staging.us-west-2.mentraglass.com"
              CLOUD_RT="https://runtime.staging.us-west-2.mentraglass.com"
              ;;
            prod)
              CLOUD_CORE="https://core.us-west-2.mentraglass.com"
              CLOUD_RT="https://runtime.us-west-2.mentraglass.com"
              ;;
            *)
              CLOUD_CORE=""
              CLOUD_RT=""
              ;;
          esac
          if [ -n "$CLOUD_CORE" ]; then
            sed -e "s|^EXPO_PUBLIC_BUILD_ENV=.*|EXPO_PUBLIC_BUILD_ENV=$CLOUD_ENV|" \
                -e "s|^EXPO_PUBLIC_CLOUD_CORE_URL=.*|EXPO_PUBLIC_CLOUD_CORE_URL=$CLOUD_CORE|" \
                -e "s|^EXPO_PUBLIC_CLOUD_RUNTIME_URL=.*|EXPO_PUBLIC_CLOUD_RUNTIME_URL=$CLOUD_RT|" \
                .env > .env.tmp && mv .env.tmp .env
            # Make the pin authoritative for every later step. release:android /
            # release:ios call setBuildEnv(), which keeps any value already
            # present in the environment over the .env file (standard dotenv
            # precedence, deliberately relied on for the signing credentials).
            # These jobs run on persistent self-hosted runners, so a stale
            # runner-level EXPO_PUBLIC_CLOUD_* or EXPO_PUBLIC_BUILD_ENV would
            # otherwise outrank the values written above, Expo would bundle the
            # inherited endpoint, and validateReleaseArchive() would compare the
            # bundle against that same inherited process env and pass. GITHUB_ENV
            # takes precedence over the runner's inherited environment, so the
            # three keys agree from here on.
            {
              echo "EXPO_PUBLIC_BUILD_ENV=$CLOUD_ENV"
              echo "EXPO_PUBLIC_CLOUD_CORE_URL=$CLOUD_CORE"
              echo "EXPO_PUBLIC_CLOUD_RUNTIME_URL=$CLOUD_RT"
            } >> "$GITHUB_ENV"
            echo "Cloud backend pinned to $CLOUD_ENV ($CLOUD_CORE)"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::Unrecognised cloud env '$CLOUD_ENV'; this PR build keeps the dev backend (OS-1875)."
          else
            echo "::error::Unrecognised cloud env '$CLOUD_ENV'. A distributable build must pin its backend (OS-1875)."
            exit 1
          fi
          if [ -n "$MAPBOX_PUBLIC_TOKEN" ]; then
            # Portable in-place edit. This job runs on bare `self-hosted`, which
            # may be Linux (GNU sed); `sed -i ''` is BSD/macOS-only and on GNU sed
            # treats the script as a filename ("can't read s|...|" → exit 2). The
            # temp-file form works on both. (The iOS/staging jobs are macOS-pinned.)
            sed "s|^EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=.*|EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=$MAPBOX_PUBLIC_TOKEN|" .env > .env.tmp && mv .env.tmp .env
          else
            echo "::warning::MAPBOX_PUBLIC_TOKEN secret not set — Android build will use the dummy token and on-device navigation will not work."
          fi
          # .env.example ships an empty EXPO_PUBLIC_SENTRY_DSN and SentrySetup.tsx
          # returns early on an empty DSN *without logging*, so every CI build has
          # shipped with crash reporting silently off (OS-1827). Warn rather than
          # fail, but never be silent about it again.
          # A release-producing lane must never ship a green build with crash
          # reporting silently off -- that is the exact failure OS-1827 exists to
          # remove. pull_request runs legitimately have no secrets (forks, and
          # secrets are not exposed to PRs from outside collaborators), so those
          # still warn and continue. Everything else -- push to a release branch,
          # workflow_dispatch, staging -- is fatal.
          #
          # Note the curl below keeps `|| true` on purpose: a network failure or a
          # changed response shape lands here as an empty DSN and is reported with
          # an actionable message, rather than killing the step with a bare
          # non-zero exit that says nothing about crash reporting.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SENTRY_DSN_REQUIRED=false
          else
            SENTRY_DSN_REQUIRED=true
          fi
          sentry_dsn_unavailable() {
            if [ "$SENTRY_DSN_REQUIRED" = "true" ]; then
              echo "::error::$1 A release build must have crash reporting (OS-1827)."
              exit 1
            fi
            echo "::warning::$1 This PR build will have no crash reporting (OS-1827)."
          }
          if [ -n "$DOPPLER_TOKEN" ]; then
            # curl, not the Doppler CLI action: that action verifies its own
            # download with gpg and hard-fails where gpg is absent, which is the
            # case on our self-hosted macOS runners. curl needs nothing that is
            # not already on every runner. The single-secret endpoint keeps the
            # rest of the config (MAPBOX_DOWNLOADS_TOKEN) out of the shell; a
            # service token implies its own project and config.
            SENTRY_DSN_RESPONSE="$(curl -sS --fail-with-body --retry 3 --retry-connrefused \
              -u "$DOPPLER_TOKEN:" \
              "https://api.doppler.com/v3/configs/config/secret?name=EXPO_PUBLIC_SENTRY_DSN" || true)"
            # A DSN contains no double quote, so this extraction is exact.
            SENTRY_DSN_VALUE="$(printf '%s' "$SENTRY_DSN_RESPONSE" | sed -n 's/.*"computed":"\([^"]*\)".*/\1/p')"
            echo "::add-mask::$SENTRY_DSN_VALUE"
            if [ -n "$SENTRY_DSN_VALUE" ]; then
              # Same portable temp-file form as the Mapbox edit above: this job
              # runs on Linux (GNU sed), where `sed -i ''` exits 2.
              sed "s|^EXPO_PUBLIC_SENTRY_DSN=.*|EXPO_PUBLIC_SENTRY_DSN=$SENTRY_DSN_VALUE|" .env > .env.tmp && mv .env.tmp .env
            else
              sentry_dsn_unavailable "Doppler returned an empty EXPO_PUBLIC_SENTRY_DSN."
            fi
          else
            sentry_dsn_unavailable "DOPPLER_TOKEN_MOBILE_PRD secret not set."
          fi

      - name: Run Expo prebuild
        working-directory: ./mobile
        run: bun expo prebuild --platform android

      - name: Fix React Native symlinks
        working-directory: ./mobile
        run: |
          if [ -f "./fix-react-native-symlinks.sh" ]; then
            chmod +x ./fix-react-native-symlinks.sh
            ./fix-react-native-symlinks.sh
          fi

      - name: Inject release signing key
        uses: ./.github/actions/inject-signing
        with:
          mobile: "true"
          upload-keystore-b64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          upload-store-password: ${{ secrets.MENTRAOS_UPLOAD_STORE_PASSWORD }}
          upload-key-password: ${{ secrets.MENTRAOS_UPLOAD_KEY_PASSWORD }}
          upload-key-alias: ${{ secrets.MENTRAOS_UPLOAD_KEY_ALIAS }}

      - name: Build Android Release APK
        id: gradle-build
        working-directory: ./mobile/android
        # --max-workers matches the 8 vCPU runner. Do not -x lintVitalAnalyze*
        # / lintVitalReport*: assembleRelease still runs lintVitalRelease, which
        # then fails looking for those tasks' output files. Android lint stays
        # on this job; Mobile App Quality Checks is TypeScript/Jest only.
        run: ./gradlew assembleRelease --build-cache --parallel --max-workers=8 -x test
        continue-on-error: true
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          # Mapbox Downloads:Read secret token (sk.…). Authenticates the private
          # Maven repo so Gradle can fetch the Nav SDK (com.mapbox.navigationcore)
          # binaries. Build-time only — never written into the APK.
          # Passed under BOTH names: our hand-written repo block reads
          # MAPBOX_DOWNLOADS_TOKEN, while the @rnmapbox/maps-generated repo block
          # (allprojects, in mobile/android/build.gradle) reads
          # RNMAPBOX_MAPS_DOWNLOAD_TOKEN. The generated block applies to ALL
          # modules incl. :mentra-crust, so without the second name it adds the
          # repo UNAUTHENTICATED → "Could not find navigationcore".
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

      - name: Retry build with clean cache (if first attempt failed)
        if: steps.gradle-build.outcome == 'failure'
        working-directory: ./mobile/android
        run: |
          echo "First build failed, cleaning Gradle cache and retrying..."
          # Stop Gradle daemons first to release file locks
          ./gradlew --stop || true
          rm -rf ~/.gradle/caches ~/.gradle/wrapper || true
          ./gradlew assembleRelease --build-cache --parallel --max-workers=8 -x test
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

      - name: Fail if both builds failed
        if: steps.gradle-build.outcome == 'failure'
        run: |
          # Check if retry succeeded by looking for the APK
          if [ ! -f "mobile/android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Both build attempts failed"
            exit 1
          fi

      - name: Verify release signature (not debug)
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::Release APK is DEBUG-signed — upload keystore was not injected."
            exit 1
          fi
          echo "Release APK is signed with the production upload key."

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK to pr-builds release
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const apkName = `mobile-pr-${prNumber}-${sha}.apk`;
            const apkPath = 'mobile/android/app/build/outputs/apk/release/app-release.apk';

            // Get the pr-builds release
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'pr-builds'
            });

            // Delete existing asset with same name if it exists
            for (const asset of release.data.assets) {
              if (asset.name === apkName) {
                console.log(`Deleting existing asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
                break;
              }
            }

            // Read the APK file
            const apkData = fs.readFileSync(apkPath);

            // Upload the APK
            console.log(`Uploading ${apkName} (${apkData.length} bytes)...`);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: apkName,
              data: apkData
            });

            console.log(`Successfully uploaded ${apkName}`);

      - name: Cleanup old release assets
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'pr-builds'
              });

              for (const asset of release.data.assets) {
                const createdAt = new Date(asset.created_at);
                if (createdAt < sevenDaysAgo) {
                  console.log(`Deleting old asset: ${asset.name} (created ${asset.created_at})`);
                  await github.rest.repos.deleteReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id
                  });
                }
              }
            } catch (error) {
              console.log('Cleanup skipped:', error.message);
            }

      - name: Update PR comment - Build succeeded
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- pr-review-helper -->';
            const comment = comments.data.find(c => c.body.includes(marker));
            if (!comment) return;

            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const apkName = `mobile-pr-${prNumber}-${sha}.apk`;
            const downloadUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/pr-builds/${apkName}`;

            const buildStatus = `### 📱 Mobile App Build\n✅ **Ready to test!** (commit \`${sha}\`)\n\n[📥 **Download APK**](${downloadUrl})`;

            const newBody = comment.body.replace(
              /<!-- android-build-status -->[\s\S]*?<!-- \/android-build-status -->/,
              `<!-- android-build-status -->\n${buildStatus}\n<!-- /android-build-status -->`
            );

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body: newBody
            });

      - name: Update PR comment - Build failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- pr-review-helper -->';
            const comment = comments.data.find(c => c.body.includes(marker));
            if (!comment) return;

            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Check if there was a previous working build
            const previousDownloadMatch = comment.body.match(/\[📥 \*\*Download APK\*\*\]\((https:\/\/github\.com[^)]+\.apk)\)/);
            const previousShaMatch = comment.body.match(/✅ \*\*Ready to test!\*\* \(commit `([a-f0-9]+)`\)/)
                                  || comment.body.match(/📦 \*\*Previous build:\*\* \(commit `([a-f0-9]+)`\)/);

            let buildStatus = `### 📱 Mobile App Build\n❌ **Build failed** (commit \`${sha}\`) - [View logs](${runUrl})`;

            if (previousDownloadMatch && previousShaMatch && previousShaMatch[1] !== sha) {
              buildStatus += `\n\n📦 **Previous build:** (commit \`${previousShaMatch[1]}\`) - [📥 **Download APK**](${previousDownloadMatch[1]})`;
            }

            const newBody = comment.body.replace(
              /<!-- android-build-status -->[\s\S]*?<!-- \/android-build-status -->/,
              `<!-- android-build-status -->\n${buildStatus}\n<!-- /android-build-status -->`
            );

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body: newBody
            });
