name: Cloud V2 Validation

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - "cloud-v2/**"
      - "sdk/miniapp-cli/**"
      - ".dockerignore"
      - ".github/workflows/cloud-v2-validation.yml"
  workflow_dispatch:

concurrency:
  group: cloud-v2-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deployment-image:
    name: Build deployment image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Exercise the same isolated dependency layer used by Porter and GHCR.
      # Installing in the checkout cannot detect missing workspace COPY entries.
      - name: Build Cloud V2 Docker image
        run: docker build --progress=plain -f cloud-v2/docker/Dockerfile .

  validate:
    name: Typecheck, test, and build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match the Cloud V2 deployment image.
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cloud-v2-${{ hashFiles('cloud-v2/bun.lock', 'sdk/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cloud-v2-

      - name: Install dependencies
        working-directory: cloud-v2
        run: bun install --frozen-lockfile

      - name: Install Miniapp CLI dependencies
        working-directory: sdk
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test enterprise deployment helpers
        working-directory: cloud-v2
        run: |
          node --test deploy/azure/enterprise-reference/scripts/*.test.mjs
          python3 -m unittest discover -s deploy/azure/enterprise-reference/installer -p 'test_*.py'

      - name: Test Miniapp CLI
        working-directory: sdk
        run: bun test miniapp-cli/src

      - name: Typecheck Miniapp CLI
        working-directory: sdk/miniapp-cli
        run: bun run tsc --noEmit -p tsconfig.json

      - name: Run package tests
        working-directory: cloud-v2
        # Keep CI deterministic and local: integration, soak, and external-service
        # tests under cloud-v2/tests require a separately designed environment.
        # Run before typecheck creates dist output, which would duplicate tests.
        run: bun test packages

      - name: Run website sign-in tests
        working-directory: cloud-v2
        # Mentra's sign-in page, and the portal sites' sign-in, sign-out and
        # Pages relay. Browserless: React views render to static markup.
        run: |
          bun test --max-concurrency=1 \
            websites/account/src \
            websites/account/functions \
            websites/portal/src \
            websites/portal/functions \
            websites/admin/functions \
            websites/admin/src/lib/session.test.ts \
            websites/admin/src/lib/admin-access.test.ts \
            websites/admin/src/lib/shared-react.test.ts \
            websites/admin/src/components/signed-out.test.tsx \
            websites/admin/src/pages/workspaces.test.tsx \
            websites/admin/src/pages/operator-keys.test.tsx

      - name: Typecheck backend packages
        working-directory: cloud-v2
        run: bun run typecheck

      - name: Typecheck websites
        working-directory: cloud-v2
        run: |
          bun run typecheck:console
          bun run typecheck:admin
          bun run typecheck:portal
          bun run typecheck:account

      - name: Build websites
        working-directory: cloud-v2
        run: |
          bun run build:console
          bun run build:admin
          bun run build:portal
          bun run build:account

  workspace-integration:
    name: Sign-in and workspace integration tests (Mongo 7 replica set)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match the Cloud V2 deployment image.
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cloud-v2-${{ hashFiles('cloud-v2/bun.lock', 'sdk/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cloud-v2-

      - name: Install dependencies
        working-directory: cloud-v2
        run: bun install --frozen-lockfile

      # Workspace administration uses multi-document transactions, which need a
      # replica set. A single node is enough. The port is published on the
      # loopback interface only: `--bind_ip_all` binds inside the container,
      # never on the runner's network.
      - name: Start Mongo 7 as a single-node replica set
        run: |
          docker run -d --name cloud-v2-test-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          # Mirrors the healthcheck in cloud-v2/docker-compose.test.yml: initiate
          # the set on first contact, then wait until this node is primary.
          for attempt in $(seq 1 60); do
            if docker exec cloud-v2-test-mongo mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"; then
              echo "Mongo replica set rs0 is primary (attempt ${attempt})"
              exit 0
            fi
            sleep 2
          done
          echo "Mongo did not become primary in time" >&2
          docker logs cloud-v2-test-mongo >&2
          exit 1

      - name: Run sign-in and workspace integration tests
        working-directory: cloud-v2
        env:
          # Every one of these tests reads this variable (through
          # tests/support/local-mongo.ts, which refuses anything that is not a
          # plain loopback URL) and works in its own randomly named database.
          CLOUD_V2_TEST_MONGO_URL: mongodb://127.0.0.1:27017
        # Only these suites: the rest of cloud-v2/tests needs services CI does
        # not provide (for example Redis, Soniox and R2).
        run: |
          bun test --max-concurrency=1 --timeout 30000 \
            tests/auth.mentra-user-exchange.integration.test.ts \
            tests/idp-tokens.integration.test.ts \
            tests/oidc-provider.integration.test.ts \
            tests/oidc-clients.integration.test.ts \
            tests/oidc-interaction.integration.test.ts \
            tests/signin-sessions.integration.test.ts \
            tests/portal-signin.integration.test.ts \
            tests/principal-auth.integration.test.ts \
            tests/signin-revocation.integration.test.ts \
            tests/enterprise-portal.integration.test.ts \
            tests/private-cloud-signin.integration.test.ts \
            tests/signin-security.integration.test.ts \
            tests/admin-reports.integration.test.ts \
            tests/workspace-models.integration.test.ts \
            tests/workspace-service.integration.test.ts \
            tests/workspace-invitations.integration.test.ts \
            tests/workspace-credentials.integration.test.ts \
            tests/workspaces-api.integration.test.ts \
            tests/admin-capabilities.integration.test.ts \
            tests/workspaces-internal-api.integration.test.ts \
            tests/legacy-admin-keys.integration.test.ts \
            tests/account-deletion.integration.test.ts

      - name: Show Mongo logs after a failure
        if: failure()
        run: docker logs cloud-v2-test-mongo

  cosmos-upgrade:
    name: Core install and upgrade on Azure Cosmos DB
    # Private Cloud runs Core on Azure Cosmos DB for MongoDB, which refuses some
    # things MongoDB allows: for example, it cannot add a unique index to a
    # collection that already holds documents. Start this change's Core on a
    # fresh database, and on one the base branch's Core left behind with every
    # collection populated, as a running deployment's upgrade would.
    # Azure trusts this repository's pull requests and dev (ci-database/main.bicep);
    # forks, Dependabot and manual runs on other branches skip this job.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # cloud-v2/deploy/azure/ci-database/main.bicep
      COSMOS_RESOURCE_GROUP: rg-mentra-ci-core-database
      COSMOS_ACCOUNT: mentra-ci-core-cosmos
      CHECK: packages/core/src/scripts/database-upgrade-check.ts
    steps:
      # A pull_request checkout is the merge commit; its first parent is the
      # base branch the change lands on.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match the Cloud V2 deployment image.
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cloud-v2-${{ hashFiles('cloud-v2/bun.lock', 'sdk/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cloud-v2-

      - name: Install dependencies for this change and its base
        run: |
          set -euo pipefail
          (cd cloud-v2 && bun install --frozen-lockfile)
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          (cd "$RUNNER_TEMP/base/cloud-v2" && bun install --frozen-lockfile)

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CORE_DATABASE_CI_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.CORE_DATABASE_CI_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CORE_DATABASE_CI_AZURE_SUBSCRIPTION_ID }}

      - name: Require the CI account to match the Private Cloud database
        run: |
          set -euo pipefail
          expected=$(az bicep build --file cloud-v2/deploy/azure/enterprise-reference/main.bicep --stdout | jq -c '
            [(.resources | if type == "object" then .[] else .[] end)
              | select(.type == "Microsoft.DocumentDB/databaseAccounts")
              | {kind, serverVersion: .properties.apiProperties.serverVersion,
                 capabilities: ([.properties.capabilities[].name] | sort)}]')
          actual=$(az cosmosdb show --resource-group "$COSMOS_RESOURCE_GROUP" --name "$COSMOS_ACCOUNT" | jq -c '
            [{kind, serverVersion: .apiProperties.serverVersion, capabilities: ([.capabilities[].name] | sort)}]')
          if [[ "$expected" != "$actual" ]]; then
            echo "::error title=CI database differs from Private Cloud::Private Cloud deploys $expected but $COSMOS_ACCOUNT is $actual. Update cloud-v2/deploy/azure/ci-database/main.bicep and redeploy it."
            exit 1
          fi

      - name: Create this run's databases
        run: |
          set -euo pipefail
          url=$(az cosmosdb keys list --type connection-strings --resource-group "$COSMOS_RESOURCE_GROUP" \
            --name "$COSMOS_ACCOUNT" --query "connectionStrings[0].connectionString" --output tsv)
          key=${url#*://*:}; key=${key%%@*}
          echo "::add-mask::$key"
          prefix="ci-$(date +%s)-${{ github.run_id }}-${{ github.run_attempt }}"
          # The same form Private Cloud gives Core: the database name before the options.
          {
            echo "ACCOUNT_URL=${url/\/\?//admin?}"
            echo "FRESH_URL=${url/\/\?//$prefix-fresh?}"
            echo "UPGRADE_URL=${url/\/\?//$prefix-upgrade?}"
          } >> "$GITHUB_ENV"

      - name: Drop databases left by cancelled runs
        working-directory: cloud-v2
        run: bun "$CHECK" sweep "$ACCOUNT_URL"

      - name: Install this change's Core on an empty database
        working-directory: cloud-v2
        run: |
          bun "$CHECK" start . "$FRESH_URL" || {
            echo "::error title=Core does not start on Cosmos DB::A new Private Cloud install of this change fails at Core startup. See the log above."
            exit 1
          }

      - name: Upgrade the base branch's Core, with data, to this change
        working-directory: cloud-v2
        run: |
          set -euo pipefail
          bun "$CHECK" start "$RUNNER_TEMP/base/cloud-v2" "$UPGRADE_URL"
          bun "$CHECK" seed "$UPGRADE_URL"
          bun "$CHECK" start . "$UPGRADE_URL" || {
            echo "::error title=Core upgrade fails on Cosmos DB::Existing Private Cloud deployments could not start this change's Core. Cosmos DB cannot, for example, add a unique index to a collection that already holds documents. See the log above."
            exit 1
          }

      - name: Drop this run's databases
        if: always() && env.FRESH_URL != ''
        working-directory: cloud-v2
        run: |
          bun "$CHECK" drop "$FRESH_URL"
          bun "$CHECK" drop "$UPGRADE_URL"
