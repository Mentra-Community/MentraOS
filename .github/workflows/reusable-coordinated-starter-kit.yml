name: Reusable Coordinated Starter Kit

# Requests the exact Starter Kit example release for one coordinated release
# plan and verifies the immutable result the Starter Kit repository publishes.
# Shared by the coordinated dev and beta releases and by the production example
# candidates, which differ only in the Starter Kit branch and release container.

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      release_plan_artifact:
        required: true
        type: string
      ota_manifest_url:
        required: true
        type: string
      ota_manifest_sha256:
        required: true
        type: string
    outputs:
      result_artifact:
        value: ${{ jobs.starter-kit.outputs.result_artifact }}
      result_url:
        value: ${{ jobs.starter-kit.outputs.result_url }}
      release_url:
        value: ${{ jobs.starter-kit.outputs.release_url }}
      run_url:
        value: ${{ jobs.starter-kit.outputs.run_url }}
      react_native_apk_name:
        value: ${{ jobs.starter-kit.outputs.react_native_apk_name }}
      react_native_apk_url:
        value: ${{ jobs.starter-kit.outputs.react_native_apk_url }}

permissions:
  actions: read
  contents: read

jobs:
  starter-kit:
    name: Build coordinated Starter Kit examples
    # Runs only after the Mentra beta is finalized: the example is its own
    # release notion built against a complete beta, never a gate on it.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      result_artifact: ${{ steps.coordinates.outputs.result_artifact }}
      result_url: ${{ steps.coordinates.outputs.result_url }}
      release_url: ${{ steps.coordinates.outputs.release_url }}
      run_url: ${{ steps.coordinates.outputs.run_url }}
      react_native_apk_name: ${{ steps.coordinates.outputs.react_native_apk_name }}
      react_native_apk_url: ${{ steps.coordinates.outputs.react_native_apk_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: release-input/plan

      - name: Create Starter Kit request token
        id: starter-kit-request-token
        if: vars.STARTER_KIT_COORDINATOR_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.STARTER_KIT_COORDINATOR_APP_ID }}
          private-key: ${{ secrets.STARTER_KIT_COORDINATOR_APP_PRIVATE_KEY }}
          owner: Mentra-Community
          repositories: |
            MentraOS
            Mentra-Bluetooth-SDK-Starter-Kit
          permission-actions: write
          permission-contents: write

      - name: Request the exact Starter Kit release
        id: request
        env:
          STARTER_KIT_TOKEN: ${{ steps.starter-kit-request-token.outputs.token || secrets.STARTER_KIT_COORDINATOR_TOKEN || secrets.MENTRA_BLUETOOTH_SDK_IOS_PUSH_TOKEN }}
          STARTER_KIT_REPOSITORY: Mentra-Community/Mentra-Bluetooth-SDK-Starter-Kit
          OTA_MANIFEST_URL: ${{ inputs.ota_manifest_url }}
          OTA_MANIFEST_SHA256: ${{ inputs.ota_manifest_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "$STARTER_KIT_TOKEN" ]]; then
            echo "A Starter Kit GitHub App token is required in STARTER_KIT_COORDINATOR_TOKEN." >&2
            exit 1
          fi
          export GH_TOKEN="$STARTER_KIT_TOKEN"

          plan=release-input/plan/release-plan.json
          identity=$(jq -er .releaseIdentity "$plan")
          release_set_id=$(jq -er .releaseSetId "$plan")
          family_base=$(jq -er .familyBaseVersion "$plan")
          channel=$(jq -er .channel "$plan")
          source_commit=$(jq -er .sourceCommit "$plan")
          # The Starter Kit mirrors the MentraOS branches: dev and beta examples
          # come from dev and staging, and the production example candidates
          # come from main, tagged sdk-X.Y.Z in their own non-prerelease
          # GitHub release. They never reach a public store from here.
          case "$channel" in
            dev) target_branch=dev ;;
            beta) target_branch=staging ;;
            production) target_branch=main ;;
            *) echo "Unsupported Starter Kit channel $channel" >&2; exit 1 ;;
          esac

          # The Starter Kit repository builds every coordinated example from its
          # own channel head, so nothing about it is frozen in the Mentra plan.
          # A retry must still resend the head the earlier attempt used: the
          # Starter Kit only accepts a byte-identical payload whose head is the
          # parent of the candidate it already created. Recover that head from
          # the candidate branch, or from the release tag if the candidate was
          # already merged and the branch deleted, before sampling a new head.
          candidate_parent=$(gh api "repos/$STARTER_KIT_REPOSITORY/commits/coordinated/$identity" --jq '.parents[0].sha' 2>/dev/null || true)
          if [[ ! "$candidate_parent" =~ ^[0-9a-f]{40}$ ]]; then
            candidate_parent=$(gh api "repos/$STARTER_KIT_REPOSITORY/commits/sdk-$identity" --jq '.parents[0].sha' 2>/dev/null || true)
          fi
          if [[ "$candidate_parent" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Reusing the Starter Kit head $candidate_parent recorded by the earlier request for $identity"
            expected_head="$candidate_parent"
          else
            expected_head=$(git ls-remote "https://github.com/$STARTER_KIT_REPOSITORY.git" "refs/heads/$target_branch" | awk '{print $1}')
          fi
          [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]]
          payload=$(jq -cn \
            --arg releaseSetId "$release_set_id" \
            --arg releaseIdentity "$identity" \
            --arg familyBaseVersion "$family_base" \
            --arg channel "$channel" \
            --arg sourceCommit "$source_commit" \
            --arg coordinatorRunUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg manifestUrl "$OTA_MANIFEST_URL" \
            --arg manifestSha256 "$OTA_MANIFEST_SHA256" \
            --arg expectedStarterKitHead "$expected_head" \
            --arg correlationId "mentraos-${GITHUB_RUN_ID}" \
            '{
              schemaVersion: 1,
              releaseSetId: $releaseSetId,
              releaseIdentity: $releaseIdentity,
              familyBaseVersion: $familyBaseVersion,
              channel: $channel,
              correlationId: $correlationId,
              mentraos: {sourceCommit: $sourceCommit, coordinatorRunUrl: $coordinatorRunUrl},
              ota: {manifestUrl: $manifestUrl, manifestSha256: $manifestSha256},
              packages: {
                "@mentra/bluetooth-sdk": $releaseIdentity,
                "@mentra/engine": $releaseIdentity
              },
              expectedStarterKitHead: $expectedStarterKitHead
            }')

          run_title="Coordinated example $channel $identity"
          run_id=""
          run_url=""
          result_name="starter-kit-release-$identity.json"
          if [[ "$channel" == "production" ]]; then
            container_tag="sdk-$identity"
          else
            container_tag="sdk-builds-v$family_base"
          fi
          result_url="https://github.com/$STARTER_KIT_REPOSITORY/releases/download/$container_tag/$result_name"

          if ! curl --fail --silent --show-error --location "$result_url" --output /dev/null 2>&1; then
            run_json=$(gh run list --repo "$STARTER_KIT_REPOSITORY" \
              --workflow coordinated-example-release.yml --event workflow_dispatch \
              --branch "$target_branch" --limit 100 \
              --json databaseId,displayTitle,status,url \
              --jq ".[] | select(.displayTitle == \"$run_title\" and .status != \"completed\")" \
              | head -1)
            dispatched_at=""
            if [[ -n "$run_json" ]]; then
              run_id=$(jq -r .databaseId <<< "$run_json")
              run_url=$(jq -r .url <<< "$run_json")
              echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
            else
              dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              gh workflow run coordinated-example-release.yml \
                --repo "$STARTER_KIT_REPOSITORY" \
                --ref "$target_branch" \
                --field channel="$channel" \
                --field payload="$payload"
            fi

            candidate_branch="coordinated/$identity"
            encoded_candidate_branch=$(jq -rn --arg value "$candidate_branch" '$value | @uri')
            candidate_sha=""
            for _ in {1..180}; do
              if [[ -z "$run_id" ]]; then
                run_json=$(gh run list --repo "$STARTER_KIT_REPOSITORY" \
                  --workflow coordinated-example-release.yml --event workflow_dispatch \
                  --branch "$target_branch" --limit 30 \
                  --json databaseId,displayTitle,createdAt,url \
                  --jq ".[] | select(.displayTitle == \"$run_title\" and .createdAt >= \"$dispatched_at\")" \
                  2>/dev/null | head -1 || true)
                if [[ -n "$run_json" ]]; then
                  run_id=$(jq -r .databaseId <<< "$run_json")
                  run_url=$(jq -r .url <<< "$run_json")
                  echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
                fi
              fi
              candidate_sha=""
              if branch_sha=$(gh api "repos/$STARTER_KIT_REPOSITORY/branches/$encoded_candidate_branch" \
                --jq .commit.sha 2>/dev/null) && [[ "$branch_sha" =~ ^[0-9a-f]{40}$ ]]; then
                candidate_sha="$branch_sha"
              fi
              [[ -n "$run_id" && -n "$candidate_sha" ]] && break
              if [[ -n "$run_id" ]]; then
                run_state=$(gh run view "$run_id" --repo "$STARTER_KIT_REPOSITORY" \
                  --json status,conclusion 2>/dev/null || true)
                status=$(jq -r '.status // empty' <<< "${run_state:-null}")
                if [[ "$status" == "completed" ]]; then
                  conclusion=$(jq -r '.conclusion // "unknown"' <<< "$run_state")
                  echo "Starter Kit run concluded $conclusion before creating $candidate_branch: $run_url" >&2
                  exit 1
                fi
              fi
              sleep 10
            done
            if [[ -z "$run_id" || -z "$candidate_sha" ]]; then
              echo "Starter Kit did not create $candidate_branch for $identity within 30 minutes." >&2
              exit 1
            fi
          fi

          {
            echo "identity=$identity"
            echo "release_set_id=$release_set_id"
            echo "source_commit=$source_commit"
            echo "target_branch=$target_branch"
            echo "result_name=$result_name"
            echo "container_tag=$container_tag"
            echo "result_url=$result_url"
            echo "run_url=$run_url"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for the immutable Starter Kit result
        env:
          RESULT_NAME: ${{ steps.request.outputs.result_name }}
          RESULT_URL: ${{ steps.request.outputs.result_url }}
          RUN_URL: ${{ steps.request.outputs.run_url }}
          # Public run metadata needs no cross-repository permissions. The job
          # token remains valid through this wait; the request App token expires
          # after one hour, before the full 105-minute wait can finish.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p starter-kit-result
          for _ in {1..630}; do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$RESULT_URL" \
              --output "starter-kit-result/$RESULT_NAME" 2>/dev/null; then
              exit 0
            fi
            if [[ -n "$RUN_URL" ]]; then
              # A transient API failure must not be mistaken for a failed build.
              run_state=$(gh api "repos/Mentra-Community/Mentra-Bluetooth-SDK-Starter-Kit/actions/runs/${RUN_URL##*/}" \
                --jq '{status,conclusion}' 2>/dev/null || true)
              if [[ "$(jq -r '.status // empty' <<< "${run_state:-null}")" == "completed" ]]; then
                conclusion=$(jq -r '.conclusion // "unknown"' <<< "$run_state")
                if [[ "$conclusion" != "success" ]]; then
                  echo "Starter Kit run concluded $conclusion: $RUN_URL" >&2
                  exit 1
                fi
              fi
            fi
            sleep 10
          done
          echo "Starter Kit did not publish $RESULT_NAME within 105 minutes." >&2
          exit 1

      - name: Create Starter Kit verification token
        id: starter-kit-verification-token
        if: vars.STARTER_KIT_COORDINATOR_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.STARTER_KIT_COORDINATOR_APP_ID }}
          private-key: ${{ secrets.STARTER_KIT_COORDINATOR_APP_PRIVATE_KEY }}
          owner: Mentra-Community
          repositories: |
            MentraOS
            Mentra-Bluetooth-SDK-Starter-Kit
          permission-contents: read
          permission-pull-requests: read

      - name: Verify the exact Starter Kit release
        id: coordinates
        env:
          STARTER_KIT_TOKEN: ${{ steps.starter-kit-verification-token.outputs.token || secrets.STARTER_KIT_COORDINATOR_TOKEN || secrets.MENTRA_BLUETOOTH_SDK_IOS_PUSH_TOKEN }}
          STARTER_KIT_REPOSITORY: Mentra-Community/Mentra-Bluetooth-SDK-Starter-Kit
          IDENTITY: ${{ steps.request.outputs.identity }}
          RELEASE_SET_ID: ${{ steps.request.outputs.release_set_id }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
          RESULT_NAME: ${{ steps.request.outputs.result_name }}
          CONTAINER_TAG: ${{ steps.request.outputs.container_tag }}
          RESULT_URL: ${{ steps.request.outputs.result_url }}
          RUN_URL: ${{ steps.request.outputs.run_url }}
        run: |
          set -euo pipefail
          if [[ -z "$STARTER_KIT_TOKEN" ]]; then
            echo "A Starter Kit GitHub App token is required in STARTER_KIT_COORDINATOR_TOKEN." >&2
            exit 1
          fi
          export GH_TOKEN="$STARTER_KIT_TOKEN"

          identity="$IDENTITY"
          release_set_id="$RELEASE_SET_ID"
          source_commit="$SOURCE_COMMIT"
          target_branch="$TARGET_BRANCH"
          result_name="$RESULT_NAME"
          container_tag="$CONTAINER_TAG"
          result_url="$RESULT_URL"
          run_url="$RUN_URL"
          result="starter-kit-result/$result_name"
          test -s "$result"
          [[ "$(jq -er .releaseSetId "$result")" == "$release_set_id" ]]
          [[ "$(jq -er .releaseIdentity "$result")" == "$identity" ]]
          [[ "$(jq -er .mentraos.sourceCommit "$result")" == "$source_commit" ]]
          jq -er '.starterKit.baseCommit | select(test("^[0-9a-f]{40}$"))' "$result" >/dev/null
          release_commit=$(jq -er '.starterKit.releaseCommit | select(test("^[0-9a-f]{40}$"))' "$result")
          merge_commit=$(jq -er '.starterKit.mergeCommit | select(test("^[0-9a-f]{40}$"))' "$result")
          pull_request_url=$(jq -er .starterKit.pullRequestUrl "$result")
          [[ "$(jq -er .starterKit.sourceTag "$result")" == "sdk-$identity" ]]
          pr_provenance=$(gh pr view "$pull_request_url" --repo "$STARTER_KIT_REPOSITORY" \
            --json url,state,headRefOid,baseRefName,mergeCommit)
          [[ "$(jq -r .url <<< "$pr_provenance")" == "$pull_request_url" ]]
          [[ "$(jq -r .state <<< "$pr_provenance")" == "MERGED" ]]
          [[ "$(jq -r .headRefOid <<< "$pr_provenance")" == "$release_commit" ]]
          [[ "$(jq -r .baseRefName <<< "$pr_provenance")" == "$target_branch" ]]
          [[ "$(jq -r .mergeCommit.oid <<< "$pr_provenance")" == "$merge_commit" ]]
          [[ "$(gh api "repos/$STARTER_KIT_REPOSITORY/git/ref/tags/sdk-$identity" --jq .object.sha)" == "$release_commit" ]]
          [[ "$(jq -er '.artifacts | length' "$result")" =~ ^(3|4)$ ]]
          if [[ -z "$run_url" ]]; then
            run_url=$(jq -er .starterKit.validationRunUrl "$result")
          fi

          release_id=$(gh api "repos/$STARTER_KIT_REPOSITORY/releases/tags/$container_tag" --jq .id)
          assets_json=$(gh api --paginate --slurp \
            "repos/$STARTER_KIT_REPOSITORY/releases/$release_id/assets?per_page=100" | jq -c add)
          result_asset=$(jq -c --arg name "$result_name" '.[] | select(.name == $name)' <<< "$assets_json")
          [[ -n "$result_asset" ]]
          [[ "$(jq -r .browser_download_url <<< "$result_asset")" == "$result_url" ]]
          [[ "$(jq -r .size <<< "$result_asset")" == "$(stat -c %s "$result")" ]]
          [[ "$(jq -r .digest <<< "$result_asset")" == "sha256:$(sha256sum "$result" | cut -d' ' -f1)" ]]
          while IFS= read -r artifact; do
            name=$(jq -r .name <<< "$artifact")
            url=$(jq -r .url <<< "$artifact")
            size=$(jq -r .size <<< "$artifact")
            digest="sha256:$(jq -r .sha256 <<< "$artifact")"
            asset=$(jq -c --arg name "$name" '.[] | select(.name == $name)' <<< "$assets_json")
            [[ -n "$asset" ]]
            [[ "$(jq -r .browser_download_url <<< "$asset")" == "$url" ]]
            [[ "$(jq -r .size <<< "$asset")" == "$size" ]]
            [[ "$(jq -r .digest <<< "$asset")" == "$digest" ]]
          done < <(jq -c '.artifacts[]' "$result")

          react_native_apk_name=$(jq -er '.artifacts[] | select(.key == "reactNative") | .name' "$result")
          react_native_apk_url=$(jq -er '.artifacts[] | select(.key == "reactNative") | .url' "$result")
          release_url=$(jq -er .starterKit.releaseUrl "$result")
          result_artifact="coordinated-starter-kit-$release_set_id"
          {
            echo "result_artifact=$result_artifact"
            echo "result_url=$result_url"
            echo "release_url=$release_url"
            echo "run_url=$run_url"
            echo "react_native_apk_name=$react_native_apk_name"
            echo "react_native_apk_url=$react_native_apk_url"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.coordinates.outputs.result_artifact }}
          path: starter-kit-result
          if-no-files-found: error
          retention-days: 90

      - name: Summarize Starter Kit release
        run: |
          {
            echo "## Starter Kit"
            echo
            echo "- Result: ${{ steps.coordinates.outputs.result_url }}"
            echo "- Validation: ${{ steps.coordinates.outputs.run_url }}"
            echo "- React Native APK: ${{ steps.coordinates.outputs.react_native_apk_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
