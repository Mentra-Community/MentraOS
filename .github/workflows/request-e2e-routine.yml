name: Request device routine
on:
  workflow_dispatch:
    inputs:
      routine:
        description: Enrolled routine ID from the Core catalog
        type: string
        required: true
      platform:
        description: Enrolled execution platform
        type: choice
        options: [android, ios-on-mac]
        required: true
      channel:
        description: Exact build source channel
        type: choice
        options: [pr, dev, staging]
        required: true
      pr:
        description: PR number for the PR channel
        type: number
        required: false
      source_build_run_id:
        description: Exact published app or coordinated build run
        type: string
        required: true
      source_publication_attempt:
        description: Original publication attempt
        type: string
        required: true
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  request:
    if: >-
      github.repository == 'Mentra-Community/MentraOS' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') ||
       (github.event_name == 'pull_request_target' && vars.DEVICE_ROUTINE_PR_DISPATCH_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Queue selected enrolled routines through Core
        uses: actions/github-script@v7
        env:
          TEST_RUN_INGEST_TOKEN: ${{ secrets.TEST_RUN_INGEST_TOKEN_DEV }}
          REQUEST_ROUTINE: ${{ inputs.routine }}
          REQUEST_PLATFORM: ${{ inputs.platform }}
          REQUEST_CHANNEL: ${{ inputs.channel }}
          REQUEST_PR: ${{ inputs.pr || github.event.pull_request.number }}
          SOURCE_BUILD_RUN_ID: ${{ inputs.source_build_run_id }}
          SOURCE_PUBLICATION_ATTEMPT: ${{ inputs.source_publication_attempt }}
        with:
          retries: 0
          script: |
            const {createRoutineRequests} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/request-e2e-routine.mjs`);
            const source = context.eventName === 'workflow_dispatch' ? {
              channel: process.env.REQUEST_CHANNEL,
              buildRunId: Number(process.env.SOURCE_BUILD_RUN_ID),
              publicationAttempt: Number(process.env.SOURCE_PUBLICATION_ATTEMPT),
              ...(process.env.REQUEST_CHANNEL === 'pr' ? {prNumber: Number(process.env.REQUEST_PR)} : {}),
            } : undefined;
            const result = await createRoutineRequests({github, context, token: process.env.TEST_RUN_INGEST_TOKEN,
              routine: process.env.REQUEST_ROUTINE, platform: process.env.REQUEST_PLATFORM, source, number: Number(process.env.REQUEST_PR)});
            const {writeFile} = await import('node:fs/promises');
            await writeFile('routine-dispatches.json', JSON.stringify({requestIds: result.requests.map(request => request.requestId)}));
            await core.summary.addRaw(JSON.stringify(result)).write();
      - uses: actions/upload-artifact@v4
        with:
          name: routine-dispatches-${{ github.run_id }}-${{ github.run_attempt }}
          path: routine-dispatches.json
          if-no-files-found: error
