name: Recovery Worker Build

on:
  pull_request:
    paths:
      - "asg_client/recovery_worker/**"
      - ".github/workflows/recovery-worker-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build recovery worker debug APK
        working-directory: ./asg_client/recovery_worker
        run: ./gradlew clean assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: recovery-worker-debug
          path: asg_client/recovery_worker/app/build/outputs/apk/debug/app-debug.apk
