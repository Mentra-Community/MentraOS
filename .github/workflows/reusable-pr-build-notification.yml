name: Reconcile PR build notification

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_PR_BUILDS:
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # All producer workflows and their retries share one writer per PR. The job
    # does not poll: whichever build finishes last reconciles the final state.
    concurrency:
      group: pr-builds-slack-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      # Keep all three producer completions; the default single pending slot
      # could cancel a peer's notification and turn its build workflow red.
      queue: max
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile current PR downloads and notify Slack
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_PR_BUILDS: ${{ secrets.SLACK_WEBHOOK_PR_BUILDS }}
        with:
          script: |
            const {notifyPrBuilds} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/notify-pr-builds.mjs`);
            await notifyPrBuilds({github, context, core});
