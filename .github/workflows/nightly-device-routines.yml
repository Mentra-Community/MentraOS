name: Nightly device routines

on:
  workflow_dispatch:
  schedule:
    # Two triggers cover daylight saving time; only intended 04:00 Pacific selects an occurrence.
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'

permissions:
  contents: read
  actions: read

jobs:
  nightly:
    environment: routine-nightly-dev
    if: github.repository == 'Mentra-Community/MentraOS' && vars.DEVICE_ROUTINE_NIGHTLY_ENABLED == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 190
    concurrency:
      group: routine-occurrence-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Select the occurrence and reconcile Core results
        uses: actions/github-script@v7
        env:
          TEST_RUN_INGEST_TOKEN: ${{ secrets.TEST_RUN_INGEST_TOKEN_DEV }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEV_BUILDS }}
        with:
          retries: 0
          script: |
            const {githubOccurrence, reconcileNightlyOccurrence, nightlySummary, publishNightlyWebhook} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/nightly-device-routines.mjs`);
            const occurrence = await githubOccurrence({github, context, attempt: Number(process.env.GITHUB_RUN_ATTEMPT)});
            if (!occurrence) {
              await core.summary.addRaw('The other UTC trigger covers 04:00 Pacific today.').write();
              return;
            }
            const token = process.env.TEST_RUN_INGEST_TOKEN;
            await core.summary.addHeading('Dev nightly occurrence').addCodeBlock(JSON.stringify(occurrence, null, 2), 'json').write();
            const result = await reconcileNightlyOccurrence({token, occurrence, deadline: Date.now() + 3 * 3600_000});
            const {writeFile} = await import('node:fs/promises');
            await writeFile('nightly-suite-result.json', JSON.stringify(result));
            const summary = nightlySummary(result);
            await core.summary.addHeading(summary.text).addTable([
              ['Routine', 'Platform', 'Result', 'Unavailable reason'].map(data => ({data, header: true})), ...summary.rows,
            ]).addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
            if (summary.url) await core.summary.addLink('Recorded results', summary.url).write();
            if (Number(process.env.GITHUB_RUN_ATTEMPT) === 1) {
              await writeFile('nightly-suite-send-intent.json', JSON.stringify({occurrenceId: result.occurrenceId, destination: 'dev-builds-webhook', status: 'send-entered'}));
              const receipt = await publishNightlyWebhook({result, webhook: process.env.SLACK_WEBHOOK, attempt: 1});
              await writeFile('nightly-suite-slack-receipt.json', JSON.stringify(receipt));
            } else core.notice('Core result reconciled. Slack was not replayed; inspect the original send receipt before a manual notification.');
            if (!summary.passed && !summary.skipped) core.setFailed(summary.text);
      - name: Retain the frozen occurrence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-suite-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-suite-*.json
          if-no-files-found: ignore
          retention-days: 30
