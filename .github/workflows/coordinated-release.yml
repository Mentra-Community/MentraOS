name: Coordinated Mentra Release

on:
  push:
    branches: [dev, staging]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the selected branch without publishing
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  # Preserve the running publication and coalesce same-branch pushes to the
  # latest pending head. Separate branch groups prevent dev and staging from
  # replacing one another's pending release.
  group: coordinated-mentra-release-publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Allocate immutable release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.release.outputs.source_commit }}
      release_identity: ${{ steps.release.outputs.release_identity }}
      release_set_id: ${{ steps.release.outputs.release_set_id }}
      plan_artifact: ${{ steps.release.outputs.plan_artifact }}
      npm_artifact: ${{ steps.release.outputs.npm_artifact }}
      release_id: ${{ steps.container.outputs.release_id }}
      cloud_environment: ${{ steps.release.outputs.cloud_environment }}
      backend_environment: ${{ steps.release.outputs.backend_environment }}
      play_track: ${{ steps.release.outputs.play_track }}
      example_play_track: ${{ steps.release.outputs.example_play_track }}
      testflight_group: ${{ steps.release.outputs.testflight_group }}
      testflight_audience: ${{ steps.release.outputs.testflight_audience }}
      example_testflight_group: ${{ steps.release.outputs.example_testflight_group }}
      example_testflight_audience: ${{ steps.release.outputs.example_testflight_audience }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve branch release channel
        id: channel
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            dev)
              echo "cloud_environment=dev" >> "$GITHUB_OUTPUT"
              echo "backend_environment=dev" >> "$GITHUB_OUTPUT"
              echo "play_track=internal" >> "$GITHUB_OUTPUT"
              echo "example_play_track=internal" >> "$GITHUB_OUTPUT"
              echo "testflight_group=Mentra Dev" >> "$GITHUB_OUTPUT"
              echo "testflight_audience=internal" >> "$GITHUB_OUTPUT"
              echo "example_testflight_group=Mentra Dev" >> "$GITHUB_OUTPUT"
              echo "example_testflight_audience=internal" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "cloud_environment=staging" >> "$GITHUB_OUTPUT"
              # Beta validates the branch-associated staging cloud. Production
              # promotion needs a follow-up design because signed mobile bytes
              # cannot have their embedded backend rewritten after this build.
              echo "backend_environment=staging" >> "$GITHUB_OUTPUT"
              echo "play_track=beta" >> "$GITHUB_OUTPUT"
              echo "example_play_track=beta" >> "$GITHUB_OUTPUT"
              echo "testflight_group=Mentra Staging Public" >> "$GITHUB_OUTPUT"
              echo "testflight_audience=external" >> "$GITHUB_OUTPUT"
              echo "example_testflight_group=Mentra Staging Public" >> "$GITHUB_OUTPUT"
              echo "example_testflight_audience=external" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Coordinated prereleases only run from dev or staging, not $BRANCH." >&2
              exit 1
              ;;
          esac

      - name: Restore the release plan selected by an earlier attempt
        id: restore-plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")
          matches=$(jq '[.artifacts[] | select(.name | startswith("coordinated-release-plan-"))]' <<< "$artifacts")
          count=$(jq 'length' <<< "$matches")
          if (( count > 1 )); then
            echo "Run $GITHUB_RUN_ID has $count release-plan artifacts; refusing an ambiguous retry." >&2
            exit 1
          fi
          if (( count == 0 )); then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(jq -r '.[0].expired' <<< "$matches")" != "false" ]]; then
            echo "The immutable release plan for run $GITHUB_RUN_ID has expired; allocate a new release instead." >&2
            exit 1
          fi
          artifact=$(jq -er '.[0].name' <<< "$matches")
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir restored-plan
          cp restored-plan/release-plan.json release-plan.json
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Collect promoted firmware inputs
        run: node .github/scripts/collect-ota-release-inputs.mjs

      - name: Verify generated changelog catalogs
        run: node .github/scripts/generate-changelog-catalog.mjs --check

      - name: Create deterministic release plan
        run: |
          set -euo pipefail
          if [[ "${{ steps.restore-plan.outputs.restored }}" == "true" ]]; then
            output=release-plan.verify.json
          else
            output=release-plan.json
          fi
          node .github/scripts/create-release-plan.mjs \
            --branch "${{ github.ref_name }}" \
            --sequence "${{ github.run_number }}" \
            --source-commit "${{ github.sha }}" \
            --native-build-number "$((310000000 + ${{ github.run_number }}))" \
            --ota-inputs ota-release-inputs.json \
            --require-version-mirrors true \
            --public-beta-testflight true \
            --output "$output"
          if [[ "$output" == "release-plan.verify.json" ]]; then
            cmp release-plan.json "$output"
            exit 0
          fi
          cp "$output" release-plan.first.json
          node .github/scripts/create-release-plan.mjs \
            --branch "${{ github.ref_name }}" \
            --sequence "${{ github.run_number }}" \
            --source-commit "${{ github.sha }}" \
            --native-build-number "$((310000000 + ${{ github.run_number }}))" \
            --ota-inputs ota-release-inputs.json \
            --require-version-mirrors true \
            --public-beta-testflight true \
            --output release-plan.json
          cmp release-plan.first.json release-plan.json

      - name: Export immutable release coordinates
        id: release
        env:
          CLOUD_ENVIRONMENT: ${{ steps.channel.outputs.cloud_environment }}
          BACKEND_ENVIRONMENT: ${{ steps.channel.outputs.backend_environment }}
          PLAY_TRACK: ${{ steps.channel.outputs.play_track }}
          EXAMPLE_PLAY_TRACK: ${{ steps.channel.outputs.example_play_track }}
          TESTFLIGHT_GROUP: ${{ steps.channel.outputs.testflight_group }}
          TESTFLIGHT_AUDIENCE: ${{ steps.channel.outputs.testflight_audience }}
          EXAMPLE_TESTFLIGHT_GROUP: ${{ steps.channel.outputs.example_testflight_group }}
          EXAMPLE_TESTFLIGHT_AUDIENCE: ${{ steps.channel.outputs.example_testflight_audience }}
        run: |
          set -euo pipefail
          identity=$(jq -er .releaseIdentity release-plan.json)
          release_set_id=$(jq -er .releaseSetId release-plan.json)
          dry_run=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            dry_run=true
          fi
          {
            echo "source_commit=${{ github.sha }}"
            echo "release_identity=$identity"
            echo "release_set_id=$release_set_id"
            echo "plan_artifact=coordinated-release-plan-$release_set_id"
            echo "npm_artifact=coordinated-npm-$release_set_id"
            echo "cloud_environment=$CLOUD_ENVIRONMENT"
            echo "backend_environment=$BACKEND_ENVIRONMENT"
            echo "play_track=$PLAY_TRACK"
            echo "example_play_track=$EXAMPLE_PLAY_TRACK"
            echo "testflight_group=$TESTFLIGHT_GROUP"
            echo "testflight_audience=$TESTFLIGHT_AUDIENCE"
            echo "example_testflight_group=$EXAMPLE_TESTFLIGHT_GROUP"
            echo "example_testflight_audience=$EXAMPLE_TESTFLIGHT_AUDIENCE"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

      - name: Allocate the release container once
        id: container
        if: steps.release.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=$(jq -er .artifactContainerTag release-plan.json)
          name=$(jq -er .artifactContainerName release-plan.json)
          if ! release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" 2>/dev/null); then
            payload=$(jq -n \
              --arg tag "$tag" \
              --arg source "$SOURCE_COMMIT" \
              --arg name "$name" \
              --arg body "Immutable development and beta artifacts for the Mentra $(jq -er .familyBaseVersion release-plan.json) release train. Exact source revisions are preserved by per-build tags." \
              '{tag_name: $tag, target_commitish: $source, name: $name, body: $body, draft: false, prerelease: true}')
            if ! release=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input - <<< "$payload" 2>/dev/null); then
              # Dev and staging can allocate the same base-version bucket concurrently.
              sleep 2
              release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag")
            fi
          fi
          [[ "$(jq -r .tag_name <<< "$release")" == "$tag" ]]
          [[ "$(jq -r .name <<< "$release")" == "$name" ]]
          [[ "$(jq -r .draft <<< "$release")" == "false" ]]
          [[ "$(jq -r .prerelease <<< "$release")" == "true" ]]
          release_id=$(jq -er .id <<< "$release")
          asset_count=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?per_page=100" | jq 'add | length')
          if (( asset_count >= 900 )); then
            echo "Release container $tag has $asset_count assets; advance the family base version before GitHub's 1000-asset limit." >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.restore-plan.outputs.restored != 'true'
        with:
          name: ${{ steps.release.outputs.plan_artifact }}
          path: |
            release-plan.json
            ota-release-inputs.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize release intent
        run: |
          {
            echo "## Coordinated release intent"
            echo ""
            echo "- Release: \`${{ steps.release.outputs.release_identity }}\`"
            echo "- Source: \`${{ github.sha }}\`"
            echo "- Cloud deployment: \`${{ steps.release.outputs.cloud_environment }}\`"
            echo "- Mobile backend: \`${{ steps.release.outputs.backend_environment }}\`"
            echo "- Google Play: \`${{ steps.release.outputs.play_track }}\`"
            echo "- Example Google Play: \`${{ steps.release.outputs.example_play_track }}\`"
            echo "- TestFlight: \`${{ steps.release.outputs.testflight_group }}\` (\`${{ steps.release.outputs.testflight_audience }}\`)"
            echo "- Example TestFlight: \`${{ steps.release.outputs.example_testflight_group }}\` (\`${{ steps.release.outputs.example_testflight_audience }}\`)"
            echo "- Dry run: \`${{ steps.release.outputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cloud-v2:
    name: Deploy branch-associated Cloud V2
    needs: plan
    uses: ./.github/workflows/reusable-coordinated-cloud-v2.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      deployment_environment: ${{ needs.plan.outputs.cloud_environment }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  ota:
    name: Publish immutable Mentra Live OTA set
    needs: plan
    uses: ./.github/workflows/reusable-coordinated-ota.yml
    with:
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      release_id: ${{ needs.plan.outputs.release_id }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  npm:
    name: Publish npm family in dependency order
    needs: [plan, ota]
    uses: ./.github/workflows/reusable-coordinated-npm.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      members: all
      result_artifact: ${{ needs.plan.outputs.npm_artifact }}
      ota_manifest_url: ${{ needs.ota.outputs.manifest_url }}
      ota_manifest_sha256: ${{ needs.ota.outputs.manifest_sha256 }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  sdk-native:
    name: Publish Bluetooth SDK native packages
    needs: [plan, ota]
    uses: ./.github/workflows/reusable-coordinated-sdk-native.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      release_id: ${{ needs.plan.outputs.release_id }}
      ota_manifest_url: ${{ needs.ota.outputs.manifest_url }}
      ota_manifest_sha256: ${{ needs.ota.outputs.manifest_sha256 }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  mobile:
    name: Build and distribute MentraOS mobile apps
    needs: [plan, ota, cloud-v2]
    uses: ./.github/workflows/reusable-coordinated-mobile.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      release_id: ${{ needs.plan.outputs.release_id }}
      ota_manifest_url: ${{ needs.ota.outputs.manifest_url }}
      ota_manifest_sha256: ${{ needs.ota.outputs.manifest_sha256 }}
      backend_environment: ${{ needs.plan.outputs.backend_environment }}
      play_track: ${{ needs.plan.outputs.play_track }}
      testflight_group: ${{ needs.plan.outputs.testflight_group }}
      testflight_audience: ${{ needs.plan.outputs.testflight_audience }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  engine-consumer:
    name: Build a clean host from the public Engine package
    needs: [plan, npm]
    uses: ./.github/workflows/reusable-coordinated-engine-consumer.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  starter-kit:
    name: Build coordinated Starter Kit examples
    needs: [plan, ota, npm, sdk-native, finalize]
    if: needs.plan.outputs.dry_run != 'true'
    uses: ./.github/workflows/reusable-coordinated-starter-kit.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      ota_manifest_url: ${{ needs.ota.outputs.manifest_url }}
      ota_manifest_sha256: ${{ needs.ota.outputs.manifest_sha256 }}
    secrets: inherit

  example-testflight:
    name: Publish React Native example to TestFlight
    needs: [plan, starter-kit]
    if: needs.plan.outputs.dry_run != 'true' && needs.starter-kit.result == 'success'
    uses: ./.github/workflows/reusable-coordinated-example-testflight.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      starter_kit_result_artifact: ${{ needs.starter-kit.outputs.result_artifact }}
      testflight_group: ${{ needs.plan.outputs.example_testflight_group }}
      testflight_audience: ${{ needs.plan.outputs.example_testflight_audience }}
    secrets: inherit

  example-google-play:
    name: Publish React Native example to Google Play
    needs: [plan, starter-kit]
    if: needs.plan.outputs.dry_run != 'true' && needs.starter-kit.result == 'success'
    uses: ./.github/workflows/reusable-coordinated-example-google-play.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      starter_kit_result_artifact: ${{ needs.starter-kit.outputs.result_artifact }}
      release_id: ${{ needs.plan.outputs.release_id }}
      play_track: ${{ needs.plan.outputs.example_play_track }}
    secrets: inherit

  finalize:
    name: Finalize immutable release bill of materials
    # A Mentra beta (Cloud V2, Mentra App, Engine, Bluetooth SDK) is complete
    # when these succeed. The Bluetooth example is finalized separately below.
    needs: [plan, cloud-v2, ota, npm, sdk-native, mobile, engine-consumer]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.cloud-v2.result == 'success' &&
      needs.ota.result == 'success' &&
      needs.npm.result == 'success' &&
      needs.sdk-native.result == 'success' &&
      needs.mobile.result == 'success' &&
      needs.engine-consumer.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: release-input/plan

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.cloud-v2.outputs.result_artifact }}
          path: release-input/cloud-v2

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ota.outputs.result_artifact }}
          path: release-input/ota

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.npm_artifact }}
          path: release-input/npm

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sdk-native.outputs.result_artifact }}
          path: release-input/sdk-native

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.mobile.outputs.result_artifact }}
          path: release-input/mobile

      - name: Assemble complete publication evidence
        id: results
        run: |
          set -euo pipefail
          mkdir -p finalized-release
          plan=release-input/plan/release-plan.json
          identity=$(jq -er .releaseIdentity "$plan")
          tag=$(jq -er .artifactContainerTag "$plan")
          asg_selection="release-input/ota/release-assets/$(jq -er .artifactNames.asgSelection "$plan")"
          test -f "$asg_selection"
          engine_package=$(find release-input/npm -type f -name 'mentra-engine-*.tgz' -print -quit)
          test -n "$engine_package"
          node .github/scripts/assemble-coordinated-release-results.mjs \
            --plan "$plan" \
            --ota release-input/ota/ota-result.json \
            --npm release-input/npm/npm-publications.json \
            --native release-input/sdk-native/sdk-native-publications.json \
            --mobile release-input/mobile/mobile-publications.json \
            --cloud release-input/cloud-v2/cloud-v2-deployment.json \
            --asg-selection "$asg_selection" \
            --engine-package "$engine_package" \
            --release-asset-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag" \
            --output finalized-release/publication-results.json
          cp "$plan" "finalized-release/$(jq -er .artifactNames.releasePlan "$plan")"
          cp "$engine_package" "finalized-release/$(jq -er .artifactNames.enginePackage "$plan")"
          {
            echo "tag=$tag"
            echo "identity=$identity"
            echo "plan_name=$(jq -er .artifactNames.releasePlan "$plan")"
            echo "manifest_name=$(jq -er .artifactNames.releaseManifest "$plan")"
            echo "engine_name=$(jq -er .artifactNames.enginePackage "$plan")"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve and verify the exact release container
        id: release-container
        if: needs.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.results.outputs.tag }}"
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${{ needs.plan.outputs.release_id }}")
          [[ "$(jq -r .tag_name <<< "$release")" == "$tag" ]]
          [[ "$(jq -r .name <<< "$release")" == "$(jq -er .artifactContainerName release-input/plan/release-plan.json)" ]]
          [[ "$(jq -r .draft <<< "$release")" == "false" ]]
          [[ "$(jq -r .prerelease <<< "$release")" == "true" ]]
          echo "release_id=${{ needs.plan.outputs.release_id }}" >> "$GITHUB_OUTPUT"

      - name: Finalize release manifest
        if: needs.plan.outputs.dry_run != 'true'
        run: >-
          node .github/scripts/finalize-release-manifest.mjs
          --plan release-input/plan/release-plan.json
          --results finalized-release/publication-results.json
          --completed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          --output "finalized-release/${{ steps.results.outputs.manifest_name }}"

      - name: Publish immutable plan, package, and manifest assets
        if: needs.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in \
            "${{ steps.results.outputs.plan_name }}" \
            "${{ steps.results.outputs.engine_name }}" \
            "${{ steps.results.outputs.manifest_name }}"; do
            node .github/scripts/publish-immutable-release-asset.mjs \
              --file "finalized-release/$name" \
              --name "$name" \
              --release-id "${{ steps.release-container.outputs.release_id }}" \
              --repository "${{ github.repository }}"
          done

      - name: Tag and verify the completed release set
        if: needs.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_tag="mentra-v${{ steps.results.outputs.identity }}"
          if ! ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$source_tag" 2>/dev/null); then
            ref=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$source_tag" \
              -f sha="${{ needs.plan.outputs.source_commit }}")
          fi
          [[ "$(jq -r .object.sha <<< "$ref")" == "${{ needs.plan.outputs.source_commit }}" ]]
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.results.outputs.tag }}/${{ steps.results.outputs.manifest_name }}"
          node .github/scripts/verify-public-release-asset.mjs \
            --file "finalized-release/${{ steps.results.outputs.manifest_name }}" \
            --url "$url"

      - uses: actions/upload-artifact@v4
        with:
          name: coordinated-release-result-${{ needs.plan.outputs.release_set_id }}
          path: finalized-release
          if-no-files-found: error
          retention-days: 90

      - name: Summarize completed release
        run: |
          {
            echo "## Coordinated release result"
            echo ""
            echo "- Release: \`${{ steps.results.outputs.identity }}\`"
            echo "- Source: \`${{ needs.plan.outputs.source_commit }}\`"
            echo "- Cloud deployment: \`$(jq -er .cloud.deploymentId finalized-release/publication-results.json 2>/dev/null || echo validated-only)\`"
            echo "- OTA manifest: ${{ needs.ota.outputs.manifest_url }}"
            echo "- Dry run: \`${{ needs.plan.outputs.dry_run }}\`"
            if [[ "${{ needs.plan.outputs.dry_run }}" != "true" ]]; then
              echo "- GitHub release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.results.outputs.tag }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  finalize-example:
    name: Finalize the Mentra Bluetooth example release
    # The example release is a separate notion from the Mentra beta: it is
    # built against the finalized beta and recorded in its own asset, so an
    # example failure never makes the beta incomplete.
    needs: [plan, finalize, starter-kit, example-testflight, example-google-play]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.dry_run != 'true' &&
      needs.finalize.result == 'success' &&
      needs.starter-kit.result == 'success' &&
      needs.example-testflight.result == 'success' &&
      needs.example-google-play.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      record_url: ${{ steps.results.outputs.record_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: release-input/plan

      - uses: actions/download-artifact@v4
        with:
          name: coordinated-release-result-${{ needs.plan.outputs.release_set_id }}
          path: release-input/finalized

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.starter-kit.outputs.result_artifact }}
          path: release-input/starter-kit

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.example-testflight.outputs.result_artifact }}
          path: release-input/example-testflight

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.example-google-play.outputs.result_artifact }}
          path: release-input/example-google-play

      - name: Assemble the example release record against the finalized beta
        id: results
        run: |
          set -euo pipefail
          mkdir -p finalized-example
          plan=release-input/plan/release-plan.json
          identity=$(jq -er .releaseIdentity "$plan")
          tag=$(jq -er .artifactContainerTag "$plan")
          manifest_name=$(jq -er .artifactNames.releaseManifest "$plan")
          beta_manifest="release-input/finalized/$manifest_name"
          test -s "$beta_manifest"
          starter_kit_result=$(find release-input/starter-kit -type f -name 'starter-kit-release-*.json' -print -quit)
          example_testflight=$(find release-input/example-testflight -type f -name 'example-testflight-publication.json' -print -quit)
          test -n "$starter_kit_result"
          test -n "$example_testflight"
          record_name="mentra-example-release-$identity.json"
          record_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$record_name"
          # Immutable asset: a retry after a partial publication must reproduce
          # the exact bytes already on the release, so reuse that record's
          # completion time and provenance instead of minting new ones.
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          provenance_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if curl --fail --silent --show-error --location "$record_url" --output existing-record.json 2>/dev/null; then
            echo "Reconciling against the example record already published at $record_url"
            completed_at=$(jq -er .completedAt existing-record.json)
            provenance_url=$(jq -er .provenanceUrl existing-record.json)
          else
            rm -f existing-record.json
          fi
          node .github/scripts/example-release-records.mjs \
            --plan "$plan" \
            --beta-manifest "$beta_manifest" \
            --beta-manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$manifest_name" \
            --starter-kit "$starter_kit_result" \
            --starter-kit-result-url "${{ needs.starter-kit.outputs.result_url }}" \
            --example-testflight "$example_testflight" \
            --example-google-play release-input/example-google-play/example-google-play-publication.json \
            --completed-at "$completed_at" \
            --provenance-url "$provenance_url" \
            --output "finalized-example/$record_name"
          if [[ -f existing-record.json ]]; then
            cmp existing-record.json "finalized-example/$record_name"
          fi
          {
            echo "tag=$tag"
            echo "identity=$identity"
            echo "record_name=$record_name"
            echo "record_url=$record_url"
          } >> "$GITHUB_OUTPUT"

      - name: Publish and verify the immutable example release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/publish-immutable-release-asset.mjs \
            --file "finalized-example/${{ steps.results.outputs.record_name }}" \
            --name "${{ steps.results.outputs.record_name }}" \
            --release-id "${{ needs.plan.outputs.release_id }}" \
            --repository "${{ github.repository }}"
          node .github/scripts/verify-public-release-asset.mjs \
            --file "finalized-example/${{ steps.results.outputs.record_name }}" \
            --url "${{ steps.results.outputs.record_url }}"

      - uses: actions/upload-artifact@v4
        with:
          name: coordinated-example-release-result-${{ needs.plan.outputs.release_set_id }}
          path: finalized-example
          if-no-files-found: error
          retention-days: 90

      - name: Summarize the example release
        run: |
          {
            echo "## Mentra Bluetooth example release"
            echo ""
            echo "- Release: \`${{ steps.results.outputs.identity }}\`"
            echo "- Record: ${{ steps.results.outputs.record_url }}"
            echo "- Starter Kit builds: ${{ needs.starter-kit.outputs.release_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Publish release-matched documentation
    needs: [plan, starter-kit, example-testflight, finalize, finalize-example]
    if: needs.plan.result == 'success' && needs.starter-kit.result == 'success' && needs.example-testflight.result == 'success' && needs.finalize.result == 'success' && needs.finalize-example.result == 'success' && needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      docs_url: ${{ steps.target.outputs.docs_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: release-input/plan

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.starter-kit.outputs.result_artifact }}
          path: release-input/starter-kit

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.example-testflight.outputs.result_artifact }}
          path: release-input/example-testflight

      - name: Select the documentation channel
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            dev)
              echo "project=mentraos-docs-dev" >> "$GITHUB_OUTPUT"
              echo "pages_branch=dev" >> "$GITHUB_OUTPUT"
              echo "docs_url=https://docs-dev.mentraglass.com" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "project=mentraos-docs-beta" >> "$GITHUB_OUTPUT"
              echo "pages_branch=staging" >> "$GITHUB_OUTPUT"
              echo "docs_url=https://docs-beta.mentraglass.com" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported documentation branch $BRANCH" >&2
              exit 1
              ;;
          esac

      - name: Render the exact release version into a temporary docs tree
        run: >-
          node .github/scripts/render-coordinated-docs.mjs
          --source mintlify-docs
          --output "$RUNNER_TEMP/mentraos-docs-source"
          --plan release-input/plan/release-plan.json
          --starter-kit "$(find release-input/starter-kit -type f -name 'starter-kit-release-*.json' -print -quit)"
          --example-testflight "$(find release-input/example-testflight -type f -name 'example-testflight-publication.json' -print -quit)"
          --repository "${{ github.repository }}"

      - name: Export Mintlify docs
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mentraos-docs-source"
          bunx --bun mint export --output "$RUNNER_TEMP/mentraos-docs.zip"

      - name: Prepare and verify the Cloudflare Pages artifact
        env:
          RELEASE_IDENTITY: ${{ needs.plan.outputs.release_identity }}
          EXAMPLE_APK_URL: ${{ needs.starter-kit.outputs.react_native_apk_url }}
          EXAMPLE_IOS_URL: ${{ needs.example-testflight.outputs.install_url }}
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/mentraos-docs"
          rm -rf "$export_dir"
          mkdir -p "$export_dir"
          unzip -q "$RUNNER_TEMP/mentraos-docs.zip" -d "$export_dir"
          cat > "$export_dir/_headers" <<'HEADERS'
          /*
            X-Robots-Tag: noindex
          HEADERS
          if grep -R --extended-regexp --ignore-case --quiet '\{\{[a-z0-9_-]+\}\}|%7b%7b[a-z0-9_-]+%7d%7d' "$export_dir/bluetooth-sdk"; then
            echo "Mintlify export contains an unresolved documentation variable." >&2
            exit 1
          fi
          node .github/scripts/verify-coordinated-docs.mjs \
            "$export_dir/bluetooth-sdk/software-update/index.html"
          # Mintlify's static export does not emit docs.json redirects.
          cat >> "$export_dir/_redirects" <<'REDIRECTS'
          /mentra-live/software-update /bluetooth-sdk/software-update/ 301
          /mentra-live/software-update/ /bluetooth-sdk/software-update/ 301
          REDIRECTS

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          PROJECT: ${{ steps.target.outputs.project }}
          PAGES_BRANCH: ${{ steps.target.outputs.pages_branch }}
          RELEASE_IDENTITY: ${{ needs.plan.outputs.release_identity }}
        run: |
          set -euo pipefail
          npx wrangler@4.86.0 pages deploy "$RUNNER_TEMP/mentraos-docs" \
            --project-name "$PROJECT" \
            --branch "$PAGES_BRANCH" \
            --commit-hash "${{ needs.plan.outputs.source_commit }}" \
            --commit-message "Deploy MentraOS docs for $RELEASE_IDENTITY" \
            --commit-dirty=true

      - name: Verify the published custom domain
        env:
          DOCS_URL: ${{ steps.target.outputs.docs_url }}
          RELEASE_IDENTITY: ${{ needs.plan.outputs.release_identity }}
          EXAMPLE_APK_URL: ${{ needs.starter-kit.outputs.react_native_apk_url }}
          EXAMPLE_IOS_URL: ${{ needs.example-testflight.outputs.install_url }}
        run: |
          set -euo pipefail
          page="$DOCS_URL/bluetooth-sdk/software-update/"
          body="$RUNNER_TEMP/software-update.html"
          headers="$RUNNER_TEMP/software-update.headers"
          for _ in {1..18}; do
            if curl --fail --silent --show-error --location \
              --dump-header "$headers" --output "$body" "$page" && \
              grep --fixed-strings --quiet "$RELEASE_IDENTITY" "$body" && \
              grep --fixed-strings --quiet "href=\"$EXAMPLE_APK_URL\"" "$body" && \
              grep --fixed-strings --quiet "href=\"$EXAMPLE_IOS_URL\"" "$body" && \
              grep --ignore-case --quiet '^x-robots-tag:.*noindex' "$headers" && \
              ! grep --extended-regexp --ignore-case --quiet \
                '\{\{[a-z0-9_-]+\}\}|%7b%7b[a-z0-9_-]+%7d%7d' "$body"; then
              echo "Verified $page for $RELEASE_IDENTITY"
              exit 0
            fi
            sleep 10
          done
          echo "Published docs did not converge to $RELEASE_IDENTITY at $page" >&2
          exit 1

  notify-slack:
    name: Notify release Slack channel
    needs:
      [plan, cloud-v2, ota, npm, sdk-native, mobile, engine-consumer, starter-kit, example-testflight, example-google-play, finalize, finalize-example, docs]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post coordinated release result
        continue-on-error: true
        env:
          STAGING_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_BUILDS }}
          DEV_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DEV_BUILDS }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          RELEASE_IDENTITY: ${{ needs.plan.outputs.release_identity }}
          PLAY_TRACK: ${{ needs.plan.outputs.play_track }}
          TESTFLIGHT_GROUP: ${{ needs.plan.outputs.testflight_group }}
          TESTFLIGHT_DISTRIBUTION_STATUS: ${{ needs.mobile.outputs.testflight_distribution_status }}
          TESTFLIGHT_INSTALL_URL: ${{ needs.mobile.outputs.testflight_install_url }}
          TESTFLIGHT_REVIEW_STATE: ${{ needs.mobile.outputs.testflight_review_state }}
          PLAN_RESULT: ${{ needs.plan.result }}
          CLOUD_V2_RESULT: ${{ needs.cloud-v2.result }}
          OTA_RESULT: ${{ needs.ota.result }}
          NPM_RESULT: ${{ needs.npm.result }}
          SDK_NATIVE_RESULT: ${{ needs.sdk-native.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          ANDROID_RESULT: ${{ needs.mobile.outputs.android_result }}
          IOS_RESULT: ${{ needs.mobile.outputs.ios_result }}
          ENGINE_RESULT: ${{ needs.engine-consumer.result }}
          STARTER_KIT_RESULT: ${{ needs.starter-kit.result }}
          EXAMPLE_TESTFLIGHT_RESULT: ${{ needs.example-testflight.result }}
          EXAMPLE_GOOGLE_PLAY_RESULT: ${{ needs.example-google-play.result }}
          EXAMPLE_GOOGLE_PLAY_TRACK: ${{ needs.plan.outputs.example_play_track }}
          EXAMPLE_GOOGLE_PLAY_INSTALL_URL: ${{ needs.example-google-play.outputs.install_url }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
          FINALIZE_EXAMPLE_RESULT: ${{ needs.finalize-example.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          DOCS_URL: ${{ needs.docs.outputs.docs_url }}
          APK_NAME: ${{ needs.mobile.outputs.apk_name }}
          IPA_NAME: ${{ needs.mobile.outputs.ipa_name }}
          MOBILE_ASSET_BASE_URL: ${{ needs.mobile.outputs.asset_base_url }}
          ASG_APK_NAME: ${{ needs.ota.outputs.asg_apk_name }}
          ASG_APK_URL: ${{ needs.ota.outputs.asg_apk_url }}
          STARTER_KIT_APK_NAME: ${{ needs.starter-kit.outputs.react_native_apk_name }}
          STARTER_KIT_APK_URL: ${{ needs.starter-kit.outputs.react_native_apk_url }}
          STARTER_KIT_RELEASE_URL: ${{ needs.starter-kit.outputs.release_url }}
          STARTER_KIT_RUN_URL: ${{ needs.starter-kit.outputs.run_url }}
          EXAMPLE_TESTFLIGHT_DISTRIBUTION_STATUS: ${{ needs.example-testflight.outputs.distribution_status }}
          EXAMPLE_TESTFLIGHT_INSTALL_URL: ${{ needs.example-testflight.outputs.install_url }}
          EXAMPLE_TESTFLIGHT_REVIEW_STATE: ${{ needs.example-testflight.outputs.review_state }}
          EXAMPLE_TESTFLIGHT_MARKETING_VERSION: ${{ needs.example-testflight.outputs.marketing_version }}
          EXAMPLE_TESTFLIGHT_BUILD_NUMBER: ${{ needs.example-testflight.outputs.build_number }}
        run: .github/scripts/notify-coordinated-release-slack.sh
