name: Coordinated Mentra Release

on:
  push:
    branches: [dev, staging]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the selected branch without publishing
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  # Preserve the running publication and coalesce same-branch pushes to the
  # latest pending head. Separate branch groups prevent dev and staging from
  # replacing one another's pending release.
  group: coordinated-mentra-release-publication-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ARTIFACTS_R2_ACCOUNT_ID: ${{ vars.ARTIFACTS_R2_ACCOUNT_ID }}
  ARTIFACTS_R2_BUCKET: artifactscdn

jobs:
  plan:
    name: Allocate immutable release identity
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.release.outputs.source_commit }}
      release_identity: ${{ steps.release.outputs.release_identity }}
      release_set_id: ${{ steps.release.outputs.release_set_id }}
      plan_artifact: ${{ steps.release.outputs.plan_artifact }}
      npm_artifact: ${{ steps.release.outputs.npm_artifact }}
      release_id: ${{ steps.container.outputs.release_id }}
      cloud_environment: ${{ steps.release.outputs.cloud_environment }}
      backend_environment: ${{ steps.release.outputs.backend_environment }}
      play_track: ${{ steps.release.outputs.play_track }}
      upload_google_play: ${{ steps.release.outputs.upload_google_play }}
      testflight_group: ${{ steps.release.outputs.testflight_group }}
      testflight_audience: ${{ steps.release.outputs.testflight_audience }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve branch release channel
        id: channel
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            dev)
              echo "cloud_environment=dev" >> "$GITHUB_OUTPUT"
              echo "backend_environment=dev" >> "$GITHUB_OUTPUT"
              echo "play_track=internal" >> "$GITHUB_OUTPUT"
              echo "testflight_group=Mentra Dev" >> "$GITHUB_OUTPUT"
              echo "testflight_audience=internal" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "cloud_environment=staging" >> "$GITHUB_OUTPUT"
              # Beta validates the branch-associated staging cloud. Production
              # promotion needs a follow-up design because signed mobile bytes
              # cannot have their embedded backend rewritten after this build.
              echo "backend_environment=staging" >> "$GITHUB_OUTPUT"
              # The open-testing track behind the public beta link. It serves
              # a pre-formula code above the family window, so the Android
              # build takes the track's floor plus one until the family passes
              # it (resolve-android-version-code.mjs). Keep release-family.mjs
              # in step.
              echo "play_track=beta" >> "$GITHUB_OUTPUT"
              echo "testflight_group=Mentra Staging Public" >> "$GITHUB_OUTPUT"
              echo "testflight_audience=external" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Coordinated prereleases only run from dev or staging, not $BRANCH." >&2
              exit 1
              ;;
          esac

      - name: Restore the release plan selected by an earlier attempt
        id: restore-plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")
          matches=$(jq '[.artifacts[] | select(.name | startswith("coordinated-release-plan-"))]' <<< "$artifacts")
          count=$(jq 'length' <<< "$matches")
          if (( count > 1 )); then
            echo "Run $GITHUB_RUN_ID has $count release-plan artifacts; refusing an ambiguous retry." >&2
            exit 1
          fi
          if (( count == 0 )); then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(jq -r '.[0].expired' <<< "$matches")" != "false" ]]; then
            echo "The immutable release plan for run $GITHUB_RUN_ID has expired; allocate a new release instead." >&2
            exit 1
          fi
          artifact=$(jq -er '.[0].name' <<< "$matches")
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir restored-plan
          cp restored-plan/release-plan.json release-plan.json
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Collect promoted firmware inputs
        run: node .github/scripts/collect-ota-release-inputs.mjs

      - name: Verify generated changelog catalogs
        run: node .github/scripts/generate-changelog-catalog.mjs --check

      # One build number per run for the app and (when rebuilt) the ASG client:
      # the next free sequence of the family above everything the family's
      # build container already records. A rerun keeps its restored number.
      - name: Allocate the family build number
        id: family-number
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.restore-plan.outputs.restored }}" == "true" ]]; then
            echo "build_number=$(jq -er .native.buildNumber release-plan.json)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_version=$(node -e 'import("./.github/scripts/release-family.mjs").then((m) => console.log(m.loadReleaseFamily().familyBaseVersion))')
          tag="mentra-builds-v$base_version"
          assets='[]'
          if release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" 2>/dev/null); then
            release_id=$(jq -er .id <<< "$release")
            assets=$(node .github/scripts/release-assets.mjs list --repository "${GITHUB_REPOSITORY}" --release-id "$release_id")
          fi
          printf '%s\n' "$assets" > family-only-assets.json
          # GitHub can remove attempt-scoped artifacts when a workflow is
          # rerun. Recover this run's durable number reservation from the
          # family container before allocating, so any already-published
          # native artifacts keep the same build number on retry.
          mkdir -p family-build-number-markers
          while IFS=$'\t' read -r asset_id name; do
            [[ -z "$asset_id" ]] && continue
            node .github/scripts/release-assets.mjs fetch \
              --repository "$GITHUB_REPOSITORY" --asset-id "$asset_id" \
              > "family-build-number-markers/$name"
          done < <(jq -r \
            '.[] | select(.name | test("^mentra-build-number-[0-9]+\\.json$")) | [.id, .name] | @tsv' \
            family-only-assets.json)
          # ASG pairs numbered before markers existed live in the shared ASG
          # release; their numbers are taken too. Inventories are merged through
          # files: a family inventory runs to hundreds of kilobytes, past the
          # per-argument limit of the runner.
          echo '[]' > asg-release-assets.json
          if asg_release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/mentra-coordinated-asg" --jq .id 2>/dev/null); then
            node .github/scripts/release-assets.mjs list --repository "${GITHUB_REPOSITORY}" --release-id "$asg_release_id" > asg-release-assets.json
          fi
          jq -s 'add' family-only-assets.json asg-release-assets.json > family-container-assets.json
          node .github/scripts/allocate-family-build-sequence.mjs allocate \
            --assets family-container-assets.json \
            --base-version "$base_version" \
            --owner "coordinated-run:${GITHUB_RUN_ID}" \
            --markers-dir family-build-number-markers \
            --output family-build-number.json
          echo "build_number=$(jq -er .buildNumber family-build-number.json)" >> "$GITHUB_OUTPUT"

      - name: Create deterministic release plan
        run: |
          set -euo pipefail
          if [[ "${{ steps.restore-plan.outputs.restored }}" == "true" ]]; then
            output=release-plan.verify.json
          else
            output=release-plan.json
          fi
          node .github/scripts/create-release-plan.mjs \
            --branch "${{ github.ref_name }}" \
            --sequence "${{ github.run_number }}" \
            --source-commit "${{ github.sha }}" \
            --native-build-number "${{ steps.family-number.outputs.build_number }}" \
            --play-track "${{ steps.channel.outputs.play_track }}" \
            --ota-inputs ota-release-inputs.json \
            --require-version-mirrors true \
            --public-beta-testflight true \
            --output "$output"
          if [[ "$output" == "release-plan.verify.json" ]]; then
            cmp release-plan.json "$output"
            exit 0
          fi
          cp "$output" release-plan.first.json
          node .github/scripts/create-release-plan.mjs \
            --branch "${{ github.ref_name }}" \
            --sequence "${{ github.run_number }}" \
            --source-commit "${{ github.sha }}" \
            --native-build-number "${{ steps.family-number.outputs.build_number }}" \
            --play-track "${{ steps.channel.outputs.play_track }}" \
            --ota-inputs ota-release-inputs.json \
            --require-version-mirrors true \
            --public-beta-testflight true \
            --output release-plan.json
          cmp release-plan.first.json release-plan.json

      - name: Export immutable release coordinates
        id: release
        env:
          CLOUD_ENVIRONMENT: ${{ steps.channel.outputs.cloud_environment }}
          BACKEND_ENVIRONMENT: ${{ steps.channel.outputs.backend_environment }}
          PLAY_TRACK: ${{ steps.channel.outputs.play_track }}
          TESTFLIGHT_GROUP: ${{ steps.channel.outputs.testflight_group }}
          TESTFLIGHT_AUDIENCE: ${{ steps.channel.outputs.testflight_audience }}
        run: |
          set -euo pipefail
          identity=$(jq -er .releaseIdentity release-plan.json)
          release_set_id=$(jq -er .releaseSetId release-plan.json)
          dry_run=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            dry_run=true
          fi
          {
            echo "source_commit=${{ github.sha }}"
            echo "release_identity=$identity"
            echo "release_set_id=$release_set_id"
            echo "plan_artifact=coordinated-release-plan-$release_set_id"
            echo "npm_artifact=coordinated-npm-$release_set_id"
            echo "cloud_environment=$CLOUD_ENVIRONMENT"
            echo "backend_environment=$BACKEND_ENVIRONMENT"
            echo "play_track=$PLAY_TRACK"
            echo "upload_google_play=$(jq -r '.native.googlePlayUpload != false' release-plan.json)"
            echo "testflight_group=$TESTFLIGHT_GROUP"
            echo "testflight_audience=$TESTFLIGHT_AUDIENCE"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

      - name: Allocate the release container once
        id: container
        if: steps.release.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=$(jq -er .artifactContainerTag release-plan.json)
          name=$(jq -er .artifactContainerName release-plan.json)
          if ! release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" 2>/dev/null); then
            payload=$(jq -n \
              --arg tag "$tag" \
              --arg source "$SOURCE_COMMIT" \
              --arg name "$name" \
              --arg body "Immutable development and beta artifacts for the Mentra $(jq -er .familyBaseVersion release-plan.json) release train. Exact source revisions are preserved by per-build tags." \
              '{tag_name: $tag, target_commitish: $source, name: $name, body: $body, draft: false, prerelease: true}')
            if ! release=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input - <<< "$payload" 2>/dev/null); then
              # Dev and staging can allocate the same base-version bucket concurrently.
              sleep 2
              release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag")
            fi
          fi
          [[ "$(jq -r .tag_name <<< "$release")" == "$tag" ]]
          [[ "$(jq -r .name <<< "$release")" == "$name" ]]
          [[ "$(jq -r .draft <<< "$release")" == "false" ]]
          [[ "$(jq -r .prerelease <<< "$release")" == "true" ]]
          release_id=$(jq -er .id <<< "$release")
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      # Recorded before any build starts, so a run that fails halfway never
      # gives its number away; the marker is deterministic, so a rerun
      # republishes identical bytes.
      - name: Record the family build number in the release container
        if: steps.release.outputs.dry_run != 'true'
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_version=$(jq -er .familyBaseVersion release-plan.json)
          build_number=$(jq -er .native.buildNumber release-plan.json)
          node .github/scripts/allocate-family-build-sequence.mjs marker \
            --base-version "$base_version" \
            --build-number "$build_number" \
            --owner "coordinated-run:${GITHUB_RUN_ID}" \
            --output-dir family-build-number
          name="mentra-build-number-$build_number.json"
          node .github/scripts/publish-immutable-release-asset.mjs \
            --file "family-build-number/$name" \
            --name "$name" \
            --release-id "${{ steps.container.outputs.release_id }}" \
            --repository "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        if: steps.restore-plan.outputs.restored != 'true'
        with:
          name: ${{ steps.release.outputs.plan_artifact }}
          path: |
            release-plan.json
            ota-release-inputs.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize release intent
        run: |
          {
            echo "## Coordinated release intent"
            echo ""
            echo "- Release: \`${{ steps.release.outputs.release_identity }}\`"
            echo "- Source: \`${{ github.sha }}\`"
            echo "- Cloud deployment: \`${{ steps.release.outputs.cloud_environment }}\`"
            echo "- Mobile backend: \`${{ steps.release.outputs.backend_environment }}\`"
            if [[ "${{ steps.release.outputs.upload_google_play }}" == "false" ]]; then
              echo "- Google Play: dev uploads paused; APK/AAB downloads remain available"
            else
              echo "- Google Play: \`${{ steps.release.outputs.play_track }}\`"
            fi
            echo "- TestFlight: \`${{ steps.release.outputs.testflight_group }}\` (\`${{ steps.release.outputs.testflight_audience }}\`)"
            echo "- Dry run: \`${{ steps.release.outputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cloud-v2:
    name: Deploy branch-associated Cloud V2
    needs: plan
    uses: ./.github/workflows/reusable-coordinated-cloud-v2.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      deployment_environment: ${{ needs.plan.outputs.cloud_environment }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  runtime-image:
    name: Publish canonical Mentra Cloud image
    needs: plan
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/reusable-coordinated-runtime-image.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  private-deployment:
    name: Deploy release-matched private stack
    needs: [plan, runtime-image]
    # Dev releases deploy demo-dev.acmeworkspace.com; staging releases deploy the
    # sales demo, demo.acmeworkspace.com. ENTERPRISE_DEMO_FROZEN=true holds the
    # sales demo on its current release (e.g. during sales demos), and the beta
    # Private Cloud download channel with it.
    if: >-
      needs.plan.outputs.cloud_environment == 'dev' ||
      (needs.plan.outputs.cloud_environment == 'staging' && vars.ENTERPRISE_DEMO_FROZEN != 'true')
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/private-deployment.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      runtime_image_artifact: ${{ needs.runtime-image.outputs.result_artifact }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}

  private-cloud-channel:
    name: Point Private Cloud downloads at this release
    needs: [plan, runtime-image, private-deployment]
    # A channel moves only after its demo stack deployed and verified this exact
    # release, so it stays put while that stack is frozen.
    if: >-
      always() && needs.plan.outputs.dry_run != 'true' && needs.runtime-image.result == 'success' &&
      needs.private-deployment.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    concurrency:
      group: private-cloud-channel-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify the published installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IDENTITY: ${{ needs.plan.outputs.release_identity }}
        run: |
          set -euo pipefail
          url=$(node .github/scripts/release-assets.mjs url --repository "$GITHUB_REPOSITORY" \
            --tag "mentra-private-cloud-$RELEASE_IDENTITY" --name mentra-private-cloud.tar.gz)
          curl --fail --silent --show-error --location --retry 3 --output mentra-private-cloud.tar.gz "$url"
          gh attestation verify mentra-private-cloud.tar.gz --repo "$GITHUB_REPOSITORY"
          tar -xzOf mentra-private-cloud.tar.gz mentra-private-cloud/release.json > release.json

      - name: Advance the channel's stable install URL
        env:
          ARTIFACTS_R2_ACCOUNT_ID: ${{ vars.ARTIFACTS_R2_ACCOUNT_ID }}
          ARTIFACTS_R2_BUCKET: artifactscdn
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        run: >-
          node .github/scripts/publish-private-cloud-channel.mjs
          --repository "$GITHUB_REPOSITORY"
          --version "${{ needs.plan.outputs.release_identity }}"
          --archive mentra-private-cloud.tar.gz
          --release-json release.json
          --bootstrap cloud-v2/deploy/azure/enterprise-reference/installer/bootstrap.sh

  ota:
    name: Publish immutable Mentra Live OTA set
    needs: plan
    uses: ./.github/workflows/reusable-coordinated-ota.yml
    with:
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      release_id: ${{ needs.plan.outputs.release_id }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  npm:
    name: Publish npm family in dependency order
    needs: [plan, ota]
    uses: ./.github/workflows/reusable-coordinated-npm.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      members: all
      result_artifact: ${{ needs.plan.outputs.npm_artifact }}
      ota_manifest_url: ${{ needs.ota.outputs.manifest_url }}
      ota_manifest_sha256: ${{ needs.ota.outputs.manifest_sha256 }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  sdk-native:
    name: Publish Bluetooth SDK native packages
    needs: [plan, ota]
    uses: ./.github/workflows/reusable-coordinated-sdk-native.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      release_id: ${{ needs.plan.outputs.release_id }}
      ota_manifest_url: ${{ needs.ota.outputs.manifest_url }}
      ota_manifest_sha256: ${{ needs.ota.outputs.manifest_sha256 }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  mobile:
    name: Build and distribute MentraOS mobile apps
    needs: [plan, ota, cloud-v2]
    uses: ./.github/workflows/reusable-coordinated-mobile.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      release_id: ${{ needs.plan.outputs.release_id }}
      ota_manifest_url: ${{ needs.ota.outputs.manifest_url }}
      ota_manifest_sha256: ${{ needs.ota.outputs.manifest_sha256 }}
      installable_downloads: true
      backend_environment: ${{ needs.plan.outputs.backend_environment }}
      play_track: ${{ needs.plan.outputs.play_track }}
      testflight_group: ${{ needs.plan.outputs.testflight_group }}
      testflight_audience: ${{ needs.plan.outputs.testflight_audience }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  engine-consumer:
    name: Build a clean host from the public Engine package
    needs: [plan, npm]
    uses: ./.github/workflows/reusable-coordinated-engine-consumer.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
    secrets: inherit

  finalize:
    name: Finalize immutable release bill of materials
    # A Mentra beta (Cloud V2, Mentra App, Engine, Bluetooth SDK) is complete
    # when these succeed. Examples and the enterprise demo deploy independently.
    needs: [plan, cloud-v2, runtime-image, ota, npm, sdk-native, mobile, engine-consumer]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.cloud-v2.result == 'success' &&
      needs.runtime-image.result == 'success' &&
      needs.ota.result == 'success' &&
      needs.npm.result == 'success' &&
      needs.sdk-native.result == 'success' &&
      needs.mobile.result == 'success' &&
      needs.engine-consumer.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: release-input/plan

      - name: Restore finalized release result from an earlier attempt
        id: restore-result
        if: needs.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="coordinated-release-result-${{ needs.plan.outputs.release_set_id }}"
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")
          matches=$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)]' <<< "$artifacts")
          count=$(jq 'length' <<< "$matches")
          if (( count > 1 )); then
            echo "Run $GITHUB_RUN_ID has multiple finalized release results; refusing an ambiguous retry." >&2
            exit 1
          fi
          if (( count == 0 )); then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(jq -r '.[0].expired' <<< "$matches")" != "false" ]]; then
            echo "The finalized release result for run $GITHUB_RUN_ID has expired; refusing to regenerate immutable assets." >&2
            exit 1
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir restored-release
          plan=release-input/plan/release-plan.json
          plan_name=$(jq -er .artifactNames.releasePlan "$plan")
          manifest_name=$(jq -er .artifactNames.releaseManifest "$plan")
          cmp "$plan" "restored-release/$plan_name"
          manifest="restored-release/$manifest_name"
          [[ -s "$manifest" ]]
          [[ "$(jq -er .releaseSetId "$manifest")" == "$(jq -er .releaseSetId "$plan")" ]]
          [[ "$(jq -er .sourceCommit "$manifest")" == "${{ needs.plan.outputs.source_commit }}" ]]
          [[ -s "restored-release/$(jq -er .artifactNames.enginePackage "$plan")" ]]
          [[ -s restored-release/publication-results.json ]]
          mkdir -p finalized-release
          cp -a restored-release/. finalized-release/
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.restore-result.outputs.restored != 'true'
        with:
          name: ${{ needs.cloud-v2.outputs.result_artifact }}
          path: release-input/cloud-v2

      - uses: actions/download-artifact@v4
        if: steps.restore-result.outputs.restored != 'true'
        with:
          name: ${{ needs.runtime-image.outputs.result_artifact }}
          path: release-input/runtime-image

      - uses: actions/download-artifact@v4
        if: steps.restore-result.outputs.restored != 'true'
        with:
          name: ${{ needs.ota.outputs.result_artifact }}
          path: release-input/ota

      - uses: actions/download-artifact@v4
        if: steps.restore-result.outputs.restored != 'true'
        with:
          name: ${{ needs.plan.outputs.npm_artifact }}
          path: release-input/npm

      - uses: actions/download-artifact@v4
        if: steps.restore-result.outputs.restored != 'true'
        with:
          name: ${{ needs.sdk-native.outputs.result_artifact }}
          path: release-input/sdk-native

      - name: Download and validate complete mobile publication evidence
        if: steps.restore-result.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_ARTIFACT: ${{ needs.mobile.outputs.result_artifact }}
          RELEASE_SET_ID: ${{ needs.plan.outputs.release_set_id }}
        run: |
          set -euo pipefail
          # The large mobile archive must finish extracting before assembly can
          # see it. Keep the CLI's original download/extraction failure intact.
          test ! -e release-input/mobile
          download=$(mktemp -d release-input/.mobile-download.XXXXXX)
          trap 'rm -rf -- "$download"' EXIT
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$MOBILE_ARTIFACT" --dir "$download"
          test -s "$download/mobile-publications.json"
          jq -e --arg release_set "$RELEASE_SET_ID" \
            '.releaseSetId == $release_set' "$download/mobile-publications.json" > /dev/null
          mv "$download" release-input/mobile

      - name: Assemble complete publication evidence
        id: results
        run: |
          set -euo pipefail
          mkdir -p finalized-release
          plan=release-input/plan/release-plan.json
          identity=$(jq -er .releaseIdentity "$plan")
          tag=$(jq -er .artifactContainerTag "$plan")
          plan_name=$(jq -er .artifactNames.releasePlan "$plan")
          manifest_name=$(jq -er .artifactNames.releaseManifest "$plan")
          engine_name=$(jq -er .artifactNames.enginePackage "$plan")
          if [[ "${{ steps.restore-result.outputs.restored }}" != "true" ]]; then
            asg_selection="release-input/ota/release-assets/$(jq -er .artifactNames.asgSelection "$plan")"
            test -f "$asg_selection"
            engine_package=$(find release-input/npm -type f -name 'mentra-engine-*.tgz' -print -quit)
            test -n "$engine_package"
            node .github/scripts/assemble-coordinated-release-results.mjs \
              --plan "$plan" \
              --ota release-input/ota/ota-result.json \
              --npm release-input/npm/npm-publications.json \
              --native release-input/sdk-native/sdk-native-publications.json \
              --mobile release-input/mobile/mobile-publications.json \
              --cloud release-input/cloud-v2/cloud-v2-deployment.json \
              --runtime-image release-input/runtime-image/runtime-image-publication.json \
              --asg-selection "$asg_selection" \
              --engine-package "$engine_package" \
              --release-asset-base-url "https://artifactscdn.mentraglass.com/${GITHUB_REPOSITORY}/releases/$tag" \
              --output finalized-release/publication-results.json
            cp "$plan" "finalized-release/$plan_name"
            cp "$engine_package" "finalized-release/$engine_name"
          fi
          {
            echo "tag=$tag"
            echo "identity=$identity"
            echo "plan_name=$plan_name"
            echo "manifest_name=$manifest_name"
            echo "engine_name=$engine_name"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve and verify the exact release container
        id: release-container
        if: needs.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.results.outputs.tag }}"
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${{ needs.plan.outputs.release_id }}")
          [[ "$(jq -r .tag_name <<< "$release")" == "$tag" ]]
          [[ "$(jq -r .name <<< "$release")" == "$(jq -er .artifactContainerName release-input/plan/release-plan.json)" ]]
          [[ "$(jq -r .draft <<< "$release")" == "false" ]]
          [[ "$(jq -r .prerelease <<< "$release")" == "true" ]]
          echo "release_id=${{ needs.plan.outputs.release_id }}" >> "$GITHUB_OUTPUT"

      - name: Finalize release manifest
        if: needs.plan.outputs.dry_run != 'true' && steps.restore-result.outputs.restored != 'true'
        run: >-
          node .github/scripts/finalize-release-manifest.mjs
          --plan release-input/plan/release-plan.json
          --results finalized-release/publication-results.json
          --completed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          --output "finalized-release/${{ steps.results.outputs.manifest_name }}"

      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.dry_run != 'true' && steps.restore-result.outputs.restored != 'true'
        with:
          name: coordinated-release-result-${{ needs.plan.outputs.release_set_id }}
          path: finalized-release
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable plan, package, and manifest assets
        if: needs.plan.outputs.dry_run != 'true'
        env:
          ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_R2_ACCESS_KEY_ID }}
          ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in \
            "${{ steps.results.outputs.plan_name }}" \
            "${{ steps.results.outputs.engine_name }}" \
            "${{ steps.results.outputs.manifest_name }}"; do
            node .github/scripts/publish-immutable-release-asset.mjs \
              --file "finalized-release/$name" \
              --name "$name" \
              --release-id "${{ steps.release-container.outputs.release_id }}" \
              --repository "${{ github.repository }}"
          done

      - name: Tag and verify the completed release set
        if: needs.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_tag="mentra-v${{ steps.results.outputs.identity }}"
          if ! ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$source_tag" 2>/dev/null); then
            ref=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$source_tag" \
              -f sha="${{ needs.plan.outputs.source_commit }}")
          fi
          [[ "$(jq -r .object.sha <<< "$ref")" == "${{ needs.plan.outputs.source_commit }}" ]]
          url="https://artifactscdn.mentraglass.com/${GITHUB_REPOSITORY}/releases/${{ steps.results.outputs.tag }}/${{ steps.results.outputs.manifest_name }}"
          node .github/scripts/verify-public-release-asset.mjs \
            --file "finalized-release/${{ steps.results.outputs.manifest_name }}" \
            --url "$url"

      - name: Summarize completed release
        run: |
          {
            echo "## Coordinated release result"
            echo ""
            echo "- Release: \`${{ steps.results.outputs.identity }}\`"
            echo "- Source: \`${{ needs.plan.outputs.source_commit }}\`"
            echo "- Cloud deployment: \`$(jq -er .cloud.deploymentId finalized-release/publication-results.json 2>/dev/null || echo validated-only)\`"
            echo "- Runtime image: \`$(jq -er '.runtimeImage.reference // "validated-only"' finalized-release/publication-results.json)\`"
            echo "- OTA manifest: ${{ needs.ota.outputs.manifest_url }}"
            echo "- Dry run: \`${{ needs.plan.outputs.dry_run }}\`"
            if [[ "${{ needs.plan.outputs.dry_run }}" != "true" ]]; then
              echo "- GitHub release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/mentra-v${{ steps.results.outputs.identity }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The one writer of the dev or beta download page: after finalize and the
  # examples, so the page lists the example apps when they were published.
  release-page:
    name: Publish versioned release download page
    needs: [plan, finalize, examples]
    if: always() && needs.plan.outputs.dry_run != 'true' && needs.finalize.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Retry page creation from archived, completed evidence. It must never
      # regenerate timestamps or republish immutable artifacts on a retry.
      - uses: actions/download-artifact@v4
        with:
          name: coordinated-release-result-${{ needs.plan.outputs.release_set_id }}
          path: release-page-input

      - name: Publish direct app downloads from the completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/publish-coordinated-release-page.mjs
          --plan "release-page-input/mentra-release-plan-${{ needs.plan.outputs.release_identity }}.json"
          --manifest "release-page-input/mentra-release-${{ needs.plan.outputs.release_identity }}.json"
          --examples "${{ needs.examples.result == 'success' }}"
          --repository "${{ github.repository }}"

  # The Bluetooth examples build from examples/bluetooth at the release's
  # source, stamped with the same release metadata and OTA pin as the Mentra
  # App, in parallel with the package and app builds, and upload their files
  # to the release container. Finalize never waits for them.
  examples:
    name: Build the Bluetooth examples from source
    needs: [plan, ota]
    if: needs.plan.outputs.dry_run != 'true'
    uses: ./.github/workflows/reusable-bluetooth-examples.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      ota_manifest_url: ${{ needs.ota.outputs.manifest_url }}
      ota_manifest_sha256: ${{ needs.ota.outputs.manifest_sha256 }}
      release_id: ${{ needs.plan.outputs.release_id }}
      desktop: false
    secrets: inherit

  example-testflight:
    name: Publish React Native example to TestFlight
    needs: [plan, ota, finalize]
    # A dry run publishes nothing to the stores.
    if: needs.plan.outputs.dry_run != 'true'
    uses: ./.github/workflows/reusable-coordinated-example-testflight.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      ota_manifest_url: ${{ needs.ota.outputs.manifest_url }}
      ota_manifest_sha256: ${{ needs.ota.outputs.manifest_sha256 }}
      testflight_group: ${{ needs.plan.outputs.testflight_group }}
      testflight_audience: ${{ needs.plan.outputs.testflight_audience }}
    secrets: inherit

  example-google-play:
    name: Publish React Native example to Google Play
    needs: [plan, ota, finalize]
    # A dry run publishes nothing to the stores.
    if: needs.plan.outputs.dry_run != 'true'
    uses: ./.github/workflows/reusable-coordinated-example-google-play.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      release_plan_artifact: ${{ needs.plan.outputs.plan_artifact }}
      ota_manifest_url: ${{ needs.ota.outputs.manifest_url }}
      ota_manifest_sha256: ${{ needs.ota.outputs.manifest_sha256 }}
      release_id: ${{ needs.plan.outputs.release_id }}
      play_track: ${{ needs.plan.outputs.play_track }}
    secrets: inherit

  docs:
    # Android docs link to the published example APK, so Play publication is
    # not a prerequisite for this deployment.
    name: Publish release-matched documentation
    needs: [plan, examples, example-testflight]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      docs_url: ${{ steps.target.outputs.docs_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: release-input/plan

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.example-testflight.outputs.result_artifact }}
          path: release-input/example-testflight

      - name: Select the documentation channel
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            dev)
              echo "project=mentraos-docs-dev" >> "$GITHUB_OUTPUT"
              echo "pages_branch=dev" >> "$GITHUB_OUTPUT"
              echo "docs_url=https://docs-dev.mentraglass.com" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "project=mentraos-docs-beta" >> "$GITHUB_OUTPUT"
              echo "pages_branch=staging" >> "$GITHUB_OUTPUT"
              echo "docs_url=https://docs-beta.mentraglass.com" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported documentation branch $BRANCH" >&2
              exit 1
              ;;
          esac

      - name: Render the exact release version into a temporary docs tree
        run: >-
          node .github/scripts/render-coordinated-docs.mjs
          --source mintlify-docs
          --output "$RUNNER_TEMP/mentraos-docs-source"
          --plan release-input/plan/release-plan.json
          --example-apk-url "${{ needs.examples.outputs.react_native_url }}"
          --example-testflight "$(find release-input/example-testflight -type f -name 'example-testflight-publication.json' -print -quit)"
          --repository "${{ github.repository }}"

      - name: Export Mintlify docs
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mentraos-docs-source"
          bunx --bun mint export --output "$RUNNER_TEMP/mentraos-docs.zip"

      - name: Prepare and verify the Cloudflare Pages artifact
        env:
          RELEASE_IDENTITY: ${{ needs.plan.outputs.release_identity }}
          EXAMPLE_APK_URL: ${{ needs.examples.outputs.react_native_url }}
          EXAMPLE_IOS_URL: ${{ needs.example-testflight.outputs.install_url }}
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/mentraos-docs"
          rm -rf "$export_dir"
          mkdir -p "$export_dir"
          unzip -q "$RUNNER_TEMP/mentraos-docs.zip" -d "$export_dir"
          cat > "$export_dir/_headers" <<'HEADERS'
          /*
            Cache-Control: public, max-age=0, must-revalidate
            X-Robots-Tag: noindex
          HEADERS
          if grep -R --extended-regexp --ignore-case --quiet '\{\{[a-z0-9_-]+\}\}|%7b%7b[a-z0-9_-]+%7d%7d' "$export_dir/bluetooth-sdk"; then
            echo "Mintlify export contains an unresolved documentation variable." >&2
            exit 1
          fi
          node .github/scripts/verify-coordinated-docs.mjs \
            "$export_dir/bluetooth-sdk/software-update/index.html"
          # Mintlify's static export does not emit docs.json redirects.
          cat >> "$export_dir/_redirects" <<'REDIRECTS'
          /mentra-live/software-update /bluetooth-sdk/software-update/ 301
          /mentra-live/software-update/ /bluetooth-sdk/software-update/ 301
          REDIRECTS

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          PROJECT: ${{ steps.target.outputs.project }}
          PAGES_BRANCH: ${{ steps.target.outputs.pages_branch }}
          RELEASE_IDENTITY: ${{ needs.plan.outputs.release_identity }}
        run: |
          set -euo pipefail
          npx wrangler@4.86.0 pages deploy "$RUNNER_TEMP/mentraos-docs" \
            --project-name "$PROJECT" \
            --branch "$PAGES_BRANCH" \
            --commit-hash "${{ needs.plan.outputs.source_commit }}" \
            --commit-message "Deploy MentraOS docs for $RELEASE_IDENTITY" \
            --commit-dirty=true

      # Purging accelerates propagation; the required live-page check below
      # determines whether the exact release is available to users.
      - name: Purge release-sensitive documentation routes
        continue-on-error: true
        timeout-minutes: 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          DOCS_URL: ${{ steps.target.outputs.docs_url }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ZONE_ID" ]] || {
            echo "CLOUDFLARE_ZONE_ID repository variable is required." >&2
            exit 1
          }
          payload="$(jq -nc \
            --arg canonical "$DOCS_URL/bluetooth-sdk/software-update/" \
            --arg canonical_no_slash "$DOCS_URL/bluetooth-sdk/software-update" \
            --arg legacy "$DOCS_URL/mentra-live/software-update/" \
            --arg legacy_no_slash "$DOCS_URL/mentra-live/software-update" \
            '{files: [$canonical, $canonical_no_slash, $legacy, $legacy_no_slash]}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache")"
          jq --exit-status '.success == true' <<< "$response" >/dev/null

      - name: Verify the published custom domain
        env:
          DOCS_URL: ${{ steps.target.outputs.docs_url }}
          RELEASE_IDENTITY: ${{ needs.plan.outputs.release_identity }}
          EXAMPLE_APK_URL: ${{ needs.examples.outputs.react_native_url }}
          EXAMPLE_IOS_URL: ${{ needs.example-testflight.outputs.install_url }}
        run: |
          set -euo pipefail
          canonical_page="$DOCS_URL/bluetooth-sdk/software-update/"
          legacy_page="$DOCS_URL/mentra-live/software-update/"
          body="$RUNNER_TEMP/software-update.html"
          headers="$RUNNER_TEMP/software-update.headers"
          page_is_current() {
            local page="$1"
            curl --fail --silent --show-error --location \
              --dump-header "$headers" --output "$body" "$page" && \
              grep --fixed-strings --quiet "$RELEASE_IDENTITY" "$body" && \
              grep --fixed-strings --quiet "href=\"$EXAMPLE_APK_URL\"" "$body" && \
              grep --fixed-strings --quiet "href=\"$EXAMPLE_IOS_URL\"" "$body" && \
              grep --ignore-case --quiet '^x-robots-tag:.*noindex' "$headers" && \
              ! grep --extended-regexp --ignore-case --quiet \
                '\{\{[a-z0-9_-]+\}\}|%7b%7b[a-z0-9_-]+%7d%7d' "$body"
          }
          for _ in {1..18}; do
            if page_is_current "$canonical_page" && page_is_current "$legacy_page"; then
              echo "Verified $canonical_page and $legacy_page for $RELEASE_IDENTITY"
              exit 0
            fi
            sleep 10
          done
          echo "Published docs did not converge to $RELEASE_IDENTITY at $canonical_page and $legacy_page" >&2
          exit 1

  notify-slack:
    name: Notify release Slack channel
    environment: build-notifications
    needs:
      [
        plan,
        cloud-v2,
        runtime-image,
        private-deployment,
        ota,
        npm,
        sdk-native,
        mobile,
        engine-consumer,
        finalize,
        release-page,
        examples,
        example-testflight,
        example-google-play,
        docs,
      ]
    if: always() && github.event_name == 'push'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Post coordinated release result
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_BUILDS }}
          DEV_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DEV_BUILDS }}
          SLACK_BUILDS_BOT_TOKEN: ${{ secrets.SLACK_BUILDS_BOT_TOKEN }}
          TEST_RUN_INGEST_TOKEN: ${{ secrets.TEST_RUN_INGEST_TOKEN_DEV }}
          SLACK_DEV_BUILDS_CHANNEL_ID: ${{ vars.SLACK_DEV_BUILDS_CHANNEL_ID }}
          SLACK_STAGING_BUILDS_CHANNEL_ID: ${{ vars.SLACK_STAGING_BUILDS_CHANNEL_ID }}
          RELEASE_PAGE_RESULT: ${{ needs.release-page.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
          EXAMPLE_APK_URL: ${{ needs.examples.outputs.react_native_url }}
          EXAMPLE_TESTFLIGHT_RESULT: ${{ needs.example-testflight.result }}
          EXAMPLE_TESTFLIGHT_INSTALL_URL: ${{ needs.example-testflight.outputs.install_url }}
          EXAMPLE_GOOGLE_PLAY_RESULT: ${{ needs.example-google-play.result }}
          EXAMPLE_GOOGLE_PLAY_INSTALL_URL: ${{ needs.example-google-play.outputs.install_url }}
          DOCS_RESULT: ${{ needs.docs.result }}
          DOCS_URL: ${{ needs.docs.outputs.docs_url }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          RELEASE_IDENTITY: ${{ needs.plan.outputs.release_identity }}
          PLAY_TRACK: ${{ needs.plan.outputs.play_track }}
          UPLOAD_GOOGLE_PLAY: ${{ needs.plan.outputs.upload_google_play }}
          PLAY_INSTALL_URL: ${{ needs.mobile.outputs.play_install_url }}
          TESTFLIGHT_GROUP: ${{ needs.plan.outputs.testflight_group }}
          TESTFLIGHT_DISTRIBUTION_STATUS: ${{ needs.mobile.outputs.testflight_distribution_status }}
          TESTFLIGHT_INSTALL_URL: ${{ needs.mobile.outputs.testflight_install_url }}
          TESTFLIGHT_REVIEW_STATE: ${{ needs.mobile.outputs.testflight_review_state }}
          PLAN_RESULT: ${{ needs.plan.result }}
          CLOUD_V2_RESULT: ${{ needs.cloud-v2.result }}
          RUNTIME_IMAGE_RESULT: ${{ needs.runtime-image.result }}
          PRIVATE_DEPLOYMENT_RESULT: ${{ needs.private-deployment.result }}
          OTA_RESULT: ${{ needs.ota.result }}
          NPM_RESULT: ${{ needs.npm.result }}
          SDK_NATIVE_RESULT: ${{ needs.sdk-native.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          ANDROID_RESULT: ${{ needs.mobile.outputs.android_result }}
          IOS_RESULT: ${{ needs.mobile.outputs.ios_result }}
          ENGINE_RESULT: ${{ needs.engine-consumer.result }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
          APK_NAME: ${{ needs.mobile.outputs.apk_name }}
          IPA_NAME: ${{ needs.mobile.outputs.ipa_name }}
          MOBILE_APK_URL: ${{ needs.mobile.outputs.apk_url }}
          IPHONE_MANIFEST_URL: ${{ needs.mobile.outputs.iphone_manifest_url }}
          IPHONE_SHARE_URL: ${{ needs.mobile.outputs.iphone_share_url }}
          MAC_URL: ${{ needs.mobile.outputs.mac_url }}
          OTA_MANIFEST_URL: ${{ needs.ota.outputs.manifest_url }}
          MOBILE_IPA_URL: ${{ needs.mobile.outputs.ipa_url }}
          ASG_APK_NAME: ${{ needs.ota.outputs.asg_apk_name }}
          ASG_APK_URL: ${{ needs.ota.outputs.asg_apk_url }}
        run: .github/scripts/notify-coordinated-release-slack.sh

      - name: Retain the exact editable release message
        if: always() && hashFiles('slack-release-message.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-slack-message-${{ github.run_id }}-${{ github.run_attempt }}
          path: slack-release-message.json
          if-no-files-found: error
