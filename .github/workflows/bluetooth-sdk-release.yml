name: Release Bluetooth SDK

# Channel promotion (see .github/scripts/npm-channel.mjs): git holds one
# prerelease base version (X.Y.Z-dev.N, only edited on dev) and the branch
# derives what publishes:
#   dev                -> X.Y.Z-dev.N   (npm dev tag)
#   staging            -> X.Y.Z-beta.N  (npm beta tag)
#   main-bluetooth-sdk -> X.Y.Z         (npm latest tag)
# Merging up the chain IS the promotion; no version edits ride the branches.
# The SDK's prod branch is main-bluetooth-sdk, NOT main — merge staging into it
# when the SDK should go public, independently of the monorepo's main.
#
# Publish mode per channel, aligned across all three stores: dev releases go
# straight out; staging/prod releases are STAGED and a human approves each one
# in the store's own UI —
#   npm:     `npm stage publish --tag` -> approve in npmjs.com's staging queue
#   maven:   Sonatype Central upload with publishing_type=user_managed ->
#            publish at https://central.sonatype.com/publishing/deployments
#   swiftpm: SPM resolves TAGS only, so the export+commit is invisible until
#            the tag lands; the tag-push job sits behind the protected
#            `bluetooth-sdk-release-approval` GitHub environment and waits for
#            a reviewer's approval in the Actions UI.
#
# Detection is registry-state across all three stores (a promotion merge does
# not change the version field, so the release fires when the derived version
# is missing from ANY store; each job still re-checks and skips its own store).
# No paths filter, deliberately: every push to a channel branch reconciles, and
# the detect job no-ops in seconds when all stores are complete.

on:
  push:
    branches:
      - dev
      - staging
      - main-bluetooth-sdk
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build/export/publish dry-runs without uploading artifacts"
        required: true
        default: true
        type: boolean
      force_release:
        description: "Run release jobs even when every store already has the derived version (immutable stores still skip themselves)."
        required: true
        default: false
        type: boolean

concurrency:
  group: bluetooth-sdk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  SDK_OTA_RELEASE_TAG: bluetooth-sdk-ota
  SDK_PACKAGE_DIR: mobile/modules/bluetooth-sdk
  SDK_PACKAGE_JSON: mobile/modules/bluetooth-sdk/package.json

jobs:
  detect:
    name: Detect SDK version change
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.release-info.outputs.package_name }}
      version: ${{ steps.release-info.outputs.version }}
      base_version: ${{ steps.release-info.outputs.base_version }}
      dist_tag: ${{ steps.release-info.outputs.dist_tag }}
      npm_exists: ${{ steps.release-info.outputs.npm_exists }}
      maven_exists: ${{ steps.release-info.outputs.maven_exists }}
      swiftpm_exists: ${{ steps.release-info.outputs.swiftpm_exists }}
      force_release: ${{ steps.release-info.outputs.force_release }}
      run_release: ${{ steps.release-info.outputs.run_release }}
      dry_run: ${{ steps.release-info.outputs.dry_run }}
      swiftpm_tag: ${{ steps.release-info.outputs.swiftpm_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        # Depth 1 is fine: the decision reads the working tree + the three
        # stores' registry state, never git history.

      - name: Decide release for this channel
        id: release-info
        run: node .github/scripts/bluetooth-sdk-release-info.mjs
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}

      - name: Verify iOS SDK version is package-derived
        run: |
          set -euo pipefail
          if grep -Fq "compiledSdkVersion" mobile/modules/bluetooth-sdk/ios/Source/BluetoothSdkDefaults.swift; then
            echo "BluetoothSdkDefaults.swift must not hardcode the SDK version; iOS OTA defaults must use package metadata." >&2
            exit 1
          fi
          if grep -Fq "packageVersion(from:" mobile/modules/bluetooth-sdk/ios/Source/BluetoothSdkDefaults.swift \
            || grep -Fq "Bundle(for: BluetoothSdkBundleToken.self)" mobile/modules/bluetooth-sdk/ios/Source/BluetoothSdkDefaults.swift; then
            echo "BluetoothSdkDefaults.swift must not derive the SDK version from iOS bundle metadata." >&2
            exit 1
          fi
          if ! grep -Fq "normalizedSdkVersion(swiftPackageSdkVersion)" mobile/modules/bluetooth-sdk/ios/Source/BluetoothSdkDefaults.swift; then
            echo "BluetoothSdkDefaults.swift must derive the SDK version from the packed SDK version." >&2
            exit 1
          fi

      - name: Setup Bun for release preflight
        if: steps.release-info.outputs.run_release == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate root Bun lockfile
        if: steps.release-info.outputs.run_release == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate mobile Bun lockfile
        if: steps.release-info.outputs.run_release == 'true'
        working-directory: mobile
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Summarize release decision
        run: |
          {
            echo "## Bluetooth SDK release decision"
            echo ""
            echo "- Package: \`${{ steps.release-info.outputs.package_name }}\`"
            echo "- Base version: \`${{ steps.release-info.outputs.base_version }}\` -> derived \`${{ steps.release-info.outputs.version }}\` (dist-tag \`${{ steps.release-info.outputs.dist_tag }}\`)"
            echo "- Already released — npm: \`${{ steps.release-info.outputs.npm_exists }}\`, maven: \`${{ steps.release-info.outputs.maven_exists }}\`, swiftpm: \`${{ steps.release-info.outputs.swiftpm_exists }}\`"
            echo "- Dry run: \`${{ steps.release-info.outputs.dry_run }}\`"
            echo "- Run release jobs: \`${{ steps.release-info.outputs.run_release }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  sdk-ota:
    name: Publish SDK-pinned ASG OTA manifest
    needs: detect
    if: needs.detect.outputs.run_release == 'true'
    # Pinned to the mac runners: they have the ASG signing keystore provisioned
    # (~/.mentra/credentials + ~/.gradle/gradle.properties), the Linux Azure VM doesn't.
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      manifest_url: ${{ steps.sdk-ota-info.outputs.manifest_url }}
      bundle_url: ${{ steps.sdk-ota-info.outputs.bundle_url }}
      version_code: ${{ steps.existing-sdk-ota.outputs.version_code || steps.asg-build-info.outputs.version_code }}
      version_name: ${{ steps.existing-sdk-ota.outputs.version_name || steps.asg-build-info.outputs.version_name }}
    steps:
      - name: Get cache week number
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Clean build artifacts (preserve caches)
        # Includes the submodule worktree: this job runs on a persistent self-hosted
        # runner, actions/checkout does not clean submodule worktrees, and submodule
        # init does not remove ignored build outputs (core/build, extensions/*/build)
        # — stale StreamPackLite products would survive across release runs. Removal
        # is cheap: the submodule git dir lives under .git/modules, so init
        # re-checks-out locally instead of re-cloning.
        run: |
          rm -rf asg_client/app/build asg_client/.gradle asg_client/StreamPackLite

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute ASG build info
        id: asg-build-info
        env:
          SDK_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          EPOCH_OFFSET_SECONDS=1735689600
          BASELINE=100000
          NOW_SECONDS=$(git show -s --format=%ct HEAD)
          VERSION_CODE=$((BASELINE + NOW_SECONDS - EPOCH_OFFSET_SECONDS))
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_NAME="${SDK_VERSION}"

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare SDK OTA release names
        id: sdk-ota-info
        env:
          SDK_VERSION: ${{ needs.detect.outputs.version }}
          SHORT_SHA: ${{ steps.asg-build-info.outputs.short_sha }}
          VERSION_CODE: ${{ steps.asg-build-info.outputs.version_code }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SDK_VERSION" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]*$'; then
            echo "Unsafe SDK version for OTA path: $SDK_VERSION" >&2
            exit 1
          fi
          APK_ASSET="asg-client-sdk-${SDK_VERSION}-vc${VERSION_CODE}-${SHORT_SHA}.apk"
          MANIFEST_ASSET="bluetooth-sdk-${SDK_VERSION}-version.json"
          BUNDLE_ASSET="bluetooth-sdk-${SDK_VERSION}-ota-bundle.zip"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SDK_OTA_RELEASE_TAG}/${APK_ASSET}"
          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SDK_OTA_RELEASE_TAG}/${MANIFEST_ASSET}"
          BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SDK_OTA_RELEASE_TAG}/${BUNDLE_ASSET}"

          echo "apk_asset=${APK_ASSET}" >> "$GITHUB_OUTPUT"
          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"
          echo "manifest_asset=${MANIFEST_ASSET}" >> "$GITHUB_OUTPUT"
          echo "manifest_url=${MANIFEST_URL}" >> "$GITHUB_OUTPUT"
          echo "bundle_asset=${BUNDLE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "bundle_url=${BUNDLE_URL}" >> "$GITHUB_OUTPUT"

      - name: Check existing SDK OTA manifest
        id: existing-sdk-ota
        if: needs.detect.outputs.dry_run != 'true'
        env:
          MANIFEST_URL: ${{ steps.sdk-ota-info.outputs.manifest_url }}
          BUNDLE_URL: ${{ steps.sdk-ota-info.outputs.bundle_url }}
        run: |
          set -euo pipefail

          http_status=$(curl --silent --show-error --location \
            --output /tmp/sdk_ota_version.json \
            --write-out "%{http_code}" \
            "$MANIFEST_URL" || true)

          if [[ "$http_status" == "404" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "bundle_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$http_status" != "200" ]]; then
            echo "Unexpected HTTP ${http_status} while checking ${MANIFEST_URL}" >&2
            exit 1
          fi

          jq -e \
            '.apps["com.mentra.asg_client"].versionCode
              and .apps["com.mentra.asg_client"].versionName
              and (.mtk_patches | type == "array" and length > 0)
              and (.bes_firmware | type == "object")' \
            /tmp/sdk_ota_version.json >/dev/null

          version_code=$(jq -er '.apps["com.mentra.asg_client"].versionCode' /tmp/sdk_ota_version.json)
          version_name=$(jq -er '.apps["com.mentra.asg_client"].versionName' /tmp/sdk_ota_version.json)

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "Reusing existing SDK OTA manifest at ${MANIFEST_URL}."

          bundle_status=$(curl --silent --show-error --head --location \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$BUNDLE_URL" || true)
          if [[ "$bundle_status" == "200" ]]; then
            echo "bundle_exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing portable OTA bundle at ${BUNDLE_URL}."
          elif [[ "$bundle_status" == "404" ]]; then
            echo "bundle_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected HTTP ${bundle_status} while checking ${BUNDLE_URL}" >&2
            exit 1
          fi

      - name: Setup Java
        if: steps.existing-sdk-ota.outputs.exists != 'true'
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        if: steps.existing-sdk-ota.outputs.exists != 'true'
        uses: android-actions/setup-android@v2

      - name: Setup ASG environment
        if: steps.existing-sdk-ota.outputs.exists != 'true'
        working-directory: ./asg_client
        run: cp .env.example .env

      - name: Init StreamPackLite submodule
        # After (and gated on) the existing-manifest check: a reused SDK OTA manifest
        # needs no ASG build, so no StreamPackLite fetch and no exposure to a
        # transient submodule fetch failure.
        # Path-scoped on purpose: .gitmodules also carries a dangling
        # mcu_client/peripheral_uart_next/nrf5340 entry with an unfetchable relative
        # self-URL; a blanket recursive init would break if its gitlink ever lands.
        if: steps.existing-sdk-ota.outputs.exists != 'true'
        run: git submodule update --init asg_client/StreamPackLite

      - name: Cache Gradle dependencies
        if: steps.existing-sdk-ota.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: asg-gradle-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-${{ hashFiles('asg_client/**/*.gradle*', 'asg_client/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            asg-gradle-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-
            asg-gradle-${{ runner.os }}-

      - name: Build recovery worker asset
        if: steps.existing-sdk-ota.outputs.exists != 'true'
        working-directory: ./asg_client/recovery_worker
        run: |
          chmod +x ./build_and_deploy.sh
          ./build_and_deploy.sh
          test -f ../app/src/main/assets/recovery_worker.apk

      - name: Build ASG release APK
        id: gradle-build
        if: steps.existing-sdk-ota.outputs.exists != 'true'
        working-directory: ./asg_client
        run: ./gradlew -PASG_VERSION_CODE="${{ steps.asg-build-info.outputs.version_code }}" -PASG_VERSION_NAME="${{ steps.asg-build-info.outputs.version_name }}" assembleRelease --build-cache --parallel
        continue-on-error: true

      - name: Retry ASG build with clean cache
        if: steps.existing-sdk-ota.outputs.exists != 'true' && steps.gradle-build.outcome == 'failure'
        working-directory: ./asg_client
        run: |
          echo "First ASG build failed, cleaning Gradle cache and retrying..."
          ./gradlew --stop || true
          rm -rf ~/.gradle/caches ~/.gradle/wrapper || true
          ./gradlew -PASG_VERSION_CODE="${{ steps.asg-build-info.outputs.version_code }}" -PASG_VERSION_NAME="${{ steps.asg-build-info.outputs.version_name }}" assembleRelease --build-cache --parallel

      - name: Collect ASG APK info
        id: asg-apk-info
        if: steps.existing-sdk-ota.outputs.exists != 'true'
        run: |
          set -euo pipefail
          APK="asg_client/app/build/outputs/apk/release/app-release.apk"
          if command -v shasum >/dev/null 2>&1; then
            SHA256=$(shasum -a 256 "$APK" | awk '{print $1}')
          else
            SHA256=$(sha256sum "$APK" | awk '{print $1}')
          fi
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "size=$(wc -c < "$APK" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Generate SDK OTA manifest
        if: steps.existing-sdk-ota.outputs.exists != 'true'
        env:
          ASG_APK_SHA256: ${{ steps.asg-apk-info.outputs.sha256 }}
          ASG_APK_SIZE: ${{ steps.asg-apk-info.outputs.size }}
          ASG_APK_URL: ${{ steps.sdk-ota-info.outputs.apk_url }}
          ASG_VERSION_CODE: ${{ steps.asg-build-info.outputs.version_code }}
          ASG_VERSION_NAME: ${{ steps.asg-build-info.outputs.version_name }}
          FIRMWARE_MANIFEST: asg_client/ota_manifests/firmware_live.json
          OUTPUT_PATH: sdk-ota-manifest/version.json
          SDK_VERSION: ${{ needs.detect.outputs.version }}
        run: node .github/scripts/build-bluetooth-sdk-ota-manifest.mjs

      - name: Build portable self-hosted OTA bundle
        if: steps.existing-sdk-ota.outputs.bundle_exists != 'true'
        env:
          APK_URL: ${{ steps.sdk-ota-info.outputs.apk_url }}
          BUNDLE_ASSET: ${{ steps.sdk-ota-info.outputs.bundle_asset }}
          BUNDLE_DIRECTORY: bluetooth-sdk-${{ needs.detect.outputs.version }}-ota
          EXISTING_MANIFEST: ${{ steps.existing-sdk-ota.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "$EXISTING_MANIFEST" == "true" ]]; then
            MANIFEST_SOURCE=/tmp/sdk_ota_version.json
            LOCAL_ARTIFACTS_JSON='{}'
          else
            MANIFEST_SOURCE=sdk-ota-manifest/version.json
            LOCAL_ARTIFACTS_JSON=$(jq -cn \
              --arg url "$APK_URL" \
              --arg path "asg_client/app/build/outputs/apk/release/app-release.apk" \
              '{($url): $path}')
          fi

          rm -rf "$BUNDLE_DIRECTORY"
          mkdir -p sdk-ota-bundle
          rm -f "sdk-ota-bundle/$BUNDLE_ASSET"
          MANIFEST_SOURCE="$MANIFEST_SOURCE" \
          OUTPUT_DIRECTORY="$BUNDLE_DIRECTORY" \
          LOCAL_ARTIFACTS_JSON="$LOCAL_ARTIFACTS_JSON" \
            node .github/scripts/build-bluetooth-sdk-ota-bundle.mjs

          node "$BUNDLE_DIRECTORY/configure.mjs" \
            "https://updates.example.invalid/mentra/version.json"
          jq -e '
            (.apps | all(.[]; (.apkUrl | test("^https?://"))))
            and (.mtk_patches | all(.[]; ((.url // .firmwareUrl) | test("^https?://"))))
            and ((.bes_firmware.url // .bes_firmware.firmwareUrl) | test("^https?://"))
          ' "$BUNDLE_DIRECTORY/version.json" >/dev/null
          rm "$BUNDLE_DIRECTORY/version.json"

          find "$BUNDLE_DIRECTORY" -exec touch -t 198001010000 {} +
          (
            cd "$BUNDLE_DIRECTORY"
            find . -type f -print \
              | LC_ALL=C sort \
              | sed 's#^\./##' \
              | zip -X -q "../sdk-ota-bundle/$BUNDLE_ASSET" -@
          )
          test -f "$BUNDLE_DIRECTORY/version.template.json"
          test -f "$BUNDLE_DIRECTORY/configure.mjs"
          test ! -e "$BUNDLE_DIRECTORY/version.json"
          zipinfo -1 "sdk-ota-bundle/$BUNDLE_ASSET" | grep -x 'version.template.json' >/dev/null
          if zipinfo -1 "sdk-ota-bundle/$BUNDLE_ASSET" | grep "^${BUNDLE_DIRECTORY}/" >/dev/null; then
            echo "Portable OTA ZIP unexpectedly contains a versioned directory prefix." >&2
            exit 1
          fi
          unzip -t "sdk-ota-bundle/$BUNDLE_ASSET"

      - name: Upload SDK OTA artifacts
        if: needs.detect.outputs.dry_run != 'true' && (steps.existing-sdk-ota.outputs.exists != 'true' || steps.existing-sdk-ota.outputs.bundle_exists != 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            function sha256(data) {
              return crypto.createHash('sha256').update(data).digest('hex');
            }

            const releaseBody = [
              'Persistent ASG OTA artifacts for Bluetooth SDK releases.',
              '',
              'Each SDK version owns an immutable manifest at:',
              '`https://github.com/Mentra-Community/MentraOS/releases/download/bluetooth-sdk-ota/bluetooth-sdk-<sdkVersion>-version.json`',
              '',
              'The matching `bluetooth-sdk-<sdkVersion>-ota-bundle.zip` contains the same artifacts plus a manifest template and configurator for absolute-URL self-hosting.',
              '',
              'Do not delete assets from this release unless the matching SDK version is intentionally retired.',
            ].join('\n');
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.SDK_OTA_RELEASE_TAG,
              });
            } catch (error) {
              if (error.status === 404) {
                release = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: process.env.SDK_OTA_RELEASE_TAG,
                  name: 'Bluetooth SDK OTA Artifacts',
                  body: releaseBody,
                  prerelease: true,
                  draft: false,
                });
              } else {
                throw error;
              }
            }

            const releaseId = release.data.id;
            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });
            const uploads = [];
            if ('${{ steps.existing-sdk-ota.outputs.exists }}' !== 'true') {
              uploads.push({
                path: 'asg_client/app/build/outputs/apk/release/app-release.apk',
                name: '${{ steps.sdk-ota-info.outputs.apk_asset }}',
              });
              uploads.push({
                path: 'sdk-ota-manifest/version.json',
                name: '${{ steps.sdk-ota-info.outputs.manifest_asset }}',
              });
            }
            if ('${{ steps.existing-sdk-ota.outputs.bundle_exists }}' !== 'true') {
              uploads.push({
                path: 'sdk-ota-bundle/${{ steps.sdk-ota-info.outputs.bundle_asset }}',
                name: '${{ steps.sdk-ota-info.outputs.bundle_asset }}',
              });
            }

            for (const upload of uploads) {
              const data = fs.readFileSync(upload.path);
              const existingAsset = existingAssets.find((asset) => asset.name === upload.name);
              if (existingAsset) {
                const existingResponse = await fetch(existingAsset.browser_download_url);
                if (!existingResponse.ok) {
                  throw new Error(`Failed to download existing SDK OTA release asset ${upload.name}: HTTP ${existingResponse.status}`);
                }
                const existingData = Buffer.from(await existingResponse.arrayBuffer());
                if (sha256(existingData) !== sha256(data)) {
                  throw new Error(`Refusing to overwrite immutable SDK OTA release asset ${upload.name}; existing content differs.`);
                }
                core.info(`Reusing existing SDK OTA release asset ${upload.name}.`);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: upload.name,
                data,
              });
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body: releaseBody,
            });

      - name: Verify SDK OTA manifest release asset
        if: needs.detect.outputs.dry_run != 'true'
        env:
          VERSION_CODE: ${{ steps.existing-sdk-ota.outputs.version_code || steps.asg-build-info.outputs.version_code }}
        run: |
          set -euo pipefail

          echo "Verifying ${{ steps.sdk-ota-info.outputs.manifest_url }}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "${{ steps.sdk-ota-info.outputs.manifest_url }}" -o /tmp/sdk_ota_version.json \
              && jq -e --argjson versionCode "$VERSION_CODE" \
                '.apps["com.mentra.asg_client"].versionCode == $versionCode
                  and (.mtk_patches | type == "array" and length > 0)
                  and (.bes_firmware | type == "object")' \
                /tmp/sdk_ota_version.json >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "SDK OTA manifest was not reachable at ${{ steps.sdk-ota-info.outputs.manifest_url }} after deploy." >&2
              exit 1
            fi
            sleep 10
          done

          for attempt in {1..12}; do
            bundle_status=$(curl --silent --show-error --head --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              "${{ steps.sdk-ota-info.outputs.bundle_url }}" || true)
            if [[ "$bundle_status" == "200" ]]; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Portable OTA bundle returned HTTP ${bundle_status} after deploy." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Summarize SDK OTA artifact
        run: |
          {
            echo "## Bluetooth SDK OTA artifact"
            echo ""
            echo "- SDK version: \`${{ needs.detect.outputs.version }}\`"
            echo "- ASG versionCode: \`${{ steps.existing-sdk-ota.outputs.version_code || steps.asg-build-info.outputs.version_code }}\`"
            echo "- ASG versionName: \`${{ steps.existing-sdk-ota.outputs.version_name || steps.asg-build-info.outputs.version_name }}\`"
            echo "- APK asset: \`${{ steps.existing-sdk-ota.outputs.exists == 'true' && 'reused from existing manifest' || steps.sdk-ota-info.outputs.apk_asset }}\`"
            echo "- Manifest URL: \`${{ steps.sdk-ota-info.outputs.manifest_url }}\`"
            echo "- Portable bundle URL: \`${{ steps.sdk-ota-info.outputs.bundle_url }}\`"
            echo "- Existing manifest reused: \`${{ steps.existing-sdk-ota.outputs.exists == 'true' }}\`"
            echo "- Existing portable bundle reused: \`${{ steps.existing-sdk-ota.outputs.bundle_exists == 'true' }}\`"
            echo "- Dry run: \`${{ needs.detect.outputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  npm:
    name: Publish npm package
    needs: [detect, sdk-ota]
    if: needs.detect.outputs.run_release == 'true' && (needs.detect.outputs.npm_exists != 'true' || needs.detect.outputs.dry_run == 'true' || needs.detect.outputs.force_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm with staged publishing support
        # Pinned major: the release-critical path must not pick up whatever npm
        # shipped this morning. `npm stage publish` needs >=11.15.0.
        run: |
          npm install -g npm@11
          npm stage --help >/dev/null 2>&1 || { echo "::error::this npm ($(npm --version)) lacks 'npm stage' — staged publishing needs >=11.15.0."; exit 1; }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-bluetooth-sdk-${{ hashFiles('mobile/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-bluetooth-sdk-

      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      # After the frozen install (which would reject a changed version field):
      # stamp the manifest to this channel's derived version — everything
      # downstream (build, pack, the iOS placeholder substitution) reads it.
      # Packed checkout only, never committed.
      - name: Stamp channel version
        working-directory: ${{ env.SDK_PACKAGE_DIR }}
        run: npm pkg set version="${{ needs.detect.outputs.version }}"

      - name: Build package
        working-directory: ${{ env.SDK_PACKAGE_DIR }}
        run: bun run build

      - name: Check npm registry
        id: npm-registry
        # Belt-and-braces re-check of the detect decision (E404-only absence).
        run: |
          set -euo pipefail
          set +e
          out=$(npm view "${{ needs.detect.outputs.package_name }}@${{ needs.detect.outputs.version }}" version --json --registry=https://registry.npmjs.org 2>&1)
          code=$?
          set -e
          if [[ $code -eq 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "npm already has ${{ needs.detect.outputs.package_name }}@${{ needs.detect.outputs.version }}."
          elif echo "$out" | grep -q '"code": *"E404"' || echo "$out" | grep -q "code E404"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view failed with a non-404 error — refusing to guess registry state." >&2
            echo "$out" >&2
            exit 1
          fi

      - name: Dry-run npm package
        if: steps.npm-registry.outputs.exists != 'true'
        working-directory: ${{ env.SDK_PACKAGE_DIR }}
        run: npm pack --dry-run

      - name: Verify packed npm iOS SDK version
        if: steps.npm-registry.outputs.exists != 'true'
        working-directory: ${{ env.SDK_PACKAGE_DIR }}
        env:
          SDK_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          trap 'rm -rf "$pack_dir"' EXIT

          npm pack --json --pack-destination "$pack_dir" > "$pack_dir/pack.json"
          tarball="$(find "$pack_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "npm pack did not produce a tarball." >&2
            exit 1
          fi

          mkdir "$pack_dir/unpacked"
          tar -xzf "$tarball" -C "$pack_dir/unpacked"

          packed_defaults="$pack_dir/unpacked/package/ios/Source/BluetoothSdkDefaults.swift"
          if ! grep -Fq "swiftPackageSdkVersion = \"${SDK_VERSION}\"" "$packed_defaults"; then
            echo "Packed npm iOS SDK did not contain SDK version ${SDK_VERSION}." >&2
            exit 1
          fi
          if grep -Fq "__MENTRA_BLUETOOTH_SDK_VERSION__" "$packed_defaults"; then
            echo "Packed npm iOS SDK still contains the SDK version placeholder." >&2
            exit 1
          fi
          if ! grep -Fq 'swiftPackageSdkVersion = "__MENTRA_BLUETOOTH_SDK_VERSION__"' ios/Source/BluetoothSdkDefaults.swift; then
            echo "npm pack did not restore the source SDK version placeholder." >&2
            exit 1
          fi

      # Direct publish on the dev channel (fast internal iteration, no
      # approval). Uses NPM_TOKEN: the package's npm Trusted Publisher is
      # configured for `npm stage publish` only.
      - name: Publish to npm (dev channel)
        if: needs.detect.outputs.dry_run != 'true' && steps.npm-registry.outputs.exists != 'true' && github.ref_name == 'dev'
        working-directory: ${{ env.SDK_PACKAGE_DIR }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Set the NPM_TOKEN repository secret for dev-channel direct publishes."
            exit 1
          fi
          npm publish --tag "${{ needs.detect.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Stage npm package for approval (beta/latest channels)
        if: needs.detect.outputs.dry_run != 'true' && steps.npm-registry.outputs.exists != 'true' && github.ref_name != 'dev'
        working-directory: ${{ env.SDK_PACKAGE_DIR }}
        # OIDC trusted publisher; the tag is immutable once staged, so it must
        # be right here. A staged-but-unapproved version is not live (npm view
        # won't list it), so a re-merge before approval re-attempts the stage —
        # tolerate that one error.
        run: |
          set +e
          out=$(npm stage publish --tag "${{ needs.detect.outputs.dist_tag }}" 2>&1)
          code=$?
          set -e
          echo "$out"
          if [[ $code -ne 0 ]]; then
            if echo "$out" | grep -qi "already"; then
              echo "::notice::${{ needs.detect.outputs.package_name }}@${{ needs.detect.outputs.version }} is already in the staging queue — approve or reject it in the npm UI."
            else
              exit $code
            fi
          else
            echo "::notice::${{ needs.detect.outputs.package_name }}@${{ needs.detect.outputs.version }} staged for '${{ needs.detect.outputs.dist_tag }}' — a maintainer must approve it in the npm UI before it goes live."
          fi

      - name: Skip npm publish
        if: steps.npm-registry.outputs.exists == 'true'
        run: echo "Skipping npm publish because this version already exists on npm."

  maven:
    name: Publish Maven Central artifacts
    needs: [detect, sdk-ota]
    if: needs.detect.outputs.run_release == 'true' && (needs.detect.outputs.maven_exists != 'true' || needs.detect.outputs.dry_run == 'true' || needs.detect.outputs.force_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-mobile-${{ hashFiles('mobile/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-mobile-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-bluetooth-sdk-${{ hashFiles('mobile/modules/bluetooth-sdk/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-bluetooth-sdk-

      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Prepare generated Android project
        working-directory: mobile
        run: |
          cp .env.example .env
          bun expo prebuild --platform android

      - name: Check Maven Central
        id: maven-central
        run: |
          set -euo pipefail
          version="${{ needs.detect.outputs.version }}"
          base_url="https://repo.maven.apache.org/maven2/com/mentraglass"
          sdk_url="${base_url}/bluetooth-sdk/${version}/bluetooth-sdk-${version}.pom"
          lc3_url="${base_url}/lc3Lib/${version}/lc3Lib-${version}.pom"

          sdk_exists=false
          lc3_exists=false
          if curl -fsI "$sdk_url" >/dev/null 2>&1; then
            sdk_exists=true
          fi
          if curl -fsI "$lc3_url" >/dev/null 2>&1; then
            lc3_exists=true
          fi

          echo "sdk_exists=${sdk_exists}" >> "$GITHUB_OUTPUT"
          echo "lc3_exists=${lc3_exists}" >> "$GITHUB_OUTPUT"

          if [[ "$sdk_exists" == "true" && "$lc3_exists" == "true" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Maven Central already has both Android artifacts for ${version}."
          elif [[ "$sdk_exists" == "false" && "$lc3_exists" == "false" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Maven Central has only one Android artifact for ${version}; refusing to publish over a partial release." >&2
            exit 1
          fi

      - name: Dry-run Maven local publication
        if: steps.maven-central.outputs.exists != 'true'
        working-directory: mobile/android
        run: |
          ./gradlew \
            :lc3Lib:publishToMavenLocal \
            :mentra-bluetooth-sdk:publishToMavenLocal \
            -PmentraPublicSdk=true \
            --no-daemon \
            --stacktrace
        env:
          MENTRA_MAVEN_VERSION: ${{ needs.detect.outputs.version }}

      - name: Check Maven publish credentials
        if: needs.detect.outputs.dry_run != 'true' && steps.maven-central.outputs.exists != 'true'
        run: |
          missing=0
          if [[ -z "${MAVEN_CENTRAL_TOKEN_BASE64:-}" ]]; then
            echo "::error::Set the MAVEN_CENTRAL_TOKEN_BASE64 repository secret."
            missing=1
          fi
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::error::Set the MAVEN_SIGNING_KEY repository secret."
            missing=1
          fi
          if [[ -z "${SIGNING_PASSWORD:-}" ]]; then
            echo "::error::Set the MAVEN_SIGNING_PASSWORD repository secret."
            missing=1
          fi
          exit "$missing"
        env:
          MAVEN_CENTRAL_TOKEN_BASE64: ${{ secrets.MAVEN_CENTRAL_TOKEN_BASE64 }}
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: Publish Maven Central artifacts
        if: needs.detect.outputs.dry_run != 'true' && steps.maven-central.outputs.exists != 'true'
        working-directory: mobile/android
        # Publish mode mirrors the npm split: the dev channel auto-releases
        # (publishing_type=automatic), beta/prod uploads stay staged in the
        # Central Portal (user_managed) until a maintainer publishes them at
        # https://central.sonatype.com/publishing/deployments.
        run: |
          ./gradlew \
            :lc3Lib:publishReleasePublicationToSonatypeCentralRepository \
            :mentra-bluetooth-sdk:publishReleasePublicationToSonatypeCentralRepository \
            :mentra-bluetooth-sdk:uploadSonatypeCentralDeployment \
            -PmentraPublicSdk=true \
            --no-daemon \
            --stacktrace
          if [[ "${SONATYPE_PUBLISHING_TYPE}" == "user_managed" ]]; then
            echo "::notice::Maven deployment for ${{ needs.detect.outputs.version }} is staged in the Central Portal — a maintainer must publish it at https://central.sonatype.com/publishing/deployments."
          fi
        env:
          MAVEN_CENTRAL_TOKEN_BASE64: ${{ secrets.MAVEN_CENTRAL_TOKEN_BASE64 }}
          MENTRA_MAVEN_VERSION: ${{ needs.detect.outputs.version }}
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          SONATYPE_PUBLISHING_TYPE: ${{ github.ref_name == 'dev' && 'automatic' || 'user_managed' }}

      - name: Skip Maven publish
        if: steps.maven-central.outputs.exists == 'true'
        run: echo "Skipping Maven publish because both Android artifacts already exist."

  ios-swiftpm:
    name: Export iOS SwiftPM mirror
    needs: [detect, sdk-ota]
    if: needs.detect.outputs.run_release == 'true' && (needs.detect.outputs.swiftpm_exists != 'true' || needs.detect.outputs.dry_run == 'true' || needs.detect.outputs.force_release == 'true')
    runs-on: macos-15
    outputs:
      tag_exists: ${{ steps.swiftpm-tag.outputs.exists }}
      mirror_sha: ${{ steps.mirror-commit.outputs.mirror_sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: MentraOS

      - name: Check SwiftPM push token
        if: needs.detect.outputs.dry_run != 'true'
        run: |
          if [[ -z "${SWIFTPM_PUSH_TOKEN:-}" ]]; then
            echo "::error::Set the MENTRA_BLUETOOTH_SDK_IOS_PUSH_TOKEN repository secret before pushing the SwiftPM mirror."
            exit 1
          fi
        env:
          SWIFTPM_PUSH_TOKEN: ${{ secrets.MENTRA_BLUETOOTH_SDK_IOS_PUSH_TOKEN }}

      - name: Checkout SwiftPM mirror
        uses: actions/checkout@v4
        with:
          repository: Mentra-Community/mentra-bluetooth-sdk-ios
          path: mentra-bluetooth-sdk-ios
          token: ${{ secrets.MENTRA_BLUETOOTH_SDK_IOS_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Check SwiftPM tag
        id: swiftpm-tag
        working-directory: mentra-bluetooth-sdk-ios
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${{ needs.detect.outputs.swiftpm_tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "SwiftPM tag ${{ needs.detect.outputs.swiftpm_tag }} already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The export script reads the SDK package.json version, so stamping the
      # channel-derived version here flows into Package.swift, the README and
      # the Swift source placeholder. Export checkout only — never committed.
      - name: Stamp channel version
        working-directory: MentraOS/mobile/modules/bluetooth-sdk
        run: npm pkg set version="${{ needs.detect.outputs.version }}"

      - name: Export and verify Swift package
        if: steps.swiftpm-tag.outputs.exists != 'true'
        working-directory: MentraOS
        run: |
          scripts/export-bluetooth-sdk-ios-spm.sh \
            --target "$GITHUB_WORKSPACE/mentra-bluetooth-sdk-ios" \
            --verify

      - name: Show SwiftPM export diff
        if: steps.swiftpm-tag.outputs.exists != 'true'
        working-directory: mentra-bluetooth-sdk-ios
        run: |
          git status --short
          git diff --stat

      # Commit + push the export, but NOT the tag: SPM resolves tags only, so
      # an untagged commit is invisible to consumers. The tag push is the
      # release act and lives in the next job, behind the approval environment
      # on non-dev channels.
      - name: Commit SwiftPM mirror (no tag)
        id: mirror-commit
        if: needs.detect.outputs.dry_run != 'true' && steps.swiftpm-tag.outputs.exists != 'true'
        working-directory: mentra-bluetooth-sdk-ios
        run: |
          set -euo pipefail
          source_sha="$(git -C "$GITHUB_WORKSPACE/MentraOS" rev-parse --short HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift README.md LICENSE ios .gitignore
          if git diff --cached --quiet; then
            echo "SwiftPM export produced no file changes; the tag job will tag the current mirror HEAD."
          else
            git commit -m "Release MentraBluetoothSDK ${{ needs.detect.outputs.version }}" \
              -m "Exported from MentraOS ${source_sha}."
            git push origin HEAD:main
          fi
          echo "mirror_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Skip SwiftPM export
        if: steps.swiftpm-tag.outputs.exists == 'true'
        run: echo "Skipping SwiftPM export because the version tag already exists."

  ios-swiftpm-tag:
    name: Tag iOS SwiftPM release
    needs: [detect, ios-swiftpm]
    if: needs.detect.outputs.dry_run != 'true' && needs.ios-swiftpm.outputs.tag_exists != 'true' && needs.ios-swiftpm.outputs.mirror_sha != ''
    runs-on: ubuntu-latest
    # SPM resolves tags only, so pushing the tag IS the release. On dev the
    # environment is unprotected and the tag goes straight out; on staging and
    # main-bluetooth-sdk the approval environment holds this job until a
    # reviewer approves it in the Actions UI — the SwiftPM equivalent of npm's
    # staging queue and Sonatype's user_managed deployments. Configure required
    # reviewers on `bluetooth-sdk-release-approval` (Settings -> Environments);
    # until that is done the gate is a no-op.
    environment: ${{ github.ref_name == 'dev' && 'bluetooth-sdk-dev-release' || 'bluetooth-sdk-release-approval' }}
    steps:
      - name: Checkout SwiftPM mirror
        uses: actions/checkout@v4
        with:
          repository: Mentra-Community/mentra-bluetooth-sdk-ios
          token: ${{ secrets.MENTRA_BLUETOOTH_SDK_IOS_PUSH_TOKEN }}
          fetch-depth: 0

      - name: Tag and push
        run: |
          set -euo pipefail
          mirror_sha="${{ needs.ios-swiftpm.outputs.mirror_sha }}"
          if ! git cat-file -e "${mirror_sha}^{commit}"; then
            echo "::error::Exported mirror commit ${mirror_sha} not found — was the mirror force-pushed between export and approval?"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.detect.outputs.swiftpm_tag }}" "${mirror_sha}"
          git push origin "refs/tags/${{ needs.detect.outputs.swiftpm_tag }}"
          echo "::notice::SwiftPM release ${{ needs.detect.outputs.swiftpm_tag }} is live (tag pushed at ${mirror_sha})."
