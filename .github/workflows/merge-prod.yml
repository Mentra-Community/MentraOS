on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/console2-scaffold
    paths:
      - "miniapps/merge/**"
      - "cloud-v2/packages/auth/**"
      - ".github/workflows/merge-prod.yml"

name: Deploy Local Merge prod to Porter

permissions:
  contents: read

jobs:
  porter-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Github tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup porter
        uses: porter-dev/setup-porter@v0.1.0

      - name: Deploy stack
        timeout-minutes: 30
        run: exec porter apply -f miniapps/merge/porter.prod.yaml
        env:
          PORTER_CLUSTER: 5783
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PROJECT: 15081
          PORTER_APP_NAME: merge-prod
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
          PORTER_TOKEN: ${{ secrets.PORTER_APP_15081_5783 || secrets.PORTER_TOKEN }}
