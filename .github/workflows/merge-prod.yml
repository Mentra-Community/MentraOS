name: Deploy Local Merge prod

on:
  workflow_dispatch:

concurrency:
  group: merge-prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy merge-prod to miniapps us-west-2
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      PORTER_CLUSTER: "5783"
      PORTER_PROJECT: "15081"
      PORTER_DEPLOYMENT_TARGET_ID: 95380467-4a76-458d-b12a-df66cf0c362b
      PORTER_HOST: https://dashboard.porter.run
      PORTER_APP_NAME: merge-prod
      PORTER_REPO_NAME: ${{ github.event.repository.name }}
      PORTER_TOKEN: ${{ secrets.PORTER_TOKEN }}
      MERGE_HOSTNAME: merge.us-west-2.mentraglass.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Git SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Porter CLI
        uses: porter-dev/setup-porter@v0.1.0

      - name: Deploy merge-prod app
        timeout-minutes: 30
        env:
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
        run: porter apply -w -x "${PORTER_DEPLOYMENT_TARGET_ID}" -f miniapps/merge/porter.prod.yaml

      - name: Verify prod health
        run: |
          set -euo pipefail
          if ! getent hosts "${MERGE_HOSTNAME}" >/dev/null; then
            echo "::warning::Merge prod DNS is not configured yet; skipping public health check."
            exit 0
          fi
          curl --retry 12 --retry-delay 10 --retry-all-errors -fsS "https://${MERGE_HOSTNAME}/healthz"
          echo
