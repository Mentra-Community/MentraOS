name: Codex review scripts tests

on:
  pull_request:
    branches: [dev, staging, main]
    paths:
      - "scripts/codex-review/**"
      - ".github/workflows/codex-review-tests.yml"

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Lifecycle tests with fake gh and codex
        run: bun test scripts/codex-review
