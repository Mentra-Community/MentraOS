# ccache configuration for the iOS PR build (mentra-app-ios-build.yml).
#
# React Native's ccache-clang.sh wrapper honours a pre-set CCACHE_CONFIGPATH,
# so this file replaces RN's shipped scripts/xcode/ccache.conf. It starts as a
# verbatim copy of that file (React Native 0.83) plus the CI-specific lines at
# the end. Owning the file means a suspected stale hit can be answered by
# tightening `sloppiness` here (at a hit-rate cost) instead of editing
# node_modules.
#
# The relaxed `sloppiness` entries are what make caching work at all with
# Clang modules, PCH and CocoaPods VFS overlays; they are also the documented
# stale-hit vector. The workflow's deliberate-invalidation tests (broken
# source, broken header, macro change on a warm cache) are the acceptance gate
# for keeping them. See https://ccache.dev/manual/latest.html.

sloppiness = clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
file_clone = true
depend_mode = true
inode_cache = true

# CI additions
# Hash the compiler binary's content, not its mtime: toolchain files on CI
# hosts are reinstalled/touched without changing.
compiler_check = content
# Bound per cache namespace (the workflow keys CCACHE_DIR by toolchain and
# config hash, so several namespaces can coexist after an Xcode update).
max_size = 20G
