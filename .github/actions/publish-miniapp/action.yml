name: Publish a first-party Mentra miniapp
description: Validate a deterministic bundle or publish the saved artifact to the Mentra Miniapp Store through the pinned Store CLI.
inputs:
  operation:
    description: prepare or publish
    required: true
  directory:
    description: Miniapp directory relative to the checkout, for example miniapps/captions
    required: true
  token:
    description: The miniapp's app-restricted Store publishing key (publish only)
    default: ''
  branch:
    description: Branch whose tip may publish; an older commit skips publication
    default: dev
  store-url:
    description: Production Store API
    default: https://api.apps.mentraglass.com
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install isolated pinned publishing tools
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        tool_dir=$(mktemp -d "$RUNNER_TEMP/mentra-store-tools.XXXXXX")
        cp -R "$ACTION_ROOT/tooling/." "$tool_dir/"
        cd "$tool_dir"
        bun install --frozen-lockfile --ignore-scripts
        echo "MENTRA_PUBLISH_TOOLS=$tool_dir" >> "$GITHUB_ENV"
    - name: Validate or publish miniapp
      shell: bash
      env:
        MENTRA_OPERATION: ${{ inputs.operation }}
        MENTRA_DIRECTORY: ${{ inputs.directory }}
        MENTRA_PUBLISH_BRANCH: ${{ inputs.branch }}
        MENTRA_CLI_TOKEN: ${{ inputs.token }}
        MENTRA_STORE_URL: ${{ inputs.store-url }}
        GH_TOKEN: ${{ github.token }}
      run: bun "$MENTRA_PUBLISH_TOOLS/run.ts"
