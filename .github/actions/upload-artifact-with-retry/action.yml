name: Upload artifact with retry
description: Retry an already-built release handoff up to three times.
inputs:
  name:
    description: Unique artifact name for this handoff.
    required: true
  path:
    description: Files or directory to upload.
    required: true
runs:
  using: composite
  steps:
    - name: Upload attempt 1 of 3
      id: attempt1
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: 90

    - name: Wait before upload attempt 2
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Upload attempt 2 of 3
      id: attempt2
      if: steps.attempt1.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: 90
        # A failed response can leave an artifact with this name behind.
        overwrite: true

    - name: Wait before upload attempt 3
      if: steps.attempt2.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Upload attempt 3 of 3
      id: attempt3
      if: steps.attempt2.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: 90
        # A failed response can leave an artifact with this name behind.
        overwrite: true
