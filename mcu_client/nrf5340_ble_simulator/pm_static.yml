# Static partition layout (external flash)
# 静态分区表（外置 Flash）
# mcuboot_secondary / font_storage (2MB) / font_storage2 (2MB) / user_storage

mcuboot_secondary:
  address: 0x0
  device: DT_CHOSEN(nordic_pm_ext_flash)
  end_address: 0xf0000
  region: external_flash
  share_size:
  - mcuboot_primary
  size: 0xf0000

# 18px binfont, 2MB
font_storage:
  address: 0xf0000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  end_address: 0x2f0000
  region: external_flash
  size: 0x200000

# 20px binfont, 2MB
font_storage2:
  address: 0x2f0000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  end_address: 0x4f0000
  region: external_flash
  size: 0x200000

# user_storage (0x4f0000 ~ 0x2000000)
user_storage:
  address: 0x4f0000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  end_address: 0x2000000
  region: external_flash
  size: 0x1b10000
