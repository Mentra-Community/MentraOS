# LEGACY: do not apply. This manifest predates the per-environment app split
# and selects `porter.run/app-name: cloud-v2`, an app name that no longer
# deploys (envs are now cloud-dev / cloud-debug / cloud-staging / cloud-prod).
# Use audio-udp-nlb-debug.yaml as the per-env template instead, swapping the
# app name. Kept only as annotated reference for the NLB annotations and the
# externalTrafficPolicy rationale below.
#
# See docs/runbooks/deploy/udp-nlb-aws.md for current provisioning steps.
# Note: applying requires direct kubectl (aws eks update-kubeconfig);
# `porter kubectl` is read-only and cannot create Services.

apiVersion: v1
kind: Service
metadata:
  name: cloud-v2-audio-udp
  namespace: default
  labels:
    porter.run/app-name: cloud-v2
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "UDP LoadBalancer for audio ingress (not managed by Porter)"
    # AWS LoadBalancer Controller annotations. NLB is required for UDP —
    # ALB is HTTP/TCP only.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Cross-zone load balancing distributes packets evenly across nodes
    # in all AZs, not just the AZ the NLB ENI lives in. Costs slightly
    # more (cross-zone data transfer) but eliminates AZ-skew failure
    # modes. Worth it.
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  # Match Porter's runtime pods specifically (NOT the core service). The
  # service was renamed audio -> runtime; this NLB Service keeps its name
  # (cloud-v2-audio-udp) to preserve the NLB hostname already wired into
  # AUDIO_UDP_ADVERTISED_HOST, but retargets the runtime pods. v1 used the
  # same selector pattern in cloud/udp-service.yaml.
  selector:
    porter.run/app-name: cloud-v2
    porter.run/service-name: runtime
  ports:
    - name: udp-audio
      protocol: UDP
      port: 8000
      targetPort: 8000
  # `externalTrafficPolicy: Local` does TWO things for us:
  #
  # 1. NLB health checks: when set to Local, k8s allocates a stable
  #    `healthCheckNodePort` (TCP) that AWS LB Controller automatically
  #    uses for the target group's health check. NLBs do TCP health checks
  #    even for UDP listeners; without this, the target group tries to
  #    TCP-connect to the UDP traffic port and ALL targets show
  #    "FailedHealthChecks". This is the canonical UDP-on-NLB gotcha.
  #
  # 2. Source IP preservation: traffic only routes to nodes that have
  #    pods, and the pod sees the real client IP (vs. the node IP under
  #    `Cluster` policy). Audio doesn't currently depend on client IP,
  #    but it's a nice side benefit.
  externalTrafficPolicy: Local
