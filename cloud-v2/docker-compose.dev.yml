# Local-dev infrastructure for cloud-v2.
#
# Only Redis runs in Docker by default. MongoDB points at the shared dev Atlas
# cluster via Doppler-managed connection string. Cloud-v2 services themselves
# run natively on the host via `bun --watch`.
#
# Optional: a local single-node replica set (rs0), for working offline or on
# features that need multi-document transactions without touching Atlas:
#   docker compose -f docker-compose.dev.yml --profile local-mongo up -d
# It binds the same host port as the test Mongo in docker-compose.test.yml, so
# run only one of them at a time.

services:
  mongo:
    image: mongo:7
    container_name: cloud-v2-mongo-dev
    profiles: ["local-mongo"]
    # `--bind_ip_all` binds inside the container only; the published port
    # below stays loopback-only on the host (never expose Mongo to your network).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloud-v2-redis-dev
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
