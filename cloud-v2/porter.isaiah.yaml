version: v2
name: cloud-isaiah

envGroups:
  - cloud-v2-isaiah-doppler

build:
  method: docker
  context: ../
  dockerfile: ./docker/Dockerfile

services:
  - name: core
    type: web
    run: bun packages/core/src/index.ts
    port: 3000
    instances: 1
    cpuCores: 0.25
    ramMegabytes: 1024
    domains:
      - name: core.isaiah.us-west-2.mentraglass.com
    livenessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 15
    readinessCheck:
      enabled: true
      httpPath: /ready
      timeoutSeconds: 5
      initialDelaySeconds: 15
    ingressAnnotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    terminationGracePeriodSeconds: 10

  - name: store
    type: web
    run: bun packages/store/src/index.ts
    port: 3003
    instances: 1
    cpuCores: 0.25
    ramMegabytes: 1024
    domains:
      - name: store.isaiah.us-west-2.mentraglass.com
    env:
      PORT: "3003"
      MENTRA_CORE_INTERNAL_URL: "http://core:3000"
      MENTRA_STORE_CORE_JWKS_URL: "http://core:3000/.well-known/jwks.json"
    livenessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 15
    readinessCheck:
      enabled: true
      httpPath: /ready
      timeoutSeconds: 5
      initialDelaySeconds: 15
    terminationGracePeriodSeconds: 10

  - name: runtime
    type: web
    run: bun packages/runtime/src/index.ts
    port: 3001
    instances: 1
    cpuCores: 0.5
    ramMegabytes: 2048
    domains:
      - name: runtime.isaiah.us-west-2.mentraglass.com
    env:
      AUDIO_WORKERS: "1"
    livenessCheck:
      enabled: true
      httpPath: /healthz
      timeoutSeconds: 3
      initialDelaySeconds: 15
    readinessCheck:
      enabled: true
      httpPath: /ready
      timeoutSeconds: 5
      initialDelaySeconds: 15
    ingressAnnotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    terminationGracePeriodSeconds: 10
    additionalPorts:
      - port: 8000
        protocol: UDP
        name: udp-audio
